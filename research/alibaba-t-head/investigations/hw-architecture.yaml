chip: alibaba-t-head
artifact: research/alibaba-t-head/investigations/hw-architecture.md
investigated: "2026-04-05"
status: completed

products:
  hanguang_800:
    type: AI inference NPU
    process: TSMC 12nm
    transistors_B: 17
    peak_tops_int8: 820
    on_chip_sram_mb: 192
    cores: 4
    host_interface: PCIe Gen4 x16
    resnet50_ips: 78563
    energy_efficiency_ips_per_w: 500
    memory_type: SRAM-only (no HBM)
    announced: "2019-09"
    hotchips: HC32 2020

  zhenwu_810e:
    also_known_as: PPU (Parallel Processing Unit)
    type: AI training+inference accelerator
    process: "7nm (domestic, likely SMIC)"
    memory_type: HBM2e
    memory_capacity_gb: 96
    inter_chip_bandwidth_gbps: 700
    icn_links: 7
    tdp_w: 400
    target_performance: "comparable to NVIDIA H20, some modes > A100"
    bom_cost_vs_h20: "-40%"
    workloads: [AI inference, AI training, autonomous driving]
    llm_optimization: Qwen series
    announced: "2026-01-30"
    deployment_scale: "10K-card clusters, 400+ customers, 470K units shipped"

xuantie_risc_v:
  c910:
    type: high-performance OoO
    isa: RVV 0.7.1
    pipeline_width: 3-wide
    pipeline_stages: 12
    process: TSMC 12nm
    area_mm2: 0.8
    freq_ghz: "2.0-2.5"
    open_source: true
    license: Apache 2.0

  c920:
    type: high-performance OoO
    isa: RVV 1.0
    notes: C910 with updated vector spec

  c930:
    type: server-grade
    launched: "2025-02"
    shipping: "2025-03"

  c950:
    type: server-grade AI agent CPU
    process: TSMC 5nm
    isa: RVA23
    ai_engine: self-developed
    max_freq_ghz: 3.2
    llm_native: true
    supported_models: [Qwen3, DeepSeek V3]
    spec_score: ">70 (RISC-V world record)"
    perf_vs_c920: ">3x"
    launched: "2026-03-24"
    target: agentic AI inference

key_findings:
  - "Dual product lines: Hanguang NPU (AI ASIC) + Xuantie CPU (RISC-V)"
  - "Hanguang 800: 820 TOPS INT8, TSMC 12nm, 4-core ring bus, SRAM-only"
  - "Zhenwu 810E: 96GB HBM2e, 700GB/s ICN, 7nm domestic, H20-class performance"
  - "C950: TSMC 5nm, RVA23, 3.2GHz, first RISC-V with native LLM inference"
  - "T-Head IPO speculation early 2026; >RMB 10B annualized revenue"
  - "Fully proprietary closed stack for Zhenwu; open-source RISC-V tools for Xuantie"

