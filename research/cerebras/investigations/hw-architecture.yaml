resource: hw-architecture
url: https://www.cerebras.ai/chip
type: docs_site
as_of: "2026-08-08"
baseline_as_of: "2026-04-05"
commit_sha: null
doc_version: "WSE-3 (2024) — still current as of 2026-08-08; no WSE-4 / CS-4 announced"
chip: cerebras
device_class: Wafer-Scale Engine

layer_mappings:
  - layer: Compute Engine
    component: "900K PE Array (FP16/BF16 8-wide SIMD, INT8 16-wide SIMD, FP32)"
    confidence: confirmed
    sources:
      - https://www.cerebras.ai/chip
      - https://hc2024.hotchips.org/assets/program/conference/day2/72_HC2024.Cerebras.Sean.v03.final.pdf
      - https://arxiv.org/html/2503.11698v1

  - layer: Data Path
    component: "Swarm 2D Mesh Fabric (5-port routers, 32-bit wavelet messages, 24 colors, ~1 ns/hop)"
    confidence: confirmed
    sources:
      - https://www.cerebras.ai/blog/cerebras-architecture-deep-dive-first-look-inside-the-hw-sw-co-design-for-deep-learning
      - https://hc2024.hotchips.org/assets/program/conference/day2/72_HC2024.Cerebras.Sean.v03.final.pdf

  - layer: On-chip Memory
    component: "44 GB Distributed On-chip SRAM (48 KB/PE, single-cycle, no HBM)"
    confidence: confirmed
    sources:
      - https://www.cerebras.ai/press-release/cerebras-announces-third-generation-wafer-scale-engine
      - https://arxiv.org/html/2503.11698v1

  - layer: Off-chip Memory
    component: "MemoryX (DRAM+Flash tiers, 4TB–2.4PB, weight-streaming-only)"
    confidence: confirmed
    sources:
      - https://www.cerebras.ai/blog/announcing-the-cerebras-architecture-for-extreme-scale-ai
      - https://www.cerebras.ai/system

  - layer: Host Interface / Package
    component: "CS-3 Chassis (PCIe host, water-cooling cold plate, custom 300mm wafer PCB substrate)"
    confidence: confirmed
    sources:
      - https://www.cerebras.ai/system
      - https://www.cerebras.ai/blog/100x-defect-tolerance-how-cerebras-solved-the-yield-problem

  - layer: Scale-up Interconnect
    component: "Swarm On-chip 2D Mesh (100 Pb/s aggregate, <1 pJ/bit, ~1 ns/hop, hardware router per PE)"
    confidence: confirmed
    sources:
      - https://www.cerebras.ai/blog/cerebras-architecture-deep-dive-first-look-inside-the-hw-sw-co-design-for-deep-learning

  - layer: Scale-out Interconnect
    component: "SwarmX Fabric (100GbE + RoCE RDMA, tree topology, up to 2048 CS-3s, broadcast+reduce)"
    confidence: confirmed
    sources:
      - https://www.cerebras.ai/blog/announcing-the-cerebras-architecture-for-extreme-scale-ai
      - https://www.cerebras.ai/press-release/cerebras-systems-announces-worlds-first-brain-scale-artificial-intelligence-solution

framework_integrations:
  - framework: PyTorch
    integration_point: "Lazy Tensor Core (LTC) backend; PyTorch ops captured as CIRH graph and compiled to PE binary"
  - framework: Weight Streaming Runtime
    integration_point: "MemoryX + SwarmX coordinate layer-by-layer weight dispatch to WSE during forward/backward pass"
  - framework: CSL (Cerebras Software Language)
    integration_point: "Low-level kernel language; maps directly to PE compute units, SRAM DSDs, and Swarm wavelet routing"

key_abstractions:
  - name: Processing Element (PE)
    description: "Atomic compute+memory unit: 48KB SRAM + FP16/BF16 8-wide SIMD + INT8 16-wide SIMD + 5-port mesh router. 900K instances on one wafer. Each runs own CSL program."
  - name: Swarm 2D Mesh
    description: "On-wafer interconnect: hardware router per PE, 32-bit wavelet messages, 24 colors/PE, ~1 ns/hop, 100 Pb/s aggregate. Replaces NVLink within chip."
  - name: Wavelet
    description: "32-bit data+color-tag message; fundamental inter-PE communication unit. Arrival on a color triggers the associated CSL task on receiving PE."
  - name: MemoryX
    description: "External weight-only storage appliance: DRAM+Flash, 4TB–2.4PB elastic. Decouples model parameter storage from on-chip compute for large-model training."
  - name: SwarmX
    description: "Scale-out fabric: tree topology, 100GbE+RoCE RDMA. Broadcasts weights from MemoryX to all CS-3s; reduces gradients from all CS-3s. Up to 2,048 systems."
  - name: Defect Tolerance Layer
    description: "0.05mm² PE size + 1–1.5% redundant PEs + dynamic routing remapping. Enables commercial wafer-scale yield at TSMC 5nm 300mm."

generations:
  - name: WSE-1
    process: TSMC 16nm
    cores: 400000
    sram_gb: 18
    released: "2019"
  - name: WSE-2
    process: TSMC 7nm
    transistors_trillions: 2.6
    cores: 850000
    sram_gb: 40
    sram_bw_pbs: 20
    released: "2021"
  - name: WSE-3
    process: TSMC 5nm
    transistors_trillions: 4
    cores: 900000
    sram_gb: 44
    sram_bw_pbs: 21
    peak_fp16_pflops: 125
    die_area_mm2: 46225   # corrected 2026-08-08 from 46255 (transposed digit); source: https://www.cerebras.ai/chip
    released: "2024"
    status_2026_08_08: "current / shipping"

system:
  name: CS-3
  chip: WSE-3
  tdp_kw: 23
  max_model_params: "24e12"
  external_memory_max_tb: 1200
  max_cluster_size: 2048
  max_cluster_pflops: 250000

execution_modes:
  layer_pipelined:
    model_fits_on_sram: true
    off_chip_weight_access: none
    use_case: "models ≤ 44GB parameters"
  weight_streaming:
    model_fits_on_sram: false
    weights_from: MemoryX
    activations: on_chip_sram
    use_case: "models up to 120T parameters"

no_hbm: true
no_dram_for_activations: true

