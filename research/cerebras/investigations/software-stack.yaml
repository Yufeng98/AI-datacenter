framework_integrations:
  - framework: PyTorch
    integration_point: "LTC backend: cerebras.pytorch.compile() captures ATen graph → CIRH IR → PE binary"
  - framework: HuggingFace Transformers
    integration_point: "Model Zoo provides checkpoint conversion tools (Cerebras ↔ HF format); HF model configs supported"
  - framework: Slurm / HPC schedulers
    integration_point: "csctl submits jobs to Slurm; CS-3 appears as a schedulable resource in HPC clusters"

key_abstractions:
  - name: cerebras.pytorch (cstorch)
    description: "PyTorch 2.0 LTC backend: cstorch.compile() for graph capture, cstorch.Trainer for training loop lifecycle with weight streaming"
  - name: CIRH
    description: "MLIR-based ATen-aligned IR. Compiler input; supports op fusion (FlashAttn, LayerNorm+dropout), memory layout optimization, AutoGen kernel generation"
  - name: CSL (Cerebras Software Language)
    description: "Zig-inspired low-level PE kernel language. Dataflow model: tasks activated by wavelet arrival on colors. DSDs address PE SRAM. Used for custom kernels and SDK path."
  - name: Task / Color / Wavelet
    description: "CSL execution primitives: Task=activation handler, Color=virtual channel (0–23 per PE), Wavelet=32-bit data+color-tag message"
  - name: Data Structure Descriptor (DSD)
    description: "CSL typed memory view over PE-local SRAM. Defines N-D strided access patterns. All SRAM access in CSL goes through DSDs."
  - name: Trainer + YAML config
    description: "High-level training orchestrator: YAML file specifies model/dataset/optimizer/lr_scheduler; Trainer handles compile/run/checkpoint lifecycle"
  - name: MemDataLoader
    description: "Cerebras-specific data pipeline: prefetches batches from storage; streams data into PE memory; replaces standard PyTorch DataLoader"
  - name: AutoGen
    description: "Compiler pass for automatic CSL kernel generation from CIRH op patterns. Eliminates manual CSL for standard training ops."

openness:
  model_zoo: "open_source (Apache 2.0)"
  cerebras_pytorch_api: "sdk_release (pip-installable, documented)"
  csl_sdk: "public_sdk (sdk.cerebras.net, sdk-examples open source)"
  cirh_compiler: "closed"
  hardware_binary_format: "closed"
  inference_api: "cloud_service (OpenAI-compatible REST)"

