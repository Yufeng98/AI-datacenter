    notes: |
      NEW ENTRY (2026-08-08 landscape scan). Tecorigin (brand 太初元碁; legal entity 太初（杭州）集成电路有限公司, founded November 2019, HQ Hangzhou, R&D in Wuxi/Beijing/Shanghai, systems integration in Yancheng). Per its own About page the core team comes from Tsinghua and the National Supercomputing Center in Wuxi — home of Sunway TaihuLight — with three Gordon Bell Prizes. SDAA (Software Defined Accelerator Architecture) is NEITHER a GPU NOR a systolic-array TPU: it is a heterogeneous many-core machine in the Sunway/Cell idiom wrapped in a deliberately CUDA-shaped software surface. The card is a host/device machine (主从异构) with the HOST CPU as master and no documented on-device master core; one card holds 4 SPAs (Synergistic Processor Element Arrays), each with its own Global memory and each exposed to software as an INDEPENDENT device ('每个SPA类似于GPU的一张卡') with NO shared address space across SPAs; each SPA holds 32 SPEs (从核, slave cores) with scalar, vector and matrix units and a private software-managed SPM scratchpad => 128 SPEs per card. There is NO hardware data cache in the compute path: a strict three-level registers / SPM / Global model where every transfer is an explicit DMA (Global<->SPM), RMA (SPE<->SPE scratchpad, direct) or hardware broadcast — RMA plus row/column broadcast is the Sunway athread idiom and the clearest fingerprint of the lineage. Chip is T1; card SKUs are 元碁 T100 (PCIe), T110 (air-cooled OAM) and T111 (liquid-cooled OAM); systems are the AI workstation (1-4 cards), T1008 (4U/8-card), I1004 (2U/4-card inference), T1108 (6U/8-card OAM), T1118 (2U/8-card liquid) and 元碁 SuperPOD-128 (128 cards per rack) — unambiguously datacenter-class, no edge SKU. THE DEFINING EVIDENTIARY FACT: Tecorigin publishes NO datasheet — no peak TFLOPS/TOPS at any precision, no memory bandwidth, no process node, no die size and no TDP anywhere in ~3.2 MB of vendor documentation or on the website; every quantitative fact in this entry was recovered from programming manuals, teco-smi driver telemetry, TecoGDB or published cost models, sources strong on structure and silent on peak performance. Any spec table will be mostly 'not disclosed' and must not be filled by inference. SW is a complete, deliberate CUDA clone shipping as exactly TWO version-locked packages — TecoDriver (driver + firmware + management + monitoring) and TecoToolKit (SDK) — currently v3.2.0: PyTorch 2.7.1 via TecoPyTorch (torch_sdaa, device='sdaa', torch.sdaa.* mirroring torch.cuda, ProcessGroupTCCL as backend='tccl'; AMP FP16 training supported, INFERENCE IS FP32-ONLY); PaddlePaddle 3.0.0 via TecoPaddle (paddle_sdaa) whose most valuable artifact is the upstream Apache-2.0 PaddleCustomDevice backends/sdaa (~115 kernel .cc files, sdaac_ops/ .scpp kernels, a pr_ci_sdaa.sh hardware-CI script implying a real device fleet); Teco-vLLM v3.2.0 (PagedAttention, continuous batching, chunked prefill, prefix caching, PD分离 disaggregated prefill, LoRA, tool calling, TP/PP/EP/DP + EPLB + SBO, Ray multi-node) and Teco-Megatron-LM v3.2.0; torch.compile -> teco_inductor; ONNX -> TecoInferenceEngine (TVM/Relay); TecoDNN/TecoBLAS/TecoRAND/TecoLMK/TecoCUSTOM as the cuDNN/cuBLAS analogues; SDAA C (.scpp, CUDA-shaped __global__/<<<>>>/threadIdx/sdaaMalloc plus a Sunway-shaped intrinsic set with thread groups, SPM malloc/free, DMA, RMA, hardware broadcast, matmul, transpose) -> TecoCC (Clang/LLVM-derived) -> PCX v1.0.0, a hardware-independent virtual ISA that is structurally the PTX of this ecosystem and is fully documented publicly PRECISELY because the actual T1 machine ISA is not disclosed -> PCXAC -> SDAARuntime (libsdaart.so) + TCCL -> SDAADriver -> /dev/tcaicardN. Full proprietary tooling parity: TecoSMI (nvidia-smi), TCML (NVML), SDPTI (CUPTI), TCPX (NVTX), TSight (Nsight), TecoGDB (cuda-gdb with per-SPE focus switching), TCVS (DCGM-diag), sdaacfilt. Distinguishing datapoint: the full stack ships for FIVE CPU/OS combinations — x86_64 Ubuntu 22.04, Hygon 海光 7380/7375 on Kylin V10, Phytium 飞腾 S5000C ARMv8 on Kylin V10 国防版, Sunway 申威 8A (SW-64) on UOS Server 20, and Loongson 龙芯 3C6000 (LoongArch) on Loongnix Server 23.1; shipping a full AI stack on an SW-64 host is close to unique in this registry. The PCX compatibility table lists only T100系列 while claiming support for 多种系列, strongly implying planned successor silicon — no successor is named.

