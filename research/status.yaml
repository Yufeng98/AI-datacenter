      NEW ENTRY (2026-08-08 landscape scan). Preferred Networks, Inc. (Tokyo, founded 2014, original Chainer authors) with Kobe University (Prof. Junichiro Makino, also PFN CTO of Computer Architecture); development began 2016. MN-Core belongs in a software-stack survey for what the hardware OMITS: PFN's own framing is that network control circuits, cache controllers and command schedulers are 'incorporated in the compiler software rather than the hardware', and the developer manual is blunter — there are no hardware-managed caches, all intra-board transfers are explicit machine-code instructions, and PEs have NO program counter and NO instruction decoder, running in perfect lockstep on a single instruction stream streamed from the HOST CPU over PCIe at RUN TIME (the host is part of the execution model, not just the compiler). PFN quantifies the payoff at 7.4% of transistors in arithmetic units against its own anonymized 1.7% for 'GPU N' and 2.4% for 'Accelerator P' (vendor claim). MN-Core 2 (current part, internally GPFN3): TSMC N7, 550 mm2 single die, 22B transistors, 750 MHz, 4096 PEs / 1024 MAUs, 12 TFLOPS FP64 / 49 FP32 / 98 pseudo-single ('TF32') / 393 half ('TF16') — PFN block-FP formats, NOT NVIDIA TF32 or IEEE binary16; 330 W design value, measured TDP not disclosed. Gen 1 (TSMC 12 nm, 4 dies/package) powered MN-3 (three Green500 #1 finishes, one verified by TOP500) and the commercial Matlantis service; superseded. MN-Core L1100 / L1400 (the L1000 DRAM-on-logic 3D architecture) are announced, pre-silicon, mockup only, 2027 target — do NOT describe as shipping. SW: PyTorch is the ONE supported framework -> fx2onnx -> PFVM compiler -> codegen graph compiler (MNGraph, where every MNValue carries Dtype / Location / Layout — that trio IS the programming model) -> code emitter -> GPFNApp (FlatBuffers-packed VSM + relocations) -> libgpfn3 -> gpfn3.ko. There is no eager device: you isolate a pure function and compile forward, backward and the optimizer step into ONE fused device program (device-side MNCoreSGD / MNCoreAdam / MNCoreAdamW; AdamW is not bit-compatible with LibTorch). The compiler performs cache replacement, physical-topology data placement, capacity management, rematerialization (auto_recompute_sa simulated annealing) and instruction packing — with ~35 CODEGEN_* env vars including the candid CODEGEN_AUTO_RECOMPUTE_HACK_FOR_QWEN. Coverage: 378 compilable / 369 inference-ready / 156 training-ready timm backbones (SDK v0.4), static shapes only; LLM inference labelled experimental; no vLLM, no TensorRT-LLM analogue, no ONNX Runtime EP; JAX is claimed on marketing pages but absent from the SDK docs — treat as unsubstantiated. NO collectives library: multi-board and multi-node go through the host via OpenMPI + torch.distributed on the gloo backend. Users CANNOT add operators (codegen/layers is not shipped as source; the extension framework is 'being prepared', no timeline). Openness: everything load-bearing ships as binary .deb from a private Google Artifact Registry APT repo under EULA — pfnet/mncore is Apache-2.0 but holds only Dockerfiles, apt scripts and examples, so SDK v0.5's 'SDK source now public' note is misleading; yet a ~130-page public ISA manual, a free no-login assembler and cycle-faithful emulator, and an educational from-scratch graph compiler make it the most reproducible proprietary stack in the registry. Platform: gpfn3 DKMS module, libgpfn3, gpfn3-smi; Ubuntu 24.04/22.04 only; cloud via PFCP managed Kubernetes (resource preferred.jp/mncore2), pricing unpublished. Maturity: shipping as complete Japanese-market systems with list prices (MN-Server 2 ¥20M, Devkit ¥2M) since ~Sept 2024; ~256 boards in PFN/NEDO testbeds; no merchant bare-chip sales, no non-Japanese customers, no third-party OEM. The public developer story is only ~6 months old (SDK Hub dev.mn-core.com launched 2026-06-22).

