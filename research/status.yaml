      NEW ENTRY (2026-08-08 landscape scan). SpiNNcloud Systems GmbH (Dresden; TU Dresden spinout commercializing Steve Furber's SpiNNaker lineage). SpiNNaker2: GlobalFoundries 22FDX (22 nm FDSOI) with Racyics ABX adaptive body biasing, 102 mm2, 266M gate equivalents; 152 ARM Cortex-M4F PEs (38 QuadPEs x4) plus one periphery Cortex-M4 management core (the vendor's '153 ARM cores'), 148 usable by applications; each PE carries a 16x4 MAC array and 128 kB SRAM => 19.8 MB on-chip, ENTIRELY software-managed — no hardware data cache, no OS, no tensor compiler and no kernel driver. 5.837 TOPS INT8 theoretical / 4.563 TOPS measured @300 MHz 0.8 V; 2.77 TOPS/W @150 MHz 0.5 V and 2.06 TOPS/W @300 MHz 0.8 V (on-chip operands); measured chip power 0.075 W (PEs off) to 1.248 W (all 152 PEs on CoreMark), summary range 0.24-2.2 W; rated TDP not disclosed. Off-chip 2 GB LPDDR4 per chip over 2 interfaces, 6.4 GB/s aggregate raw, sustained bandwidth not disclosed. Interconnect: 6 chip-to-chip event links in a hexagonal grid forming a 48-chip torus, on-die 400 MHz multicast event router, dual NoC. Host interface is 1 GbE over UDP/UDT — no PCIe, no RDMA. SNN capacity >150,000 neurons/chip and >1.8 G synaptic events/s at a 1 ms tick. Explicitly NOT a dense-GEMM competitor and its designers say so: limited DRAM bandwidth starves the DNN accelerators once layers exceed on-chip memory. Its survey value is as a contrasting corner of the design space — microcontroller-class cores, sub-watt power, event-driven sparse execution, and a programming model made of statically placed bare-metal C rather than a compiler. SW: for DNNs PyTorch -> ONNX -> AMD Quark INT8 PTQ -> OctopuScheduler (application-graph IR, layer fusion, tiling, PE mapping) -> S2Layer/S2Model producing a complete DRAM image; for SNNs snnTorch/Norse/Sinabs/Rockpool/Nengo/Lava-DL/Spyx export NIR into py-spinnaker2 (Apache-2.0; Populations/Projections, partitioner, placer, routing tables); both paths land on bare-metal C per PE built with GNU Arm Embedded GCC and custom linker scripts (CMSIS-NN, ml-lib MMIO), executed by ExperimentRunner (C++) / SpiNNMan2 via spec.json -> UDP+UDT over 1 GbE -> results.json. Maturity: shipping, low volume; commercial availability announced at ISC High Performance May 2024. Documented deployments: Sandia NNSA 'NERL Braunfels' (175M neurons, delivered March 2025) and TU Dresden / SpiNNcloud (~35,000 chips / 5M cores / eight racks). Definitive primary source is the full-chip paper Scholze, Partzsch, Hoeppner et al., 'The SpiNNaker2 chip', IEEE OJCAS 2026, DOI 10.1109/OJCAS.2026.3714974 (CC-BY, published 2026-07-27), which SUPERSEDES the 2021/2022 processing-element paper describing an 8-PE testchip (e.g. 8-bit unsigned MACs with a 29-bit accumulator was the testchip; the product is signed/unsigned with a 24-bit accumulator). Successor SpiNNext is announced only — no silicon, no specs, no process node, no date. No MLPerf; no independently audited benchmark exists.

