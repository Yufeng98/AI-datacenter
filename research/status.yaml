      NEW ENTRY (2026-08-08 landscape scan). Beijing Tsingmicro Intelligence Technology (清微智能, founded 2018-07-26; fabless, foundry NOT disclosed), Tsinghua reconfigurable-computing lineage. Two architecturally unrelated lines: TX5 edge/embedded NPUs on the TS.Knight/RNE toolchain (out of scope, do not conflate) and TX8, whose datacenter part is the TX81. Marketed as an RPU (Reconfigurable Processing Unit) on a self-developed 可重构 2.0 architecture; what is publicly observable is a coarse-grained reconfigurable dataflow accelerator — 16 tiles in a 4x4 mesh, each tile a RISC-V RV64IMFDC (lp64d) T-Head XuanTie 900 control core with NO RVV, driving neural (GEMM/conv, I_NEUR), RDMA/WDMA, DTE, vector/transcendental, layout (img2col, transpose, NCHW<->NHWC, gather/scatter, LUT) and reduction/sort engines through one command descriptor per whole tiled tensor op. 3 MiB software-managed SPM per tile (3,014,656 B visible to a Triton kernel), 48 MiB aggregate (derived); NO hardware data cache — only two address spaces, SPM and DDR, with all movement explicit RDMA/WDMA. 64 GB off-chip per device per the vendor-maintained FlagGems descriptor; technology and bandwidth not disclosed. Backward conv exists in hardware (ConvOp.op_type=2); structured sparsity is present (en_sparse/src_sparse) with pattern, ratio and speedup not disclosed; native bf16/fp16/tf32/fp32, INT8 via src_fmt/dst_fmt, FP8 E4M3/E5M2 and MX/FP4 block-scaled in the conversion path; no FP64 and no native INT64 (split into two INT32 lanes). On-chip 2D mesh NoC with DTE async block transfer PLUS globally addressable peer SPM (a distributed shared address space, not message-passing only); scale-up is a proprietary SWITCHLESS chip-to-chip mesh/torus that the compiler sees as a four-level (chip_x, chip_y, die, tile) remote load/store hierarchy, with every bandwidth and latency figure not disclosed. Performance is SYSTEM-LEVEL ONLY: TX81 module 512 TFLOPS FP16, REX1032 node 4 PFLOPS with 2 TB memory (max 4 TB), REX81 supernode 4,096 TX81 chips at >500 PFLOPS (announced only); per-chip TFLOPS and all INT8/FP8/FP4/TF32/sparse peaks are not disclosed, and the ~128 TFLOPS FP16/chip that falls out of the vendor arithmetic must never be cited as a published spec. TRAPS recorded so they are not repeated: (1) unit error — 算力突破每秒500千万亿次 is >500 PFLOPS, not exaflops; (2) attribution — FlagTree's third_party/rpu on main is Huixi Intelligence's (辉羲智能) Rhino RPU, a different company that also uses 'RPU'; Tsingmicro's backend is third_party/tsingmicro on triton_v3.3.x only; (3) product line — TS.Knight/RNE has no TX8 support. SW brand is RAISA, itself publicly undocumented; the verifiable path is PyTorch (device 'txda', PrivateUse1 via a closed torch_txda wheel) -> open FlagGems _tsingmicro operator backend -> closed RAISA graph-optimisation layer (no public graph capture) -> Triton 3.3 + TLE (tle.dsa for SPM, tle.device_mesh/remote/distributed_barrier for the mesh) -> the open FlagTree tsingmicro backend (609 files) lowering ttir -> coreir -> txir -> llir -> so; collectives via closed TCCL (NCCL-shaped), with FlagCX listing all 12 collectives in homogeneous and heterogeneous modes. Because there is no ISSCC/ISCA/Hot Chips/MICRO/JSSC paper, no architecture whitepaper and no developer portal, nearly every microarchitectural fact here is reconstructed from vendor-authored open source — chiefly the 47 KB Tx81Ops.td MLIR dialect, effectively a published operation-level model of the accelerator. Everything physical — process node, foundry, die size, dies per package, memory technology, memory bandwidth, TDP, clock, PCIe generation, form factor, chip-to-chip link bandwidth — is not disclosed and is recorded as such, never estimated. Deployment: Chinese provincial intelligent-computing centres and China Unicom private clouds, shipping at modest scale.

