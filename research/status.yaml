    notes: |
      NEW ENTRY (2026-08-08 landscape scan). NextSilicon Maverick-2 (NextSilicon Ltd, Israel, founded 2017), TSMC 5 nm 2.5D; launched 2025-10-22. SCOPE CAVEAT, read before citing this as an AI chip: it is datacenter-class hardware (OAM, 750 W, 192 GB HBM3E, PCIe Gen5, liquid-cooled, in a DOE/NNSA machine) but it is NOT an AI accelerator — the published peak table lists FP64, FP32 and FP16 ONLY (no BF16, FP8, INT8, INT4 or sparsity), FP32 and FP16 have identical scalar/vector throughput, no MLPerf or any AI/ML benchmark has ever been published, and the vendor lists CUDA, HIP/ROCm and 'leading AI frameworks' under 'upcoming integrations planned'. It is in the survey for its programming model. Intelligent Compute Architecture (ICA): 224 compute blocks per die in 4 regions, each block holding 'hundreds of interlinked ALUs' (count not disclosed), plus 32 embedded RISC-V E-cores at the die edges; no instruction stream on the grid, no architected register file, no branch predictor, no speculation. Single die ~54B transistors / 128 MB chip cache / 96 GB HBM3E @3.2 TB/s / 400 W air; dual-die OAM 448 blocks / 64 E-cores / ~108B / 256 MB / 192 GB HBM3E @6.4 TB/s (up to 288 GB flavors) / 750 W liquid; 1.5 GHz; 1-2 x 100 GbE on package. Dual-die peaks: FP64 21.6 TF s/v & 40.3 TF m/t, FP32 40.7 & 56.1, FP16 40.7 & 56.4 — transcribed from NextSilicon's own spec table as reproduced by The Next Platform; the vendor web page publishes neither peak FLOPS nor HBM bandwidth. SW is 'BYOC — bring your own code': standard C/C++/Fortran + OpenMP + Kokkos through nextcxx (LLVM/MLIR driver) to ONE binary with no arch flag and no device object; the program first runs on the HOST under nextsystemd telemetry, which identifies the 'top 1% of code flows', builds an optimized compute graph and PROJECTS it onto the grid as 'mill cores' — transient, software-defined graph objects laid down Tetris-style and torn down again — then continuously re-optimizes, caching projections persistently across runs. Three fallback tiers GRID / RISC-V E-CORES / HOST CPU, with ~80% of instruction runtime claimed on the grid. Dispatch is synchronous: nextapi::parallel_for is the entire API, fence() is a no-op, launch takes a device mutex, one kernel at a time. Memory is UVM — one virtual address space, plain std::aligned_alloc, exception-driven demand paging with page sizes from 4 KiB to 16 GiB. Only open-source component: the Kokkos NextSilicon execution space upstreamed in Kokkos 5.2.0 (Apache-2.0 WITH LLVM-exception), early maturity tracked in kokkos/kokkos#9032. SDK is gated — docs.nextsilicon.com returns HTTP 401, the architecture whitepaper is 'COMING SOON', and the GitHub org's 14 repos are all forks with no first-party SDK. Maturity: shipping, limited deployment — Sandia National Laboratories 'Spectra' (128 accelerators) and the ODISSEE consortium (4 cards). Not disclosed: ALUs per block, die area, kernel driver name.

