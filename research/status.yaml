      NEW ENTRY (2026-08-08 landscape scan). VastaiTech (瀚博半导体（上海）股份有限公司, Shanghai, founded December 2018 by two ex-AMD engineers — CEO 钱军, former Senior Director over GPU/AI server chip design, and CTO 张磊, former AMD Fellow for AI and video codec). Two chip generations in mass production, both 7 nm with the foundry NEVER named in any source: SV100 (达景 'Dajing'; the VA1 SKU is SV102), a server-class AI-inference DSA that the vendor is explicit was a deliberate choice AGAINST building a GPGPU (tape-out 2021-03, MP 2022-Q1); and SG100 (乾元 'Qianyuan'), a full-function GPU with DirectX 11/OpenGL/Vulkan graphics, AI, H.264/H.265/AV1 codec and SR-IOV virtualisation on one die (silicon back 2023-02, MP 2023-04). Both sit under the VUCA umbrella (Vastai Unified Compute Architecture, Sept 2022): streaming media, inference and graphics engines on one chip. BIGGEST RESEARCH TRAP: vastaitech.com is stale — its milestone timeline and awards stop in 2023 and the current 2026 product line (VA16, VA10L, VA1L) appears NOWHERE on the marketing site; it is documented only in github.com/Vastai, the vllm-vacc.vastaitech.com recipe site and 2025-2026 Chinese press. Researching this vendor from the website alone yields the wrong generation and the wrong conclusion that it is a video/CV inference company; in 2026 it is a datacenter LLM-serving platform running DeepSeek-V3 671B in native FP8. SECOND STRUCTURAL FACT: a card presents N independent devices ('dies'), each with its own memory pool and device_id — VA1-16G = 2 dies x 8 GB, while the vLLM recipes state VA16128G and VA10L128G as 4 dies x 32 GB, which is why DeepSeek-V3 on 8x VA16 runs at TP=32; every runtime knob (VACC_VISIBLE_DEVICES, --llm_devices, --tensor-parallel-size) operates at die granularity. Whether a 'die' is physically separate silicon in an MCP or a partition of a monolithic die is NOT disclosed. THIRD: almost nothing quantitative is public — no memory technology (HBM/GDDR/LPDDR/DDR) and no memory bandwidth figure exists for ANY VastaiTech part ever shipped, in Chinese or English; peak TOPS/TFLOPS, TDP, form factor, PCIe generation and process node are all undisclosed for the current VA16/VA10L/VA1L; there is no ISCA/MICRO/Hot Chips/ISSCC/arXiv publication and no third-party benchmark. SW: the compute target is VACC (Vastai Accelerated Computing, never expanded by the vendor), delivered as VVI (Vastai Versatile Inference) VVI-26.02 from a sales-gated developer centre, in TWO parallel runtime paths that share nothing above the driver — Build_In (VastModelZOO/VastGenX, HF-modeling patch + AOT trace, VAMC graph compiler, VDSP ELF ops + closed VNNL, VastStreamX/VACM tensors, VACL/VACE/VAME + Stream), the mature CV/NLP path; and vLLM (vllm_vacc / torch_vacc, no graph capture at all, --enforce-eager mandatory), where all 2026 LLM/VLM work happens. VAMC is TVM-based, NOT MLIR-based — all 344 compile configs set backend.type: tvm_vacc (594 occurrences), putting VastaiTech in the TVM lineage camp unlike most 2024+ Chinese accelerator compilers. Consequences: tensor parallelism is COMPILED IN on Build_In (model_kwargs.tp, so changing TP means recompiling) while the vLLM path takes --tensor-parallel-size at launch; and the compiler owns memory placement (output_ddr, mem_inplace, data_transport_mode, cluster_mode, graph.extra_ops: insert_odma), the strongest available evidence that on-chip memory is a software-managed scratchpad — confirmed flags, inferred conclusion, no vendor statement. Quantisation coverage is broad: FP16, BF16, INT8 PTQ (per-channel, four calibration modes), W8A16-GPTQ, W4A16, INT4, FP8 and FP4 on VA16 as of 2026 (GPTQ calibration can even run on device: cuda:5 — calibrate on NVIDIA, deploy on VACC). Build_In graph capture is invasive: every LLM except LLaMA needs a config_vacc.json auto_map pointing at a vendor-modified xxx_modeling_xxx_vacc.py, so each new architecture needs a vendor-authored patch. REAL KERNEL GAP relative to peers: no Triton port, no TileLang, no assembler, no intrinsics header, no disassembler; VDSP custom operators ship as pre-built ELF binaries under /opt/vastai/vaststreamx/data/elf/ loaded via vsx::CustomOperator, and the toolchain that produces them is not distributed — a customer cannot write a new fused kernel. Collectives VCCL; management VAML -> vasmi / VAProfiler / VASID / valogger, VastCloudNative for k8s; driver vastai_pci.ko (/dev/vastai0); ISA not disclosed.
