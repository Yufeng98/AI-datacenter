    notes: |
      CDNA 5 / MI455X launched Advancing AI 2026 (2026-07-23); AMD CDNA 5 blog 2026-08-04. Arch is CDNA 5, NOT "CDNA Next"/UDNA (UDNA/CDNA 6 -> MI500 2027; ~1000x claim deleted, unsourced). MI455X: 8 XCDs (TSMC N2) x 32 active WGPs of 34 = 256 WGPs (=512 CUs), 2 SE/XCD x16 WGP, 4 matrix units/WGP, 2.4 GHz, native Wave32 (Wave64 removal not disclosed); 40.26 PFLOPS MXFP4 + 315 TFLOPS FP32 confirmed, 20.13/5.03 PFLOPS unconfirmed; new E5M3 scale fmt, 4-bit Tensor LUT, Tensor Data Movers. Mem: 432 GB HBM4 @ 23.3 TB/s (was 19.6 stale), 12 stacks x2048-bit/192ch; 192 MB global L2 = 2x96 MB on new Fabric-and-Cache Dies @54 TB/s (Infinity Cache tier gone); 320 KB LDS + 128 KB L1 per WGP. Pkg: 8 XCD + 2 IOD + 2 FCD (N3), CoWoS-L, host = 256 GB/s 16-lane Infinity Fabric (not PCIe); transistors/TBP not disclosed. Fabric: UALoE 36x400 Gb/s = 3.6 TB/s bidir, 72-GPU scale-up domain, 260 TB/s rack; scale-out 43 TB/s/rack via Pensando Vulcano. Helios: 72 MI455X + 18 EPYC Venice, 2.9 EFLOPS MXFP4, 31 TB HBM4, ~1.7 PB/s; rack power/format NOT disclosed. In production, shipping Q3 2026, ramping Q4 — not deployed at scale. SKUs: MI430X (288 TF FP64, H1 2027), MI350P is CDNA4/gfx950 not CDNA5, MI440X unconfirmed (omitted). Anthropic 2 GW; 6 GW is OpenAI (Oct 2025), NOT Meta (repo error fixed). SW: ROCm 7.14.0 (2026-07-16, TheRock production, HIP Execution Contexts, batch mem APIs, RCCL hierarchical AllGather, ROCprof-SDK SPM, PT 2.12/JAX 0.10/vLLM 0.23); no ROCm 8. CRITICAL: CDNA 5 gfx target NOT DISCLOSED (matrix stops at gfx950). AMD Primus training framework added (Megatron/TorchTitan/MaxText, v26.4). ROCm.AI/Hyperloom announced; 3.3x/38% are unverified vendor claims. MLPerf Training v6.0: first multi-node (512x MI300X on OCI), first MXFP4 recipe, +19%/+13% MI355X. Next: confirm gfx ID, Tomahawk 6 count, rack power, MLPerf Inference v6.0 numbers.

      Unresolved / written as 'not disclosed': MI455X transistor count (320B is an unverified aggregator figure) — written as not disclosed; MI455X TBP — not disclosed; CDNA 5 gfx ISA target / --offload-arch value — not disclosed; ROCm 7.14.0 compatibility matrix stops at gfx950 for Instinct; Helios rack power (the 225–245 kW figure is unsourced; AMD's footnote references only a 100 kW comparison envelope) — not disclosed; Helios rack format (Open Rack Wide 1.2 m × 1.3 m, 44 OU) and 50 V liquid-cooled bus bar — not confirmed against a primary AMD source; Whether Wave64 is removed from the CDNA 5 ISA (only native Wave32 execution is confirmed) — not disclosed; Whether UALoE switching performs in-network reduction — not disclosed; Broadcom switch detail: '12× Tomahawk 6 ASICs in a 12-plane topology' — not confirmed (partnership itself is corroborated)

