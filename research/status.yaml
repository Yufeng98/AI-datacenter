    notes: |
      NEW ENTRY (2026-08-08 landscape scan). Stream Computing Inc. (希姆计算, founded 2019; operating entity 广州希姆半导体科技有限公司). Geography note because secondary sources get it wrong: the CARRV'21 paper and ByteDance's benchmark both say Beijing, the current entity is Guangzhou (offices also Beijing/Shanghai/Hangzhou) — origin Beijing, current entity Guangzhou, NOT a Shanghai company. NeuralScale is a general-purpose programmable NPU architecture extending RISC-V with vendor-custom vector and matrix instructions, shipping as PCIe 4.0 x16 datacenter INFERENCE cards — five SKUs (STCP920 / STCP950L / STCP950P / STCP980L / STCP980P), all one silicon generation: the P920 SoC, TSMC 12 nm, 400 mm2, 32 NeuralScale cores, 128 TFLOPS FP16 / 256 TOPS INT8 @1.0 GHz, 130 W chip TDP, 16 GB LPDDR4X (~108 GB/s). Three things make it survey-worthy: (1) a genuinely different core model — a NeuralScale core is an AndesCore N25F RV32G 5-stage in-order scalar core issuing up to THREE instructions per cycle to three decoupled engines (vector MAC VME, matrix MAC MME, memory transfer MTE), i.e. per-core MIMD, not SIMT and not a fixed-function systolic NPU; (2) a vendor-custom RISC-V extension in shipping silicon — RVV v0.8 plus 53 custom instructions on the custom-3 opcode (OP-VE) and 22 unprivileged shape CSRs, which must NOT be conflated with the separate OPEN RISC-V matrix-extension proposal the company chairs and the shipping silicon does not implement; (3) a documented compiler-family migration, from TensorTurbo (TVM + LLVM + stcDNN, 2021-2023) to MLTC (MLIR + IREE + torch-mlir) — very few vendors have publicly changed compiler families mid-product. MLTC is proprietary MLIR: its stc.* dialect has 164 ops including stc.attention / stc.attention_lm, stc.kv_cache_load/store, stc.matmul vs stc.matmul_vme, and a built-in collective family; its GOAT tiling framework tiles LLB -> MC -> L1 and is operator-agnostic, motivated by the vendor's own statement that 'most of the code is managing the multi-level storage hierarchy and the data movement between levels'; graph-level ops are deliberately atomic with no fused operators in the graph IR. Delivery is STCRP (Stream Computing System Reference Platform) V1.12.1 as vendor-support-supplied .deb/.rpm repos plus Python wheels — there are NO public SDK repositories; OS support Ubuntu 22.04, Ubuntu 25.04, Kylin V10, Python 3.10. Framework paths: PyTorch primary via torch.compile(backend=mltc_backend) or from_torch after torch.export with Dim() dynamic shapes; ONNX (OnnxToStc, 156 ops) and TensorFlow (TfToStc, 106 TF1 GraphDef ops) importers; PaddlePaddle Level-I compatibility certification with Baidu plus an open STCPaddleModelZoo (~20 models) that is a TensorTurbo-era artifact, not current-stack; HuggingFace LLMs via STC_LLM loading bin/safetensors directly. Notably absent: no vLLM fork, no SGLang, no Triton kernel language, no ONNX Runtime EP. Maturity: shipping and deployed, first generation only — silicon returned 2021, first cards shipped 2021, volume orders 2022; ByteDance's ByteMLPerf hosts the vendor's own Apache-2.0 backend whose README states the STCP920 'is in mass production, and has completed a batch of shipments to users', with reproducible QPS and accuracy. NO second-generation silicon is public: the only trace is that the shipping MLTC compiler accepts --arch=npu-v2, a flag, not a chip. Stated plainly: the card is bandwidth-starved for LLM decode — 16 GB LPDDR4X at ~108 GB/s against 128 TFLOPS FP16 is a CNN/NLP-era part retrofitted for LLMs, and the vendor's own table shows Qwen2-72B-Instruct on 16 cards at 4.98 tok/s.

