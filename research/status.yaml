    notes: |
      NEW ENTRY (2026-08-08 landscape scan). IBM Spyre Accelerator: 5 nm inference ASIC, 25.6B transistors, single-slot 75 W PCIe card, 128 GB LPDDR5 (16 ch @6.4 Gbps, ~204 GB/s), IBM-primary peak '>300 TOPS per card at 75 W' (the per-dtype fp16 98 / fp8 157 / int8 315 / int4 629 TOPS breakdown is secondary-source only and unconfirmed). 32 active AI cores (34 physical, 2 yield spares) in an 8x4 grid; 2 corelets per core sharing one 2 MB LX scratchpad; each corelet an 8x8 SIMD-systolic PE array (64 math engines, the toolchain 'PT' unit) plus 1D vector/SFU => 4,096 math engines per card (arithmetic, not published). NO hardware cache anywhere in the compute path: the compiler emits explicit load/stores staging 128-byte 'sticks' between LPDDR5 and the LX scratchpad, with no eviction mechanism, by design; the stick inherits the zAIU/zDNN 'stickified tensor' layout from Telum. On-chip bidirectional ring joins all 32 cores at 128 B/cycle/direction and the compiler is ring-aware (K-split matmul core-ID permutation). NO proprietary chip-to-chip fabric: scale-out is a standard PCIe switch fabric with direct card-to-card RDMA. Chassis limits 48 cards on z17/LinuxONE 5 (~6.1 TB, 1,536 cores) and 16 on Power11; single-model ensemble capped at 8 cards / ~1 TB by spyreccl; multi-node not supported. The widely repeated '8 cards / 256 cores' is a stale Aug-2024 Hot Chips preview figure. Productization of IBM Research's AIU line; the AIU name survives throughout the software (torch_sendnn, aiu-smi, libaiupti, the ibm-aiu GitHub org). DO NOT conflate with the Telum II on-die zAIU: zDNN and zDLC do not target Spyre. Unusually open middle of the stack: github.com/torch-spyre, 14 mostly Apache-2.0 repos publishing the PyTorch backend, TorchInductor front end, compiler<->device interface specs, design RFCs, a Triton fork, and a CPU interpreter + latency model for the tile IR. Closed below: DeepTools back-end compiler, DeepRT/Flex runtime, collectives, driver, firmware and ISA; torch_sendnn is only available pre-installed and cannot be downloaded. Status: shipping GA as a priced system option (z17 / LinuxONE 5 GA 2025-10-28; Power11 GA early Dec 2025), not a merchant datacenter part; no named external at-scale deployment. Primary academic source ISSCC 2026 (DOI 10.1109/ISSCC49663.2026.11409090). Not disclosed: clock frequency, scratchpad bandwidth, inner scratchpad level size, ring aggregate GB/s; die size 330 mm2 and PCIe Gen5 x16 / 64 GB/s are secondary-source only.

