        - title: "PEZY news 2026-05-13 (PZLAST-MAG)"
          url: "https://www.pezy.co.jp/en/news/news20260513-pzlastmag/"

    - group: green500_june_2026_negative
      confidence: high
      basis: independent_list_check_top20_only
      facts:
        pezy_in_top_20: false
        zettascaler_in_top_20: false
        exascaler_in_top_20: false
        top_20_leaders:
          - {system: KAIROS (CALMIP/CNRS), gf_per_w: 73.282}
          - {system: ROMEO-2025, gf_per_w: 70.912}
          - {system: Levante GPU extension, gf_per_w: 69.426}
          - {system: Isambard-AI phase 1, gf_per_w: 68.835}
          - {system: Otus, gf_per_w: 68.177}
