        delay_news: none
        funding_news: none
        acquisition_news: none
        corporate_status_news: none
        caveat: >
          ExaScaler's own site could not be checked: www.exascaler.co.jp presents a TLS
          certificate valid only for pezy.co.jp / pezy.jp and is unreachable to automated
