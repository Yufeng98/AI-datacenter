chip: qualcomm-cloud-ai-100
investigation: hw-architecture
date: "2026-04-05"
confidence: high

device_class: Cloud AI Inference Accelerator
focus: Cloud AI 100 and Cloud AI 200 data center inference

sku:
  standard:
    socs_per_card: 1
    ai_cores: 16
    tops_int8: 400
    tflops_fp16: 200
    sram_mb: 144
    dram: "32 GB LPDDR4X, 136 GB/s"
    tdp_w: 75
    pcie: "Gen4 x8"
  ultra:
    socs_per_card: 4
    ai_cores_total: 64
    tops_int8: 870
    sram_mb: 576
    dram: "128 GB LPDDR4X, 548 GB/s"
    tdp_w: 150
    pcie: "Gen4 x16"
  ai200:
    status: announced_2026
    dram_capacity_per_card_gb: 768
    power_rack_kw: 160
    direct_liquid_cooling: true

ai_core_microarchitecture:
  type: "Hexagon Q6 DSP + HVX + HMX"
  cores_per_soc: 16
  tensor_unit:
    int8_ops_per_cycle: 8192
    fp16_ops_per_cycle: 4096
    instruction_count: 125
  vector_unit:
    int8_ops_per_cycle: 512
    fp16_ops_per_cycle: 256
    instruction_count: 700
  scalar_unit:
    type: "4-way VLIW"
    hardware_threads: 6

memory:
  on_chip_sram_per_soc_mb: 144
  noc_count: 3
  noc_bandwidth_gbs: 186  # Compute NoC
  dram_type: LPDDR4X
  no_hbm: true

sources:
  - https://quic.github.io/cloud-ai-sdk-pages/latest/Getting-Started/Architecture/
  - https://www.qualcomm.com/artificial-intelligence/data-center/cloud-ai-100-ultra
  - https://docs.kernel.org/accel/qaic/aic100.html

