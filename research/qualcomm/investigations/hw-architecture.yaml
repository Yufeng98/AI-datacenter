    brand: Dragonfly
    memory_type: LPDDR5x
    no_hbm: true
    dram_capacity_per_card_gb: 768      # Oct 2025 launch figure; NOT restated June 2026
    dram_capacity_conflict: >-
      The Register (2026-06-30) attributes 768 GB/card on LPDDR5x to AI250, not AI200.
