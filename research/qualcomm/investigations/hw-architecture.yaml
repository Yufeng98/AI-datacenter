update_2026_08_08:
  as_of: "2026-08-08"
  event: "Qualcomm Investor Day, 2026-06-24"

  branding:
    confidence: high
    umbrella_brand: "Qualcomm Dragonfly"
    products_named_in_pr: [C1000, AI200, AI250, AI300]
    note: >-
      AI200 and AI250 are the October 2025 parts retroactively rebranded. A separate
      'connectivity / custom silicon / AI accelerator / CPU' sequence is REVENUE-RAMP
      SEQUENCING from the Investor Day financial deck, NOT the product taxonomy; only the
      'custom silicon revenue Q1 FY2027' and 'AI accelerator revenue H2 FY2027' legs are
      attested (via Futurum). Do not conflate the two.
    sources:
      - https://www.qualcomm.com/news/releases/2026/06/qualcomm-unveils-comprehensive-data-center-roadmap-for-the-agent
      - https://futurumgroup.com/insights/qualcomms-data-center-reentry-at-investor-day-2026-arrives-just-in-time-for-the-inference-decode-prize/

  hbc_architecture:
    confidence: high            # that the architecture is as described
    name: "HBC — High Bandwidth Compute"
    mechanism: "3D-stacked near-memory computing: DRAM stacked over XPU logic die, connected via TSVs"
    mechanism_confidence: medium_high   # Qualcomm PR says 'near-memory computing'; DRAM-over-logic-via-TSV detail is The Register
    strategic_position: "explicit bet against HBM"
    generations:
      gen1: AI250
      gen2: AI300
    sources:
      - https://www.qualcomm.com/news/releases/2026/06/qualcomm-unveils-comprehensive-data-center-roadmap-for-the-agent
      - https://www.theregister.com/systems/2026/06/30/qualcomms-proposed-solution-to-catch-up-in-ai-infra-bury-the-compute-under-the-dram/5264071

  hbc_vendor_claims:
    confidence: high            # high that Qualcomm CLAIMED these; the values themselves are UNAUDITED
    claim_status: vendor_marketing_unaudited
    methodology: not_disclosed
    bandwidth_per_watt_vs_hbm: "6x"
    capacity_per_watt_vs_sram: "200x"
    disputed_by:
      source: https://www.theregister.com/systems/2026/06/30/qualcomms-proposed-solution-to-catch-up-in-ai-infra-bury-the-compute-under-the-dram/5264071
      argument: >-
        The Register (2026-06-30) reports Qualcomm declined to disclose peak FLOPS for AI250 or
        AI300 and declined to explain the 'effective bandwidth' methodology, and computes that
        the implied ~414 TB/s aggregated across 56 AI200 chips would require an implausible
        ~6,720-bit bus on standard LPDDR5x. Treat 18x / 54x / 133 TB/s as inflated-by-definition
        until audited.
    sources:
      - https://www.qualcomm.com/news/releases/2026/06/qualcomm-unveils-comprehensive-data-center-roadmap-for-the-agent
      - https://www.theregister.com/systems/2026/06/30/qualcomms-proposed-solution-to-catch-up-in-ai-infra-bury-the-compute-under-the-dram/5264071

  ai200:
