layer_mappings:
  - layer: Compute Engine
    confidence: confirmed
    summary: >
      SM-based architecture. Each SM has 128 CUDA cores, 4 Tensor Cores (4th gen on Hopper,
      5th gen on Blackwell), 256 KB register file, and 4 warp schedulers supporting up to 64
      concurrent warps. H100 has 132 SMs; B200 has 148 SMs per die. 5th-gen Tensor Cores
      add MXFP4 and MXFP6 microscaling formats. B200 peak: 20 PetaFLOPS FP4, 10 PFLOPS FP8,
      5 PFLOPS FP16, 45 TFLOPS FP64.
    key_specs:
      cuda_cores_per_sm: 128
      tensor_cores_per_sm: 4
      register_file_per_sm_KB: 256
      warp_schedulers_per_sm: 4
      max_warps_per_sm: 64
      sm_count:
        H100: 132
        B200_per_die: 148
      data_types_hopper: [FP64, TF32, FP32, FP16, BF16, FP8_E4M3, FP8_E5M2, INT8]
      data_types_blackwell: [FP64, TF32, FP32, FP16, BF16, FP8_E4M3, FP8_E5M2, MXFP6, MXFP4, INT8]
    sources:
      - title: "NVIDIA Blackwell Architecture Technical Overview"
        url: "https://resources.nvidia.com/en-us-blackwell-architecture"
      - title: "NVIDIA H100 Tensor Core GPU Architecture Whitepaper"
        url: "https://www.advancedclustering.com/wp-content/uploads/2022/03/gtc22-whitepaper-hopper.pdf"
      - title: "NVIDIA Hopper Architecture In-Depth — NVIDIA Technical Blog"
        url: "https://developer.nvidia.com/blog/nvidia-hopper-architecture-in-depth/"

  - layer: Data Path
    confidence: confirmed
    summary: >
      SIMT execution model: warps of 32 threads execute one instruction in lock-step; from Volta
      onward each thread has independent program counter (independent thread scheduling). 4 warp
      schedulers per SM with dual-issue capability (2 independent instructions per warp per cycle
      to separate functional units). In-order fetch/decode with out-of-order memory completion.
      Hopper introduced Tensor Memory Accelerator (TMA) for asynchronous 5D tensor moves
      between global and shared memory. Thread Block Clusters (Hopper+) allow cooperative groups
      spanning up to 8 SMs with distributed shared memory.
    key_specs:
      warp_size_threads: 32
      max_warps_per_sm: 64
      max_threads_per_sm: 2048
      dispatch_units_per_scheduler: 2
      hopper_features: [TMA, Thread Block Clusters, async wgmma instructions]
    sources:
      - title: "NVIDIA Hopper Architecture In-Depth — NVIDIA Technical Blog"
        url: "https://developer.nvidia.com/blog/nvidia-hopper-architecture-in-depth/"
      - title: "NVIDIA Hopper Tuning Guide"
        url: "https://docs.nvidia.com/cuda/hopper-tuning-guide/index.html"
      - title: "CUDA SIMT and Warps — Cornell Virtual Workshop"
        url: "https://cvw.cac.cornell.edu/gpu-architecture/gpu-characteristics/simt_warp"

  - layer: On-chip Memory
    confidence: confirmed
    summary: >
      Per SM: 256 KB register file; unified L1/SMEM pool configurable at kernel launch.
      H100 supports up to 228 KB shared memory per SM (256 KB total pool), a 39% increase
      over A100's 164 KB. Blackwell maintains 228 KB/SM for shared memory. L2 cache shared
      across all SMs: 50 MB on H100 (1.25× A100's 40 MB); ~96–128 MB on Blackwell
      (2–2.5× H100), with 4 L2 partitions vs 2 on Hopper. Hopper added L2 residency controls
      for pinning frequently-accessed data.
    key_specs:
      register_file_per_sm_KB: 256
      shared_memory_max_per_sm_KB:
        A100: 164
        H100: 228
        B200: 228
      l2_cache_total_MB:
        A100: 40
        H100: 50
        B200_approx: 96
      l2_partitions:
        H100: 2
        Blackwell: 4
    sources:
      - title: "NVIDIA Hopper Architecture In-Depth — NVIDIA Technical Blog"
        url: "https://developer.nvidia.com/blog/nvidia-hopper-architecture-in-depth/"
      - title: "NVIDIA Blackwell Tuning Guide"
        url: "https://docs.nvidia.com/cuda/blackwell-tuning-guide/index.html"
      - title: "Nvidia H100 Funny L2 and Tons of Bandwidth — Chips and Cheese"
        url: "https://chipsandcheese.com/2023/07/02/nvidias-h100-funny-l2-and-tons-of-bandwidth/"

  - layer: Off-chip Memory
    confidence: confirmed
    summary: >
      All current-gen NVIDIA datacenter GPUs use HBM stacked on a 2.5D CoWoS interposer.
      H100 SXM5: 80 GB HBM3 at 3.35 TB/s. H200 SXM5: 141 GB HBM3e at 4.8 TB/s (first GPU
      with HBM3e). B200: 192 GB HBM3e at 8.0 TB/s — 2.4× H100 bandwidth. GB200 NVL72 (72 GPUs):
      13.4 TB aggregate HBM3e. Blackwell dual-die uses NV-HBI (10 TB/s die-to-die) so both dies
      share a unified 192 GB address space.
    key_specs:
      H100_SXM5:
        hbm_gen: HBM3
        capacity_GB: 80
        bandwidth_TBps: 3.35
      H200_SXM5:
        hbm_gen: HBM3e
        capacity_GB: 141
        bandwidth_TBps: 4.8
      B200:
        hbm_gen: HBM3e
        capacity_GB: 192
        bandwidth_TBps: 8.0
      GB200_NVL72_aggregate:
        capacity_TB: 13.4
        bandwidth_TBps_aggregate: 576
      die_to_die_link_B200: "NV-HBI 10 TB/s"
    sources:
      - title: "NVIDIA H200 GPU Product Page"
        url: "https://www.nvidia.com/en-us/data-center/h200/"
      - title: "NVIDIA Blackwell Architecture Technical Overview"
        url: "https://resources.nvidia.com/en-us-blackwell-architecture"
      - title: "NVIDIA H200 vs B200 Comparison — vast.ai"
        url: "https://vast.ai/article/nvidia-h200-vs-b200-comparing-datacenter-grade-accelerators"
      - title: "Nvidia introduces Blackwell 800mm² N4P dies — SemiWiki"
        url: "https://semiwiki.com/forum/threads/nvidia-introduces-blackwell-800mm2-reticle-limit-n4p-dies.19856/"

  - layer: "Host Interface / Package"
    confidence: confirmed
    summary: >
      PCIe Gen 5.0 x16 (~128 GB/s bidirectional) for standard form-factor GPUs (H100 PCIe,
      B100 PCIe). SXM/HGX board configurations use NVLink as the primary data path between
      GPUs in the same node. GH200 Grace Hopper and GB200 Grace Blackwell Superchips use
      NVLink-C2C at 900 GB/s bidirectional coherent interface between Grace CPU and GPU —
      7× faster than PCIe Gen 5. Blackwell uses TSMC CoWoS-L 2.5D packaging with two ~800 mm²
      GB100 dies connected by 10 TB/s NV-HBI on the same interposer as HBM3e stacks.
    key_specs:
      pcie_gen5_BW_GBps_bidir: 128
      nvlink_c2c_BW_GBps_bidir: 900
      blackwell_die_size_mm2: 800
      blackwell_packaging: "TSMC CoWoS-L 2.5D"
      blackwell_die_to_die_BW_TBps: 10
      process_node:
        H100: "TSMC 4N custom"
        B200: "TSMC 4NP custom"
    sources:
      - title: "NVIDIA Grace Hopper Superchip Product Page"
        url: "https://www.nvidia.com/en-us/data-center/grace-hopper-superchip/"
      - title: "Inside NVIDIA Blackwell Ultra — NVIDIA Technical Blog"
        url: "https://developer.nvidia.com/blog/inside-nvidia-blackwell-ultra-the-chip-powering-the-ai-factory-era/"
      - title: "Nvidia goes MCM and announces Blackwell — igor'sLAB"
        url: "https://www.igorslab.de/en/nvidia-goes-mcm-and-officially-announces-blackwell-at-gtc-2024-details-of-the-monster-chip/"

  - layer: Scale-up Interconnect
    confidence: confirmed
    summary: >
      NVLink is NVIDIA's proprietary GPU-to-GPU interconnect. 4th-gen (Hopper): 900 GB/s per
      GPU. 5th-gen (Blackwell): 1.8 TB/s per GPU (2× Hopper). NVSwitch ASICs implement a
      non-blocking all-to-all NVLink crossbar: 5th-gen NVSwitch has 64 ports and 7.2 TB/s
      aggregate bandwidth per switch, scalable to 576 GPUs. GB200 NVL72 connects 72 Blackwell
      GPUs and 36 Grace CPUs in a rack-scale liquid-cooled system with 130 TB/s total
      GPU-to-GPU bandwidth and 13.4 TB aggregate HBM.
    key_specs:
      nvlink_gen4_per_gpu_GBps: 900
      nvlink_gen5_per_gpu_TBps: 1.8
      nvswitch_gen5_ports: 64
      nvswitch_gen5_aggregate_TBps: 7.2
      max_gpus_nvlink_fabric: 576
      gb200_nvl72:
        gpus: 72
        grace_cpus: 36
        total_bandwidth_TBps: 130
        total_hbm_TB: 13.4
    sources:
      - title: "NVIDIA GB200 NVL72 Product Page"
        url: "https://www.nvidia.com/en-us/data-center/gb200-nvl72/"
      - title: "NVIDIA GB200 NVL72 Technical Blog"
        url: "https://developer.nvidia.com/blog/nvidia-gb200-nvl72-delivers-trillion-parameter-llm-training-and-real-time-inference/"
      - title: "NVIDIA GB200 Interconnect Architecture Analysis — NADDOD"
        url: "https://naddod.medium.com/nvidia-gb200-interconnect-architecture-analysis-nvlink-infiniband-and-future-trends-91dc6ba49bf3"

  - layer: Scale-out Interconnect
    confidence: confirmed
    summary: >
      Inter-node GPU communication uses NVIDIA ConnectX-7 HCAs (NDR InfiniBand) at 400 Gb/s
      per port (800 Gb/s dual-port). ConnectX-7 supports both IB and Ethernet (RoCE v2 at
      400 GbE) on the same ASIC. GPUDirect RDMA allows the NIC to DMA directly to/from GPU
      HBM, eliminating CPU bounce buffers. SHARP (in-network AllReduce on IB switches) reduces
      GPU idle time during collective operations. Standard AI training cluster topology: NVLink
      for intra-node (scale-up) + NDR InfiniBand fat-tree for inter-node (scale-out).
    key_specs:
      connectx7_ib_speed_Gbps: 400
      connectx7_ethernet_speed_GbE: 400
      connectx7_pcie_interface: "Gen 5.0 x16"
      gpudirect_rdma: true
      sharp_in_network_compute: true
      roce_version: "RoCEv2"
    sources:
      - title: "NVIDIA ConnectX-7 400G Datasheet"
        url: "https://www.nvidia.com/content/dam/en-zz/Solutions/networking/infiniband/connectx-7-datasheet.pdf"
      - title: "NVIDIA ConnectX-7 NDR InfiniBand Adapter Card — NVIDIA"
        url: "https://www.nvidia.com/content/dam/en-zz/Solutions/networking/infiniband-adapters/infiniband-connectx7-data-sheet.pdf"
      - title: "GPUDirect RDMA deep-dive — QSysArch"
        url: "https://qsysarch.com/posts/gpu-direct-from-rdma-from-pcie-to-using-doca/"

key_abstractions:
  - name: SM (Streaming Multiprocessor)
    description: >
      NVIDIA's fundamental compute unit. Each SM is an independent multithreaded processor
      with its own warp schedulers, CUDA cores, Tensor Cores, register file, and L1/SMEM.
      The GPU is composed of a grid of SMs sharing L2 cache and HBM. All CUDA programs express
      parallelism in terms of thread blocks that map to SMs.
    layers_involved: [Compute Engine, Data Path, On-chip Memory]

  - name: Tensor Core
    description: >
      Specialized MMA (matrix-multiply-accumulate) unit inside each SM. Performs D = A×B + C
      on small matrix tiles (e.g., 16×16 for FP16) in a single clock cycle with dramatically
      higher throughput than scalar CUDA cores. Generations 1–5 have progressively added lower
      precision formats (FP8, MXFP4) to trade dynamic range for compute density.
    layers_involved: [Compute Engine, Data Path]

  - name: Warp
    description: >
      The fundamental execution unit of NVIDIA's SIMT model: 32 threads that execute the same
      instruction in lock-step. Warp schedulers select from resident warps each cycle, hiding
      memory latency by switching to ready warps. All CUDA occupancy tuning, register
      allocation, and shared memory sizing trade off against how many warps can be resident
      simultaneously per SM.
    layers_involved: [Compute Engine, Data Path]

  - name: NVLink
    description: >
      NVIDIA's proprietary high-speed GPU interconnect, used both within a server (GPU-to-GPU
      via NVSwitch) and for CPU-GPU coupling (NVLink-C2C in Grace Hopper / Grace Blackwell).
      5th-gen NVLink delivers 1.8 TB/s per GPU, enabling tensor-parallel splits across GPUs
      without host CPU involvement. NVSwitch extends NVLink into a non-blocking all-to-all
      fabric scaling to 576 GPUs.
    layers_involved: ["Scale-up Interconnect", "Host Interface / Package"]

  - name: HBM (High Bandwidth Memory)
    description: >
      Stacked DRAM technology integrated on the same CoWoS 2.5D package as the GPU die.
      HBM3 (H100: 3.35 TB/s) and HBM3e (H200: 4.8 TB/s; B200: 8.0 TB/s) provide the
      main GPU frame buffer. The arithmetic intensity threshold for compute-bound vs
      memory-bound kernel behavior scales with HBM bandwidth, making HBM generation a
      primary determinant of software algorithm selection (e.g., FlashAttention vs naive
      attention).
    layers_involved: [Off-chip Memory]

