chip: etched-sohu
investigation: hw-architecture
as_of: 2026-08-08
baseline_as_of: 2026-04-05  # everything not under update_2026_08_08 is the Gen 1 (Sohu, 2024) baseline
confidence_overall: medium  # no independent benchmarks; A0 silicon back but not shipping; 2026 architecture claims are vendor-only

key_findings:
  - finding: "Hardcoded transformer pipeline — every transformer op is dedicated silicon, not a kernel on a programmable engine"
    confidence: confirmed
    source: etched.com announcements, TechCrunch, LessWrong deep-dive
  - finding: "Proprietary non-GEMM attention hardware — attention computed without standard matrix-multiply engine, uses less silicon area than GEMM approach"
    confidence: confirmed
    source: LessWrong deep-dive, Etched marketing
  - finding: "TSMC 4nm, reticle-limit single die (~800 mm²)"
    confidence: confirmed
    source: multiple sources
  - finding: "144 GB HBM3E per chip (0.75× B200, 1.8× H100)"
    confidence: confirmed
    source: multiple sources
  - finding: "Claimed 90%+ FLOPS utilization vs ~30-40% for GPU transformer inference"
    confidence: claimed-unverified
    source: Etched marketing
  - finding: "8× Sohu server: 500,000+ tok/s on Llama 70B"
    confidence: claimed-unverified
    source: Etched marketing; no third-party validation
  - finding: "No peak TFLOPS figure published"
    confidence: confirmed-absence
    source: all public sources
  - finding: "No training support — inference only"
    confidence: confirmed
    source: multiple sources
  - finding: "MoE variant exists (separate config)"
    confidence: confirmed
    source: Etched announcements
  - finding: "Chip not shipped to customers as of Q1 2026"
    confidence: confirmed
    source: Data Center Dynamics, Bloomberg
    superseded_by: update_2026_08_08.silicon  # still not shipping, but A0 silicon is back

compute:
  architecture: hardwired_transformer_pipeline
  blocks:
    - name: attention_engine
      ops: [QKV_projection, attention_dot_product, softmax, output_projection]
      implementation: proprietary_non_gemm_hardware
    - name: ffn_engine
      ops: [linear_1, activation_gelu_silu, linear_2]
      implementation: dedicated_matrix_pipeline
    - name: norm_block
      ops: [layer_norm, rms_norm]
      implementation: dedicated_hardware
    - name: residual_add
      ops: [element_wise_add]
      implementation: dedicated_alu
  flops_utilization_claimed: ">90%"
  gpu_baseline_utilization: "~30-40%"
  peak_tflops: not_disclosed

memory:
  offchip_type: HBM3E
  offchip_capacity_gb: 144
  offchip_bw_tbs: ~4-5  # estimated from HBM3E specs
  onchip_sram: not_described
  memory_model: hardware_managed_via_fixed_pipeline

process:
  foundry: TSMC
  node: 4nm
  die_size_mm2: ~800  # reticle-limit
  die_count: 1  # single monolithic die
  packaging: CoWoS_2.5D  # inferred for HBM3E integration

interconnect:
  scale_up_chips_per_server: 8
  scale_up_protocol: not_disclosed
  scale_out: not_disclosed
  host_interface: not_disclosed  # likely PCIe

status:
  # Gen 1 baseline snapshot (2026-04-05). See update_2026_08_08.status for the current record.
  samples_shipped: false
  customer_deliveries: false
  third_party_benchmarks: false
  funding_raised_m: 620  # SUPERSEDED — see update_2026_08_08.funding
  valuation_b: 5         # SUPERSEDED — see update_2026_08_08.funding
  funding_date: "2026-01"  # CORRECTED — round closed 2025-12, reported 2026-01

