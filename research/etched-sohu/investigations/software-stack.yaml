chip: etched-sohu
investigation: software-stack
as_of: 2026-08-08
baseline_as_of: 2026-04-05  # everything not under update_2026_08_08 is the Gen 1 (Sohu, 2024) baseline
confidence_overall: low  # SDK still not released as of 2026-08-08; all inferred from architecture + public statements

key_findings:
  - finding: "No user-programmable ISA — hardware is the computation, no CUDA/PTX equivalent"
    confidence: confirmed
    source: architectural constraints + Etched statements
  - finding: "Transformer-specific compiler — maps PyTorch/ONNX model to Sohu execution binary"
    confidence: confirmed-in-principle
    source: Etched marketing ('few lines of code to port')
  - finding: "No separate op library or kernel library layer — ops are hardware blocks"
    confidence: confirmed
    source: architectural constraints
  - finding: "Thin runtime — model loader + I/O manager, no dynamic dispatch"
    confidence: inferred
    source: architectural constraints
  - finding: "SDK not publicly released as of Q1 2026"
    confidence: confirmed
    source: no public SDK found in search
  - finding: "OpenAI-compatible serving API likely (industry standard; not confirmed)"
    confidence: speculative
    source: inference from industry norms
  - finding: "MoE routing handled by separate hardware variant"
    confidence: confirmed
    source: Etched announcements

stack_layers:
  - layer: framework_integration
    components: [PyTorch_export, ONNX]
    confidence: inferred
  - layer: compiler
    name: Etched Transformer Compiler
    inputs: [PyTorch_graph, ONNX]
    outputs: [Sohu_execution_binary]
    tasks: [architecture_validation, weight_packing, pipeline_mapping, binary_generation]
    open_source: false
    released: false
    confidence: confirmed-in-principle
  - layer: runtime
    description: thin_loader_and_io_manager
    dynamic_dispatch: false
    kernel_scheduling: false
    confidence: inferred
  - layer: driver
    type: PCIe_kernel_driver
    firmware_on_chip: none  # fixed pipeline ASIC needs no firmware runtime
    confidence: inferred
  - layer: serving_api
    format: likely_openai_compatible_http
    confidence: speculative

absent_layers:
  - no_user_isa
  - no_kernel_library
  - no_op_library
  - no_collective_comm_library_disclosed
  - no_profiler_released
  - no_assembler

supported_architectures:
  - dense_transformer_mha: confirmed
  - grouped_query_attention: likely
  - multi_query_attention: likely
  - mixture_of_experts: confirmed_variant
  - sliding_window_attention: unknown
  - ssm_mamba: not_supported
  - cnn: not_supported
  - rnn: not_supported

