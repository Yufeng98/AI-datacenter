update_2026_08_08:
  investigated: "2026-08-08"
  change_class: minor  # the major update for this chip is on the hardware side
  headline: "No public software artifact of any kind was released. Software appears only as a named co-design axis and in hiring copy."

  still_true:
    facts:
      - fact: "No public SDK, compiler, runtime documentation, profiler, API reference, or open-source repository"
        confidence: confirmed-absence
      - fact: "No user-programmable ISA disclosed; no contrary statement published"
        confidence: confirmed-absence
      - fact: "No serving API or endpoint format published"
        confidence: confirmed-absence
    sources:
      - "https://www.etched.com/ (retrieved 2026-08-08)"
      - "https://www.etched.com/progress (retrieved 2026-08-08)"
      - "https://www.etched.com/progress/frontier-inference-clusters (2026-06-30)"
      - "https://www.etched.com/progress/accelerating-inference (2026-07-23)"

  software_as_codesign_axis:
    facts:
      - fact: "Etched markets co-designing 'chips, racks, software, and manufacturing methods' for 'frontier inference systems'"
        confidence: confirmed  # vendor wording
        technical_content: none
      - fact: "David Munday is listed as VP of Software on etched.com/join (alongside Brian Loiler, VP Platform; Wayne Cao, VP Production)"
        confidence: confirmed
        implication: "A VP-level software org is consistent with more than a thin loader, but no product or stack layer is described."
        implication_confidence: inferred
    sources:
      - "https://www.etched.com/progress/frontier-inference-clusters (2026-06-30)"
      - "https://www.etched.com/join (retrieved 2026-08-08)"

  recursive_kernel_generation:
    facts:
      - fact: "Verbatim from the 2026-07-23 /progress post: 'thousand-chip scale-up domains, in-house SMT lines, and new RL environments for recursive kernel generation'"
        confidence: confirmed  # the quote exists
        provenance: "closing hiring pitch of the /progress post; NOT on /join"
      - fact: "The word 'kernel' is in tension with the repo's 'no op library / no kernel library / no ISA' layer rows for this chip"
        confidence: confirmed  # the tension is real
      - fact: "What 'kernel' denotes here"
        value: not_disclosed
        confidence: not-disclosed
        candidate_readings:
          - "(a) loose usage for compiler-emitted schedules/tilings, not GPU-style programmable kernels"
          - "(b) the Gen 2 part is more programmable than Sohu was described to be"
          - "(c) an internal LLM/RL tooling effort unrelated to the product's programming surface"
    rule: "Record as a signal only. Do NOT revise the 'no kernel library' layer rows on the strength of one hiring sentence. Flag the tension and revisit on any technical publication."
    confidence: claimed-unverified
    sources:
      - "https://www.etched.com/progress (2026-07-23 post, retrieved 2026-08-08)"

  communication_layer:
    facts:
      - fact: "Cluster Scale Memory exposes 'a much lower-latency shared memory pool across our scale-up domain' via 'a proprietary ultra-low-latency, high-bandwidth interconnect'"
        confidence: claimed-unverified  # hardware claim, vendor-only
      - fact: "Software interface to that pool — API, collectives library, memory model, coherence semantics, addressing"
        value: not_disclosed
        confidence: not-disclosed
      - fact: "No NCCL-analogue or collectives library has ever been disclosed by Etched"
        confidence: confirmed-absence
    note: "A memory-semantic thousand-chip domain would change what a collectives layer must do; this is an inference, not a disclosure."
    sources:
      - "https://www.etched.com/progress/frontier-inference-clusters (2026-06-30)"
      - "https://techcrunch.com/2026/07/23/ai-chip-startup-etched-defies-skeptics-hits-10-3b-valuation-from-big-name-investors/"

  workload_scope:
    facts:
      - fact: "Platform now marketed for BOTH prefill and decode; targets many-trillion-parameter sparse MoEs, long context, and agentic workloads"
        confidence: confirmed  # vendor
      - fact: "How the toolchain handles MoE expert routing at thousand-chip scale, long-context KV-cache management, or agentic multi-turn/tool-calling patterns"
        value: not_disclosed
        confidence: not-disclosed
    note: "The 2024 software model (compile transformer graph -> pack weights -> fixed pipeline) has no published account of any of these."
    sources:
      - "https://www.etched.com/progress/frontier-inference-clusters (2026-06-30)"

