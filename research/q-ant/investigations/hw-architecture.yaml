      sources:
        - title: "Q.ANT takes photonic AI computing commercial as AI's power demand surges (2026-05-19)"
          url: "https://qant.com/press-releases/q-ant-takes-photonic-ai-computing-commercial-as-ais-power-demand-surges/"
        - title: "The Quantum Insider - Q.ANT / IONOS (2026-05-21)"
          url: "https://thequantuminsider.com/2026/05/21/qant-photonic-ai-computing-commercial-ionos/"

