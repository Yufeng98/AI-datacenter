        date_announced: "2026-05-19"
        venue: "re:publica 2026, Berlin"
        pr_dateline: "Austin, Texas / Stuttgart, Germany - May 19, 2026"
        product: "NPS (Native Processing Server) carrying the second-generation NPU"
        status: signed_not_deployed
