  refuted_from_raw_scan:
    - claim: "8 GOPS is a NEW spec / the first hard number for Q.ANT"
      verdict: REFUTED
      reason: "already verbatim on qant.com/photonic-computing/ in the 2026-01-22 Wayback snapshot, i.e. pre-baseline"
    - claim: "LRZ independent evaluation showed up to 100x over Gen 1 (asserted)"
      verdict: NUMBER_CONFLICT
      reason: "The Quantum Insider reports 50x for the same announcement; no LRZ-authored evaluation published"
    - claim: "NPU 2 is now in production use ... and signed IONOS (blurs signed vs deployed)"
      verdict: OVERSTATED
      reason: "the IONOS agreement is signed; rollout is explicitly 'later this year' and has not happened"
    - claim: "commercial shipment slipped past H1"
      verdict: OVERSTATED
      reason: "'slipped' implies a withdrawn commitment; no source shows Q.ANT retracting an H1 2026 date"
    - claim: "the Daisytuner work is the ISC 2026 diffusion/xLSTM demo"
      verdict: DATE_CONTENT_ERROR
      reason: "Daisytuner's item is Faster R-CNN + ResNet-50 object detection, revealed April 2026 - a separate event"
    - claim: "the repo's ~30 W chip figure is complete"
      verdict: MISSING
      reason: "qant.com publishes 'Power consumption of NPU 150 W'; the bare 30 W was a pre-existing repo error"
    - claim: "LRZ is running climate modeling, medical imaging and fusion energy workloads (as independent fact)"
      verdict: UNVERIFIABLE_AS_STATED
      reason: "traces to Q.ANT's own 2026-04-23 PR; no LRZ or JSC publication found"

  methodology_note: >
    The raw scan's source list was six qant.com URLs plus hotchips.org - entirely
    vendor-controlled. The two claims that broke under independent checking (8 GOPS
    novelty, 100x Gen1->Gen2) are precisely the two that only a vendor page or vendor
    press release supported. Wayback snapshots and The Quantum Insider were decisive.
