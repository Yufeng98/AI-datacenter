update_2026_08_08:
  date: "2026-08-08"
  change_class: moderate
  new_silicon: false
  verification: "adversarial round-3; verdict PARTIALLY_CONFIRMED (refuted=True)"
  summary: >
    No new NPU generation, no new published hardware specification, no NPU 3
    timeline. Real changes: first commercial customer (IONOS, signed not deployed),
    manufacturing partner named (IMS CHIPS), Austin US HQ + CTO hire, and
    qualitative ISC 2026 workload demos. Separately, several vendor specs that the
    original scan missed are added here with their true PRE-BASELINE provenance.

