chip: lightmatter
investigation: hw-architecture
as_of: "2026-08-08"  # original investigation 2026-04-05; update_2026_08_08 block appended at end
baseline_as_of: "2026-04-05"
confidence: medium-high  # Nature paper provides architecture detail; some specs inferred
device_class: "Photonic Interconnect + Optics (compute product no longer marketed)"
device_class_previous: "Photonic Compute + Interconnect"

compute_engine:
  technology: photonic_mzi_array
  core_type: Photonic Tensor Core (PTC)
  core_array_size: 128x128  # MZI mesh per PTC
  ptcs_per_package: 4
  dci_chips_per_package: 2  # 12nm CMOS digital control interfaces
  total_chips_per_package: 6
  compute_format: ABFP16  # Adaptive Block Floating-Point 16-bit
  peak_tops_per_package: 65.5  # ABFP16, from Nature 2025
  electrical_power_per_package_W: 78
  optical_power_per_package_W: 1.6
  key_operation: matrix_vector_multiply  # MVM; GEMM via batched MVM

envise_4s_server:
  packages: 4
  total_photonic_chips: 16
  form_factor: 4U
  host_cpu: "2x AMD EPYC"
  system_dram_TB: 1
  storage_TB: 3  # NVMe flash
  system_power_kW: 3
  inference_efficiency: "240 ResNet-50 inf/sec/W (reported)"

mzi_physics:
  mechanism: electro_optic_phase_shift
  matrix_decomposition: SVD  # W = U * Sigma * V_dagger
  unitary_matrix: MZI_mesh
  diagonal_scaling: optical_attenuators
  weight_encoding: "MZI phase voltages set per-layer"
  input_encoding: "optical amplitude modulation (WDM, 512 channels)"
  output_readout: "photodetector + ADC"

electronic_photonic_interface:
  dac_channels: 512  # per package (WDM)
  adc_location: after_ptc_output
  activation_functions: executed_on_12nm_DCI
  layer_norm: executed_on_12nm_DCI
  residual_add: executed_on_12nm_DCI

supported_models:
  - ResNet-50
  - ResNet-101
  - BERT-base
  - BERT-large
  - Deep Q-Network (Atari RL)
  - Transformer inference (via Idiom partitioning)

passage_interconnect:
  products:
    - name: Passage M1000
      announced: "2025-03-31"
      type: "3D multi-reticle active photonic interposer"
      die_area_mm2: 4000+
      total_bandwidth_Tbps: 114
      fiber_count: 256
      features:
        - solid_state_optical_circuit_switching
        - electro_optical_IO_any_surface
        - 1500W_power_delivery
    - name: Passage L200
      announced: "2025-03-31"
      type: "3D co-packaged optics (CPO)"
      bandwidth_Tbps: [32, 64]
      total_IO_per_package_Tbps: 200+
      improvement_vs_existing: "5-10x"
  vs_nvlink:
    medium: photonic_vs_copper
    topology: reconfigurable_OCS_vs_fixed_NVSwitch
    placement: any_surface_vs_edge_only
    scale: thousands_xpus_vs_576_gpus
    power_efficiency_pJ_per_bit: "<1 vs ~5"

key_papers:
  - title: "Universal photonic artificial intelligence acceleration"
    journal: Nature
    date: "2025-04"
    doi: "10.1038/s41586-025-08854-x"
  - title: "An integrated large-scale photonic accelerator with ultralow latency"
    journal: Nature
    date: "2025"
    doi: "10.1038/s41586-025-08786-6"

