  fact_groups:

    - id: portfolio_repositioning
      confidence: medium  # evidence of absence on a marketing site, not an announced EOL
      status: announced_absence
      summary: >
        Lightmatter's public positioning has shifted from photonic compute to photonic
        interconnect and optics. As of 2026-08-08 the homepage and /products/ page list
        only Passage L200, Passage L20, Guide 1, Guide DR and four evaluation kits
        (Passage M1000 EVK, Passage EVK100, Passage EVK50, Guide 1 EVK). Envise appears
        nowhere in product navigation or descriptive content and survives only in the
        footer trademark line. There is NO announced discontinuation, no EOL notice and
        no press release. State this as "no longer marketed", NOT "discontinued".
      facts:
        envise_in_product_navigation: false
        envise_in_footer_trademark_line: true
        envise_discontinuation_announced: false
        current_product_list:
          - Passage L200
          - Passage L20
          - Guide 1
          - Guide DR
        current_evk_list:
          - Passage M1000 EVK
          - Passage EVK100
          - Passage EVK50
          - Guide 1 EVK
        m1000_status: "repositioned as Passage M1000 EVK — rack-level reference/evaluation platform (114 Tbps), not a product tier"
        nature_2025_result_status: "remains valid published science; retained as architectural history"
        mlperf_status: not_applicable  # no marketed compute product exists to submit
        device_class_change:
          from: "Photonic Compute + Interconnect"
          to: "Photonic Interconnect + Optics (compute product no longer marketed)"
      sources:
        - title: "Lightmatter homepage (fetched 2026-08-08)"
          url: "https://lightmatter.co/"
        - title: "Lightmatter Products page (fetched 2026-08-08)"
          url: "https://lightmatter.co/products/"
        - title: "The 10 Coolest Semiconductor Startups Of 2026 (So Far) — CRN, July 2026"
          url: "https://www.crn.com/news/computing/2026/the-10-coolest-semiconductor-startups-of-2026-so-far"

    - id: passage_l20
      confidence: high  # vendor press release + product page + independent carry + The Register
      status: announced_not_shipping
      announced: "2026-03-11"
      demoed: "OFC, Los Angeles, 2026-03-15/19"
      availability: "sampling begins late 2026"
      predates_repo_baseline: true  # repo miss, not new-window news
      summary: >
        Passage L20 is a NEW product tier: a unified optical engine for near-package
        optics (NPO) and on-board optics (OBO), mounted adjacent to the switch ASIC on
        the switch board, or on a flexible-PCB / mezzanine card for OBO (which adds a
        retimer for extended reach). Bidirectional (BiDi) multiplexing carries upstream
        and downstream traffic on a single fiber.
      key_specs:
        bandwidth_per_direction_Tbps: 6.4
        bandwidth_aggregate_Tbps: 12.8
        note_on_bandwidth: >
          6.4 and 12.8 are the SAME figure (per-direction vs aggregate);
          32 ports x 200 Gbps x 2 = 12.8 Tbps. This is NOT a vendor-vs-press
          discrepancy and must not be presented as one.
        optical_ports: 32
        bidirectional: true
        per_lane_Gbps: 200
        serdes_line_rate_Gbps: 212.5  # PAM4
        electrical_signaling: "IEEE 802.3dj-compliant"
        max_tdp_W: 30
        fiber_coupling: "Corning CPO FlexConnect"
        thermal: "A2 ASHRAE-compliant cold plate"
        deployment_modes: [NPO, OBO]
        obo_note: "OBO uses a retimer for extended reach"
      vendor_internal_inconsistencies:  # genuine; quote both with attribution
        energy_efficiency_pJ_per_bit:
          press_release: 3.0
          product_page: 5
        package:
          press_release: "2000-pin BGA"
          product_page: "1827-ball BGA, 37.5 x 26.4 mm"
      vendor_claims:
        fiber_count_reduction: "~50% vs duplex/unidirectional DR optics (BiDi)"
        density: ["4x pluggable density", "88% smaller by volume compared to OSFP"]
      third_party_claims:
        - claim: "Just 16 L20s would be enough to replace 512, 200 Gbps pluggables in a 102.4 Tbps switch"
          attribution: "The Register (2026-03-11) — NOT a vendor press-release claim"
      roadmap_quote:
        speaker: "Nick Harris, CEO"
        outlet: "The Register"
        text: >
          I don't think that it's going to be a super-long roadmap for near package
          optics, because, of course, CPO is coming, and we think that's like a 2028
          high-volume ramp.
        implication: "L20 is explicitly a bridge product ahead of a ~2028 CPO volume ramp"
      sources:
        - title: "Lightmatter Expands Photonic Interconnect Roadmap with Passage L20 (press release)"
          url: "https://lightmatter.co/press-release/lightmatter-expands-photonic-interconnect-roadmap-with-passage-l20-unified-optical-engine-for-npo-and-obo-applications/"
        - title: "Passage L20 product page (fetched 2026-08-08)"
          url: "https://lightmatter.co/products/passage-l20/"
        - title: "Photonics Online — independent carry of the 2026-03-11 press release"
          url: "https://www.photonicsonline.com/doc/lightmatter-expands-photonic-interconnect-roadmap-with-passage-l-unified-optical-engine-for-npo-and-obo-applications-0001"
        - title: "The Register — Lightmatter Passage L20 bidirectional fiber (2026-03-11)"
          url: "https://www.theregister.com/2026/03/11/lightmatter_passge_l20_fiber/"

    - id: guide_vlsp_light_engine
      confidence: high  # vendor product page, fetched directly
      status: announced_evk_sampling
      announced: "2026-01-26/27"
      predates_repo_baseline: true  # repo miss
      summary: >
        Guide 1 introduces an external light-source tier that this survey had not
        previously modelled for Lightmatter. CPO/NPO/OBO need CW laser light supplied
        from outside the ASIC package, conventionally from discrete ELSFP "laser farms".
        Guide 1 integrates hundreds of lasers and photonic components on one chip.
      key_specs:
        optical_power_per_fiber_mW: "100+"
        wavelengths: 16
        wavelength_spacing_GHz: [100, 200, "400+"]
        wavelength_roadmap: "4 to 64 wavelengths with zero increase in assembly complexity"
        fabrication: "HVM CMOS fab with on-PIC wavelength tunability"
        management: "CMIS-compliant telemetry, active stabilization, hyper-local thermal tuning"
        wavelength_precision: "sub-GHz, without drift"
        redundancy: "N+M — autonomously retunes a backup laser onto a failed wavelength"
        replaces: "discrete ELSFP laser farms"
        deployment_targets: [CPO, NPO, OBO]
        fibers_per_unit: not_disclosed
        aggregate_bandwidth: not_disclosed
      ecosystem_collaborators: [Cadence, Synopsys, GUC]   # named at launch
      separate_collaboration: [PHIX]
      sources:
        - title: "Lightmatter Guide product page (fetched 2026-08-08)"
          url: "https://lightmatter.co/products/guide/"
        - title: "Lightmatter news index (timeline: Converge Digest 2026-01-26, DigiTimes Asia 2026-01-27, Photonics Spectra 2026-01-28)"
          url: "https://lightmatter.co/news/"

