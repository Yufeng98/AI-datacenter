        coupling: "vertical / expanded-beam"
        packaging_compatibility: "survives mold-and-grind advanced-packaging flows"
        alignment: passive
        insertion_loss_dB: "< 1.5"
        insertion_loss_note: "sustained across insertion AND reinsertion"
        partner: "SENKO (SEAT and Metallic PIC Coupler integration)"
        enables: "known-good optical engine verification at the wafer level, before final assembly"
        ga_date: not_disclosed
      sources:
