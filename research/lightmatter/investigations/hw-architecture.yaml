    - id: vclick_dfau
      confidence: high  # vendor product page, fetched directly
      status: production_validated_no_ga_date
      announced: "2026-03-11"
      predates_repo_baseline: true  # repo miss
      trademark_spelling: vClick   # not "vCLICK"
      product_name: "vClick dFAU"
      summary: >
        A DETACHABLE fiber array unit (FAU) with vertical / expanded-beam coupling
        engineered to survive advanced-packaging mold-and-grind flows. Detachability is
        the headline property; describing it as a "surface-attach" array inverts the
