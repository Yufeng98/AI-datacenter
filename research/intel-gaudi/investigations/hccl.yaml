framework_integrations:
  - framework: PyTorch Distributed
    integration_point: "torch.distributed.init_process_group(backend='hccl') — drop-in NCCL replacement; all collective ops (AllReduce, AllGather, etc.) route through HCCL"
  - framework: DeepSpeed
    integration_point: "Intel Gaudi DeepSpeed fork sets dist_backend='hccl'; ZeRO stages 1/2/3 use HCCL for optimizer state and gradient sharding"
  - framework: Megatron-DeepSpeed
    integration_point: HabanaAI fork adds HPU device support and HCCL backend for 3D parallelism (tensor/pipeline/data) in LLM pretraining
  - framework: PyTorch Lightning
    integration_point: lightning-Habana HPUDDPStrategy uses HCCL as the distributed backend for multi-card training

key_abstractions:
  - name: HCCL Communicator
    description: Handle encapsulating a group of ranks with pre-established RoCE Queue Pairs; created via hcclCommInitRank, maps logical rank to physical NIC port
  - name: Integrated RoCE v2 on-die NIC
    description: 24 × 200 GbE Ethernet ports implemented as on-die SerDes on Gaudi 3; enables RDMA directly to/from HBM2e without discrete NIC chip
  - name: Two-level topology (scale-up / scale-out)
    description: 21 on-die ports for intra-node and rack-level traffic, 3 ports for inter-rack scale-out; both use same RoCEv2 protocol over Ethernet
  - name: RDMA-to-HBM2e
    description: HCCL registers HBM2e tensor buffers as RDMA memory regions; peer cards issue RDMA READ/WRITE directly to HBM2e physical addresses with no CPU copy
  - name: Compute-communication overlap
    description: Integrated NIC engines operate independently from MME/TPC engines; HCCL non-blocking ops allow AllReduce to overlap with forward/backward compute of next micro-batch
