framework_integrations:
  - framework: PyTorch
    integration_point: gaudi-pytorch-bridge registers HPU device backend via PyTorch plugin mechanism; habana_frameworks.torch.core import triggers registration
  - framework: HuggingFace Transformers
    integration_point: optimum-habana wraps Trainer and inference pipelines to use HPU device and HCCL distributed backend
  - framework: PyTorch Lightning
    integration_point: lightning-Habana HPUAccelerator plugin maps Lightning training loop onto HPU device and HCCL
  - framework: DeepSpeed
    integration_point: Intel Gaudi DeepSpeed fork replaces NCCL backend with HCCL; ZeRO stages 1/2/3 supported

key_abstractions:
  - name: SynapseAI Graph
    description: AOT-compiled DAG mapping framework ops to MME configuration descriptors and TPC kernel binaries; the fundamental unit of device execution
  - name: TPC Kernel (TPC-C)
    description: VLIW SIMD program compiled from C99+intrinsics by tpc-clang; runs on one or more of the 64 TPC processors; 256-byte vector lane, 4-slot VLIW
  - name: Habana Bridge lazy IR
    description: Deferred op accumulation mechanism in gaudi-pytorch-bridge; ops are recorded as IR nodes until mark_step() flushes them to the graph compiler
  - name: mark_step()
    description: Synchronization boundary in habana_frameworks.torch that triggers graph compiler invocation and runtime execution of the accumulated lazy graph
  - name: SynapseAI Lowering Module
    description: C++ layer inside gaudi-pytorch-bridge that translates ATen ops to SynapseAI graph nodes, handling layout conversion and type promotion

