      - https://docs.habana.ai/en/latest/TPC/TPC_User_Guide/Processor_Architectural_Overview.html

  - layer: Data Path
    component: MME→SRAM→TPC pipeline (producer-consumer via shared SRAM)
    confidence: confirmed
    sources:
      - https://hc2024.hotchips.org/assets/program/conference/day1/60_HC2024.Intel.RomanKaplan.Gaudi3-0826.pdf

  - layer: Data Path
    component: Async DMA engines (HBM↔SRAM, double-buffering)
    confidence: confirmed
    sources:
      - https://docs.habana.ai/en/latest/Gaudi_Overview/Gaudi_Architecture.html

  - layer: On-chip Memory
    component: 96 MB shared SRAM (12.8 TB/s, 48 MB per die)
    confidence: confirmed
    sources:
      - https://cdrdv2-public.intel.com/817486/gaudi-3-ai-accelerator-white-paper.pdf
      - https://videocardz.com/newz/intel-announces-gaudi3-ai-accelerator-with-128gb-hbm2e-memory-up-to-900w-tdp-on-air

  - layer: Off-chip Memory
    component: 128 GB HBM2e (3.7 TB/s) — Gaudi 3
    confidence: confirmed
    sources:
      - https://videocardz.com/newz/intel-announces-gaudi3-ai-accelerator-with-128gb-hbm2e-memory-up-to-900w-tdp-on-air
      - https://cdrdv2-public.intel.com/817487/gaudi-3-ai-accelerator-hl-325l-oam-mezzanine-card-product-brief.pdf

  - layer: Off-chip Memory
    component: 96 GB HBM2e (2.45 TB/s) — Gaudi 2
    confidence: confirmed
    sources:
      - https://videocardz.com/newz/intel-announces-gaudi3-ai-accelerator-with-128gb-hbm2e-memory-up-to-900w-tdp-on-air

  - layer: Host Interface
    component: PCIe Gen5 x16 (~128 GB/s bidirectional)
    confidence: confirmed
    sources:
      - https://cdrdv2-public.intel.com/817488/Gaudi%203%20PCIe%20Product%20Brief_RB_1_V6.pdf

  - layer: Host Interface
    component: OAM (Open Accelerator Module) form factor HL-325L
    confidence: confirmed
    sources:
      - https://cdrdv2-public.intel.com/817487/gaudi-3-ai-accelerator-hl-325l-oam-mezzanine-card-product-brief.pdf

  - layer: Scale-up
    component: 21 × 200 GbE integrated RoCE v2 ports (on-die SerDes)
    confidence: confirmed
    sources:
      - https://cdrdv2-public.intel.com/817486/gaudi-3-ai-accelerator-white-paper.pdf
      - https://cdrdv2-public.intel.com/833842/gaudi-3-ai-accelerator-cluster-ref-design-white-paper.pdf

  - layer: Scale-out
    component: 3 × 200 GbE integrated RoCE v2 ports (external cluster connectivity)
    confidence: confirmed
    sources:
      - https://cdrdv2-public.intel.com/817486/gaudi-3-ai-accelerator-white-paper.pdf
      - https://cdrdv2-public.intel.com/833842/gaudi-3-ai-accelerator-cluster-ref-design-white-paper.pdf

framework_integrations:
  - framework: SynapseAI SDK
    integration_point: Graph compiler emits MME descriptor packets and TPC VLIW binaries; runtime schedules all engines via PCIe command queues
  - framework: HCCL
    integration_point: Programs integrated RoCE QP descriptors for RDMA directly on HBM2e; no CPU involvement in data path
  - framework: habanalabs kernel driver
    integration_point: Manages PCIe BAR, device MMU/SMMU, command submission queues, and power management

key_abstractions:
  - name: Dual Compute Engine (MME + TPC)
    description: Heterogeneous execution model where GEMM ops go to 8 MMEs and all other ops go to 64 TPC VLIW processors; both can execute in parallel
  - name: Shared SRAM Scratchpad (96 MB)
    description: Software-managed on-die memory (12.8 TB/s) coordinating data exchange between MME and TPC engines; managed by SynapseAI graph compiler
  - name: Integrated RoCE NIC (on-die)
    description: 24 × 200 GbE RoCE v2 ports implemented as on-die SerDes; enables RDMA directly to/from HBM2e without a discrete networking card
  - name: OAM Form Factor
    description: Open Accelerator Module mechanical standard (HL-325L); 8 cards per tray, direct card-to-card RoCE connectivity possible within tray
  - name: Dual-die Architecture
    description: Gaudi 3 integrates two compute dies on one package, each with 4 MMEs and 32 TPCs and 48 MB SRAM, interconnected on-package

