chip: muxi
resource: software-stack
as_of: "2026-08-08"
baseline_as_of: "2026-04-05"
device_class: "GPU (China, 沐曦)"
status: completed

platform:
  name: MXMACA
  full_name: "MetaX Compute Architecture / 沐曦异构计算平台"
  version: "2.0+"
  cuda_compat_model: "Source-level (cuda_alike); requires recompilation; no binary CUDA compat"
  kernel_language: "MACA C++ (CUDA C++-compatible syntax; <<<>>> launch model)"
  device_id: "torch.device('maca')"

layers:
  framework_integration:
    - name: "PyTorch MXMACA backend"
      device: "torch.device('maca')"
      features: ["autograd", "distributed training", "torch.compile via TorchInductor"]
      status: confirmed

    - name: "TensorFlow MXMACA"
      compat_method: "CUDA ON MACA compatibility layer"
      status: confirmed

    - name: "vLLM-MetaX"
      repo: "github.com/MetaX-MACA/vLLM-metax"
      backend_class: cuda_alike
      version_alignment: "vllm-metax v0.13.0 = vLLM v0.13.0"
      plugin_since: "v0.8.5"
      models_supported: ["LLaMA", "Qwen", "and major open-source LLMs"]
      upstream_rfc: "vllm-project/vllm #23157"
      status: confirmed

    - name: "llama.cpp MetaX backend"
      status: community_integration

    - name: "DeepSeek integration"
      via: MXMACA platform
      status: confirmed_via_devportal

  compiler_ir:
    - name: "MXMACA Compiler"
      analog: nvcc
      input: "MACA C++ GPU kernels"
      output: "MXMACA ISA binary"
      status: confirmed

    - name: "CUDA ON MACA"
      type: source_migration_tool
      analog: Musify
      method: "Automated CUDA→MACA source translation; cuBLAS→mxBLAS, cuDNN→mxDNN, NCCL→MXCCL"
      status: confirmed

    - name: "mcpy"
      repo: "github.com/MetaX-MACA/mcpy"
      analog: CuPy
      status: confirmed

  op_library:
    - name: mxDNN
      analog: cuDNN
      ops: ["Conv", "Attention/SDPA", "Norm", "Pooling", "Activation"]
      precision: ["FP32", "BF16", "FP16", "INT8"]
      fp8: "added in C600"
      status: confirmed

    - name: mxBLAS
      analog: cuBLAS
      ops: ["GEMM", "BLAS L1-L3", "epilogue fusion"]
      status: confirmed

    - name: mxFFT
      analog: cuFFT
      status: confirmed

  kernel_library:
    - name: mxThrust
      analog: Thrust
      ops: ["Reduce", "Scan", "Sort", "Transform"]
      status: confirmed

    - name: "MXMACA Math Libraries"
      description: "Device-side math (sin, cos, exp, log, etc.)"
      status: confirmed

  runtime:
    - name: "MXMACA Runtime (macaRT / libmaca.so)"
      analog: cudart
      apis: ["macaMalloc", "macaFree", "macaMemcpyAsync", "macaStreamCreate", "macaEventCreate"]
      status: confirmed

    - name: "MXMACA Driver API"
      analog: "CUDA Driver API"
      features: ["context management", "module loading", "JIT compilation", "fine-grained memory"]
      status: confirmed

  driver_firmware:
    - name: "MetaX Kernel Driver (.ko)"
      type: Linux PCIe kernel module
      features: ["BAR mapping", "IOCTL", "DMA", "IRQ handling"]
      status: confirmed

    - name: "mx-exporter"
      type: "Prometheus-compatible monitoring"
      features: ["GPU utilization", "memory usage", "temperature"]
      k8s_aware: true
      status: confirmed

    - name: "Kubernetes Device Plugin"
      features: ["GPU resource advertising", "health monitoring", "multi-tenant partitioning"]
      status: confirmed

  communication:
    - name: MXCCL
      full_name: "MetaX Collective Communication Library"
      analog: NCCL
      ops: ["AllReduce", "AllGather", "ReduceScatter", "Broadcast", "Scatter", "Gather"]
      intra_node: "MetaXLink hardware fabric"
      inter_node: "Ethernet / RoCE"
      scale_proven: "10,000+ GPU clusters"
      status: confirmed

  isa:
    - name: "MXMACA ISA"
      type: "Proprietary SIMT ISA"
      public_doc: false
      precision_c500: ["FP32", "BF16", "FP16", "INT8"]
      precision_c600: ["FP32", "BF16", "FP16", "FP8", "INT8", "INT4"]
      status: confirmed

github_org: "github.com/MetaX-MACA"
developer_portal: "developer.metax-tech.com"

ecosystem_maturity:
  llm_inference: "vLLM-MetaX v0.13.0; LLaMA/Qwen supported"
  llm_training: "PyTorch; 100B+ param LLMs on MXC500 cluster (claimed)"
  cluster_scale: "10,000+ GPUs (commercial, end-2024)"
  limitations:
    - "All kernels require recompilation (no binary CUDA compat)"
    - "Smaller ecosystem than CUDA"
    - "No public ISA documentation"
    - "2-3 year HW+SW ecosystem lag vs NVIDIA"

