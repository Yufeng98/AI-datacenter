update_2026_08_08:
  investigated: 2026-08-08
  scope: >
    Additive software findings since the 2026-04-05 baseline: GitHub organization activity
    (May-Aug 2026), a Mooncake fork introducing disaggregated prefill/decode serving, the
    Token Factory application framework announced at WAIC 2026, and Day-0 model enablement claims.

  fact_groups:

    - group: GitHub organizations — one live, one archived
      confidence: confirmed (GitHub REST API, primary)
      facts:
        - "BIRENSUPA is the live organization. BirenTechnology (ModelZoo, k8s-device-plugin, go-brml) is fully archived; last push 2024-12-17."
        - "The Kubernetes device plugin and go-brml management binding documented in the baseline now live in the dormant org."
        - "Live driver tooling is biren-driver-management-tools-skill in the BIRENSUPA org, created 2026-06-24."
      sources:
        - https://api.github.com/orgs/BIRENSUPA/repos
        - https://api.github.com/orgs/BirenTechnology/repos

    - group: Mooncake fork — disaggregated prefill/decode serving
      confidence: confirmed (repo exists and is active); not disclosed (contents, backend, target hardware)
      layer: Serving / KV-cache
      facts:
        - "BIRENSUPA/Mooncake — fork created 2026-07-20, pushed through 2026-08-08 (C++). The only actively developed repo in the org."
        - "Mooncake is the KV-cache-centric disaggregated serving architecture - prefill and decode run on separate pools with a KV-cache transfer engine between them and a pooled multi-tier cache store."
        - "Architecturally significant - the baseline described only monolithic vLLM-style serving on Biren hardware. Disaggregation puts new demands on the interconnect (KV transfer bandwidth, not just collective bandwidth)."
        - "Created three days after the WAIC 2026 announcement; consistent with the BLink 2.0 memory-semantic / 1,024-GPU shared-memory-space direction."
        - "NOT DISCLOSED - whether the fork carries a SUPA/BCCL transfer-engine backend, which Biren hardware it targets, or whether it tracks upstream. No release, docs, or announcement accompanies it."
      sources:
        - https://api.github.com/orgs/BIRENSUPA/repos
        - https://github.com/BIRENSUPA

    - group: SGLang fork — static, not an active port
      confidence: confirmed (GitHub API)
      layer: Framework Integration
      facts:
        - "BIRENSUPA/sglang was created 2026-05-06 with pushed_at also 2026-05-06 — a one-shot fork with ZERO subsequent pushes."
        - "Record it as a fork, NOT as an SGLang port or an active integration. A claim that Biren 'supports SGLang' is unsupported by the repository state."
      sources:
        - https://api.github.com/orgs/BIRENSUPA/repos

    - group: mmcv fork
      confidence: confirmed (GitHub API)
      layer: Framework Integration
      facts:
        - "BIRENSUPA/mmcv forked 2026-08-05. OpenMMLab CV operator layer. No activity beyond the fork at time of investigation."
      sources:
        - https://api.github.com/orgs/BIRENSUPA/repos

    - group: Token Factory application framework
      confidence: vendor claim, primary-sourced (Biren's own newsroom, unaudited)
      layer: Framework Integration
      facts:
        - "Token Factory - application framework announced at WAIC 2026."
        - "Claims a 95%+ cache hit rate via a five-level caching hierarchy."
        - "Claims a cross-vendor heterogeneous co-inference scheme co-developed with China Telecom (中国电信) delivering ~20% throughput gain."
        - "Unaudited vendor marketing, but published on Biren's own newsroom rather than a third-party rumour — stronger provenance than 'unverified'."
        - "No benchmark methodology, model, or workload is given for either figure."
        - "The five-level caching claim and the Mooncake fork are mutually consistent - both point at KV-cache tiering as Biren's main inference-efficiency lever."
      sources:
        - https://www.birentech.com/news/odug5ugc29npl8m6slum8d9k/

    - group: Day-0 model enablement claims
      confidence: vendor claim
      layer: Framework Integration
      facts:
        - "MiniMax M3 — 2026-06-16."
        - "Zhipu GLM-5.2 — 2026-06-26."
        - "MiniMax H3 — 2026-08-03."
        - "No throughput, latency, or accuracy data accompanies these announcements."
      sources:
        - https://www.birentech.com/news/

    - group: Software implications of BLink 2.0 — open questions
      confidence: not disclosed
      layer: Communication
      facts:
        - "BLink 2.0's in-network computing offloads collectives into switch nodes, which would shift work out of BCCL's host/GPU path the way NVIDIA SHARP does for NCCL. No BCCL version, API, or documentation for BLink 2.0 has been published."
        - "The memory-semantic 1,024-GPU shared memory space would require an addressing/allocation model above supaMalloc. None has been described."
        - "Both are recorded as not disclosed rather than inferred."
      sources:
        - https://www.birentech.com/news/odug5ugc29npl8m6slum8d9k/

    - group: Not disclosed / not found
      confidence: not disclosed
      facts:
        - "No BIRENSUPA SDK version, release notes, or changelog published for the 壁砺 generation."
        - "No public ISA documentation — BGISA remains closed (unchanged from baseline)."
        - "No MLPerf submission for any Biren part."
        - "No Biren paper found at Hot Chips 2026 / ISCA 2026 / ISSCC 2026; the Hot Chips program page returned HTTP 403, so this is 'could not verify', not 'absent'."
      sources:
        - https://www.birentech.com/product/software/birensupa/
        - https://developer.birentech.com/Document_Hardware.html
