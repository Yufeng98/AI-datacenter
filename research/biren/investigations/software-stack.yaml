resource: Biren BIRENSUPA Software Stack
url: https://www.birentech.com/BR10X.html
chip: biren
as_of: 2026-08-08
baseline_as_of: 2026-04-05
investigation_report: software-stack.md

layer_mappings:
  - layer: Framework Integration
    components:
      - name: PyTorch SUPA backend
        role: Custom device backend registering BR100/BR104 as torch.device("supa"); dispatches ATen ops to Biren DL library; BCCL for distributed training
        confidence: confirmed

      - name: TensorFlow integration
        role: XLA backend or custom device plugin; TensorFlow training and inference on BR100
        confidence: confirmed

      - name: PaddlePaddle integration
        role: Custom operator plugins for BR100/BR104; important for Chinese AI market (Baidu ecosystem)
        confidence: confirmed

      - name: vLLM / LLM inference serving
        role: SUPA-accelerated LLM inference (LLaMA, Qwen, Baichuan); Flash-Attention-style kernels on BR100
        confidence: inferred

  - layer: Compiler / IR
    components:
      - name: BRCC (Biren Runtime Compiler)
        role: nvcc analog; compiles SUPA C++ GPU kernels to Biren native ISA binary; CUDA C++ migration support
        confidence: confirmed

      - name: SUPA MLIR inference compiler
        role: TensorRT analog; ONNX/PyTorch/TF graph → fused+quantized BR100 engine; INT8/BF16/TF32+ quantization
        confidence: inferred

      - name: cuda2supa migration tool
        role: Automated CUDA C++ → SUPA C++ namespace substitution and porting tool
        confidence: confirmed

  - layer: Op Library
    components:
      - name: BILA (Biren DL Library)
        role: cuDNN + cuBLAS analog; GEMM/Conv/Attn/Norm/Activation/Pooling; TF32+/BF16/INT8 engines
        confidence: confirmed

      - name: General computing library
        role: BLAS L1-L3, Reduce, Scan, Sort primitives; vector elementwise ops
        confidence: inferred

  - layer: Kernel Library
    components:
      - name: SUPA kernel template library
        role: CUTLASS analog; GEMM/Conv templates for TF32+/BF16/INT8; targets SPC/EU hierarchy; L2-cache-aware tiling
        confidence: inferred

  - layer: Runtime
    components:
      - name: SUPA Runtime API (libsupa.so)
        role: cudart analog; supaMalloc/Free, supaStream, supaEvent, supaMemcpyAsync, kernel launch <<<>>> syntax
        confidence: confirmed

      - name: SUPA Driver API
        role: CUDA Driver API analog; explicit context management, module loading, fine-grained memory
        confidence: inferred

  - layer: Driver / Firmware
    components:
      - name: Biren Linux kernel driver (.ko)
        role: PCIe BAR mapping, IOCTL dispatch, DMA control, interrupt handling
        confidence: confirmed

      - name: On-GPU firmware
        role: Resource management, power control, GPU-side initialization; NVIDIA GSP analog
        confidence: inferred

      - name: Kubernetes device plugin
        role: K8s DaemonSet; birentech.com/gpu resource reporting; health monitoring; SVI multi-tenancy
        confidence: inferred

  - layer: Communication
    components:
      - name: BCCL (Biren Collective Communication Library)
        role: NCCL analog; AllReduce/AllGather/ReduceScatter/Broadcast over BLink intra-node; IB/ETH inter-node
        confidence: confirmed

  - layer: Assembler / ISA
    components:
      - name: Biren GPU ISA (BGISA)
        role: Proprietary native SIMT ISA; C-Warp based; FP32/TF32+/BF16/INT8; NOT publicly documented (unlike PTX)
        confidence: inferred

      - name: BRCC as primary ISA entry point
        role: Developers access hardware only through SUPA C++ + BRCC; no public PTX/ISA equivalent
        confidence: confirmed

key_abstractions:
  - name: BIRENSUPA (SUPA SDK)
    description: >
      Biren's complete software platform. An 8-layer stack from framework (PyTorch/TF/Paddle)
      through compiler (BRCC), op libraries (BILA), runtime (SUPA RT), to driver and kernel.
      Explicitly positioned as CUDA replacement for Chinese AI market.
    layer: All
    hardware_mapping: Full BR100/BR104 hardware stack

  - name: BRCC
    description: >
      Biren's kernel compiler. Accepts SUPA C++ (GPU kernel code using __global__, thread/block/grid model)
      and compiles to Biren native ISA binary. Provides CUDA C++ migration path via limited CUDA-mode compilation.
    layer: Compiler / IR
    hardware_mapping: Generates SPC/EU-targeted GPU binary code

  - name: BILA (Biren DL Library)
    description: >
      The cuDNN + cuBLAS combined equivalent. Implements GEMM, Conv, Attention, Normalization
      in TF32+/BF16/INT8 precisions, exploiting BR100's 300 MB L2 cache and SPC parallel architecture.
    layer: Op Library
    hardware_mapping: Directly calls SUPA runtime kernel launches targeting EU tensor units

  - name: BCCL
    description: >
      NCCL equivalent for Biren hardware. Implements collective communication primitives over BLink
      for intra-node GPU-to-GPU communication (8-GPU ring/tree AllReduce), and falls back to
      InfiniBand/Ethernet for inter-node scale-out.
    layer: Communication
    hardware_mapping: BLink scale-up links + host NIC for scale-out

