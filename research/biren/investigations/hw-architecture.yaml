    year: 2022
    dies: 2
    process: TSMC 7nm CoWoS-S
    memory: HBM2e 64GB 2.3TB/s
    peak_fp32_tflops: 256
    peak_bf16_tflops: 1024
    peak_int8_tops: 2048
    transistors_B: 77
    die_area_mm2: 1074
    tdp_w: 550
    form_factor: OAM
    host_interface: PCIe Gen5 + CXL
    scale_up: BLink 8x 64GB/s
