resource: Biren BR10X / BR20X Hardware Architecture
url: https://hc34.hotchips.org/assets/program/conference/day1/GPU%20HPC/HC2022.BirenTech.MikeHong.LingjieXu.v01.pdf
chip: biren
as_of: 2026-08-08
baseline_as_of: 2026-04-05
investigation_report: hw-architecture.md

layer_mappings:
  - layer: Compute Engine
    components:
      - name: SPC (Streaming Processing Cluster)
        role: Top-level compute grouping; 32 SPCs per die (64 total in BR100); each SPC has 16 EUs and 4,096 threads
        entry_points:
          - 16 Execution Units (EUs) per SPC
          - 4,096 threads per SPC
          - C-Warp warp scheduler
        confidence: confirmed

      - name: EU (Execution Unit)
        role: Atom-level compute block; analogous to NVIDIA SM; contains FP32/BF16/TF32+/INT8 pipelines plus tensor units
        confidence: confirmed

      - name: BR100 peak compute
        role: 256 TFLOPS FP32, 1024 TFLOPS BF16, 2048 TOPS INT8; 77B transistors dual-die TSMC 7nm
        confidence: confirmed

      - name: BR104 peak compute
        role: 128 TFLOPS FP32, ~1024 TOPS INT8; monolithic single die; 300W PCIe
        confidence: confirmed

      - name: Precision formats
        role: FP32, TF32+, BF16, FP16, INT8; NO FP64
        confidence: confirmed

      - name: TF32+ (Biren extended TF32)
        role: Extended dynamic range vs NVIDIA TF32; key training throughput advantage claimed by Biren
        confidence: confirmed

  - layer: Data Path
    components:
      - name: C-Warp execution model
        role: SIMT warp execution adapted for data-flow workloads; threads in SPC execute same instruction; hardware divergence handling
        confidence: confirmed

      - name: Data-flow architecture (six features)
        role: TF32+ precision, TDA (data-flow access), C-Warp parallel, NME (near-memory engine), NUMA/UMA, SVI (stream virtualization isolation)
        confidence: confirmed

      - name: Mesh on-chip network
        role: SPCs connected via mesh to distributed L2 cache slices; all-to-all SPC communication; similar to Intel Sapphire Rapids topology
        confidence: inferred

      - name: Die-to-die link (CoWoS-S interposer)
        role: 896 GB/s bidirectional bandwidth between two BR100 dies via silicon interposer
        confidence: confirmed

  - layer: On-chip Memory
    components:
      - name: L2 cache (distributed, 300 MB)
        role: Hardware-managed distributed cache across all SPCs; 300 MB total — ~6x NVIDIA A100 L2; reduces HBM pressure
        confidence: confirmed

      - name: L1 / shared memory per EU
        role: Per-EU L1 cache and configurable shared memory; specific capacity not disclosed
        confidence: inferred

  - layer: Off-chip Memory
    components:
      - name: HBM2e (BR100)
        role: 64 GB total (2 stacks per die × 4 stacks), 2,300 GB/s (2.3 TB/s), 4096-bit interface
        confidence: confirmed

      - name: HBM2e (BR104)
        role: 32 GB, 819 GB/s, 2048-bit interface
        confidence: confirmed

      - name: HBM supply constraint (export controls)
        role: US controls block SK Hynix / Samsung HBM for Biren; production severely impacted 2022-2026
        confidence: confirmed

  - layer: Host Interface / Package
    components:
      - name: PCIe Gen5 x16 + CXL
        role: ~128 GB/s bidir host interface; CXL 1.1/2.0 support for coherent memory expansion
        confidence: confirmed

      - name: TSMC CoWoS-S 2.5D packaging (BR100)
        role: Two dies + 4 HBM2e stacks on silicon interposer; 896 GB/s die-to-die link
        confidence: confirmed

      - name: OAM form factor (BR100)
        role: Open Accelerator Module; 550W TDP; 8-card per server via BLink
        confidence: confirmed

      - name: PCIe FHFL card (BR104)
        role: Standard full-height full-length PCIe card; 300W TDP; single die
        confidence: confirmed

  - layer: Scale-up Interconnect
    components:
      - name: BLink (Biren proprietary GPU interconnect)
        role: 8 bidirectional links × 64 GB/s = 512 GB/s aggregate; connects up to 8 BR100 GPUs per server; NVLink analog
        confidence: confirmed

      - name: 8-way BLink topology
        role: 8 BR100 GPUs per server node with full peer-to-peer GPU memory access; no external switch ASIC disclosed
        confidence: confirmed

  - layer: Scale-out Interconnect
    components:
      - name: Standard InfiniBand / Ethernet
        role: Inter-node communication via commodity NICs; no proprietary scale-out network ASIC
        confidence: confirmed

      - name: BCCL (Biren Collective Comms Library)
        role: NCCL analog for AllReduce/AllGather over SUPA runtime; intra-node and cross-node collectives
        confidence: inferred

key_abstractions:
  - name: SPC (Streaming Processing Cluster)
    description: >
      Biren's top-level compute grouping containing 16 EUs and 4,096 threads.
      Analogous to NVIDIA's GPC. The BR100 has 32 SPCs per die (64 total).
    layer: Compute Engine
    hardware_mapping: Array of 32 SPCs per die connected via mesh to L2 cache slices

  - name: C-Warp
    description: >
      Biren's SIMT warp execution unit. Groups threads that execute the same instruction
      simultaneously within an EU. Hardware divergence handling via predication.
      Programming model compatible with BIRENSUPA GPU kernel model.
    layer: Data Path
    hardware_mapping: Warp schedulers within each EU

  - name: TF32+
    description: >
      Biren's extended TF32 numerical format with higher dynamic range than NVIDIA TF32.
      Key throughput-per-accuracy advantage for deep learning training at 512 TFLOPS.
    layer: Compute Engine
    hardware_mapping: Tensor units within EU

  - name: BLink
    description: >
      Biren's proprietary GPU-to-GPU scale-up interconnect. 8 links × 64 GB/s = 512 GB/s aggregate.
      Enables 8-GPU single-server configurations analogous to NVIDIA DGX A100 NVLink topology.
    layer: Scale-up Interconnect
    hardware_mapping: SerDes links on OAM board

  - name: 300 MB L2 Cache
    description: >
      Massive distributed hardware-managed L2 cache across all SPCs. At 300 MB, this is
      ~6x NVIDIA A100's L2. Reduces HBM bandwidth pressure for workloads with large working sets
      (transformer KV-cache, weight reuse). Key architectural differentiator vs contemporaries.
    layer: On-chip Memory
    hardware_mapping: Distributed cache slices on mesh between SPCs

