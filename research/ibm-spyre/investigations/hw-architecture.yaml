chip: ibm-spyre
as_of: "2026-08-08"
device_class: "Inference Accelerator (SIMD-Systolic Dataflow, scratchpad-managed)"
investigation: hw-architecture

# ── Product identity / maturity ───────────────────────────────────────────────
product:
  name: "IBM Spyre Accelerator"
  also_known_as: "IBM AIU (Artificial Intelligence Unit) — the name still used throughout the software stack"
  vendor: IBM
  host_systems: ["IBM z17", "IBM LinuxONE 5", "IBM Power11"]
  form_factor: "Single-slot PCIe card, no auxiliary power connector"
  workload_scope: "Inference only (no public training support; hardware training capability not disclosed)"
  announced: "2025-10-07"
  ga_z17_linuxone5: "2025-10-28"
  ga_power11: "early December 2025"
  maturity: "shipping (GA) — sold as a priced system option"
  deployed_at_scale: false
  deployment_note: >-
    No named external at-scale production deployment is public. Pre-GA validation is documented only at
    IBM Yorktown Heights and the University at Albany Center for Emerging AI Systems. Record as
    'shipping (GA)', NOT 'deployed at scale'.
  do_not_conflate_with: >-
    IBM Telum II on-die AI unit (zAIU), a CPU-integrated accelerator reached via the NNPA instruction and
    served by zDNN/zDLC. Spyre is a discrete PCIe ASIC with a separate software path.
  confidence: confirmed
  sources:
    - https://newsroom.ibm.com/2025-10-07-ibm-introduces-the-spyre-accelerator-for-commercial-availability
    - https://research.ibm.com/blog/building-the-ibm-spyre-accelerator
    - https://research.ibm.com/blog/lifting-the-cover-on-the-ibm-spyre-accelerator

