# Update appended 2026-08-08 — Ascend 950 generation.
# Prior content above reflects the 2026-04-05 baseline and is unchanged.
# Confidence vocabulary:
#   confirmed    = independently corroborated by >=2 sources, or vendor primary
#   vendor_claim = stated by Huawei marketing; not independently measured
#   announced    = a stated schedule/plan, not an accomplished fact
#   single_source= one third-party analysis only; DO NOT cite as spec
#   not_disclosed= Huawei has not published a value; no estimate recorded
# ---------------------------------------------------------------------------
