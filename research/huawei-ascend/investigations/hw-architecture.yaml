      die_config: "dual AI die per chip"
      package_construction: not_disclosed
      die_area: not_disclosed
      process_node: not_disclosed
      process_node_analyst_inference: "SMIC N+2 / N+3 (~5-7 nm equivalent) - low confidence, never vendor-stated"
      sources:
        - https://public-download.obs.cn-east-2.myhuaweicloud.com/ascend/%E6%98%87%E8%85%BE950%20NPU%E6%9E%B6%E6%9E%84%E7%99%BD%E7%9A%AE%E4%B9%A6.pdf
        - https://pillumina.github.io/posts/aiinfra/ascend-950-npu/
