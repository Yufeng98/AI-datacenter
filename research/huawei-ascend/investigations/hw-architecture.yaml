chip: huawei-ascend
as_of: "2026-08-08"
baseline_as_of: "2026-04-05"
focus: hardware-architecture

compute_engine:
  architecture: Da Vinci (HiSilicon proprietary heterogeneous AI core)
  generations:
    - name: Da Vinci 1.0
      product: Ascend 910
      process: TSMC 7nm
      core_count: 32
      core_type: DaVinci Max
      peak_fp16_tflops: 256
      peak_int8_tops: 512
      tdp_w: 310
    - name: Da Vinci 2.0
      product: Ascend 910B
      process: SMIC N+1 (~7nm equivalent)
      core_count: 25
      core_type: New DaVinci
      peak_fp16_tflops: 320
      peak_int8_tops: 640
      tdp_w: 400
    - name: Da Vinci 3.0
      product: Ascend 910C
      process: Dual-die MCM (2x SMIC N+1 + TSMC 7nm CPU companion)
      core_count: "~64 total (32 per die)"
      core_type: New DaVinci (improved)
      peak_fp16_tflops: 800
      peak_int8_tops: 1600
      tdp_w: 400
  per_core_units:
    - name: Cube Unit
      function: Matrix multiply-accumulate (systolic)
      tile_fp16: "16x16x16 = 4096 MACs/cycle"
      tile_int8: "16x32x32 = 8192 MACs/cycle"
      operand_buffers: [L0A_16KB, L0B_16KB]
      output_buffer: L0C_32KB
    - name: Vector Unit
      function: Element-wise ops, activations, reductions
      width_fp16: 128 elements/cycle
      width_int8: 256 elements/cycle
      data_types: [FP32, FP16, BF16, INT32, INT8, INT4]
    - name: Scalar Unit
      function: Loop control, branch, address calculation (micro-CPU)
    - name: MTE1
      function: Input DMA (HBM/L2 -> L1 -> L0A/L0B)
      features: [hardware_transpose, double_buffer_prefetch]
    - name: MTE2
      function: Output DMA (L0C -> UB -> L2 -> HBM)
      features: [quantization_on_drain, format_conversion]

memory_hierarchy:
  per_core:
    - level: L0A
      size_kb: 16
      purpose: Cube left operand buffer
    - level: L0B
      size_kb: 16
      purpose: Cube right operand buffer (weights)
    - level: L0C
      size_kb: 32
      purpose: Cube accumulator (FP32)
    - level: L1
      size_kb: 512
      purpose: Input feature staging (fed by MTE1 from L2)
    - level: UB
      size_kb: 256
      purpose: Unified Buffer for Vector/MTE2/Scalar
  shared:
    - level: L2
      size_mb: 32
      bandwidth_tbps: 4.0
      notes: Shared across all AI cores; NoC 1024-bit @ 2GHz
    - level: total_on_chip_sram
      size_mb: 84
  off_chip:
    - product: Ascend 910
      type: HBM2
      capacity_gb: 32
      bandwidth_gbps: 1228
    - product: Ascend 910B
      type: HBM2e
      capacity_gb: 64
      bandwidth_gbps: 800
    - product: Ascend 910C
      type: HBM2e
      capacity_gb: 128
      bandwidth_gbps: 1600

host_interface:
  type: PCIe 4.0 x16
  bandwidth_gbps: 64

scale_up_interconnect:
  name: HCCS (Huawei Compute Communication System)
  description: Proprietary high-speed intra-server NPU-to-NPU interconnect
  versions:
    - version: "1.0-3.0"
      products: [Ascend 910, 910B, 910C]
      topology: intra-server bus
      chips_per_server: 8
    - version: "4.0"
      products: [Ascend 910D planned]
      topology: cluster fabric
      target_scale: 100000 chips
  cloudmatrix_384:
    chips: 384
    racks: 16
    per_server_scaleup_links: "56 x 400G SiPh LPO OSFP"
    per_chip_bandwidth_tbps: 2.8
    total_transceivers: 6912
    interconnect_type: full-mesh all-to-all optical

scale_out_interconnect:
  cloudmatrix_384:
    per_server_scaleout_links: "8 x 400G SiPh LPO OSFP"
    total_fibers: 3168
    topology: full-mesh optical

precision_support:
  - FP16: [Cube, Vector]
  - INT8: [Cube, Vector]
  - INT4: [Cube_gen_dependent, Vector]
  - FP32: [Vector, L0C_accumulation]
  - BF16: [Cube_DaVinci2+, Vector]
  - FP8: roadmap_910D

sources:
  - url: https://www.cmc.ca/wp-content/uploads/2020/03/Zhan-Xu-Huawei.pdf
    title: "DaVinci: A Scalable Architecture (CMC)"
  - url: https://pdfs.semanticscholar.org/78b6/d0b2a12de2e7c106e8b4a81a6b29cf5c47b7.pdf
    title: DaVinci Architecture (Semantic Scholar)
  - url: https://www.oreilly.com/library/view/ascend-ai-processor/9780128234891/B9780128234884000035.xhtml
    title: Ascend AI Processor Architecture Ch.3 (O'Reilly)
  - url: https://www.sciencedirect.com/science/article/abs/pii/S074373152300014X
    title: Performance Modeling on DaVinci AI Core (ScienceDirect)
  - url: https://www.tomshardware.com/tech-industry/artificial-intelligence/huaweis-homegrown-ai-chip-examined-chinese-fab-smic-produced-ascend-910b-is-massively-different-from-the-tsmc-produced-ascend-910
    title: Huawei Ascend 910B Examined (Tom's Hardware)
  - url: https://newsletter.semianalysis.com/p/huawei-ai-cloudmatrix-384-chinas-answer-to-nvidia-gb200-nvl72
    title: CloudMatrix 384 Analysis (SemiAnalysis)

