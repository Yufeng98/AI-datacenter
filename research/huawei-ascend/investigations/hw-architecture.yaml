    not_confirmed:
      confidence: single_source
      warning: "single third-party analysis only; DO NOT cite as spec; recorded for future verification"
      items:
        - "18 Da Vinci cores per AI die -> 36 Cube + 72 Vector cores per chip (950DT)"
        - "L0A 64 KB, L0B 64 KB, L1 512 KB, Unified Buffer 512 KB per core"
        - "sector cache: 512 B lines split into 4 x 128 B sectors"
        - "BufferID-based synchronization replacing the EnQue/DeQue inter-pipeline handshake"
        - "NDDMA as N-Dimensional Data Movement Accelerator fusing movement + layout conversion + address generation, up to 5D transforms"
        - "'Linx816' on-chip AI CPU: 4 clusters x 2 ARMv8-A cores, dual-threaded, 4 MB L3 per cluster"
        - "UnifiedBus RTP/CTP port decomposition (see scale_up below)"
      note: "the repo's 16 KB L0A/L0B figure is the 910-era value and remains correct for that generation"
      sources:
        - https://pillumina.github.io/posts/aiinfra/ascend-950-npu/

