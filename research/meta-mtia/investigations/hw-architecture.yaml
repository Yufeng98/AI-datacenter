    - group: pcie_host_interface_resolved
      confidence: confirmed
      basis: both_primary_papers_agree
      resolved_on: "2026-08-08"
      facts:
        mtia_v1: "8x PCIe Gen4 (16 GB/s)"
        mtia_v2_2i: "8x PCIe Gen5 (32 GB/s)"
        mtia_300: "16x PCIe Gen5 (64 GB/s), 1:1 host:accelerator"
        isca_2025_table: "Host connection: 8x PCIe Gen5 (32 GB/s) for MTIA 2i; 8x PCIe Gen4 (16 GB/s) for MTIA v1"
        isca_2025_module_text: "each accelerator module houses two MTIA 2i chips connected via two 8x Gen5 PCIe links; a PCIe switch links six modules per server"
        isca_2026_table_I: "MTIA 2i host connection = 8x PCIe Gen5 (32 GB/s) -- agrees with ISCA 2025"
        prior_repo_error: "the 2026-04-05 entry 'PCIe Gen5 x16 (128 GB/s)' was wrong on both lane count and bandwidth; corrected throughout on 2026-08-08"
        arithmetic_note: "128 GB/s corresponds to no Gen5 configuration Meta describes (Gen5 x16 is ~63 GB/s unidirectional, ~126 GB/s bidirectional)"
      sources:
        - title: "MTIA 300 ISCA 2026 paper (Table I)"
          url: "https://aisystemcodesign.github.io/papers/MTIA300_ISCA2026.pdf"
        - title: "MTIA ISCA 2025 paper"
          url: "https://aisystemcodesign.github.io/papers/MTIA-ISCA25.pdf"

    - group: scheduled_not_yet_public
      confidence: high
      basis: conference_program_listing_only
      facts:
        event: "Hot Chips 38"
        session: "AI 1"
        date: "2026-08-25"
        time: "2:15-4:15 PM"
        talk_title: "Meta's Custom AI Silicon: From Recommendation to Dual-Mandate with GenAI"
