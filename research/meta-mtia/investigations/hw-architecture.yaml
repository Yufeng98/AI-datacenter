      sources:
        - title: "MTIA 300 ISCA 2026 paper"
          url: "https://aisystemcodesign.github.io/papers/MTIA300_ISCA2026.pdf"

    - group: broadcom_partnership
      confidence: high
      basis: meta_newsroom_pr_primary
      facts:
        date: "2026-04-14"
        scope: "chip design, advanced packaging, and networking"
        platform: "Broadcom XPU platform"
        networking: "Broadcom Ethernet for cluster networking"
