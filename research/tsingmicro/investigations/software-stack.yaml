        - https://github.com/FlagTree/flagtree/blob/triton_v3.3.x/third_party/tsingmicro/backend/txda_tools.py

    - name: "Device firmware — tx81fw / rcs1fw-rtt"
      os: "RT-Thread SMP via T-Head YoC (tx8-yoc-rt-thread-smp)"
      distribution: "bundled in tx8_depends_dev_* tarballs"
      open_source: false
      confidence: confirmed
      sources:
        - https://github.com/FlagTree/flagtree/blob/triton_v3.3.x/third_party/tsingmicro/scripts/build_tx8_deps.sh

    - name: "libinstr_rcs1.a"
      headers: [instr_def.h, instr_adapter.h, instr_operator.h, common_base.h]
      function: "the accelerator command/instruction ABI"
      open_source: false
      confidence: confirmed

    - name: "Simulation — triton_cmodel / tx8be_op_cmodel / neuralcore_qemu"
      function: "USE_SIM_MODE=1 builds against a C-model plus a QEMU neural-core simulator instead of hardware"
      open_source: false
      confidence: confirmed

    - name: "Profiling"
      open_components: "tx-profiler LLVM IR pass — injects addOrderProfile / TsmWaitfinish / printOrderByEvent around named trace points"
      closed_components: "profiling_tool v5.5.0 / v5.6.0, rcs_profiling, hrt_profiler, tsm_profiler.h"
      env_vars: [ENABLE_PROFILING, TSM_PROFILER_EN, TRACE_POINTS]
      open_source: mixed
      confidence: confirmed
      sources:
