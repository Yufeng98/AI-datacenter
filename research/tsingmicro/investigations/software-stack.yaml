    flagcx_support_matrix: "send, recv, broadcast, gather, scatter, reduce, allreduce, allgather, reducescatter, alltoall, alltoallv, group ops — in both homogeneous and heterogeneous modes"
    algorithms: "not disclosed"
    topology_awareness: "not disclosed"
    achieved_bandwidth: "not disclosed"
    confidence: confirmed
