      - https://github.com/FlagOpen/FlagCX/blob/main/flagcx/adaptor/ccl/tccl_adaptor.cc

  driver:
    kernel_driver: "not public — ships inside the Kuiper SDK"
    module_name: "not disclosed"
    ioctl_interface: "not disclosed"
    management_cli: "tsm_smi (the nvidia-smi analogue)"
    container_image: "hub.tsingmicro.com/tx8/ubuntu/v5.7.0.0524:tsingmicro_release"
    virtualization: "claimed in the RAISA layer-4 description (驱动、容器、虚拟化) but no technical detail is public"
    open_source: false
