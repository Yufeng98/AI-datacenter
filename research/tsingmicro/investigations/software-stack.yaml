    - "RAISA graph compiler"
    - "self-developed C/C++ kernel language"
  confidence: confirmed

# ── Assessment ────────────────────────────────────────────────────────────────
net_assessment:
  strength: >
    The open portion is a compiler front/middle-end plus an operation-level hardware model —
    unusually revealing for a Chinese vendor, and sufficient to reconstruct the memory model,
    tile count, SPM size, execution model and NoC addressing with no vendor documentation at all.
  maturity_gaps:
    - "Every executable layer below LLVM IR is a closed binary tied to an internal artifact server"
    - "FlagOS ecosystem forks have ~0 stars and thin content; upstream PyTorch-Plugin-FL has no txda backend"
    - "Backend pinned to Triton 3.3 while other FlagTree vendors moved to 3.6 on main"
    - "Multi-tile TLE NoC test disabled in CI (# TODO: fix) — the distributed path is not CI-green"
    - "~60 PyTorch ops still fall back to CPU (TXDA_FALLBACK_CPU_OPS)"
    - "No public graph capture, so RAISA layer-3 'global graph optimisation' is unverifiable"
  verdict: "Real and actively developed (commits through Aug 2026) but demonstrably earlier-stage than Ascend CANN or Cambricon Neuware. The public surface is a kernel-compiler story, not an end-to-end framework story."
  confidence: likely
