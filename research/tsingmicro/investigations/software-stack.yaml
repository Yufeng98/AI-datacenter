      open_source: false
      evidence: "referenced in CMakeLists.txt (rcs1fw-rtt/include/components/oplib_rcs1/riscv/riscv/include) and build_tx8_deps.sh"
      confidence: confirmed
      sources:
        - https://github.com/FlagTree/flagtree/blob/triton_v3.3.x/third_party/tsingmicro/CMakeLists.txt

  runtime:
    - name: "Kuiper host SDK — tx_runtime.h / libhpgr"
      install_path: /usr/local/kuiper
      api_shape: "near-1:1 rename of the CUDA/HIP runtime"
      api_surface: [txSetDevice, txGetDevice, txGetDeviceCount, txGetDeviceProperty, txGetDeviceByPCIBusId, txDeviceSynchronize, txMalloc, txFree, txMallocHost, txFreeHost, txMemcpy, txMemcpyAsync, txMemset, txStreamCreate, txStreamDestroy, txStreamQuery, txStreamSynchronize, txStreamWaitEvent, txEventCreate, txEventDestroy, txEventRecord, txEventQuery, txEventSynchronize, txEventElapsedTime, txIpcGetMemHandle, txIpcOpenMemHandle, txIpcCloseMemHandle, txMemGetHandleForAddressRange, txLaunchHostFunc, txLaunchKernelGGL]
      types: [txStream_t, txEvent_t, txIpcMemHandle_t, txError_t, txDeviceProperty, TX_SUCCESS]
      naming_note: "txLaunchKernelGGL mirrors HIP's hipLaunchKernelGGL — HIP-flavoured, not CUDA-compatible"
      open_source: false
      confidence: confirmed
      note: "Header itself is closed; the surface above was reconstructed from the open FlagCX adaptor."
      sources:
