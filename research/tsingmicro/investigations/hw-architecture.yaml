chip: tsingmicro
as_of: "2026-08-08"
device_class: "Reconfigurable Dataflow / CGRA \"RPU\" (China, 清微智能)"
investigation: hw-architecture

# ── Scope ─────────────────────────────────────────────────────────────────────
scope:
  in_scope: "TX8 series / TX81 datacenter line: TX81 RPU module, REX1032 server node, REX81 supernode"
  out_of_scope: "TX5 series edge NPUs (TX510 vision, TX210 voice) and the TS.Knight / RNE toolchain"
  evidence_basis: >
    No ISSCC / ISCA / Hot Chips / MICRO / JSSC paper and no architecture whitepaper exists for
    TX8 or TX81 as of 2026-08-08, and the vendor operates no developer portal. Nearly all
    microarchitectural detail below is reconstructed from vendor-authored open source: the
    Tsingmicro Triton backend upstreamed into BAAI FlagTree (third_party/tsingmicro,
    triton_v3.3.x branch, 609 files) plus the vendor-maintained FlagGems and FlagCX backends.
  naming_caution: >
    The vendor uses "TX81" for both the die and the compute module. Trade press distinguishes
    them: "TX81 单个 RPU 模组" = one module; "4096 颗 TX81 芯片" = 4096 chips.
  unit_caution: >
    "算力突破每秒500千万亿次" = >500 PFLOPS, NOT exaflops (千万亿 = 10^15). English machine
    translations frequently render this as exaflops.
  confidence: confirmed
  sources:
    - https://www.tsingmicro.com/products/tx8/series
    - https://github.com/FlagTree/flagtree/tree/triton_v3.3.x/third_party/tsingmicro

# ── Compute Engine ────────────────────────────────────────────────────────────
compute_engine:
  architecture_class:
    self_brand: "RPU — Reconfigurable Processing Unit"
    architecture_name: "可重构 2.0 (Reconfigurable 2.0)"
    vendor_definition: >
      Runtime dynamic reconfiguration of 计算单元 (compute units), 互连结构 (interconnect
      structure) and 数据通路 (datapath) based on compute demand and dataflow characteristics.
    observed_reconfiguration_granularity: >
      Coarse-grained: one command descriptor configures an engine for an entire tiled tensor
      operation (M/K/N or pads/strides/dilations, plus fused bias, per-axis scale,
      ReLU/LeakyReLU, and psum accumulation).
    reconfiguration_mechanism_detail: "not disclosed — configuration memory size, context switching, partial reconfiguration are not described in any public source"
    confidence: likely
    note: "The RPU branding and the vendor definition are confirmed; the mapping from that definition to observable hardware behaviour is inferred from the open-source command-descriptor interface only."
    sources:
      - https://www.eefocus.com/article/1888048.html
      - https://www.tsingmicro.com/products/tx8/series
      - https://github.com/FlagTree/flagtree/blob/triton_v3.3.x/third_party/tsingmicro/include/tsingmicro-tx81/Dialect/IR/Tx81Ops.td

  tile_organisation:
    tiles_per_device: 16
    topology: "4 × 4 2-D mesh"
    topology_evidence: >
      send.c uses initTileId(coreIndex, rowLength=4) and get_tile_spm_addr_base(tile, 4, 4);
      the TLE example's TILE_PHYSICAL_RELATION [0,1,2,3,7,11,15,14,13,12,8,9,10,6,5,4] is a
      Hamiltonian cycle over a 4x4 grid in which every hop is a nearest-neighbour step.
    device_capability_reported: "major=8, minor=1 (TX81)"
    warp_size_reported: 16
    warp_size_note: "Vestigial — block dim is hard-wired to dim3{1,1,1} at launch; the grid indexes tiles directly."
    confidence: confirmed
    sources:
      - https://github.com/tsingmicro-public-e/FlagGems/blob/master/src/flag_gems/runtime/backend/_tsingmicro/__init__.py
      - https://github.com/FlagTree/flagtree/blob/triton_v3.3.x/third_party/tsingmicro/crt/lib/Tx81/send.c
      - https://github.com/FlagTree/flagtree/blob/triton_v3.3.x/third_party/tsingmicro/examples/tle/test_tle_dsa_noc_gemm_4096.py

  tile_contents:
    control_core:
      isa: "RISC-V RV64IMFDC"
      abi: lp64d
      core_ip: "T-Head XuanTie 900-series"
      toolchain: "Xuantie-900-gcc-elf-newlib-x86_64-V2.8.0, riscv64-unknown-elf-gcc 10.4.0"
      vector_extension: "absent — no RVV in -march; all vector/matrix work goes to the engines"
      internal_name: kcore
    engines:
      - name: "Neural engine"
        instruction_class: I_NEUR
        function: "GEMM and convolution; ActFuncMode {None, ENRelu, ENLeakRelu} documented as 'Neural engine activate mode'"
      - name: "RDMA / WDMA"
        instruction_class: I_RDMA
        function: "DDR→SPM (RDMA) and SPM→DDR (WDMA); 1-D, 4-D and general strided rank<=8 forms"
      - name: "DTE (Direct Transfer Engine)"
        function: "tile-to-tile transfer with hardware FSM flow-control monitors"
      - name: "Vector / elementwise / transcendental / activation units"
      - name: "Layout / data-movement engines"
        ops: [img2col, transpose, mirror, rotate90, rotate180, rotate270, nchw2nhwc, nhwc2nchw, pad, concat, gather_scatter, bilinear, lut16, lut32, randgen]
      - name: "Reduction / sort units"
        ops: [reduce_sum, reduce_avg, reduce_max, reduce_min, reduce_mul, cumsum, argmax, argmin, sort, count, histogram]
    pe_array_dimensions: "not disclosed"
    mac_lane_count: "not disclosed"
    confidence: confirmed
    note: "Engine inventory is confirmed from the Tx81 dialect and CRT; internal PE-array structure is not disclosed."
    sources:
      - https://github.com/FlagTree/flagtree/blob/triton_v3.3.x/third_party/tsingmicro/include/tsingmicro-tx81/Dialect/IR/Tx81Ops.td
      - https://github.com/FlagTree/flagtree/blob/triton_v3.3.x/third_party/tsingmicro/crt/include/Tx81/tx81_def.h
      - https://github.com/FlagTree/flagtree/blob/triton_v3.3.x/third_party/tsingmicro/backend/compiler.py

  gemm_conv_config_surface:
    gemm_builder_api: [TsmNewGemm, TsmDeleteGemm, AddInput, ConfigMKN, AddOutput, SetPsum, SetTransflag, SetQuant, ConfigBatch, EnableRelu, EnableLeakyRelu, DisableRelu, DisableLeakyRelu, AddBias, SetNegativeAxisScale, SetPositiveAxisScale]
    conv_builder_api: [TsmNewConv, AddInput, AddWeight, AddBias, AddOutput, SetOpType, SetNegativeAxisScale, SetPositiveAxisScale, SetSparse, SetPsum, SetPads, SetUnPads, SetKernelStrides, SetDilations, EnableRelu, EnableLeakyRelu, SetQuant]
    conv_op_types: {0: conv, 1: depthwise_conv, 2: backward_conv, 3: gemm}
    backward_conv_in_hardware: true
    backward_conv_note: "op_type=2 is a hardware backward-convolution mode, consistent with the vendor's training positioning."
    activation_layout: NHWC
    psum_accumulation: "en_psum — accumulate into an SPM partial-sum buffer"
    confidence: confirmed
    sources:
      - https://github.com/FlagTree/flagtree/blob/triton_v3.3.x/third_party/tsingmicro/include/tsingmicro-tx81/Dialect/IR/Tx81Ops.td
      - https://github.com/FlagTree/flagtree/blob/triton_v3.3.x/third_party/tsingmicro/crt/lib/Tx81/gemm.c

  structured_sparsity:
    hardware_support: true
    evidence: "ConvOp carries en_sparse + src_sparse (sparse-matrix address in SPM)"
    pattern: "not disclosed"
    ratio: "not disclosed"
    sparse_peak_throughput: "not disclosed"
    confidence: confirmed
    note: "The existence of the feature is confirmed by the dialect; its structure and any speedup are entirely undisclosed."
    sources:
      - https://github.com/FlagTree/flagtree/blob/triton_v3.3.x/third_party/tsingmicro/include/tsingmicro-tx81/Dialect/IR/Tx81Ops.td

  data_types:
    float_type_system: [F8E4M3FN, F8E4M3FNUZ, F8E5M2, F8E5M2FNUZ, F16, BF16, F32, F64]
    tf32: "present throughout the conversion op set and CRT (tf32_fp32.c, fp32_tf32.c)"
    integer_type_system: [I1, I4, I8, I16, I32, I64]
    block_scaled: "MX / FP4 block-scaled real in the hardware conversion path — FP4E2M1ToBF16Op, FP4E2M1ToFP16Op, MXFPScaleBF16Op, MXFPScaleFP16Op; CRT mxfp_bf16.c, mxfp_fp16.c, mxfp_scale_bf16.c, mxfp_scale_fp16.c"
    native_accelerator_compute_formats: "bf16 / fp16 / tf32 / fp32 — per explicit Tx81Ops.td header statement; unsupported types are either converted with TsmConvert or lowered to the RISC-V controller"
    int8_path: "supported via src_fmt/dst_fmt fields and per-channel INT8 bias on the GEMM/conv descriptor"
    fp64_enabled: false
    int64_enabled: false
    int64_handling: "CRT legalizeMemoryOpAttribute splits INT64 into two INT32 lanes"
    conversion_ops: "~50 hardware conversion ops covering INT8/16/32 <-> FP16/BF16/FP32/TF32 plus FP8/FP4 -> BF16/FP16"
    confidence: confirmed
    sources:
      - https://github.com/FlagTree/flagtree/blob/triton_v3.3.x/third_party/tsingmicro/include/tsingmicro-tx81/Dialect/IR/Tx81Types.td
      - https://github.com/FlagTree/flagtree/blob/triton_v3.3.x/third_party/tsingmicro/include/tsingmicro-tx81/Dialect/IR/Tx81Ops.td
      - https://github.com/tsingmicro-public-e/FlagGems/blob/master/src/flag_gems/runtime/backend/_tsingmicro/__init__.py

  peak_throughput:
    per_rpu_module_fp16_tflops: 512
    per_rex1032_node_pflops: 4
    rex81_supernode: "4,096 TX81 chips, >500 PFLOPS"
    per_chip_fp16_tflops: "not disclosed"
    peak_int8: "not disclosed"
    peak_fp8: "not disclosed"
    peak_fp4: "not disclosed"
    peak_tf32: "not disclosed"
    peak_sparse: "not disclosed"
    clock_frequency: "not disclosed"
    confidence: likely
    note: >
      The 512 TFLOPS module and 4 PFLOPS node figures are vendor claims repeated by trade press,
      not datasheet values. The >500 PFLOPS supernode figure is on the vendor's own product page.
      No per-chip throughput is published anywhere.
    sources:
      - https://www.eefocus.com/article/1888048.html
      - https://news.sina.com.cn/sx/2025-09-15/detail-infqpxhk9790648.shtml
      - https://www.tsingmicro.com/products/tx8/series

  derived_decomposition:
    value: "~128 TFLOPS FP16 per TX81 chip; 4 chips per RPU module; 32 chips per REX1032 node; 128 nodes per REX81 supernode"
    method: >
      4 PFLOPS / 512 TFLOPS = 8 modules per node. 2 TB node memory / 64 GB per device = 32 chips
      per node, hence 4 chips per module and ~128 TFLOPS per chip. Cross-checks: 4096 x 128 TFLOPS
      = 524 PFLOPS (matches ">500 PFLOPS"); 4096 / 32 = 128 nodes; the "max 4 TB" node option
      corresponds to 128 GB per chip.
    confidence: unconfirmed
    note: >
      THIS IS ARITHMETIC, NOT A VENDOR FIGURE. Every step is self-consistent but the per-chip
      number is inference and must never be cited as a published spec. It also depends on the
      unverified assumption that the 64 GB total_memory value in FlagGems is the shipping
      configuration.
    sources:
      - https://github.com/tsingmicro-public-e/FlagGems/blob/master/src/flag_gems/runtime/backend/_tsingmicro/__init__.py
      - https://www.eefocus.com/article/1888048.html

# ── Execution model / data path ───────────────────────────────────────────────
execution_model:
  parallelism: "SPMD over tiles — one program instance per tile"
  launch: "txLaunchKernelGGL(name, binary, size, dim3{gridX,gridY,gridZ}, dim3{1,1,1}, args, argsize, 0, stream)"
  block_dim: "hard-wired to 1x1x1; the grid indexes tiles directly"
  per_tile_flow: >
    The compiled kernel is a RISC-V shared object on the tile's kcore. For each tensor operation
    it fills a command descriptor (RcsNeInstr {I_NEUR} for GEMM/conv, RcsRdmaInstr {I_RDMA} for
    DMA), populates it through the builder API, and calls RcsExecute(&inst) — documented as
    "Dispatch the command to accelerator". Completion is awaited with RcsWaitfinish() /
    TsmWaitfinish().
  ordering: >
    DMA is asynchronous. tx81-insert-barrier inserts tx.barrier only when a non-tx (RISC-V) op
    may alias a buffer with a pending async write, or when an RDMA reads DDR a preceding WDMA may
    have written. Between compute-engine commands "hardware handles ordering", implying hardware
    scoreboarding / in-order issue within the engine pipeline.
  software_pipelining: "mk-pipeline builds (num_stages - 1) SPM prefetch buffers; num_stages default AND hard clamp = 2 (ping-pong double buffering only)"
  sync_primitives: [tx.barrier, tx.distribute_barrier, tx.atomic_barrier_in, tx.atomic_barrier_out, tile_sync_by_spm_single_direction]
  device_firmware: "tx81fw / rcs1fw-rtt on RT-Thread SMP via T-Head YoC (tx8-yoc-rt-thread-smp)"
  internal_codename_rcs1: "RCS1 is the vendor's internal name for the compute subsystem generation; expansion not disclosed"
  confidence: confirmed
  sources:
    - https://github.com/FlagTree/flagtree/blob/triton_v3.3.x/third_party/tsingmicro/backend/driver.py
    - https://github.com/FlagTree/flagtree/blob/triton_v3.3.x/third_party/tsingmicro/crt/lib/Tx81/gemm.c
    - https://github.com/FlagTree/flagtree/blob/triton_v3.3.x/third_party/tsingmicro/include/tsingmicro-tx81/Transforms/Passes.td
    - https://github.com/FlagTree/flagtree/blob/triton_v3.3.x/third_party/tsingmicro/include/magic-kernel/Conversion/MKPipeline/Passes.td
    - https://github.com/FlagTree/flagtree/blob/triton_v3.3.x/third_party/tsingmicro/scripts/build_tx8_deps.sh

# ── Memory ────────────────────────────────────────────────────────────────────
on_chip_memory:
  memory_model:
    address_spaces: "exactly two — SPM and DDR (typedef enum { UNKNOWN = 0, SPM = 1, DDR = 2 } MemorySpace)"
    hardware_data_cache: false
    hardware_data_cache_note: >
      No evidence of a hardware data cache anywhere in the compute path. FlagGems reports
      L2_cache_size = 3 MB, but that value is literally SPM_SIZE re-exported to satisfy
      Triton/PyTorch APIs that expect a cache-size attribute — an API shim, not a cache.
    operand_placement: "all compute-engine operands live in SPM; every ConvOp/GemmOp operand is documented as 'addr in SPM'"
    ddr_spm_movement: "exclusively explicit RDMA (DDR->SPM) and WDMA (SPM->DDR)"
    class: "software-managed scratchpad, compiler-scheduled — same class as TPU / Groq / Sophgo, not GPU"
    confidence: confirmed
    sources:
      - https://github.com/FlagTree/flagtree/blob/triton_v3.3.x/third_party/tsingmicro/crt/include/Tx81/tx81_def.h
      - https://github.com/FlagTree/flagtree/blob/triton_v3.3.x/third_party/tsingmicro/include/tsingmicro-tx81/Transforms/Passes.td

  capacities:
    spm_per_tile_mib: 3
    spm_per_tile_bytes: 3145728
    spm_system_reserved_bytes: 65536
    spm_op_reserved_bytes: 256
    spm_visible_to_triton_kernel_bytes: 3014656
    spm_visible_formula: "1024*1024*3 - 0x10000 - 0x10000"
    aggregate_spm_per_device_mib: 48
    aggregate_spm_confidence: "derived — 16 tiles x 3 MiB"
    spm_address_map_base: "0x30400000 (spmMappingOffset in the RISC-V core)"
    spm_bandwidth: "not disclosed"
    engine_internal_registers: "not disclosed"
    confidence: confirmed
    sources:
      - https://github.com/tsingmicro-public-e/FlagGems/blob/master/src/flag_gems/runtime/backend/_tsingmicro/__init__.py
      - https://github.com/FlagTree/flagtree/blob/triton_v3.3.x/third_party/tsingmicro/backend/driver.py
      - https://github.com/FlagTree/flagtree/blob/triton_v3.3.x/third_party/tsingmicro/crt/lib/Tx81/tx81.c

  compiler_management:
    allocator_pass: "--spmd-allocate-shared-memory"
    allocator_implementation: "liveness/interference allocator — lib/Analysis/Allocation.cpp (29 KB), Membar.cpp (14 KB), Alias.cpp"
    usage_attribute: "triton_tsm.spm_use, surfaced to the runtime as metadata['shared']"
    buffering: "double buffering only (num_stages max 2)"
    confidence: confirmed
    sources:
      - https://github.com/FlagTree/flagtree/blob/triton_v3.3.x/third_party/tsingmicro/include/magic-kernel/Conversion/MKPipeline/Passes.td

off_chip_memory:
  capacity_per_device_gb: 64
  capacity_evidence: "total_memory field with comment '# 64GB' in the vendor-maintained FlagGems backend"
  capacity_caveat: "Unverified by any datasheet whether 64 GB is the shipping configuration or a placeholder. Consistent with the vendor's 2 TB/node figure only under the derived 32-chips-per-node decomposition."
  technology: "not disclosed"
  technology_note: "Code names the address space 'DDR(dram)', which is a generic SDK label, not a technology disclosure. The vendor says only '大容量显存超高显存带宽'."
  bandwidth: "not disclosed"
  node_memory_rex1032: "2 TB standard, up to 4 TB (vendor claim)"
  confidence: likely
  sources:
    - https://github.com/tsingmicro-public-e/FlagGems/blob/master/src/flag_gems/runtime/backend/_tsingmicro/__init__.py
    - https://www.eefocus.com/article/1888048.html

memory_roadmap_caveat:
  statement: "The vendor's TX8 page says the NEXT generation (新一代) will adopt 基于国产DRAM的三维存算融合技术 (domestic-DRAM 3-D memory-compute fusion) to raise memory bandwidth."
  applies_to: "a future generation, NOT TX81"
  instruction: "TX81 must NOT be classified as PIM or 3-D-stacked."
  confidence: confirmed
  sources:
    - https://www.tsingmicro.com/products/tx8/series

# ── Interconnect ──────────────────────────────────────────────────────────────
on_chip_interconnect:
  type: "2-D mesh NoC over the 4x4 tile grid"
  mechanisms:
    - name: "DTE async block transfer"
      api: "__Send(chipX, chipY, dieId, tileId, dst, src, elem_bytes, data_size, physical_ids, mesh_size, ring_size) -> direct_dte_send_async / direct_fsm_monitor_receive / direct_dte_wait_done"
    - name: "Globally addressable peer SPM"
      api: "get_tile_spm_addr_base(tile, x, y) returns a base address through which a tile directly reads and writes another tile's SPM"
      significance: "This is a distributed shared address space, not message-passing only. Used for spin-wait sync flags at SINGLE_SPM_SYNC_ADDR and as the DTE destination."
  config_registers: "KUIPER_ADDR_MAP_REG_BASE = 0x6A0000; SCFG_TILE_ID_ADDR 0x6A0058 holds the hardware 2-D logical tile ID"
  platform_codename: "Kuiper (柯伊伯) — also names the host SDK install path /usr/local/kuiper; hardware-generation mapping not disclosed"
  link_width: "not disclosed"
  link_bandwidth: "not disclosed"
  hop_latency: "not disclosed"
  confidence: likely
  note: "The two transfer mechanisms and the register base are confirmed from code; the mesh topology itself is inferred from the 4x4 addressing helpers and the Hamiltonian physical-ID ring in the vendor's own example."
  sources:
    - https://github.com/FlagTree/flagtree/blob/triton_v3.3.x/third_party/tsingmicro/crt/lib/Tx81/send.c
    - https://github.com/FlagTree/flagtree/blob/triton_v3.3.x/third_party/tsingmicro/examples/tle/test_tle_dsa_noc_gemm_4096.py

scale_up:
  fabric: "Proprietary switchless chip-to-chip mesh/torus (vendor: 无交换机线性扩展, 自研算力网格技术)"
  compiler_address_hierarchy: "four-level — remote_chip_id_x, remote_chip_id_y, remote_die_id, remote_tile_id"
  primitives: [Tx81_RemoteBufferOp, Tx81_RemoteLoadOp, Tx81_RemoteStoreOp, Tx81_DistributeBarrierOp]
  semantics: "remote load/store, not merely DMA copy; remote ops carry optional mesh_physical_ids / mesh_shape attributes so the compiler can route"
  collective_sync: "Tx81_DistributeBarrierOp is a first-class subgroup barrier with mesh topology, lowering to __BarrierSubgroup()"
  topologies_claimed: [Mesh, Torus]
  vendor_claims: ["千卡直接互联，无需交换机成本", "支持 Mesh/Torus 拓扑组建千卡级高速智算集群", "兼容传统交换机组网架构"]
  link_bandwidth: "not disclosed"
  serdes_rate: "not disclosed"
  lanes_per_link: "not disclosed"
  link_radix: "not disclosed"
  hop_latency: "not disclosed"
  physical_medium: "not disclosed (cable / backplane / on-PCB all unknown)"
  confidence: likely
  note: >
    The compiler-visible remote-load/store address hierarchy and the distribute barrier are
    confirmed from the open dialect. Every quantitative property of the fabric is undisclosed —
    which is notable because switchless scale-up is the chip's headline architectural claim.
  sources:
    - https://github.com/FlagTree/flagtree/blob/triton_v3.3.x/third_party/tsingmicro/include/tsingmicro-tx81/Dialect/IR/Tx81Ops.td
    - https://www.tsingmicro.com/products/tx8/series

multi_die:
