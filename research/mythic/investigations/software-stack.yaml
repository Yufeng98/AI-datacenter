    - https://www.videantis.com/technology.html
    - https://www.taylorwessing.com/en/insights-and-events/news/media-centre/press-releases/2026/06/mythic-inc-acquires-videantis
    - https://global.honda/en/topics/2026/c_2026-02-04eng.html
    - https://mythic.ai/whats-new/honda-and-mythic-announce-joint-development-of-100x-energy-efficient-analog-ai-chip-for-next-generation-vehicles/
    - https://mythic.ai/whats-new/
