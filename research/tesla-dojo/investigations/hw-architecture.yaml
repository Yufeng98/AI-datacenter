chip: tesla-dojo
document: hw-architecture
as_of: "2026-08-08"
primary_source: "Hot Chips 34, August 2022"
baseline_note: "All D1 / Training Tile / ExaPOD figures below are unchanged since the 2026-04-05 baseline. The 2026-08-08 update is roadmap context only (see roadmap_update_2026_08_08)."

d1_chip:
  process: "TSMC 7nm"
  die_size_mm2: 645
  transistors_B: 50
  compute_nodes: 354
  clock_ghz: 2.0
  tdp_w: 400
  compute:
    bf16_tflops: 376
    cfp8_tflops: 376
    fp32_tflops: 22
  on_chip_sram_mb: 440
  per_node_sram_mb: 1.25
  isa: "Custom 64-bit scalar + 64-byte SIMD vector; not publicly documented"
  on_chip_mesh_bw_tbs: 10
  c2c_serdes_lanes: 576
  c2c_serdes_speed_gts: 112
  c2c_aggregate_bw_tbs: 8

training_tile:
  d1_chips: 25
  arrangement: "5x5 grid"
  throughput_pflops_bf16: 9
  sram_gb: 11
  tdp_kw: 15
  aggregate_bw_tbs: 36
  hbm_bw_tbs: 13
  host_bw_gbs: 160
  dip_cards_per_edge: 5

system_tray:
  tiles: 6

cabinet:
  system_trays: 2
  d1_chips: 300
  compute_nodes: 106200

exapod:
  cabinets: 10
  d1_chips: 3000
  compute_nodes: 1062000
  throughput_eflops_bf16: 1
  total_sram_tb: 1.3
  total_hbm_tb: 13

scale_out_network:
  protocol: "TTPoE (Tesla Transport Protocol over Ethernet)"
  fabric: "Commodity Ethernet switches"
  latency: "microsecond range (one-way)"
  loss_model: "lossy, hardware retry"
  nic: "Tesla custom Dumb-NIC, hardware offloaded"
  open_source_repo: "https://github.com/teslamotors/ttpoe"
  industry: "UltraEthernet Consortium (UEC)"

project_status:
  v1_production: "July 2023"
  team_disbanded: "August 2025"
  restart_announced: "January 2026"
  status_as_of: "Dojo 3 program acknowledged (confirmed publicly 2026-01-19/20, restated 2026-04-15); no Dojo 3 hardware disclosed as of 2026-08-08. Tesla's near-term AI silicon is AI5 (Samsung Taylor 2nm) and AI6 (Samsung)."

