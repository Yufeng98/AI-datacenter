chip: tesla-dojo
document: software-stack
as_of: "2026-08-08"
primary_source: "Hot Chips 34, August 2022; job postings (archived)"
baseline_note: "No software-stack fact below changed since the 2026-04-05 baseline. See roadmap_update_2026_08_08 for what was re-checked."

framework_integration:
  pytorch:
    status: confirmed
    details: "User-facing training interface; standard PyTorch model compatibility goal"
    public_backend: false
  jax:
    status: "not mentioned"
  tensorflow:
    status: "not mentioned"
  manual_kernels_required: false

compiler:
  type: "Custom in-house ML compiler"
  frontend: "PyTorch computation graph"
  backend: "LLVM"
  backend_confirmed: true
  ir: "custom; not public"
  mlir_based: unknown
  parallelism:
    data_parallel: confirmed
    model_parallel: confirmed
    graph_parallel: confirmed
    user_directives_required: false
  jit_compilation: true
  mixed_precision_handling: "BF16 / CFP8 / CFloat16"
  source_public: false

isa:
  type: "Custom Tesla ISA"
  scalar_width_bits: 64
  vector_width_bytes: 64
  precisions: ["BF16", "CFP8", "CFloat16", "FP32"]
  specification_public: false
  assembler_public: false

op_library:
  exists: inferred
  public: false
  notes: "Believed internal to compiler codegen; no standalone library described publicly"

kernel_library:
  exists: inferred
  public: false

runtime:
  fault_tolerant: true
  fault_model: "Reroutes mesh traffic around failed links"
  dynamic_scaling: true
  virtual_memory: false
  source_public: false

communication:
  ttpoe:
    description: "Tesla Transport Protocol over Ethernet"
    layer: "Custom Layer-2/transport over commodity Ethernet"
    open_source: true
    repo: "https://github.com/teslamotors/ttpoe"
    presented_at: "Hot Chips 36, August 2024"
  ttp_data_ingestion:
    description: "TTP data loading for video frames from host servers"
    bandwidth_gbs: 160
    hardware: "DIP cards"

not_public:
  - "Compiler source code"
  - "ISA specification"
  - "Assembler / disassembler"
  - "SDK / toolchain"
  - "Kernel library"
  - "Runtime source"
  - "Profiling / debugging tools"
  - "PyTorch backend plugin"
  - "MLIR dialect"

open_source_artifacts:
  - name: "teslamotors/ttpoe"
    url: "https://github.com/teslamotors/ttpoe"
    description: "TTPoE kernel-space driver and protocol implementation"

project_status:
  team_disbanded: "August 2025"
  restart_announced: "January 2026"
  new_direction: "AI5 (Samsung Taylor, 2nm) and AI6 (Samsung) are Tesla's near-term AI silicon; Dojo 3 is paired with AI7 and stated to target space-based compute"
  software_stack_frozen: true

