# ============================================================================
# Xiwang hardware update — appended 2026-08-08
# Primary sources: sunrise-ai.com S2/S3 product pages (CMS republished 2026-08-06);
# FlagTree third_party/sunrise (first third-party-inspectable architecture evidence)
# ============================================================================

update_2026_08_08:
  date: "2026-08-08"
  change_class: major
  supersedes_baseline: "2026-04-05"
  trigger: >
    Vendor site rebuild disclosing S3 LPDDR6 memory, PCIe Gen6, the FP4 precision list,
    the SRLink scale-up name and the 寰望 SC3-256 rack-scale product; plus discovery of
    the FlagTree third_party/sunrise Triton backend, which exposes the first
    compiler-visible microarchitecture facts for this chip. Also corrects a ~10x
    pre-existing funding error and removes an unsupported S2 memory-type inference.

  fact_groups:

    - group: s3_memory_and_host_interface
      confidence: high
      basis: vendor_stated_primary_product_page
      facts:
        memory_type: "LPDDR6"
        memory_backward_compat: "LPDDR5X (LPDDR6/5X ... 向下兼容 LPDDR5X)"
        memory_capacity: not_disclosed
        memory_bandwidth: not_disclosed
        host_interface: "PCIe Gen6"
        host_interface_lanes: not_disclosed
        vendor_claims:
          - "国内首款挂载 LPDDR6 的 GPU (first domestic GPU to attach LPDDR6)"
          - "国内首用 PCIe Gen6 的 GPU"
          - "100% host-device interconnect bandwidth improvement"
        significance: >
          LPDDR6 rather than HBM is the defining S3 architecture choice: it serves the
          per-token-cost positioning and removes dependence on export-restricted HBM.
          The trade-off cannot be quantified because neither capacity nor bandwidth is
          published. Applies to S3 ONLY.
      sources:
        - title: "曦望 S3 product page"
          url: "https://sunrise-ai.com/products/s3-product"
        - title: "sunrise-ai.com homepage"
          url: "https://sunrise-ai.com/"

    - group: s2_memory_type_correction
      confidence: high
      basis: absence_of_vendor_statement
      corrects_preexisting_repo_error: true
      facts:
        memory_capacity_gb: 64
        memory_type: not_disclosed
        prior_repo_value: "likely HBM2e or HBM3 via CoWoS"
        correction_note: >
          CoWoS packaging is an inference basis, not a vendor statement. The vendor has
          never named S2's memory type. Do not back-fill LPDDR6 (an S3-only disclosure)
          onto S2 either.
      sources:
        - title: "曦望 S2 product page (no memory type stated)"
          url: "https://sunrise-ai.com/products/s2-product"

    - group: s3_precision_and_performance_claims
      confidence: high
      basis: vendor_stated_primary_product_page
      facts:
        precisions: ["FP32", "FP16", "FP8", "INT8", "FP4"]
        bf16_note: >
          BF16 is NOT on the vendor's S3 precision list. The baseline's "BF16 inferred"
          should be dropped rather than carried forward.
        peak_fp4: "'P 级' (petaFLOPS-class) — no TFLOPS figure published"
        peak_any_format: not_disclosed
        operator_efficiency_gemm: "~99%"
        operator_efficiency_flashattention: "~98%"
        operator_efficiency_provenance: "仿真实测 — SIMULATION-measured, not silicon measurement"
        single_chip_perf_vs_s2_current: "'5X 单芯片性能提升' (company claim)"
        single_chip_perf_vs_s2_dec2025: "推理性能 x3 倍+ (company claim; matches the repo baseline's +300%)"
        claim_inflation_note: >
          The vendor raised its own claim between the 2025-12-11 snapshot and the current
          site. Record the change and its date; do not record either number as a fact.
        per_token_cost_vs_s2: "-90% (company claim, unchanged since Dec 2025)"
      sources:
        - title: "曦望 S3 product page"
          url: "https://sunrise-ai.com/products/s3-product"
        - title: "Wayback snapshot 2025-12-11 sunrise-ai.com"
          url: "http://web.archive.org/web/20251211220612id_/https://sunrise-ai.com/"

    - group: scale_up_interconnect_srlink
      confidence: medium-high
      basis: vendor_stated_s2_page
      facts:
        name: "SRLink"
        description: "自研 SRLink 等高速互联技术 — proprietary scale-up across cards and nodes"
        applies_to: "S2 (vendor-stated); carry-forward to S3 NOT confirmed"
        bandwidth: not_disclosed
        topology: not_disclosed
        prior_repo_value: "Scale-up interconnect: Not public"
      sources:
        - title: "曦望 S2 product page"
          url: "https://sunrise-ai.com/products/s2-product"

    - group: sc3_256_superpod
      confidence: medium-high
      basis: vendor_stated_primary_product_page
      facts:
        name: "寰望 SC3-256 超节点 / Rise SC3-256 SuperPOD"
        base_chip: S3
        cooling: liquid
        serving_architecture: "PD-disaggregated (prefill/decode separation) + large Expert Parallel (EP)"
        target_workload: "万亿乃至更大参数量 multimodal MoE (trillion-parameter and larger)"
        chip_count: not_stated_by_vendor
        chip_count_note: >
          "256" appears only in the product name. Do NOT record "256 S3 chips" as a
          specification — that is inference from branding.
        link_technology: not_disclosed
        vendor_claims:
          tco: "down an order of magnitude at equal performance"
          comms_latency: "down an order of magnitude"
          throughput: ">20x advantage (footnoted 数据来源于曦望实验室 — vendor lab data)"
        first_appearance: "present in site navigation as a placeholder link by 2026-05-21; full page by 2026-08"
      sources:
        - title: "曦望 S3 product page"
          url: "https://sunrise-ai.com/products/s3-product"
        - title: "Wayback snapshot 2026-05-21 sunrise-ai.com"
          url: "http://web.archive.org/web/20260521020029id_/https://sunrise-ai.com/"

    - group: compiler_visible_microarchitecture
      confidence: high
      basis: open_source_inspection_flagtree_sunrise_backend
      note: >
        First third-party-inspectable architecture evidence for this chip. Describes what
        the open Triton path exposes — a lower bound on hardware capability, not a spec.
      facts:
        llvm_triple_s2: "stcu-unknown-tang"
        llvm_triple_s3: "stcuv2"
        s3_libdevice: "separate *_S3.bc bitcode (source comment: libdivice库,需要区分S2/S3)"
        warp_size: 32
        default_num_warps: 4
        default_num_stages: 3
        supported_fp8_dtypes: ["fp8e5 (E5M2)"]
        min_dot_size_int8: "(8, 8, 16)"
        min_dot_size_other: "(8, 8, 4)"
        dot_input_precision: "ieee only"
        device_math_library: "OCML-based (__ocml_* entry points, AMD-style)"
        object_bundling: "clang-offload-bundler under /usr/local/tangrt/toolchains/llvm/prebuilt/linux-<arch>/"
        interpretation: >
          32-wide warps and ieee-only dot precision suggest an NVIDIA-style SIMT machine
          despite the AMD-derived OCML math library. The INT8 min_dot_size K-depth of 16
          versus 4 otherwise implies a matrix unit packing 4 INT8 operands per FP32-width
          lane. INTERPRETATION from compiler constants, not a vendor statement.
      sources:
        - title: "FlagTree sunrise backend/compiler.py"
          url: "https://raw.githubusercontent.com/FlagTree/flagtree/main/third_party/sunrise/backend/compiler.py"
        - title: "FlagTree sunrise backend/driver.py"
          url: "https://raw.githubusercontent.com/FlagTree/flagtree/main/third_party/sunrise/backend/driver.py"
        - title: "FlagTree sunrise language/tang/libdevice.py"
          url: "https://raw.githubusercontent.com/FlagTree/flagtree/main/third_party/sunrise/language/tang/libdevice.py"

    - group: form_factors_and_systems
      confidence: medium-high
      basis: vendor_stated_s2_page
      facts:
        s2_cards:
          - "智望 S2-X1 (PCIe FHFL)"
          - "智望 S2-M1 (OAM module) — NEW to this repo"
        servers_chenwang: ["A4-2N1", "A4-2N2", "N8-2G1", "N8-2G2", "A16-2G1"]
        a16_2g1_claim: >
          16-card server claimed to run full DeepSeek in a single node using a
          计算感知通信拓扑 (compute-aware communication topology), claimed +400% vs
          general-purpose platforms — UNVERIFIED company claim.
        s2_positioning_2026: "inference + fine-tuning GPGPU (大模型推理 GPU), no longer marketed as a training part"
        product_families:
          gpus: "启望 (Qiwang) S1/S2/S3"
          cards: "智望 (Zhiwang)"
          servers: "辰望 (Chenwang), incl. AI-agent all-in-one appliance"
          supernodes: "寰望 (Huanwang)"
          workstations: "熙望 (Xiwang)"
          software: "SIRE"
      sources:
        - title: "曦望 S2 product page"
          url: "https://sunrise-ai.com/products/s2-product"
        - title: "sunrise-ai.com homepage"
          url: "https://sunrise-ai.com/"

    - group: status_and_schedule
      confidence: medium
      basis: mixed_vendor_stated_and_unverified_executive_statement
      facts:
        s2_status: "volume production — 已实现规模化量产, 万片级量产 (10,000-unit class; company claim)"
        s3_status: "announced only — no public evidence of tape-out, sampling or shipment"
        s3_vendor_page_schedule: none_published
        executive_statement:
          attributed_to: "co-CEO 王勇"
          date: "2026-01-28"
          content: "S3 R&D complete; tape-out planned mid-2026; mass production by end-2026; S4 high-performance chip 2027; S5 security chip 2028"
          verification: >
            NOT independently verified — WeChat source pages are access-gated. No source
            dated after April 2026 confirms the mid-2026 tape-out occurred. Roadmap-grade
            only; do not upgrade S3 beyond "announced".
      sources:
        - title: "曦望 S3 product page (no schedule or status published)"
          url: "https://sunrise-ai.com/products/s3-product"

    - group: funding_correction
      confidence: medium-high
      basis: vendor_news_index_plus_source_title_reread
      corrects_preexisting_repo_error: true
      facts:
        prior_repo_value: "~RMB 30 billion (~US$4.1B) cumulative"
        corrected_value: "≈RMB 3 billion (~US$0.4B) cumulative as of January 2026"
