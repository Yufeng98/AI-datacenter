update_2026_08_08:
  window: "2026-04-27 to 2026-08-08"
  headline: >
    One substantive software-stack change: Compute Engine now natively supports TPU
    provisioning (GA 2026-06-01). No libtpu or JAX version entries in the Cloud TPU
    release notes for May-August 2026. TPU v8 is not yet in the supported-version list.

  fact_groups:

    - id: compute-engine-native-tpu
      layer: Runtime
      date: "2026-06-01"
      release_stage: GA
      confidence: confirmed
      facts:
        capability: "TPU VMs and TPU slices provisionable and manageable through standard Compute Engine instance and managed-instance-group APIs"
        custom_os_image: true
        boot_disk_sizing: true
        consumption_options: [on-demand, spot, reservation]
        scope: "control plane / provisioning only"
        affects_compiled_execution_path: false
        affects_libtpu: false
      significance: >
        Control-plane convergence with the rest of Compute Engine. TPU fleets stop being a
        bespoke resource type reached through TPU-specific APIs and become ordinary GCE
        instances, inheriting MIG autohealing/autoscaling, image management, and disk config.
        Sits strictly above libtpu.so; JAX -> StableHLO -> Shardy -> HLO -> LLO -> VLIW unchanged.
      sources:
        - title: "Cloud TPU release notes (retrieved 2026-08-08)"
          url: "https://docs.cloud.google.com/tpu/docs/release-notes"

    - id: tpu-ai-zones
      layer: Runtime
      date: "2026-04-27"
      release_stage: GA
      confidence: confirmed
      facts:
        capability: "Cloud TPU now offers TPU availability in AI zones"
      significance: "Additive, low-value; same date as the prior refresh baseline."
      sources:
        - title: "Cloud TPU release notes (retrieved 2026-08-08)"
          url: "https://docs.cloud.google.com/tpu/docs/release-notes"

    - id: v8-software-support-status
      layer: Runtime
      confidence: confirmed
      facts:
        v8_in_cloud_tpu_supported_version_list: false
        newest_generation_in_supported_version_list: "TPU7x (Ironwood)"
        v8_runtime_libtpu_jax_compatibility_entry: "none published"
        only_preview_named_in_v8_deep_dive: "native PyTorch support on TPU (software preview, not a silicon preview)"
      sources:
        - title: "Cloud TPU system architecture / supported versions (retrieved 2026-08-08)"
          url: "https://docs.cloud.google.com/tpu/docs/system-architecture-tpu-vm"
        - title: "TPU 8t and TPU 8i technical deep dive — Google Cloud Blog (2026-04-22)"
          url: "https://cloud.google.com/blog/products/compute/tpu-8t-and-tpu-8i-technical-deep-dive"

  not_disclosed:
    - "No libtpu version entries in the Cloud TPU release notes for May-August 2026"
    - "No JAX version entries in the Cloud TPU release notes for May-August 2026"
    - "No v8 runtime / libtpu / JAX compatibility matrix entry"
    - "No Shardy, Pallas/Mosaic, Tokamax, MaxText, or vLLM-TPU changes surfaced in the window"
