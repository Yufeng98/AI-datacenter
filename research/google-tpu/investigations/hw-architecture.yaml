layer_mappings:
  - layer: Compute Engine
    confidence: confirmed
    summary: >
      TPU compute is organized around TensorCores containing MXU systolic arrays and VPUs.
      MXU is weight-stationary: weights are loaded into systolic cells and held while
      activations stream through rows. MACs/cycle: 16,384 (128x128, v4/v5) or 65,536
      (256x256, v6e/v7). TPU v7 Ironwood has 2 TensorCores per chip = 131,072 MACs/chip.
      FP8 hardware support added in v7. SparseCore (4 per v7 chip) accelerates embedding
      table lookups for recommendation systems.
    key_specs:
      mxu_array_sizes: ["128x128 (v4/v5e/v5p)", "256x256 (v6e/v7)"]
      macs_per_cycle: [16384, 65536]
      tensorcore_per_chip: {v4_v5: 1, v7: 2}
      sparsecore_per_chip: {v4: 1, v6e: 2, v7: 4}
      data_types_v7: [FP8, BF16, FP16, INT8, FP32 accumulation]
      peak_tflops_fp8_v7: 4614
    sources:
      - title: "TPU v7 (Ironwood) Documentation"
        url: "https://docs.cloud.google.com/tpu/docs/tpu7x"
      - title: "Inside the Ironwood TPU Codesigned AI Stack"
        url: "https://cloud.google.com/blog/products/compute/inside-the-ironwood-tpu-codesigned-ai-stack"
      - title: "Google TPU Architecture: 7 Generations Explained"
        url: "https://introl.com/blog/google-tpu-architecture-complete-guide-7-generations"

  - layer: Data Path
    confidence: confirmed
    summary: >
      TPU uses a VLIW (Very Long Instruction Word) execution model with 8-op/cycle instruction
      packets. All scheduling is static (compiler-determined); no dynamic branch prediction,
      out-of-order execution, or warp schedulers. Functional units (MXU, VPU, DMA read, DMA
      write, scalar ALU, scalar LD/ST) are independently slotted per VLIW packet. Weight-
      stationary dataflow: HBM → VMEM (DMA, overlapped with compute via double-buffering) →
      MXU (weights stationary, activations stream through rows) → VMEM → HBM.
    key_specs:
      execution_model: VLIW
      vliw_ops_per_cycle: 8
      functional_units: [MXU, VPU, DMA-read, DMA-write, scalar-ALU, scalar-LD/ST]
      dataflow: weight-stationary systolic
      scheduling: static (compiler-determined)
    sources:
      - title: "TPU Architecture Overview — Google Cloud Documentation"
        url: "https://docs.cloud.google.com/tpu/docs/system-architecture-tpu-vm"
      - title: "TPU v4 Whitepaper — arXiv:2304.01433"
        url: "https://arxiv.org/abs/2304.01433"
      - title: "From JAX to VLIW: Tracing a Computation Through the TPU Compiler Stack"
        url: "https://patricktoulme.substack.com/p/from-jax-to-vliw-tracing-a-computation"

  - layer: On-chip Memory
    confidence: confirmed
    summary: >
      Per-TensorCore VMEM (vector scratchpad SRAM): ~16 MB (v4/v5), ~32 MB (v6e), increased
      on v7. Compiler-managed, not hardware-cached. CMEM (scalar memory): small fast SRAM for
      loop counters, DMA descriptors, small LUTs. No L1/L2 cache hierarchy — all memory
      management is explicit and compiler-driven. VMEM is the dominant performance bottleneck:
      workloads that spill from VMEM to HBM lose ~100x effective bandwidth.
    key_specs:
      vmem_per_tensorcore_MB: {v4_v5: 16, v6e: 32, v7: ">32"}
      management: explicit (compiler-managed)
      cache_hierarchy: none
      cmem_purpose: [loop counters, DMA metadata, scalar LUTs, ICI control registers]
    sources:
      - title: "TPU Architecture Overview — Google Cloud Documentation"
        url: "https://docs.cloud.google.com/tpu/docs/system-architecture-tpu-vm"
      - title: "Pallas Memory Hierarchy Guide"
        url: "https://docs.jax.dev/en/latest/pallas/tpu/details.html"
      - title: "Writing TPU kernels with Pallas — JAX Documentation"
        url: "https://docs.jax.dev/en/latest/pallas/tpu/details.html"

  - layer: Off-chip Memory
    confidence: confirmed
    summary: >
      HBM stacks provide the main off-chip memory. Capacity has grown from 16 GB (v5e) through
      95 GB (v5p), 144 GB (v6e), to 192 GB HBM3e (v7 Ironwood, 8 stacks, 7.4 TB/s).
      v7 Ironwood superpod (9,216 chips): 1.77 PB total HBM. Weight-stationary design reduces
      weight read amplification; inference KV caches and large model parameters are the primary
      drivers of HBM capacity requirements.
    key_specs:
      v5e: {gen: HBM2e, GB: 16, GBps: 819}
      v5p: {gen: HBM2e, GB: 95, GBps: 2765}
      v6e: {gen: HBM3, GB: 144, TBps: 1.6}
      v7: {gen: HBM3e, GB: 192, TBps: 7.4, stacks: 8}
      v7_superpod: {chips: 9216, total_PB: 1.77}
    sources:
      - title: "TPU v7 (Ironwood) Documentation"
        url: "https://docs.cloud.google.com/tpu/docs/tpu7x"
      - title: "TPU v5p Documentation"
        url: "https://docs.cloud.google.com/tpu/docs/v5p"
      - title: "TPU v6e Documentation"
        url: "https://docs.cloud.google.com/tpu/docs/v6e"
      - title: "Tensor Processing Unit — Wikipedia"
        url: "https://en.wikipedia.org/wiki/Tensor_Processing_Unit"

  - layer: "Host Interface / Package"
    confidence: confirmed
    summary: >
      TPU VM architecture: user Python/JAX code runs on a host VM co-located with the TPU
      on the same board. libtpu.so (XLA compiler + TPU driver + ICI runtime) manages all
      host-to-TPU communication. PCIe Gen 4 x16 (~64 GB/s) is the host-to-HBM transfer
      path, used for model parameter loading at initialization. Runtime inference/training
      operates entirely from HBM without returning to the host.
    key_specs:
      host_interface: PCIe Gen 4 x16
      pcie_bw_GBps: 64
      libtpu_components: [XLA compiler, TPU kernel driver, ICI runtime, HBM memory manager]
      vm_architecture: TPU VM (co-located host CPU on TPU board)
    sources:
      - title: "TPU VM System Architecture"
        url: "https://docs.cloud.google.com/tpu/docs/system-architecture-tpu-vm"
      - title: "libtpu PyPI"
        url: "https://pypi.org/project/libtpu/"

  - layer: Scale-up Interconnect
    confidence: confirmed
    summary: >
      ICI (Inter-Chip Interconnect) is Google's proprietary intra-pod chip-to-chip fabric.
      v5p: 4,800 Gbps/chip 3D torus, 8,960 chips. v7 Ironwood: 9,600 Gbps/chip (1.2 TB/s)
      3D torus, 9,216 chips in 4x4x4 cube racks (copper DAC intra-cube, optical inter-cube).
      TPU v4 introduced OCS (optical circuit switches, 136x136 MEMS) for reconfigurable
      3D torus topology, 40% power reduction vs electrical switches, enabling twisted torus
      for 70% higher bisection bandwidth on certain collective patterns.
    key_specs:
      v4: {topology: "3D torus + OCS", bw_Gbps: 600, max_chips: 4096}
      v5p: {topology: "3D torus", bw_Gbps: 4800, max_chips: 8960}
      v6e: {topology: "2D torus", max_chips: 256}
      v7: {topology: "3D torus", bw_Gbps: 9600, bw_TBps: 1.2, max_chips: 9216, links_per_chip: 4}
      ocs_ports: 136
      cube_size: "4x4x4 (64 chips)"
      intra_cube_medium: copper DAC
      inter_cube_medium: optical fiber
    sources:
      - title: "TPU v5p Documentation"
        url: "https://docs.cloud.google.com/tpu/docs/v5p"
      - title: "TPU v7 Ironwood Documentation"
        url: "https://docs.cloud.google.com/tpu/docs/tpu7x"
      - title: "TPU v4 Whitepaper — arXiv:2304.01433"
        url: "https://arxiv.org/abs/2304.01433"
      - title: "OCS Architecture — FiberMall"
        url: "https://www.fibermall.com/blog/unveiling-google-tpu-architecture.htm"

  - layer: Scale-out Interconnect
    confidence: confirmed
    summary: >
      Multislice enables multi-pod training beyond a single ICI pod via datacenter network
      (DCN). Up to 16 ICI pods per DCN aggregation block; 4 aggregation blocks support up to
      147,456 chips (v7 scale). Titanium IPUs (Google in-house SmartNIC/IPU) offload DCN
      AllReduce and RDMA operations, eliminating host CPU involvement in inter-pod gradient
      synchronization. The AI Hypercomputer abstraction presents TPU pods + Titanium IPUs
      + GCS as unified programmable infrastructure.
    key_specs:
      multislice_max_pods: 16
      max_total_chips: 147456
      inter_pod_network: DCN (datacenter network)
      offload_asic: Titanium IPU
      titanium_functions: [DCN AllReduce, RDMA, SDN management]
    sources:
      - title: "Multislice Training — Google Cloud Documentation"
        url: "https://docs.cloud.google.com/tpu/docs/v5e-training"
      - title: "AI Hypercomputer Overview — Google Cloud Blog"
        url: "https://cloud.google.com/blog/products/compute/updates-to-ai-hypercomputer-software-stack/"
      - title: "Introducing Trillium — Google Cloud Blog"
        url: "https://cloud.google.com/blog/products/compute/introducing-trillium-6th-gen-tpus"

key_abstractions:
  - name: MXU (Matrix Multiply Unit)
    description: >
      The weight-stationary systolic array at the heart of every TPU. Weights are loaded into
      systolic cells and held stationary; activations stream through rows. MACs/cycle: 16,384
      (128x128, v4/v5) or 65,536 (256x256, v6e+). The MXU's tile dimensions directly constrain
      XLA's GEMM tiling strategy — tiles must align to MXU width to avoid padding overhead.
      The 128x128 → 256x256 transition in v6e forced XLA recompilation for all existing models.
    layers_involved: [Compute Engine, Data Path]

  - name: TensorCore (Google)
    description: >
      Google's full processing die unit within a TPU chip (distinct from NVIDIA Tensor Core).
      Each TensorCore contains: MXU, VPU, ScalarCore, VMEM, and CMEM. TPU v7 Ironwood has
      2 TensorCores per chip, enabling parallel matrix pipeline execution. Not to be confused
      with NVIDIA's Tensor Core (a functional unit within an SM).
    layers_involved: [Compute Engine, On-chip Memory]

  - name: VMEM (Vector Memory)
    description: >
      Per-TensorCore SRAM scratchpad; the only explicitly managed on-chip memory tier.
      No hardware cache: all data movement to/from VMEM is compiler-scheduled via DMA.
      Capacity: ~16–32 MB (current gen). The primary performance bottleneck — workloads
      that exceed VMEM capacity suffer catastrophic HBM spills. XLA's operator fusion pass
      exists specifically to keep intermediate tensors in VMEM.
    layers_involved: [On-chip Memory, Data Path]

  - name: ICI (Inter-Chip Interconnect)
    description: >
      Google's proprietary intra-pod chip-to-chip fabric. Implements 3D torus (v4/v5p/v7)
      or 2D torus (v5e/v6e) topology. v7: 9,600 Gbps/chip, 9,216-chip pod. Carries XLA
      collective communication (AllReduce, AllGather, AllToAll). On v4, powered by OCS
      optical circuit switches for topology reconfigurability.
    layers_involved: [Scale-up Interconnect]

  - name: SparseCore
    description: >
      A dedicated on-chip accelerator for sparse embedding table lookups (gather/scatter).
      Addresses the fundamental mismatch between the MXU's dense systolic dataflow and
      the irregular, random-access patterns of embedding lookups in recommendation systems.
      v7 Ironwood has 4 SparseCores per chip, supporting financial and scientific sparse
      workloads in addition to traditional recommendation systems.
    layers_involved: [Compute Engine]

  - name: OCS (Optical Circuit Switch)
    description: >
      MEMS-based optical switches used in TPU v4 to implement the 3D torus ICI topology.
      Each OCS is 136×136 ports (128 active + 8 spare). OCS reconfigurability enables
      different 3D torus logical shapes from the same physical hardware, and twisted torus
      configurations that improve bisection bandwidth. ~40% power reduction vs electrical
      switching equivalents.
    layers_involved: [Scale-up Interconnect]

