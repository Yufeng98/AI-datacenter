figures_provenance: vendor-claimed peaks (Untether product materials, Hot Chips 2022) except mlperf block

key_innovation: >
  Processing elements embedded directly inside SRAM banks.
  512 PEs per bank read from their own local SRAM — no data movement
  to/from external memory hierarchy for multiply-accumulate operations.
  Targeted the memory wall that causes ~90% of GPU AI inference energy waste.

post_mortem: >
  Architecture assumed the working set fits in 238 MB of on-chip SRAM — true for CNN inference, false for
  LLM weights, where the LPDDR5 fallback (<=32 GB) sits far below the ~1 PB/s in-bank bandwidth that was
  the entire advantage. Matches the trustee's stated cause: "a late pivot to generative AI markets
  resulting in lost opportunities." Failure was workload-market mismatch, not silicon defect.

timeline:
  - 2018: Founded, Toronto
  - 2020: runAI200 announced
  - 2022-08: speedAI240 (Boqueria) at Hot Chips 2022
  - 2023: imAIgine SDK bare-metal kernel support
  - 2024: speedAI240 Slim shipped; MLPerf submission
  - 2025-03: imAIgine SDK v25.04 generative compiler (300+ models) — final release
  - 2025-06: 'AMD Transaction — AMD paid US$25M for exclusive employment-negotiation rights only (no IP, products, or silicon); speedAI products and imAIgine SDK discontinued; secured debt repaid in full'
  - 2025-06-17: 'National Bank of Canada patent security interest released (USPTO)'
  - 2025-10-15: 'assignment in bankruptcy filed (BIA, Ontario Estate No. 31-3285414; PwC Inc. trustee); zero employees'
  - 2025-10-31: "first meeting of creditors; trustee's preliminary report (latest public filing)"
  - 2026-03-31: 'US12591633B2 granted — portfolio still owned and prosecuted by the estate'
  - 2026-08-08: 'no USPTO reassignment; no IP sale publicly confirmed; untether.ai offline'
