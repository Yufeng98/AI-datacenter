chip: nextsilicon-maverick
as_of: "2026-08-08"
device_class: "Reconfigurable Dataflow Accelerator (runtime-JIT spatial grid; HPC-first)"
investigation: hw-architecture

vendor:
  name: "NextSilicon Ltd"
  country: Israel
  founded: 2017
  funding_raised_usd_m: 303          # "~$303M over 8 years", third-party reported
  launch_date: "2025-10-22"
  maturity: "shipping — limited deployment (1 named supercomputer + 1 EU evaluation)"
  confidence: confirmed
  sources:
    - https://www.businesswire.com/news/home/20251022712360/en/
    - https://www.nextplatform.com/compute/2025/10/22/nextsilicon-takes-aim-at-cpus-and-gpus-with-maverick-2-dataflow-engine/1639749

# ── Scope flag ────────────────────────────────────────────────────────────────
scope:
  is_ai_accelerator: false
  rationale: >
    Datacenter-class hardware (OAM, 750 W, HBM3E, PCIe Gen5, deployed in a DOE/NNSA supercomputer)
    but HPC-first. Published peak table lists FP64/FP32/FP16 only; FP32 and FP16 have identical
    scalar/vector throughput, i.e. no low-precision multiplier. No BF16/FP8/INT8/sparsity figure
    anywhere public. No MLPerf, no LLM result, no shipping framework integration.
  confidence: confirmed
  sources:
    - https://image.nextplatform.com/214601.webp?imageId=214601&width=1412&height=1200&format=jpg
    - https://www.nextsilicon.com/maverick
    - https://chipsandcheese.com/p/nextsilicon-putting-hpc-first

