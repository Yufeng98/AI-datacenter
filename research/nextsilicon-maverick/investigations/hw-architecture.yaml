# ── Explicitly not disclosed (recorded so future passes do not invent them) ───
not_disclosed:
  - "Die area (mm2). No vendor page, spec table, PR, TNP, Chips and Cheese or Hackaday source states one."
  - "ALUs per compute block; total ALU count per die or package."
  - "FPUs per compute block; whether every ALU has an associated FPU."
  - "Per-compute-block / per-tile SRAM capacity (only the 128/256 MB aggregate is public)."
  - "Reservation station capacity and organization."
  - "Coherence domain and protocol of the 128/256 MB cache level."
  - "NoC topology, link width, per-link and bisection bandwidth, cross-barrier latency penalty."
  - "Die-to-die interconnect technology, width, bandwidth, latency, and coherence on the OAM."
  - "Number of HBM3E stacks and per-stack configuration."
  - "Whether any scale-up chip-to-chip fabric exists beyond PCIe Gen5 x16 and on-package 100 GbE."
  - "BF16, FP8, INT8, INT4 and structured-sparsity support — absent from the published table; no source states whether the hardware supports them at all."
  - "Mill core capacity limits, maximum graph size, and measured reconfiguration latency."
  - "Thread/context capacity (Kokkos concurrency() = 65536 is a FIXME placeholder)."
  - "E-core microarchitecture: pipeline, ISA extensions, clock, cache."
  - "Grid configuration encoding — no published ISA, bitstream format, or configuration-word spec."
  - "Spectra host CPU, node interconnect, storage, system software stack, total system power."
  - "Maverick-2 unit shipment volumes; identity of any customer beyond Sandia and ODISSEE."
  - "Arbel vector-unit configuration (unresolved 3x256-bit vs 4x128-bit conflict) and production process node."
  - "Maverick-3 or any successor — no roadmap part is named in any retrieved source."
