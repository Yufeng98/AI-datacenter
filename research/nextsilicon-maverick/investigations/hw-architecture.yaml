# ── Peak performance (vendor spec table, verbatim) ────────────────────────────
peak_performance:
  note: >
    Transcribed verbatim from NextSilicon's own spec table as reproduced by The Next Platform.
    This figure set is NOT on the vendor's own web page — the third-party reproduction is the only
    public source for peak FLOPS.
  single_die:
    fp64_scalar_vector_tflops: 10.8
    fp64_matrix_tensor_tflops: 20.2
    fp32_scalar_vector_tflops: 20.3
    fp32_matrix_tensor_tflops: 28.2
    fp16_scalar_vector_tflops: 20.3
    fp16_matrix_tensor_tflops: 28.2
  dual_die_oam:
    fp64_scalar_vector_tflops: 21.6
    fp64_matrix_tensor_tflops: 40.3
    fp32_scalar_vector_tflops: 40.7
    fp32_matrix_tensor_tflops: 56.1
    fp16_scalar_vector_tflops: 40.7
    fp16_matrix_tensor_tflops: 56.4
  bf16: "not disclosed — absent from the published table"
  fp8: "not disclosed — absent from the published table"
  int8: "not disclosed — absent from the published table"
  int4: "not disclosed — absent from the published table"
  structured_sparsity: "not disclosed — absent from the published table"
  matrix_unit_mechanism: "not disclosed — no source explains how the grid is configured as a matrix/tensor unit"
  confidence: confirmed
  sources:
    - https://image.nextplatform.com/214601.webp?imageId=214601&width=1412&height=1200&format=jpg

# ── Compute engine ────────────────────────────────────────────────────────────
compute_engine:
  paradigm: "non-von-Neumann spatial dataflow ('Intelligent Compute Architecture', ICA)"
  instruction_stream: "none on the grid — no branch predictor, no speculation, no prediction"
  confidence: confirmed
  sources:
    - https://chipsandcheese.com/p/nextsilicon-putting-hpc-first
    - https://www.nextplatform.com/compute/2025/10/22/nextsilicon-takes-aim-at-cpus-and-gpus-with-maverick-2-dataflow-engine/1639749

  grid_organization:
    compute_regions_per_die: 4
    compute_blocks_per_region: 56       # 7 columns x 8 blocks
    compute_blocks_per_die: 224
    alus_per_compute_block: "not disclosed — 'hundreds of interlinked ALUs' (vendor); TNP states NextSilicon is not releasing the number"
    total_alus_per_die: "not disclosed"
    fpus_per_compute_block: "not disclosed"
    riscv_e_core_placement: "32 per die, on the left and right outside edges"
    confidence: likely
    note: >
      The 224 / 4-region / 7x8 counts are The Next Platform's own count from the vendor die shot,
      not a vendor disclosure. TNP's ~196 ALUs/block and 'tens of thousands to close to a hundred
      thousand ALUs' totals are explicitly third-party estimates from an illustration — NOT recorded
      here as specs.
    sources:
      - https://www.nextplatform.com/compute/2025/10/22/nextsilicon-takes-aim-at-cpus-and-gpus-with-maverick-2-dataflow-engine/1639749
      - https://image.nextplatform.com/214596.webp?imageId=214596&width=1412&height=1230&format=jpg

  compute_block_microarchitecture:
    units:
      - name: Dispatcher
        function: "Triggers computation after verifying the arrival of all data (dataflow firing rule)"
      - name: Reservation Station
        function: "Analogous to the general-purpose register state of instruction set processors"
        capacity: "not disclosed"
      - name: MMU / TLB
        function: "Translate virtual addresses for local memory operations (per compute block — translation is distributed)"
      - name: MEP (Memory Entry Point)
        function: "Contained on compute blocks; acts like memory access instructions"
    architected_register_file: "none — the reservation station plays that role"
    patented_combination: "reservation station + dispatcher + dataflow compute block"
    confidence: confirmed
    sources:
      - https://image.nextplatform.com/214597.webp?imageId=214597&width=1412&height=978&format=jpg
      - https://www.nextplatform.com/compute/2025/10/22/nextsilicon-takes-aim-at-cpus-and-gpus-with-maverick-2-dataflow-engine/1639749

  mill_core:
    definition: >
      NOT a physical core. A software-defined, dynamically instantiated projection of a compiled
      dataflow subgraph onto ALUs. Many mill cores can be laid down on the same compute block
      'Tetris style' and loaded/deleted as needed. The vendor FAQ calls it a 'software-defined core'.
    per_block_capacity: "not disclosed"
    max_graph_size: "not disclosed"
    reconfiguration_latency: "vendor claims 'nanoseconds' — marketing claim, not measured publicly"
    confidence: confirmed
    sources:
      - https://www.nextplatform.com/compute/2025/10/22/nextsilicon-takes-aim-at-cpus-and-gpus-with-maverick-2-dataflow-engine/1639749
      - https://www.nextsilicon.com/faq

  threading:
    vendor_claim: "a mill core can support hundreds of threads at once (CTO Ilan Tayari)"
    mechanism: >
      Patent US11875153B1: on an 'inconsistent-latency operation' a thread's runtime context is
      spilled into a context storage table (rows x columns) so the logical elements can be reused
      immediately by another thread; the first thread resumes later. Dataflow analogue of GPU warp
      switching.
    total_thread_capacity: "not disclosed"
    kokkos_concurrency_value: 65536
    kokkos_concurrency_note: "marked FIXME placeholder in the Kokkos source — NOT a hardware spec"
    confidence: unconfirmed
    note: "Patent disclosure is not confirmed as shipping in Maverick-2 silicon."
    sources:
      - https://patents.google.com/patent/US11875153B1/en
      - https://github.com/kokkos/kokkos/tree/develop/core/src/NextSilicon

  fallback_tiers:
    tier_1: "dataflow grid (compute blocks)"
    tier_2: "32 (64 dual-die) on-die RISC-V E-cores"
    tier_3: "external x86 host CPU"
    vendor_offload_claim: "~80% of instruction runtime offloaded to the Maverick ALU blocks"
    e_core_microarchitecture: "not disclosed — described only as Arbel-lineage control processors"
    confidence: confirmed
    sources:
      - https://image.nextplatform.com/214600.webp?imageId=214600&width=1412&height=598&format=jpg
      - https://www.nextplatform.com/compute/2025/10/22/nextsilicon-takes-aim-at-cpus-and-gpus-with-maverick-2-dataflow-engine/1639749

# ── Memory hierarchy ──────────────────────────────────────────────────────────
memory_hierarchy:
  reservation_station:
    capacity: "not disclosed"
    management: "hardware, dataflow-triggered"
    confidence: confirmed

  tile_local_sram:
    capacity: "not disclosed individually"
    management: "software-managed; explicit DMA between tiles; NOT cache coherent"
    ceo_quote: "'you need to do a DMA and move data around'; described as CUDA-shared-memory-like"
    confidence: confirmed
    sources:
      - https://chipsandcheese.com/p/nextsilicon-putting-hpc-first

  chip_level_cache:
    capacity_mb: {single_die: 128, dual_die: 256}
    management: "hardware cache; vendor product page labels the row 'Cache Coherence'"
    coherence_domain: "not disclosed"
    coherence_protocol: "not disclosed"
    tension_note: >
      Vendor labels this level coherent while the CEO states tile-local SRAM is not coherent. The
      boundary between the coherent and non-coherent regions is not publicly specified.
    confidence: likely
    sources:
      - https://image.nextplatform.com/214601.webp?imageId=214601&width=1412&height=1200&format=jpg
      - https://www.nextsilicon.com/maverick
      - https://patents.google.com/patent/US20190042427A1/en

  hbm:
    type: HBM3E
    capacity_gb: {single_die: 96, dual_die: 192}
    bandwidth_tbs: {single_die: 3.2, dual_die: 6.4}
    stacks: "not disclosed"
    per_stack_config: "not disclosed"
    confidence: confirmed

  unified_virtual_memory:
    model: "host and device share a single virtual address space"
    allocation: "NextSiliconSharedSpace::allocate is a plain std::aligned_alloc on the host heap — no explicit device allocation call exists"
    migration: "exception-based demand page migration by the 'NextSilicon UVM migration runtime'"
    page_sizes: ["4KiB", "16KiB", "64KiB", "256KiB", "1MiB", "4MiB", "16MiB", "64MiB", "256MiB", "1GiB", "4GiB", "16GiB"]
    page_size_selection: "chosen by the runtime from the alignment of the allocation"
    pinning_api: "nextapi_mem_migrate(ptr, size, NEXTAPI_PAGE_LOC_HOST, pin); PageLocation { Host, Device, Any }"
    known_hazard: "stack can be migrated to device — Kokkos clones the driver to prevent it"
    confidence: confirmed
    note: "Best primary evidence on this chip: code comments in a non-vendor-controlled upstream repository."
    sources:
      - https://github.com/kokkos/kokkos/blob/develop/core/src/NextSilicon/Kokkos_NextSiliconSpace.cpp
      - https://github.com/kokkos/kokkos/blob/develop/core/src/NextSilicon/Kokkos_NextSilicon_PageAlignedData.hpp

# ── Interconnect ──────────────────────────────────────────────────────────────
interconnect:
  on_chip_noc:
    type: "custom, non-uniform by design"
    barriers: "'NOC barriers' between tiles; crossing costs a latency (not throughput) penalty"
    penalty_magnitude: "not disclosed"
    topology: "not disclosed"
    link_width: "not disclosed"
    bisection_bandwidth: "not disclosed"
    design_implication: "locality is the explicit objective of the runtime optimizer's 'relocation' action"
    confidence: confirmed
    sources:
      - https://chipsandcheese.com/p/nextsilicon-putting-hpc-first

  die_to_die:
    present: true
    technology: "not disclosed"
    width: "not disclosed"
    bandwidth: "not disclosed"
    latency: "not disclosed"
    coherence: "not disclosed — no source states whether the two OAM dies present as one device or two"
    confidence: unconfirmed

  scale_up:
    proprietary_fabric: null
    note: "No NVLink/Infinity-Fabric analogue in any public source. Multi-device via PCIe Gen5 x16 plus network."
    confidence: confirmed

  scale_out:
    on_package_ethernet: "2 x 100 GbE (OAM) / 1 x 100 GbE (card) integrated on the device"
    other: "CEO mentions InfiniBand, Ethernet, RDMA at system level"
    partnership:
      partner: "Cornelis Networks"
      date: "2026-06-22"
      scope: "joint reference architectures with CN5000 400 Gbps; testing to extend to CN6000 800 Gbps in H2 2026"
      attachment_details: "not specified"
      confidence: confirmed
      sources:
        - https://www.nextsilicon.com/insights/cornelis-nextSilicon-to-build-joint-reference-architectures-for-ai-and-hpc/
    confidence: confirmed

# ── Host / package ────────────────────────────────────────────────────────────
host_interface:
  pcie: "PCI Express 5.0 x16 (both SKUs)"
  host_cpu: "External. NextSilicon's own Arbel RISC-V CPU is intended to fill this role eventually."
