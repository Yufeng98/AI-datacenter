    exists: false
    note: "The unit of work is parallel_for over an index range, not a tensor."
    confidence: confirmed

  compiler_ir:
    ir_stack: MLIR
    evidence:
      - "Kokkos_NextSilicon_Intrinsics.hpp declares __ns_immutable_thread_invariant_parameter_struct, documented as communicating 'to the MLIR compiler stack' that a struct is immutable and thread invariant 'for the full duration of the microtask'; body is a no-op 'to be filled in by NS toolchain'"
      - "NextSilicon compiler-engineer job posting advertises an 'innovative MLIR compiler team' contributing to upstream MLIR and LLVM"
    llvm_fork:
      repo: https://github.com/nextsilicon/llvm-project
      branches: 41
      active_through: "2026-08-01"
      branch_clusters:
        ir_import_metadata: [loop-info, loop-info-import, loop-info-refactor, parameter_attributes, more-param-attrs, parameter_attribute_import, access-group-attr, align-attribute, passthrough-import, llvm-typed-ptr, experimental-noalias-scope]
        scalar_opt_in_mlir: [mlir-mem2reg, mlir-mem2reg-memref, mlir-sroa]
        inlining: [inline-llvm-func, move-llvm-inliner, debug-llvm-inliner, inliner-interface, inline-alloca, inline-lifetime-intrinsics]
      interpretation: "importing LLVM IR into MLIR while preserving optimization-critical metadata, then running classical scalar optimization inside MLIR"
      interpretation_confidence: likely
      interpretation_note: "inferred from branch names — strong but circumstantial"
    lowering_to_grid: "proprietary and not disclosed"
    seed_correction:
      claim_rejected: "AIIR as a NextSilicon IR name"
      finding: >
        The mlir-to-aiir branch contains exactly two non-upstream commits, both by one developer, both
