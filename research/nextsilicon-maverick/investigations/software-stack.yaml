# ── Execution model (the distinguishing mechanism) ────────────────────────────
execution_model:
  name: "two-pass train-then-project (compile once, JIT the spatial mapping at run time)"
  primary_evidence: https://github.com/kokkos/kokkos/blob/develop/scripts/nextsilicon-test-wrapper.sh
  steps:
    - step: 1
      name: "AOT compile"
      detail: "one binary via nextcxx; no device object, no fat binary, no arch flag"
    - step: 2
      name: "training run"
      detail: "program executes ON THE HOST while nextsystemd collects telemetry"
      kokkos_quote: "NextSilicon kernels may run on the host during training/telemetry collection while still being 'within' the device execution space"
    - step: 3
      name: "optimization / projection"
      detail: "nextsystemd identifies hot flows, builds an optimized compute graph, projects it onto the grid as mill cores"
      observable_states: [IDLE, OPTIMIZING, IMPROVED]
      idle_meaning: "'no mills found' — nothing was worth accelerating"
      ci_budget: "up to 5 minutes wall clock"
    - step: 4
      name: "device run"
      detail: "re-execute; hot regions hand off to the grid"
    - step: 5
      name: "continuous re-optimization"
      detail: "telemetry keeps flowing and the mapping keeps changing; TNP: 'the longer the code runs, the better it gets'"
    - step: 6
      name: "persistent cache"
      detail: "projections cached under XDG_CACHE_HOME across runs, amortizing the training pass"
  telemetry_less_mode:
    exists: true
    config: "optimizer-pi: { enable-telemetry-less: true }"
    semantics: "static projection path; any projection error counts as a failure"
    status: "DISABLED in current upstream CI — 'FIXME_NEXTSILICON: re-enable when telemetry-less mode is working'"
    confidence: confirmed
  confidence: confirmed

telemetry:
  observable: "branch / logic-path execution counts — NOT conventional performance counters"
  vendor_framing: >
    Three-stage vendor flow figure: (1) SOFTWARE identify likely flow — a branch-likelihood histogram
    partitioned into GRID / RISC-V E-CORES / HOST CPU; (2) SOFTWARE generate optimized compute graph;
    (3) HARDWARE project compute graph onto grid; TELEMETRY arrow feeds (3) back to (2). Caption claims
    the software identifies the "top 1% of code flows" and reconfigures "in nanoseconds". Figure carries
    patent marking US16/053,382.
  corroboration:
    - "WO2019055675A1: telemetry tracks 'the number of times that each logic path has been taken' to identify 'likely compute paths'"
    - "US11995419B1: the GUI surfaces 'control flow branch counters'"
    - "Chips and Cheese: Raz frames the model as 'likely flows' vs 'unlikely flows'"
  sampling_rate: "not disclosed"
  record_format: "not disclosed"
  confidence: confirmed
  sources:
    - https://image.nextplatform.com/214600.webp?imageId=214600&width=1412&height=598&format=jpg
    - https://patents.google.com/patent/WO2019055675A1/en
    - https://patents.google.com/patent/US11995419B1/en

optimizer_actions:
  patent: US20190042282A1
  patent_note: "priority 2017-08-03, Elad Raz; app. US16/053,382 — the number printed on the vendor flow figure. Actions performed 'in real-time, simultaneous to the operation of the target computational device'."
  actions:
    - name: relocation
      detail: "two computation groups that often call each other are allocated topologically close to each other (this is what the non-uniform NoC penalty makes matter)"
    - name: duplication
      detail: "hot groups duplicated several times on the grid to speed up calculation and open bottlenecks"
    - name: in-lining
      detail: "two frequently-communicating groups fused into one logical group"
    - name: shrinking
      detail: "unused duplicates reconfigured out and their resources released"
    - name: host demotion
      detail: "a function not needed in an accelerator is relocated to be executed on a CPU"
  internal_algorithm: "not disclosed"
  confidence: confirmed
  note: "Patent disclosure corroborated by the vendor FAQ's description of 'relocating communicating cores and duplicating bottlenecked cores'."
  sources:
    - https://patents.google.com/patent/US20190042282A1/en
    - https://www.nextsilicon.com/faq

# ── Runtime semantics revealed by the open-source backend ─────────────────────
runtime_semantics:
  dispatch: "synchronous and blocking — NOT the async stream model of CUDA/HIP/SYCL"
  fence: "NextSilicon::fence() is a no-op — 'fence doesn't do anything in the OpenMP-style interface'"
  concurrency: "kernel launch takes a device mutex — 'Acquire the device for potential handoff before kernel execution begins'; one kernel at a time"
  functor_transfer: "copied into a 4 MB minimum heap buffer in shared space; driver cloned to prevent the stack from being migrated to device"
  host_device_predicate: >
    KOKKOS_IF_ON_HOST / KOKKOS_IF_ON_DEVICE cannot be resolved at compile time. A runtime thread-local
    is used: is_on_device() = __next_is_in_handed_off_code() || host_thread_is_on_device(). Source
    comment: "unlike other backends, NextSilicon kernels may run on the host during training/telemetry
    collection while still being 'within' the device execution space, so we cannot simply equate
    'on device' with 'offloaded to device'."
  limitations:
    - "printf from grid code does not work (guarded by !__next_is_in_handed_off_code(); ticket CS-515)"
    - "abort from grid code does not work (ticket CS-694)"
    - "fork() unsupported — Kokkos death-tests filtered out in CI"
    - "device-side cycle counters unavailable (clock_tic_device() unimplemented, PR #9378)"
  open_tickets_referenced: [CS-515, CS-611, CS-682, CS-694, CS-737, SW-25677]
  confidence: confirmed
  sources:
    - https://github.com/kokkos/kokkos/blob/develop/core/src/NextSilicon/Kokkos_NextSilicon_ThreadSpaceGuard.hpp
    - https://github.com/kokkos/kokkos/blob/develop/core/src/NextSilicon/Kokkos_NextSilicon_ParallelFor_Range.hpp
    - https://github.com/kokkos/kokkos/pull/9378

# ── Open vs proprietary ───────────────────────────────────────────────────────
openness:
  open_source:
    - "Kokkos NextSilicon backend (upstream; Apache-2.0 WITH LLVM-exception)"
    - "scripts/nextsilicon-test-wrapper.sh (documents the execution model)"
    - "nextsilicon/llvm-project MLIR fork (Apache-2.0 WITH LLVM-exception; staging for upstream)"
    - "nextsilicon/kokkos-kernels-public, kokkos-tools-public, kokkos-core-wiki"
    - "nextsilicon/ns-gem5 (BSD; RISC-V PMP / cache / prefetcher work — models the Arbel/E-core side, NOT the dataflow grid)"
  proprietary:
    - nextcxx
    - "MLIR -> grid lowering"
    - "projection / mapping algorithm"
    - libnextapi.so
    - nextsystemd
    - nextcli
    - "telemetry format and sampling rate"
    - "optimizer cache format"
    - "kernel driver"
    - "grid configuration encoding ('ISA')"
    - "Profiler / Chip Viewer / Projection Viewer"
    - "all SDK documentation (401-gated)"
  not_applicable_by_design:
    - "kernel language"
    - "kernel compiler for device code"
    - "graph capture"
    - "graph compiler"
    - "tensor API"
    - "collective communication library"
  github_org_note: "14 public repos, ALL forks. There is no first-party NextSilicon SDK repository."
  confidence: confirmed
  sources:
    - https://github.com/orgs/nextsilicon/repositories

