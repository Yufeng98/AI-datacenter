        All independent corroboration supports the product page only. Record C/C++/Fortran/OpenMP/Kokkos
        as shipping and everything else as roadmap. Chips and Cheese's 'compatible with CUDA and ROCm'
        is a podcast paraphrase that conflicts with the product page.
    confidence: confirmed
