chip: nextsilicon-maverick
as_of: "2026-08-08"
device_class: "Reconfigurable Dataflow Accelerator (runtime-JIT spatial grid; HPC-first)"
investigation: software-stack

headline: >
  The programming model IS the product. There is no kernel language, no device-side source dialect,
  and no kernel compiler for device code — that absence is the deliberate architectural choice, not a
  research gap. Vendor slogan: "BYOC — bring your own code"; the spec-table programming-model row
  reads "Any program."

evidence_note: >
  The SDK is gated (docs.nextsilicon.com returns HTTP 401, re-verified 2026-08-08) and the architecture
  whitepaper is "COMING SOON". Almost every concrete component name below comes from upstream Kokkos —
  a non-vendor-controlled repository where NextSilicon had to expose real interface names to get a
  backend merged. That is source code and CI config, not marketing copy.

layers:

  framework_integration:
    shipping: none
    roadmap: [CUDA, "HIP/ROCm", "leading AI frameworks"]
    roadmap_source_label: "vendor product page: 'upcoming integrations planned'"
    confidence: confirmed
    sources:
      - https://www.nextsilicon.com/maverick

  graph_capture:
    applicable: false
    note: "No graph capture — there is no ML graph in this programming model."
    confidence: confirmed

  graph_compiler:
