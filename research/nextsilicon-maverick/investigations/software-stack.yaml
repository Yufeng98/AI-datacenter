      - https://www.nextsilicon.com/careers/compiler-engineer/
      - https://github.com/nextsilicon/llvm-project

  runtime:
    - name: nextsystemd
      function: "optimizer + telemetry daemon; identifies hot flows, builds the optimized compute graph, projects it onto the grid"
      config_tree: "optimizer-pi: { enable-telemetry-less: bool, mlc: { acceleration-threshold: N } }"
      config_key_expansion: "not disclosed — 'mlc' and 'pi' are not expanded anywhere public; do not guess"
      telemetry_sink_flag: "--ui-collector-address"
      open_source: false
      confidence: confirmed

    - name: libnextapi.so  # NextAPI
      function: "host-side runtime API; the only public surface is what the Kokkos backend reaches"
      install_root: "$NEXT_HOME (default /opt/nextsilicon); lib under $NEXT_HOME/lib, headers under $NEXT_HOME/include"
      public_headers:
        - header: nextapi/parallelism.hpp
          symbols: ["nextapi::parallel_for(begin, end, {.chunk_size=N}, fn, ctx)"]
          semantics: "OpenMP-style host-driven parallel loop — the ENTIRE dispatch API. No streams, no queues, no kernel launch."
        - header: nextapi/intrinsics.h
          symbols: ["__next_is_in_handed_off_code()"]
          semantics: "true iff the calling thread is actually executing on the grid; 'handoff' is the official host->grid term"
        - header: nextapi/memory.h / nextapi/memory.hpp
          symbols: ["nextapi_memory_copy", "nextapi_memory_fill", "nextapi_mem_migrate", "NEXTAPI_PAGE_LOC_HOST"]
          semantics: "copies let the runtime select the implementation; migrate/pin drives UVM placement"
      full_api_surface: "not disclosed — no published reference manual (docs.nextsilicon.com is 401-gated)"
      open_source: false
      confidence: confirmed
      sources:
        - https://github.com/kokkos/kokkos/blob/develop/cmake/Modules/FindTPLNEXTAPI.cmake
        - https://github.com/kokkos/kokkos/tree/develop/core/src/NextSilicon

    - name: nextcli
      function: "control CLI. 'nextcli application status' exposes Optimization state: IDLE | OPTIMIZING | IMPROVED; 'nextcli system status' reports the device as 'Maverick 2'"
      open_source: false
      confidence: confirmed

    - name: optimizer cache
      function: "persistent projection cache under XDG_CACHE_HOME; amortizes the training pass across runs"
      evidence: "Kokkos CI maps a named volume to $HOME/optimizer-cache; PR #9162 'enable persistent optimizer cache'"
      format: "not disclosed"
      open_source: false
      confidence: confirmed
      sources:
        - https://github.com/kokkos/kokkos/pull/9162

