    note: "No ML graph compiler exists."
    confidence: confirmed

  kernel_compiler:
    - name: nextcxx
      function: "C++ compiler driver (LLVM/MLIR-based); the only compiler entry point"
      bundled: "LLVM binutils tree at $NEXT_HOME/llvm/bin/ (ar, ranlib, ...)"
      open_source: false
      arch_flag: "none — NextSilicon is the only Kokkos device backend with no Kokkos_ARCH_* option"
      cxx_standard_in_ci: 20
      maturity_signal: "CI must pass -Wno-return-type -Wno-invalid-noreturn"
      sdk_versions_seen: ["1.2.0", "1.3.0-395"]
      confidence: confirmed
      sources:
