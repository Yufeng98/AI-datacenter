    - {cpu: "Hygon 海光 7380 / 7375", isa: x86_64, os: "Kylin V10"}
    - {cpu: "Phytium 飞腾 S5000C", isa: ARMv8, os: "Kylin V10 国防版"}
    - {cpu: "Sunway 申威 8A", isa: "SW-64", os: "UOS Server 20"}
    - {cpu: "Loongson 龙芯 3C6000", isa: LoongArch, os: "Loongnix Server 23.1"}
