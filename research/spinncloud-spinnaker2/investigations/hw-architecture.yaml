# ── Explicitly not public ─────────────────────────────────────────────────────
not_disclosed:
  - "Rated TDP (only measured workload power is published)"
  - "Transistor count (266 M gate equivalents is not a transistor count)"
  - "Package type, pin/ball count, package dimensions, thermal solution"
  - "Sustained (as opposed to raw) LPDDR4 bandwidth"
  - "Aggregate off-chip event-link bandwidth per chip; board/rack bisection bandwidth"
  - "Board- and rack-level power draw, cooling method, physical dimensions"
  - "Price of any product (chip, SpiNNode, 48-node board, rack)"
  - "Units shipped, revenue, customer list beyond Sandia and TU Dresden/SpiNNcloud"
  - "Peak throughput at any precision other than INT8"
  - "Maximum neurons and synapses per PE as a hard limit (explicitly declined by the chip paper)"
  - "Reconciliation of the portal FAQ's QuadPE coordinate range (x=1..7, y=1..6 minus (4,3) and (4,4) => 40 positions) with the confirmed 38 QPEs"
  - "Any MLPerf or independently audited benchmark result — none exists"
  - "Everything about SpiNNext: process node, PE count, memory, interconnect, silicon status, tape-out or availability date, and the basis for the 78x claim"
  - "Measured end-to-end performance of the 35,000-chip Dresden system or NERL Braunfels on any workload"

unconfirmed_items:
  - item: "QuadPE coordinate range vs 38 QPE count"
    note: "Developer-portal FAQ implies 40 QPE positions; the chip paper confirms 38. The portal does not explain the discrepancy."
    confidence: unconfirmed
    sources: [https://spinnaker2.gitlab.io/external/faq/]
