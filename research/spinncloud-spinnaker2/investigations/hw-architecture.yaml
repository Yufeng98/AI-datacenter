  jetson_orin_nano_power_w: "3.1 - 8.2"
  energy_wins: "SpiNNaker2 won on energy for 4 of 6 layers (e.g. FC1: 0.064 mJ vs 1.332 mJ A100)"
  energy_losses: "lost badly on the two largest matmuls (MM2: 17.07 mJ vs 4.18 mJ A100)"
  wall_clock: "30 - 700x slower than A100"
  confidence: confirmed
