# ── Vendor claims (label as such) ─────────────────────────────────────────────
vendor_claims:
  - claim: "18x higher energy efficiency than GPUs (SpiNNaker2)"
    status: "unaudited marketing"
    peer_reviewed_anchor: >-
      For one specific case the chip paper reports EGRU language-model inference at 65 mJ on
      SpiNNaker2 vs 1.19 J on an A100 — an 18x energy reduction for SINGLE-BATCH inference, at the
      cost of 8x longer execution time. Report it that way or not at all.
    confidence: confirmed
    sources: [https://spinncloud.com/, https://arxiv.org/abs/2607.24396]
  - claim: "78x more energy efficient than GPUs (SpiNNext)"
    status: "unaudited marketing, no anchor of any kind"
    confidence: confirmed
    sources: [https://spinncloud.com/spinnext/]
  - note: >-
      The company homepage renders headline metrics as unpopulated placeholders
      ("Cores: 0M", "Chips: 0K", "Boards: 0", "Racks: 0") and is unusable as a spec source.
    confidence: confirmed
    sources: [https://spinncloud.com/]

independent_gpu_comparison:
  source_table: "chip paper Tab. 5 — INT8, all measured, 6 real DNN layers including DRAM traffic and scheduling"
  spinnaker2_power_w: "0.58 - 0.80 (at 150 MHz)"
