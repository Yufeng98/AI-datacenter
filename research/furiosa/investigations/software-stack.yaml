chip: furiosa
as_of: "2026-04-05"
source: software-stack.md

sdk:
  name: furiosa-sdk
  license: Apache 2.0
  repo: "https://github.com/furiosa-ai/furiosa-sdk"
  language: Python
  install: "pip install furiosa-sdk"
  version_warboy: "0.10.x"
  version_rngd: "2026.1.0"

layers:
  framework_integration:
    pytorch:
      path: "torch.onnx.export() / torch.export() → ONNX → furiosa-compiler"
      eager_backend: false
      aot_only: true
    onnx:
      primary: true
      note: "canonical model exchange format; furiosa-compiler accepts directly"
    huggingface_transformers:
      via: "furiosa-llm"
      chips: [rngd]
      note: "safetensors → furiosa-llm → compiled RNGD model"
    furiosa_models:
      repo: "furiosa-ai/furiosa-models"
      models: [ResNet50, EfficientNetB0, YOLOv5, YOLOv8, SSD, RetinaFace]

  compiler:
    name: furiosa-compiler
    open_source: false
    distribution: "apt/pip (furiosa-compiler package)"
    input: ONNX
    output_warboy: ".enf (Engineered NPU Format)"
    output_rngd: "RNGD binary (format not publicly named)"
    passes:
      - ONNX import and validation
      - Graph optimization (const folding, dead code elim, op fusion)
      - Quantization-aware lowering (INT8/INT4/FP8)
      - Hardware placement (NPU vs CPU fallback)
      - Memory planning (SRAM tiling, HBM3 allocation for RNGD)
      - Binary generation
    key_features:
      - tactic selection per operator
      - tensor contraction mapping to TCP hardware (RNGD)
      - LLM passes: KV-cache allocation, attention fusion, RoPE fusion
      - automatic CPU fallback for unsupported ops
    cli_tools:
      - "furiosa compile"
      - "furiosa quantize"
      - "furiosa perftest"
      - "furiosa profile"

  quantizer:
    name: furiosa-quantizer
    modes:
      - INT8 dynamic/static
      - INT4 weight-only (RNGD)
      - FP8 per-tensor / per-channel (RNGD)
      - GPTQ-style block quantization (RNGD, LLM)
    usage: "furiosa.quantizer.quantize(onnx_model, calibration_dataset)"

  runtime:
    warboy:
      name: furiosa-runtime
      api:
        sync: "runtime.session.create(model.enf).run([input])"
        async: "await session.run_async([input])"
      internals:
        - PCIe DMA for weight loading and tensor I/O
        - Multi-session multiplexing on single card
    rngd:
      name: furiosa-runtime (2026.1.0)
      extra_features:
        - NPU partition selection (1/2/4/8 virtual NPUs)
        - Streaming token generation (generate / generate_async)
        - KV-cache management (HBM3 segment allocation)
        - Continuous batching

  llm_interface:
    name: furiosa-llm
    chips: [rngd]
    models_supported:
      - "LLaMA 2/3 (7B–70B)"
      - "Mistral 7B"
      - "EXAONE 3.5 (32B)"
      - "Gemma 2B/7B"
    api_example: "LLM('meta-llama/Llama-3-8B-Instruct', devices='npu:0:*').generate(prompts, sampling_params)"

  serving:
    furiosa_serving:
      apis:
        - "OpenAI Chat Completions (/v1/chat/completions)"
        - "Triton-compatible REST"
        - "Health check + metrics"
    tgi_integration:
      via: "HuggingFace TGI backend plugin"
      deployment: Docker container
      chips: [rngd]

  driver:
    kernel_module: "furiosa-npu.ko"
    distribution: "apt install furiosa-driver"
    features:
      - PCIe BAR MMIO mapping
      - DMA channel management
      - NPU partition management (RNGD)
    on_chip_firmware:
      type: minimal microcontroller
      responsibilities:
        - DVFS power management
        - Thermal monitoring
        - PCIe link management
      note: "Does NOT manage operator scheduling — that is entirely compiler-determined"

  profiler:
    name: furiosa-profiler
    output: "Chrome Tracing JSON (compatible with chrome://tracing and Perfetto)"
    captures:
      - per-operator NPU execution time
      - memory DMA transfers
      - CPU-NPU synchronization

op_library:
  note: "Not applicable — no separate op dispatch library like cuDNN; all fusion handled inside furiosa-compiler"

kernel_library:
  note: "Not applicable — no user-facing kernel library (no CUTLASS equivalent); compiler owns all placement"

programming_model:
  philosophy: "compiler-first, runtime-thin"
  compilation: AOT_only
  model_format: ONNX
  dynamic_shapes: false
  recompilation_required_for_shape_change: true

references:
  - url: "https://github.com/furiosa-ai/furiosa-sdk"
    type: open_source_repo
  - url: "https://developer.furiosa.ai/latest/"
    type: documentation
  - url: "https://developer.furiosa.ai/latest/en/overview/rngd.html"
    type: documentation
  - url: "http://developer.furiosa.ai/docs/latest/en/software/python-sdk.html"
    type: documentation
  - url: "http://developer.furiosa.ai/furiosa-models/latest/getting_started/"
    type: documentation
  - url: "https://furiosa.ai/blog/lg-ai-research-taps-furiosaai-to-achieve-2-25x-better-llm-inference-in-production-vs-gpus"
    type: benchmark_blog

