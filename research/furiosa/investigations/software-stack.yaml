update_2026_08_08:
  as_of: "2026-08-08"

  sdk_release:
    confidence: confirmed
    sources:
      - "https://furiosa.ai/blog/furiosa-sdk-2026-3-a-new-kernel-framework-and-the-models-it-unlocks"
      - "https://pypi.org/pypi/furiosa-llm/json"
      - "https://developer.furiosa.ai/latest/en/"
    version: "2026.3.0"
    released: "2026-06-30"
    breaking_changes_from: "2026.2"
    distribution: "PyPI wheels, calendar versioning; documented at developer.furiosa.ai"

  # ---- SUPERSEDES the baseline `kernel_library` key above ----
  kernel_library:
    supersedes: "kernel_library.note ('Not applicable — no user-facing kernel library')"
    confidence: confirmed
    sources:
      - "https://furiosa.ai/blog/furiosa-sdk-2026-3-a-new-kernel-framework-and-the-models-it-unlocks"
      - "https://pypi.org/pypi/furiosa-kernels/json"
    name: "TCL — Tensor Contraction Language"
    kind: "declarative Python eDSL"
    entry_point: "@tcl.kernel-decorated function"
    semantics: >-
      Author states WHAT to compute; the compiler owns tiling, scheduling,
      fusion and hardware mapping. Tensor contraction is a first-class language
      primitive, matching the TCP hardware primitive.
    language_level_features:
      - padding
      - sharding
      - multi-chip collectives
    package: "furiosa-kernels"
    package_version: "2026.3.0"
    package_uploaded: "2026-06-30T07:28:17Z"
    package_license: "LicenseRef-Proprietary"   # NOT Apache 2.0
    package_python: ">=3.10"
    shipped_blocks: ["RMSNorm", "Linear", "MLP"]
    vendor_framing: "Enablement now scales with the number of reusable blocks, not the number of models."
    taxonomy_placement: >-
      Same tier as Triton/Pallas (user-facing kernel-authoring layer above the
      compiler) but at a DECLARATIVE point in that tier — no user-specified
      schedule, unlike Triton's explicitly-tiled imperative model.
    public_documentation_exists: false
    public_documentation_note: "Developer Center 2026.3.0 has no TCL or furiosa-kernels section (checked via nav and docs search)"
    general_availability:
      value: null                 # not disclosed
      note: "Whether TCL is GA to all customers or gated to partners could not be confirmed"

  virtual_isa:
    supersedes: "layer-table row 'No user-visible virtual ISA (no PTX equivalent)'"
    confidence: named_only
    sources:
      - "https://furiosa.ai/blog/experience-renegade-summit-2026"
    name: "FVISA (\"Furiosa Virtual ISA\")"
    named_at: "RENEGADE Summit 2026 (blog 2026-05-13)"
    instruction_set_disclosed: false
    documentation_exists: false
    user_facing_tooling: false
    note: "Named publicly as a stack layer alongside the compiler and TCL. No technical detail disclosed."

  other_2026_3_features:
    confidence: reported_vendor_blog_not_independently_verified
    sources:
      - "https://furiosa.ai/blog/furiosa-sdk-2026-3-a-new-kernel-framework-and-the-models-it-unlocks"
    fxb:
      name: "FXB — Furiosa Executable Bundle"
