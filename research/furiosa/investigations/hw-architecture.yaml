    type: product_page
  - url: "https://furiosa.ai/warboy"
    type: product_page
  - url: "https://developer.furiosa.ai/latest/en/overview/rngd.html"
    type: documentation
  - url: "https://chipsandcheese.com/p/furiosaais-rngd-at-hot-chips-2024-accelerating-ai-with-a-more-flexible-primitive"
    type: technical_analysis
  - url: "https://web.ist.utl.pt/nuno.lopes/pubs/tcp-micro25.pdf"
    type: academic_paper
    conference: "MICRO 2025"
  - url: "https://www.hpcwire.com/2025/09/30/the-fast-and-the-furiosaai-korean-chip-startup-takes-aim-at-nvidia-gpus-with-tensor-contraction-architecture/"
    type: press
  - url: "https://furiosa.ai/warboy/specs"
    type: specs_page
