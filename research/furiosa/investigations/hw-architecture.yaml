chip: furiosa
as_of: "2026-04-05"
source: hw-architecture.md

generations:
  warboy:
    label: "Gen 1 — Warboy"
    process: "Samsung 14nm LPP"
    die_area_mm2: 180
    transistors_B: 5
    clock_ghz: 2.0
    peak_int8_tops: 64
    peak_fp16_tflops: null
    architecture: "PE array (vision/CNN-first)"
    on_chip_sram_mb: 32
    off_chip_memory: "16 GB LPDDR4X"
    memory_bw_gbs: 66
    host_interface: "PCIe Gen4 x8"
    tdp_w: 50
    production: "2021"
    target_workload: "CNN inference (ResNet, YOLO, EfficientDet)"
    designed_via: "SemiFive ASIC platform (SK Telecom subsidiary)"

  rngd:
    label: "Gen 2 — RNGD (Renegade)"
    process: "TSMC 5nm N5"
    die_area_mm2: null  # not disclosed; ~600+ estimated
    transistors_B: 40
    clock_ghz: 1.0
    peak_int8_tops: 512
    peak_int4_tops: 1024
    peak_fp8_tops: 512
    architecture: "Tensor Contraction Processor (TCP)"
    compute_units:
      pes: 8
      slices_per_pe: 64
      total_slices: 512
    on_chip_sram_mb: null  # not disclosed
    off_chip_memory: "2× HBM3"
    memory_capacity_gb: 24
    memory_bw_tbs: 1.5
    host_interface: "PCIe Gen5 x16"
    tdp_w: 180
    production: "January 2026"
    target_workload: "LLM / Multimodal / Vision inference"
    multi_tenancy:
      partitions: [2, 4, 8]
      isolation: "hardware-enforced"
    presented_at: "Hot Chips 2024, MICRO 2025"

compute_architecture:
  warboy:
    type: PE_array_systolic_style
    compiler_managed: true
    caches: false
    sram_model: SW-managed
  rngd:
    type: Tensor_Contraction_Processor
    key_insight: "tensor contraction = generalization of matmul; handles attention, GEMM, conv natively"
    pe_grid: "8 PEs × 64 slices"
    compiler_managed: true
    caches: false
    sram_model: SW-managed
    multi_tenant_partitioning: true

memory_hierarchy:
  warboy:
    on_chip: "32 MB SRAM"
    off_chip: "16 GB LPDDR4X @ 66 GB/s"
    model: SW-managed
  rngd:
    on_chip: "not disclosed (compiler-managed SRAM)"
    off_chip: "24 GB HBM3 @ 1.5 TB/s (2× HBM3 modules)"
    model: SW-managed

host_interface:
  warboy: "PCIe Gen4 x8"
  rngd: "PCIe Gen5 x16"

power:
  warboy_tdp_w: 50
  rngd_tdp_w: 180

scale_up:
  rngd: "not disclosed — multi-card via PCIe; NXT RNGD server uses 4 cards"

corporate:
  founded: 2017
  hq: Seoul, South Korea
  meta_acquisition_offer_usd_m: 800
  meta_offer_rejected: true
  rejection_reason: "Disagreement over post-acquisition strategy and organizational structure"
  series_c_raised_usd_m: 125
  series_c_date: "July 2025"
  series_d_target_usd_m: 500
  series_d_advisers: ["Morgan Stanley", "Mirae Asset Securities"]
  estimated_valuation_usd_b: 2.3
  ipo_target: "2027"
  rngd_monthly_production: "~1,000 units (Jan 2026); 2,000–3,000/month target end of 2026"

benchmarks:
  lg_ai_research_exaone_35_32b:
    cards: 4  # NXT RNGD server
    batch_size: 1
    context_4k_toks_per_sec: 60
    context_32k_toks_per_sec: 50
    vs_gpu_rack_same_power: "3.75× more tokens per watt"
  gpt_oss_120b:
    cards: 2
    tpot_ms: 5.8
    source: "https://furiosa.ai/blog/serving-gpt-oss-120b-at-5-8-ms-tpot-with-two-rngd-cards-compiler-optimizations-in-practice"
  nxt_rngd_server_vs_dgx_h100:
    server_power_kw: 3
    dgx_h100_power_kw: 10
    power_advantage: "3.3× lower power"

references:
