resource: Cambricon NeuWare SDK Software Stack
url: https://developer.cambricon.com/
chip: cambricon
as_of: 2026-04-05
last_updated: 2026-08-08   # see update_2026_08_08 at the end of this file
investigation_report: software-stack.md

layer_mappings:
  - layer: Framework Integration
    components:
      - name: torch_mlu
        url: https://github.com/Cambricon/torch_mlu
        role: Official PyTorch extension; registers MLU device backend; dispatches ATen ops to CNNL/BANGC OPS; versioned as {torch_mlu_ver}+torch{pytorch_ver}
        entry_points:
          - torch.device("mlu")
          - tensor.to("mlu")
          - model.mlu()
          - torch.distributed with CNCL backend
          - torch.compile integration
        confidence: confirmed
      - name: vllm-mlu
        url: https://github.com/Cambricon/vllm-mlu
        role: vLLM fork for MLU; supports Chunk Prefill, Prefix Caching, Speculative Decoding, Graph Mode; requires SDK 25.08, MLU370+
        confidence: confirmed
      - name: PaddlePaddle custom device plugin
        url: https://github.com/PaddlePaddle/PaddleCustomDevice
        role: libpaddle-custom-mlu.so with 264+ custom operators for Cambricon MLU
        confidence: confirmed
      - name: CATCH (legacy)
        url: https://github.com/Cambricon/catch
        role: Earlier PyTorch integration layer for MLU; superseded by torch_mlu
        confidence: confirmed

  - layer: Compiler / IR
    components:
      - name: BANG C + CNCC compiler
        url: https://www.cambricon.com/docs/bangc/developer_guide_html/
        role: BANG C is the CUDA-analog kernel language; CNCC compiles .mlu source to MLISA assembly; CNAS assembles to .cnbin/.cnfatbin
        entry_points:
          - __mlu_global__ (kernel qualifier)
          - __nram__ / __wram__ / __mlu_shared__ (memory qualifiers)
          - __mlu_builtin_* (compute intrinsics)
          - __sync_cluster() / __sync_all() (barriers)
          - cncc command (compiler driver)
          - cnas command (assembler)
        confidence: confirmed
      - name: MagicMind
        url: https://github.com/Cambricon/magicmind_cloud
        role: MLIR-based inference compiler; converts TF/PyTorch/ONNX/Caffe to optimized MLU binary; graph fusion + quantization + layout optimization
        confidence: confirmed
      - name: triton-linalg
        url: https://github.com/Cambricon/triton-linalg
        role: Converts Triton MLIR dialect to Linalg dialect for Cambricon backend; frontend complete, backend under development
        confidence: confirmed

  - layer: Op Library
    components:
      - name: CNNL (Cambricon Neuware Neural Network Library)
        url: https://www.cambricon.com/docs/sdk_1.15.0/cntoolkit_3.7.2/
        role: Primary op library (cuDNN+cuBLAS analog); GEMM, Conv, BN, LayerNorm, Attention, Pooling, RNN; C API
        entry_points:
          - cnnlConvolutionForward
          - cnnlMatMul
          - cnnlBatchNormForward
          - cnnlTransformerAttention
        confidence: confirmed
      - name: CNNL_Extra
        role: Extended operator library for ML ops beyond core CNNL; dependency of torch_mlu
        confidence: confirmed
      - name: CNML (legacy)
        url: https://developer.cambricon.com/uploads/20220901/522e59edfe8c344303b95660bdffad54.pdf
        role: Predecessor graph-based op library (v7.10.2 April 2021); superseded by CNNL; referenced in MXNet integration
        confidence: confirmed

  - layer: Kernel Library
    components:
      - name: mlu-ops / BANGC OPS
        url: https://github.com/Cambricon/mlu-ops
        role: Open-source BANG C kernel implementations; hundreds of ML ops; CNNL integration helpers; used by torch_mlu for non-CNNL ops
        confidence: confirmed
      - name: BANGPy
        role: Python-level kernel programming API (Triton analog); graph/kernel/operator-level optimization; part of NeuWare SDK
        confidence: confirmed
      - name: CNCV (Cambricon Computer Vision Library)
        role: Accelerated image decode, resize, color convert, normalize on MLU; vision preprocessing for inference pipelines
        confidence: confirmed

  - layer: Runtime
    components:
      - name: CNRT (Cambricon Neuware Runtime)
        url: https://www.cambricon.com/docs/cnrt/user_guide_html/index.html
        role: Primary user-facing runtime API (libcudart.so analog); device mgmt, memory alloc, queue create, kernel launch
        entry_points:
          - cnrtGetDeviceCount / cnrtSetDevice
          - cnrtMalloc / cnrtFree / cnrtMemcpy
          - cnrtQueueCreate / cnrtQueueSync
          - cnrtNotifierCreate / cnrtPlaceNotifier
          - cnrtInvokeKernel (with cnrtDim3_t, kernel fn, params, queue)
        confidence: confirmed
      - name: CNDrv (Cambricon Driver API)
        url: https://crates.io/crates/cndrv
        role: Low-level driver API (libcuda.so analog); explicit context management, module loading, fine-grained memory
        confidence: confirmed
      - name: CNToolkit bundle
        url: https://www.cambricon.com/docs/sdk_1.15.0/cntoolkit_3.7.2/cntoolkit_install_3.7.2/index.html
        role: Packaging bundle containing CNCC, CNAS, CNRT, CNDrv, CNNL, CNCL; versioned SDK distribution
        confidence: confirmed

  - layer: Driver / Firmware
    components:
      - name: cambricon-mlu kernel driver
        url: https://gitee.com/jimpirrou/cambricon-mlu-driver
        role: Linux kernel module; PCIe BAR mapping, IOCTL dispatch, DMA engine, interrupt handling
        confidence: confirmed
      - name: cambricon-k8s-device-plugin
        url: https://github.com/Cambricon/cambricon-k8s-device-plugin
        role: Kubernetes DaemonSet auto-reporting MLU count and health to scheduler
        confidence: confirmed
      - name: mlu-exporter
        url: https://github.com/Cambricon/mlu-exporter
        role: Prometheus metrics exporter for MLU device monitoring (temperature, utilization, memory)
        confidence: confirmed

  - layer: Communication
    components:
      - name: CNCL (Cambricon Collective Communication Library)
        role: NCCL analog; AllReduce/AllGather/ReduceScatter/Broadcast over MLU-Link; torch.distributed backend
        confidence: confirmed
      - name: Gloo (for heterogeneous)
        role: Cross-vendor communication in KAITIAN framework; bridges MLU-MLU CNCL with non-MLU accelerators
        confidence: confirmed

  - layer: Assembler / ISA
    components:
      - name: MLISA (Machine Learning ISA)
        role: Native MLU ISA; 64-bit instructions; scalar/vector/matrix/control categories; 64 GPRs; assembled from BANG C via CNCC+CNAS
        confidence: confirmed
      - name: CNAS (Cambricon Neuware Assembler)
        role: Assembles MLISA text to .cncode/.cnbin/.cnfatbin binary formats
        confidence: confirmed
      - name: .cnfatbin (fat binary)
        role: Multi-generation binary bundle (analog to NVIDIA fatbinary); contains .cnbin for multiple MLU hardware generations
        confidence: inferred
      - name: Cambricon ISA (original ISCA 2016)
        url: https://ieeexplore.ieee.org/document/7551409/
        role: Published ISA specification; 43 instruction types; scalar/vector/matrix/control; load-store architecture
        confidence: confirmed

key_abstractions:
  - name: BANG C Kernel
    description: >
      Function qualified with __mlu_global__ that executes on MLU Cores. Launched via cnrtInvokeKernel with
      a cnrtDim3_t specifying X×Y×Z Core task dimensions. The programmer explicitly manages NRAM/WRAM
      allocation using __nram__/__wram__ qualifiers. There is no automatic scratchpad management —
      all data movement between GDRAM and on-chip memory is programmer-controlled via DMA built-ins.
    layer: Compiler/IR / Runtime
    hardware_mapping: Each kernel invocation maps to N MLU Cores executing in parallel

  - name: Queue
    description: >
      CNRT's ordered asynchronous execution context (CUDA Stream analog). Kernels, memcpies, and notifier
      placements enqueued on a Queue execute in submission order. Independent Queues may run concurrently.
      cnrtQueueSync() blocks host until all enqueued work completes.
    layer: Runtime
    hardware_mapping: MLU hardware command queue / DMA channel

  - name: Notifier
    description: >
      Lightweight event for cross-Queue synchronization (CUDA Event analog). A Notifier is placed in a Queue
      via cnrtPlaceNotifier() and waited on in another Queue or the host via cnrtWaitNotifier(). Used for
      producer-consumer pipelining between DMA and compute Queues.
    layer: Runtime
    hardware_mapping: Hardware fence / timestamp in command queue

  - name: CNNL Handle
    description: >
      Opaque context object required by all CNNL API calls; encapsulates stream/queue association and
      device state (cuDNN handle analog). Created once per device context, reused across operator calls.
    layer: Op Library
    hardware_mapping: Device context + associated Queue for async op dispatch

  - name: MagicMind Engine
    description: >
      Compiled inference graph produced by MagicMind compiler from a framework model. Contains fused,
      quantized, layout-optimized MLU binaries for one or more graph segments. Analogous to a TensorRT
      engine file. Loaded at inference time via MagicMind runtime API.
    layer: Compiler/IR
    hardware_mapping: Compiled MLISA binaries for MLU, bundled with calibration metadata

