        - peak_int4_tops: ">2800 (reported)"
        - peak_fp8_tops: "2000 (reported by the conflicting 7nm source only; incompatible with the other set)"
        - process_node: not disclosed  # sources contradict: TSMC 4nm vs 7nm
        - transistor_count: not disclosed
