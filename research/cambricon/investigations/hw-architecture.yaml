resource: Cambricon MLU Hardware Architecture
url: https://en.wikichip.org/wiki/cambricon/mlu
chip: cambricon
as_of: 2026-04-05
last_updated: 2026-08-08   # see update_2026_08_08 at the end of this file
investigation_report: hw-architecture.md

layer_mappings:
  - layer: Compute Engine
    components:
      - name: MLU Core (IPU Core)
        role: Fundamental compute building block; contains FU, 64 GPRs, private NRAM and WRAM scratchpads
        entry_points:
          - FU scalar/vector/matrix/control execution
          - GPR file (64 x 32-bit)
          - NRAM (input/output operand scratchpad)
          - WRAM (convolution weight scratchpad)
        confidence: confirmed
      - name: Cluster (4 MLU Cores + Memory Core + Shared SRAM)
        role: Mid-level grouping; 4 cores share a Memory Core DMA engine and per-cluster SRAM
        confidence: confirmed
      - name: MLU290 peak compute
        role: 512 INT8 TOPS, 256 INT16 TOPS, 64 FP32 TFLOPS (32 cores, HBM2)
        confidence: confirmed
      - name: MLU370 peak compute
        role: ~256 INT8 TOPS, ~96 FP16 TFLOPS (single chip, LPDDR5)
        confidence: inferred
      - name: Precision formats (MLUarch03)
        role: FP32, FP16, BF16, INT16, INT8, INT4
        confidence: confirmed

  - layer: Data Path
    components:
      - name: SPMD execution model
        role: All MLU Cores execute the same BANG C kernel in parallel; each core has independent instruction stream; no SIMT warp concept
        confidence: confirmed
      - name: Memory Core DMA engine
        role: Independent DMA controller per cluster; moves data between GDRAM and per-core NRAM/WRAM; enables overlap with compute
        confidence: confirmed
      - name: BANG C barrier synchronization
        role: __sync_cluster() / __sync_all() for inter-core and inter-cluster coordination
        confidence: confirmed
      - name: MLISA instruction set
        role: 64-bit load-store ISA; scalar/vector/matrix/control categories; 64 GPRs per core; compiled from BANG C via CNCC+CNAS
        confidence: confirmed

  - layer: On-chip Memory
    components:
      - name: NRAM (Neural-RAM)
        role: Per-MLU-Core private scratchpad for vector/tensor operand data; programmer-managed; no hardware cache
        confidence: confirmed
      - name: WRAM (Weight-RAM)
        role: Per-MLU-Core private scratchpad dedicated to convolution kernel weights; feeds matrix FU directly
        confidence: confirmed
      - name: Shared SRAM (per-Cluster)
        role: Shared across 4 Cores + Memory Core per cluster; staging buffer and inter-core data exchange
        confidence: confirmed
      - name: LLC (Last Level Cache)
        role: Small cache on GDRAM-to-core path; buffers shared read-only data (weight broadcast); not primary data path
        confidence: inferred

  - layer: Off-chip Memory
    components:
      - name: LPDDR5 (MLU370-X8)
        role: 48 GB dual-chip, 614.4 GB/s; first China cloud AI chip with LPDDR5
        confidence: confirmed
      - name: HBM2 (MLU290-M5)
        role: 32 GB, 1,228 GB/s bandwidth
        confidence: confirmed
      - name: HBM (MLU590)
        role: HBM2e or HBM3; capacity and bandwidth not publicly confirmed; supply-constrained
        confidence: inferred

  - layer: Host Interface / Package
    components:
      - name: PCIe Gen4 x16
        role: Host interface; ~64 GB/s bidir; MLU370-M8 and MLU370-X form factor
        confidence: confirmed
      - name: FHFL PCIe card (MLU370)
        role: Full-height full-length PCIe accelerator card form factor
        confidence: confirmed
      - name: Chiplet packaging (research)
        role: Future direction per Cambricon-LLM paper; 2.5D chiplet design for 70B LLM on-device inference
        confidence: inferred

  - layer: Scale-up Interconnect
    components:
      - name: MLU-Link
        role: Proprietary chip-to-chip direct interconnect; dual Siyuan 370 on MLU370-X8; 8-card parallel training
        confidence: confirmed
      - name: MLU370-X8 dual-chip configuration
        role: Two Siyuan 370 dies + 48 GB LPDDR5 unified; connected via MLU-Link on single PCIe card
        confidence: confirmed

  - layer: Scale-out Interconnect
    components:
      - name: Standard Ethernet / InfiniBand
        role: Inter-node communication via standard NICs; no proprietary scale-out switch
        confidence: confirmed
      - name: CNCL for intra-MLU collectives
        role: AllReduce/AllGather/ReduceScatter within MLU pod over MLU-Link; Gloo for cross-vendor heterogeneous
        confidence: confirmed

key_abstractions:
  - name: MLU Core
    description: >
      The atomic compute unit of Cambricon hardware. Executes BANG C kernels independently with private NRAM and WRAM
      scratchpads. No warp/thread grouping within a core; parallelism from many concurrent cores.
    layer: Compute Engine
    hardware_mapping: Single IPU execution pipeline; private NRAM+WRAM

  - name: Cluster
    description: >
      Four MLU Cores + Memory Core + Shared SRAM. The cluster is the synchronization boundary for __sync_cluster().
      The Memory Core DMA engine is shared within a cluster, enabling DMA/compute overlap.
    layer: Compute Engine / Data Path
    hardware_mapping: 4 MLU Cores sharing a DMA engine and on-chip SRAM

  - name: NRAM
    description: >
      Per-core scratchpad for vector and tensor operand data. Explicitly managed by BANG C programmer/compiler.
      No hardware prefetch or eviction — the programmer explicitly loads from GDRAM via DMA, computes in NRAM,
      then writes back. This is the primary working set for all vector/matrix operations.
    layer: On-chip Memory
    hardware_mapping: On-core SRAM bank directly connected to functional unit

  - name: WRAM
    description: >
      Per-core scratchpad holding convolution kernel weights. Used in weight-stationary convolution: weights are
      loaded once into WRAM and reused across multiple input activation tiles in NRAM.
    layer: On-chip Memory
    hardware_mapping: On-core SRAM bank connected to matrix/conv FU weight input port

  - name: MLU-Link
    description: >
      Cambricon's proprietary high-speed chip-to-chip interconnect for multi-die configurations.
      Used in MLU370-X8 to bridge two Siyuan 370 dies into a single 48GB addressable card.
    layer: Scale-up Interconnect
    hardware_mapping: SerDes links between MLU dies on multi-chip board

product_generations:
  - name: MLU220
    year: 2019
    clusters: 1
    cores: 4
    process: TSMC 16nm
    memory: LPDDR4
    target: edge/embedded
  - name: MLU270
    year: 2019
    clusters: 4
    cores: 16
    process: TSMC 16nm
    memory: LPDDR4
    target: server inference
  - name: MLU290
    year: 2020
    clusters: 8
    cores: 32
    process: TSMC 7nm
    memory: HBM2 32GB 1228GB/s
    peak_int8_tops: 512
    target: training
  - name: MLU370 (Siyuan 370)
    year: 2022
    architecture: MLUarch03
    process: TSMC 7nm
    memory: LPDDR5 48GB (dual-chip) 614GB/s
    target: training + inference
    notes: dual-die MLU-Link card; first LPDDR5 cloud AI chip in China
  - name: MLU590 (Siyuan 590)
    year: 2024
    process: TSMC 7nm+
    memory: HBM (generation unconfirmed; capacity and bandwidth not disclosed)
    target: LLM training + inference
    notes: >
      HBM supply-constrained production. Absent from Cambricon's own 2026 half-year report,
      which names only 思元100/220/270/290/370.
  - name: MLU690 (Siyuan 690)
    year: reported 2026 (contested)
    process: not disclosed (sources contradict — TSMC 4nm vs 7nm)
    memory: HBM3 196 GB / ~3.35 TB/s (reported, unverified)
    target: LLM training + inference (reported)
    notes: >
      No Cambricon primary source. Zero mentions in the 2026 half-year report. Recorded as
      reported-unverified only. See update_2026_08_08 below.

