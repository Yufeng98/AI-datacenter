  corrections_to_prior_repo_content:
    - target_file: chips/cambricon/hw-architecture.md
      prior_text: >
        "Cambricon cited HBM availability as a key production limiter for the MLU590 ramp to
        500,000 units in 2026."
      problem: >
        Misattributed and misscoped. The 500,000-unit 2026 figure is a THIRD-PARTY supply-chain
        TARGET for Cambricon's total accelerator output, originating in Bloomberg reporting dated
        2025-12-04 and echoed by Tom's Hardware and TrendForce. It is not a Cambricon statement,
        not MLU590-specific, and describes targets rather than shipments. It also pre-dates the
        repo's 2026-04-05 baseline, so it is not new information in this window.
      corrected_text: >
        Third-party supply-chain reporting (Bloomberg 2025-12-04, echoed downstream) put Cambricon's
        2026 accelerator target at ~500,000 units, of which as many as ~300,000 Siyuan 590/690, up
        from a ~116,000-142,000 unit 2025 baseline. Named risks: low yield, SMIC 7nm-class capacity
        contention with Huawei, and HBM supply. Domestic HBM3 from CXMT targets end-2026, after the
        stated ramp. No unit-shipment figure is confirmed by any Cambricon source.
      confidence: confirmed  # confirmed as third-party reporting, not as vendor guidance
      sources:
        - https://www.tomshardware.com/tech-industry/semiconductors/cambricon-targets-500000-ai-chips-in-2026-as-china-accelerates-domestic-hardware-push
        - https://www.trendforce.com/news/2025/12/15/insights-cambricon-remains-chinas-top-ai-chip-startup-rumored-2026-triple-output-faces-smic-limits/

