update_2026_08_08:
  as_of: 2026-08-08
  change_class: major
  investigation_report: hw-architecture.md (section "Investigation Update — 2026-08-08")

  headline_negative_finding:
    claim: >
      Cambricon's product center of gravity has NOT moved off the MLU370. MLU370 remains the only
      vendor-documented datacenter part as of 2026-08-08.
    evidence: >
      Cambricon 2026 半年度报告 names only 思元100/220/270/290/370 in its product and core-technology
      sections and contains zero occurrences of 思元590, 思元690 or HBM (all 590/690 string hits are
      financial figures). Cambricon's own DeepSeek-V4 Day-0 article lists MLU370-S4/X4/X8 as the board
      options. vllm-mlu README still states the hardware requirement as "MLU370以上的设备".
    confidence: confirmed
    sources:
      - https://static.cninfo.com.cn/finalpage/2026-08-08/1225464969.PDF
      - https://developer.cambricon.com/index/article/details.html?id=12
      - https://raw.githubusercontent.com/Cambricon/vllm-mlu/master/README.md

  new_facts:
