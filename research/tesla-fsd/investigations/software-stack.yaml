chip: tesla-fsd
investigation: software-stack
date: "2026-04-05"
last_updated: "2026-08-08"   # see update_2026_08_08 at end of file
confidence: medium  # proprietary stack, limited public detail

layers:
  framework:
    name: PyTorch
    usage: training_only
    public: true
  compiler:
    name: Tesla NN Compiler
    public: false
    passes: [coarse_topology_mapping, fine_quantization_pruning]
    output: static_schedule_binary
    layer_fusion: [conv, scale, activation, pooling]
  runtime:
    name: NPU static microcode
    public: false
    scheduling: static
    dispatch: compile_time
  os:
    name: embedded Linux
    target: ARM Cortex-A clusters
  deployment:
    method: OTA
    model_format: proprietary_binary
    chip_specific: true  # HW3 and HW4 binaries differ

precision:
  training: FP32/BF16
  inference: INT8

inference_pipeline:
  model_count: 48
  input: "8 cameras (Tesla Vision)"
  stages:
    - vision_engine_feature_extraction
    - bev_occupancy_network
    - ego_motion_trajectory
    - decision_network

openness: closed_proprietary

sources:
  - https://fuse.wikichip.org/news/2707/inside-teslas-neural-processor-in-the-fsd-chip/
  - https://www.toolify.ai/gpts/revolutionizing-ai-pytorch-at-tesla-138832
  - https://towardsai.net/p/l/how-tesla-has-been-optimizing-its-software-and-hardware-for-fsd-capabilities-and-a-hyper-efficient-robo-taxi-fleet

