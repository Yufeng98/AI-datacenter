hardware:
  execution_model: spatial_dataflow
  scheduling: compile_time_static
  core_units:
    pcu:
      full_name: Pattern Compute Unit
      description: Multi-stage reconfigurable SIMD pipeline; executes one innermost-parallel operation per PCU
      count_sn40l: 1040
    pmu:
      full_name: Pattern Memory Unit
      description: Distributed software-managed scratchpad SRAM; physically co-located with PCUs
      count_sn40l: 1040
    agcu:
      full_name: Address Generation and Coalescing Unit
      description: Interface between RDU and off-chip memory; handles sparse access; P2P inter-RDU
    switching_fabric:
      topology: 3D on-chip network
      networks:
        scalar: word-level data
        vector: multi-word tensor data
        control: bit-level predicates and enables

  chips:
    sn40l:
      generation: 4
      released: 2023
      process: TSMC 5nm
      transistors_B: 102
      die_config: dual-die plus HBM plus DDR on-package
      compute:
        bf16_tflops_socket: 638
        fp16_tflops_socket: ~688
    sn50:
      generation: 5
      released: H2 2026
      process: TSMC N3 (3nm)
      die_config: dual-chiplet
      compute:
        bf16_pflops_socket: 1.6
        fp8_pflops_socket: 3.2
        vs_sn40l_bf16: 2.5x
        vs_sn40l_fp8: 5x
      native_fp8: true

  memory_hierarchy:
    tier1_on_chip_sram:
      sn40l_capacity_mib: 520
      sn50_capacity_mib: 432
      bandwidth: hundreds_of_TB_per_s
      management: compiler_managed
    tier2_hbm:
      sn40l:
        capacity_gib: 64
        bandwidth_approx: ~1 TB/s
      sn50:
        capacity_gib: 64
        standard: HBM2E
        bandwidth_tbs: 1.8
      role: software_managed_caching_tier_between_ddr_and_sram
    tier3_ddr:
      sn40l:
        max_capacity_tib: 1.5
        standard: DDR4/DDR5
        attach: direct_to_rdu_not_host_cpu
      sn50:
        capacity_range: 256GiB_to_2TiB
        standard: DDR5
      role: model_weight_reservoir

  scale_up:
    sn40l:
      rdu_per_sambarack: 16
      protocol: P2P (RDU-Connect)
      inter_rack: InfiniBand
      aggregate_bf16_pflops: 10.2
    sn50:
      max_rdu_chips: 256
      chip_to_chip_bw_tbs: 2.2
      fabric_type: switched
      max_model_params: 10_trillion
      max_context_tokens: 10_million
      bw_vs_sn40l: 4x

key_differentiators:
  - Static compile-time model-to-hardware mapping (no runtime scheduler)
  - Three-tier memory with DDR directly attached to accelerator (not host CPU)
  - 520 MiB on-chip SRAM (10x+ more than GPU shared memory)
  - Data flows PCU-to-PCU without DRAM round-trips between operators
  - SambaFlow compiler owns all memory placement decisions

