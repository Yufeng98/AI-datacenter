stack_name: SambaFlow
stack_philosophy: AOT whole-graph spatial compiler; zero runtime scheduler overhead

layers:
  framework_integration:
    primary: PyTorch
    secondary: TensorFlow
    entry_point: samba.from_torch_model()
    tensor_type: SambaTensor (wraps torch.Tensor)
    parameter_type: SambaParameter (wraps nn.Parameter)
    compatibility: most PyTorch nn.Module code unchanged
    training_api: samba.session.run() replaces loss.backward() + optimizer.step()
    huggingface: supported (GPT-2, GPT-J, Llama, BERT, etc.)

  compiler:
    name: SambaFlow Dataflow Compiler
    compilation_mode: AOT (ahead-of-time)
    input: annotated PyTorch computation graph
    output: PEF (Program Execution File)
    key_transforms:
      - operator_fusion (sections)
      - meta_pipelining
      - multi_section_support
      - parallelism_mapping (data/tensor/pipeline)
      - pcu_assignment
      - pmu_data_placement
      - switching_fabric_routing
      - agcu_configuration
    fusion_modes:
      o0:
        description: one section per operator
        use: debugging / correctness verification
      o1:
        description: maximum operator fusion
        use: production
    parallelism:
      - data_parallel
      - tensor_parallel
      - pipeline_parallel
      - nested_combinations
    speedup_from_fusion: 2x-13x vs unfused baseline

  pef:
    full_name: Program Execution File
    description: Binary encoding of entire model-to-hardware spatial mapping
    contents:
      - PCU pipeline configurations
      - PMU data layouts and placement
      - switching fabric routes
      - AGCU memory access descriptors
    reuse: compiled once; used for all subsequent runs of same model

  runtime:
    name: SambaNova Runtime
    api: samba.session
    key_methods:
      compile: samba.session.compile(model, inputs, name, output_file, compile_op_mode)
      load: samba.session.load(pef_path)
      run: samba.session.run(inputs, section_types)
    execution_model: synchronous from host; fully pipelined on RDU
    multi_rdu: collectives compiled into PEF; no separate comm library (unlike NCCL)

  memory_management:
    model: fully_compiler_driven
    programmer_control: none_below_host_DRAM
    no_explicit_allocation: true
    tiers_managed_by_compiler:
      - PMU SRAM (static placement per PEF)
      - HBM (static caching policy)
      - DDR (model weight placement)

sections:
  concept: fundamental execution unit; fused subgraph
  execution: complete section runs before returning to memory
  pipelining: meta-pipelining pre-stages next section in HBM while current executes

unsupported_patterns:
  - dynamic control flow over tensor values
  - in-place operations conflicting with tracing
  - BatchNorm (use LayerNorm instead)
  - variable-length sequences without padding

composition_of_experts:
  name: Samba-CoE
  experts: 150
  params_per_expert: 7B
  total_params: ~1T
  memory_strategy: weights_in_ddr_cached_to_hbm_computed_in_sram
  unique_to_rdu: DDR tier enables storing 2+ TiB of expert weights locally

