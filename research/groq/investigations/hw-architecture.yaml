chip: groq-lpu
investigation: hw-architecture
date: "2026-04-05"
last_updated: "2026-08-08"
confidence: high

device_class: "Deterministic TSP (Tensor Streaming Processor)"
also_known_as: LPU

generations:
  - name: LPU v1
    process: Samsung 14nm
    die_size_mm: "25x29"
    clock_mhz: 900
    tops_int8: 750
    tflops_fp16: 188
    on_chip_sram_mb: 230
    sram_bandwidth_tbs: 80
    dram: none
    released: 2022
  - name: LPU v2
    process: Samsung 4nm
    status: production_2025

compute:
  matrix_unit: "320x320 fused dot product"
  vector_alus: 5120
  no_cache: true
  no_branch_predictor: true
  no_out_of_order: true

execution_model:
  type: compiler_scheduled_static
  scheduling: compile_time_cycle_exact
  deterministic: true
  jitter: none

memory:
  type: on_chip_sram_only
  sram_per_die_mb: 230
  bandwidth_tbs: 80
  dram: none

multichip:
  protocol: plesiosynchronous
  topology: "direct mesh / dragonfly variant"
  external_switches: false
  groqrack_chips: 576
  groqrack_sram_gb: ~130
  groqrack_chip_bandwidth_tbs: 640  # SUPERSEDED 2026-08-08 -> see update_2026_08_08.groqrack_bandwidth_flag
  appear_as: single_coherent_memory

status_2026: nvidia_non_exclusive_license  # CORRECTED 2026-08-08; was "acquired_by_nvidia ($20B acquisition)" -- wrong

sources:
  - http://pkamath.com/publications/papers/tsp-isca20.pdf
  - https://groq.com/lpu-architecture
  - https://groq.com/blog/inside-the-lpu-deconstructing-groq-speed
  - https://hc34.hotchips.org/assets/program/conference/day2/Machine%20Learning/HotChips34%20-%20Groq%20-%20Abts%20-%20final.pdf

