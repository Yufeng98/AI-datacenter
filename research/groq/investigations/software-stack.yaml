chip: groq-lpu
investigation: software-stack
date: "2026-04-05"
last_updated: "2026-08-08"
confidence: high

framework_integration:
  primary: PyTorch (via GroqFlow groqit())
  secondary:
    - ONNX (direct)
    - TensorFlow (via ONNX export)
    - CoreML (via ONNX export)
  cloud_sdk:
    name: groq-python
    openai_compatible: true
    install: pip install groq
    url: https://github.com/groq/groq-python

compiler:
  name: Groq Compiler (groq-devtools)
  approach: AOT_static_spatial_scheduling
  ir_pipeline:
    - torch-MLIR or ONNX-MLIR frontend
    - Groq GTen dialect lowering
    - Op fusion (automatic, no custom kernels)
    - Spatial placement (physical unit assignment)
    - Cycle-exact scheduling
    - SRAM address assignment
    - Inter-chip routing schedule (multi-chip)
  output_format: .iop (Instruction Operation Program)
  custom_kernel_authoring: false  # intentional design choice
  mlir_based: true
  assembler: available for bare-metal/research

op_library:
  applicable: false
  reason: "All fusion handled by Groq Compiler on GTen dialect ops; no separate dispatch library"

kernel_library:
  applicable: false
  reason: "No user-facing kernel library; hardware execution is statically pre-scheduled"

runtime:
  name: groq-runtime
  type: minimal_static_replay
  features:
    - load .iop binary to hardware
    - one-time SRAM weight loading
    - deterministic execution replay
  no_dynamic_scheduling: true
  groqflow:
    url: https://github.com/groq/groqflow
    license: Apache-2.0
    one_liner: "groqit(model, inputs)"

communication:
  type: compiler_scheduled_plesiosynchronous
  no_nccl: true
  cloud_api: HTTPS REST

driver:
  type: pcie_kernel_module
  no_on_chip_firmware_rm: true  # unlike NVIDIA GSP

isa:
  user_visible: false
  no_ptx_equivalent: true
  binary_format: .iop (proprietary)

performance_2025:
  llama3_70b_tokens_per_sec: "~900 (standard), >1660 (speculative decoding)"
  llama3_8b_tokens_per_sec: ">1000"

