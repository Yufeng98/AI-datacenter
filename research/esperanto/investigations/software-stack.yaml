software_layers:
  framework_integration:
    - name: "PyTorch (via ONNX export)"
      role: "Model training; export via torch.onnx.export()"
      confidence: confirmed
    - name: "TensorFlow (via tf2onnx → ONNX)"
      role: "Alternative framework entry"
      confidence: confirmed
    - name: "ONNX (native first-class)"
      role: "Primary model interchange format"
      confidence: confirmed
    - name: "ONNXRuntime Custom Execution Provider"
      role: "Standard ONNX API; dispatches to ET-SoC-1 hardware"
      confidence: confirmed

  compiler_ir:
    - name: "Meta Glow (open source)"
      role: "Graph-level ML compiler; ONNX → RISC-V code"
      url: "https://github.com/pytorch/glow"
      confidence: confirmed
    - name: "LLVM RISC-V backend"
      role: "RISC-V code generation; extended for ET-Minion vector/tensor intrinsics"
      confidence: confirmed
    - name: "Primo AI/ML SDK"
      role: "Wrapper SDK: model compilation, profiling, deployment to ET-SoC-1"
      confidence: confirmed

  op_library:
    - name: "Not applicable — Glow compiler handles all op fusion"
      role: "No separate cuDNN/MIOpen equivalent"
      confidence: confirmed

  kernel_library:
    - name: "General Purpose HPC SDK (C/C++ for ET-Minion cores)"
      role: "OpenMP parallelism; RISC-V vector intrinsics; math library"
      confidence: confirmed
      launched: "May 2023"

  runtime:
    - name: "ONNXRuntime ET-SoC-1 EP"
      role: "Standard ONNXRuntime API; handles chip dispatch"
      confidence: confirmed
    - name: "Native RISC-V runtime"
      role: "ET-Minion init, SRAM allocation, PCIe DMA, result collection"
      confidence: confirmed
    - name: "Linux on ET-Maxion (4 OoO cores)"
      role: "OS; manages ET-Minion pool; enables standalone server mode"
      confidence: confirmed

  driver_firmware:
    - name: "PCIe Linux kernel module"
      role: "BAR mapping, DMA, interrupt handling"
      confidence: confirmed
    - name: "ET-Maxion Linux OS (no separate firmware RM)"
      role: "Resource management; ET-Minion loader"
      confidence: confirmed

  communication:
    - name: "Shared on-chip SRAM"
      role: "Intra-chip ET-Minion coordination"
      confidence: confirmed
    - name: "Host PCIe (multi-chip on Glacier Point v2)"
      role: "Chip-to-chip coordination via host; no dedicated fabric"
      confidence: inferred
    - name: "No collective library (no NCCL equivalent)"
      role: "Multi-chip parallelism handled at Glow compiler graph-partition layer"
      confidence: confirmed

  isa_assembler:
    - name: "RISC-V RV64GCV (base open standard)"
      role: "Fully accessible; standard GCC/LLVM assembler"
      confidence: confirmed
    - name: "Esperanto custom vector/tensor ISA extensions"
      role: "ET-Minion tensor instructions (32K ops/instruction); transcendental unit"
      confidence: confirmed
    - name: "No virtual ISA needed (RISC-V IS the virtual ISA)"
      role: "RISC-V is portable; no PTX-equivalent abstraction required"
      confidence: confirmed

