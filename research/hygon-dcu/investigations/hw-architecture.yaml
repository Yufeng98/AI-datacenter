chip: hygon-dcu
resource: hw-architecture
as_of: "2026-08-08"
baseline_as_of: "2026-04-05"
device_class: "GPU/DCU (China, 海光)"
status: completed

# NOTE (2026-08-08): every key in the legacy blocks below (compute_engine,
# on_chip_memory, off_chip_memory, host_interface, scale_up, scale_out, package)
# is scoped to 深算一号 (Y100) / 深算二号 (Z100, Z100L) / K100 / K100_AI.
# The CURRENT flagship is 深算三号 (BW1000) and NONE of these values apply to it.
# See update_2026_08_08 at the end of this file.
generation_scope_of_legacy_blocks: "Y100 / Z100 / Z100L / K100 / K100_AI only — NOT 深算三号 (BW1000)"

compute_engine:
  architecture: GCN/Vega-derived SIMT (AMD-lineage)
  wavefront_size: 64
  simd_width: 16
  cus_z100_class: ~60
  cus_k100_class: ~64
  clock_ghz: 1.7
  fp32_tflops:
    z100_class: ~45 (est.)
    shen_suan_2: 90
  fp16_tflops:
    z100_class: ~90 (est.)
    shen_suan_2: 180
  data_types: [FP64, FP32, FP16, BF16, INT8, INT4]
  tensor_unit: "No dedicated Tensor Core; FP16/BF16 via SIMD wide ops"

on_chip_memory:
  lds_per_cu_kb: 64
  vgpr_per_simd_kb: 64
  max_vgpr_per_thread: "256x 32-bit"
  l2_cache_mb_est: "4-8"

off_chip_memory:
  z100:
    type: HBM2
    capacity_gb: 16-32
    bandwidth_tbs: 1.0
  z100l:
    type: HBM2
    capacity_gb: 32
    bandwidth_tbs: 1.0
  k100_ai:
    type: HBM2e (est.)
    capacity_gb: 64
    bandwidth_tbs: ~1.2
    tdp_w: 400
  shen_suan_1_y100:
    type: HBM2
    capacity_gb: 32
    bandwidth_tbs: 1.0
    channels: 4

host_interface:
  type: PCIe Gen4 x16
  form_factor: FHFL dual-slot

scale_up:
  protocol: xGMI (AMD Infinity Fabric derivative)
  bandwidth_gb_s: 184
  topology: peer-to-peer multi-card

scale_out:
  protocol: Standard Ethernet / RoCE v2
  library: DTK RCCL

package:
  type: 2.5D interposer with HBM stacks
  process_est: TSMC 7nm (est.)

key_differentiators:
  - "x86 Hygon C86 (Zen-derived) CPU + DCU GPU in same vendor ecosystem"
  - "ROCm-compatible HIP programming model via DTK"
  - "64-thread wavefront (same as AMD CDNA)"
  - "xGMI scale-up (AMD Infinity Fabric compatible)"
  - "Entity-listed (US 2019) but manufacturing independent"
  # CORRECTED 2026-08-08: the merger did not complete.
  - "Sugon (中科曙光) absorption merger announced 2025-05-25 was TERMINATED by Hygon board 2025-12-09; Sugon remains independently listed (603019.SH)"

