chip: hygon-dcu
resource: software-stack
as_of: "2026-08-08"
baseline_as_of: "2026-04-05"
device_class: "GPU/DCU (China, 海光)"
status: completed

platform_name: DTK (DCU ToolKit / 深算开发工具包)
platform_url: https://developer.sourcefind.cn/dtk
platform_analogy: ROCm (AMD) analog; HIP-compatible

layers:
  framework_integration:
    - name: PyTorch (via DTK ROCm compat)
      type: framework
      notes: "torch.cuda → torch.hip mapping; PyTorch 2.4+ supported"
    - name: PaddlePaddle
      type: framework
      notes: "First-class DCU support; recommended for China market; 2.5+"
    - name: TensorFlow
      type: framework
      notes: "Via DTK ROCm backend; TF 2.13+"
    - name: vLLM (community port)
      type: inference_server
    - name: GPUStack
      type: inference_server
      url: https://docs.gpustack.ai/0.5/tutorials/running-inference-with-hygon-dcus/
    - name: FlyAIBox/dcu-in-action
      type: community_cookbook
      url: https://github.com/FlyAIBox/dcu-in-action

  compiler_ir:
    - name: hipcc
      type: compiler_driver
      notes: "LLVM/clang-based; HIP C++ → DCU ISA"
    - name: DTK LLVM suite
      type: compiler
      notes: "clang, clang++, OpenMP, OpenACC, rocm-gdb, rocprofv2"
    - name: hipify-perl / hipify-clang
      type: migration_tool
      notes: "CUDA → HIP automated translation; ~90-95% automated"

  op_library:
    - name: hipDNN / MIOpen
      analog: cuDNN
      ops: [Conv, BatchNorm, Pooling, Attention, LSTM]
    - name: hipBLAS
      analog: cuBLAS
      ops: [GEMM, BLAS L1-L3, batched GEMM]
    - name: hipSPARSE
      analog: cuSPARSE
    - name: hipFFT
      analog: cuFFT
    - name: hipRAND
      analog: cuRAND

  kernel_library:
    - name: hipThrust
      analog: Thrust
    - name: hipCUB / rocPRIM
      analog: CUB
    - name: rocBLAS
      analog: cuBLAS (lower-level)

  runtime:
    - name: HIP Runtime (hiprt)
      analog: libcudart.so
      apis: [hipMalloc, hipMemcpy, hipStream_t, hipEvent_t, hipLaunchKernelGGL, hipMallocManaged]
    - name: ROCr / HSA Runtime
      analog: CUDA Driver API
      notes: "Lower-level HSA agent model; rarely used directly"

  driver_firmware:
    - name: DCU kernel driver
      type: linux_kernel_module
      notes: "PCIe BAR, DMA, IOCTL; proprietary (not open-sourced)"
    - name: HAMi dcu-vgpu-device-plugin
      type: kubernetes_device_plugin
      url: https://github.com/Project-HAMi/dcu-vgpu-device-plugin
      notes: "vGPU sharing, memory limits, core quotas"
    - name: HAMi (Heterogeneous AI Management Infrastructure)
      url: https://github.com/Project-HAMi/HAMi

  communication:
    - name: RCCL (DCU port)
      analog: NCCL
      ops: [AllReduce, AllGather, ReduceScatter, Broadcast]
      intranode: xGMI peer-to-peer
      internode: RoCE v2 / Ethernet RDMA

  isa_assembler:
    - name: DCU ISA (GCN/Vega-derived)
      public: false
      notes: "Not independently published; amdgcn LLVM backend; v_ VGPR, s_ SGPR, ds_ LDS, buffer_ global"
    - name: hipcc / LLVM
      notes: "Handles all ISA targeting; inline amdgcn asm possible"

wavefront_vs_warp:
  cuda_warp_size: 32
  dcu_wavefront_size: 64
  migration_note: "Key difference; affects occupancy, bank conflicts, shfl semantics"

dtk_versions:
  - version: "23.x"
    rocm_equiv: "5.x"
    status: stable_production
  - version: "24.x"
    rocm_equiv: "6.x"
    status: current_mainstream
  - version: "25.x"
    rocm_equiv: "6.x+"
    status: latest
    alibaba_cloud_image: available

