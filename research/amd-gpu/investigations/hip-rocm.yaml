framework_integrations:
  - framework: PyTorch / ROCm
    integration_point: PyTorch ROCm uses HIP runtime via C++ extension; hipBLAS/rocBLAS for GEMM; hipFFT for FFT; MIOpen for DNN primitives
  - framework: TensorFlow / ROCm
    integration_point: TF ROCm backend calls HIP runtime for kernel launches and memory management
  - framework: OpenCL
    integration_point: CLR provides an OpenCL runtime sharing rocclr virtual device layer with HIP
  - framework: MPI (RCCL)
    integration_point: RCCL (ROCm Communication Collectives Library) uses HIP streams and peer memory for GPU-direct collectives over XGMI/PCIe

key_abstractions:
  - name: hipStream_t
    description: FIFO command queue mapping to an AQL hardware ring buffer; all async operations (kernels, memcpy, events) are enqueued here
  - name: AQL Dispatch Packet
    description: 64-byte Architected Queuing Language packet written directly to GPU-visible ring buffer specifying grid dims, kernel object pointer, kernarg address, and completion signal
  - name: Wavefront (warp)
    description: Fundamental SIMD execution unit; 64 threads on CDNA architectures (32 on RDNA) executing the same instruction in lockstep across SIMD-16 pipelines
  - name: Compute Unit (CU)
    description: Basic execution block containing sequencer, 4x SIMD-16 pipelines, VGPR/SGPR register files, MFMA matrix cores, LDS scratchpad, vL1D cache, and memory units
  - name: LDS (Local Data Share)
    description: Per-CU on-chip SRAM (64 KiB on CDNA, 32 banks); programmer-visible as __shared__; ~100x HBM bandwidth, used for intra-workgroup data sharing
  - name: MFMA Unit
    description: Matrix Fused Multiply-Add hardware accelerator on CDNA GPUs; executes v_mfma_* ISA instructions using VGPRs and AGPRs as matrix tile registers
  - name: GFX IP Version
    description: Virtual hardware target identifier (e.g., gfx942 for MI300X) decoupling HIP/LLVM IR from physical GPU; controls ISA features, warp size, and MFMA capabilities
  - name: hipGraph_t / hipGraphExec_t
    description: DAG of GPU operations (kernels, memcpy, events) recorded once and replayed with a single launch call, eliminating per-kernel driver overhead critical for AI inference
  - name: KFD (Kernel Fusion Driver)
    description: Linux kernel module managing GPU process address spaces, AQL queue creation, doorbell MMIO mappings, and HMM page-fault (XNACK) handling

hardware_dispatch_path:
  - step: 1
    action: "Application calls hipLaunchKernelGGL / triple-chevron"
    layer: HIP Runtime API
  - step: 2
    action: "HIP constructs 64-byte AQL Dispatch Packet (grid dims, kernel object, kernarg address, completion signal)"
    layer: HIP Runtime / CLR
  - step: 3
    action: "ROCr writes AQL packet to hardware ring buffer; rings doorbell MMIO register"
    layer: ROCr / HSA Runtime
  - step: 4
    action: "GPU Command Processor Fetcher (CPF) fetches packet; CPC decodes and forwards to ACE"
    layer: GPU Hardware - Command Processor
  - step: 5
    action: "ACE breaks dispatch into workgroups; SPI (Shader Processor Input) schedules workgroups onto CUs"
    layer: GPU Hardware - ACE / SPI
  - step: 6
    action: "CU executes wavefronts: SQ arbitrates instructions to VALU / MFMA / VMEM / LDS / SALU pipelines"
    layer: GPU Hardware - Compute Unit
  - step: 7
    action: "On completion, hardware decrements HSA completion signal; ROCr notifies HIP runtime"
    layer: ROCr / HSA Runtime

memory_hierarchy:
  - level: VGPR/SGPR register file
    size_per_cu: "256-512 KiB (VGPR) + 12.5 KiB (SGPR)"
    scope: per-thread / per-warp
    hip_keyword: automatic variables
    latency: 1 cycle
  - level: LDS (Local Data Share)
    size_per_cu: "64 KiB (CDNA) / 64 KiB (RDNA)"
    scope: per-workgroup
    hip_keyword: __shared__
    latency: ~5 cycles
  - level: vL1D cache
    size_per_cu: "16 KiB"
    scope: per-CU
    hip_keyword: transparent (global/local loads)
    latency: ~15 cycles
  - level: L2 cache
    size_total: varies (32 channels, 256B interleave)
    scope: per-GPU (coherence point)
    hip_keyword: transparent
    latency: ~100 cycles
  - level: HBM
    size: GB-scale (e.g., 192 GB on MI300X)
    scope: per-device
    hip_keyword: hipMalloc / __global__
    latency: ~200-500 cycles

