key_abstractions:
  - name: CU
    full_name: "Compute Unit"
    description: "The fundamental programmable GPU compute block in CDNA architecture. Contains 4×SIMD16 units, 1 Matrix Core, LDS (64 KB), L1 caches, wavefront scheduler, VGPR/SGPR register files."
    cdna3_count_per_device: 304
    cdna4_count_per_device: 256

  - name: Matrix_Core
    full_name: "Matrix Core (MFMA)"
    description: "Dedicated tensor accelerator within each CU. Executes Matrix Fused Multiply-Add (MFMA) instructions. CDNA3 supports FP64/FP32/FP16/BF16/FP8/INT8; CDNA4 adds FP6/FP4 (OCP MX micro-scale formats)."
    cdna3_data_types: [FP64, FP32, FP16, BF16, FP8, INT8]
    cdna4_data_types: [FP64, FP32, FP16, BF16, FP8, FP6, FP4, INT8]

  - name: Wavefront
    full_name: "Wavefront (AMD warp equivalent)"
    description: "AMD's SIMT execution group of 64 threads. One wavefront executes across 4 SIMD16 units over 4 clock cycles. The wavefront scheduler issues instructions in round-robin across SIMDs."
    threads: 64
    execution_cycles: 4
    scheduling: round_robin_simd

  - name: Infinity_Fabric
    full_name: "Infinity Fabric / XGMI"
    description: "AMD's coherent high-bandwidth interconnect. On-package: connects XCDs and IODs within MI300X. Inter-chip (XGMI): connects MI300X GPUs within a node — 7 links per GPU, 128 GB/s bidirectional each, full mesh in 8-GPU configs."
    xgmi_links_per_gpu: 7
    xgmi_bandwidth_per_link_gbs: 128
    topology: full_mesh

  - name: XCD
    full_name: "Accelerator Complex Die"
    description: "The stackable GPU compute chiplet in AMD's MCM packages. Each XCD in MI300X is TSMC 5nm and contains 40 physical CUs (38 enabled), 4 MB L2 cache. MI300X has 8 XCDs per package; MI350X has 8 XCDs on TSMC N3P."
    cdna3_process: "TSMC N5 (5nm)"
    cdna3_cus_physical: 40
    cdna3_cus_enabled: 38
    cdna3_l2_mb: 4
    cdna4_process: "TSMC N3P (3nm)"
    cdna4_cus_enabled: 32

