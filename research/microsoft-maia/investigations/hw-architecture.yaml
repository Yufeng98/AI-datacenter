chip: microsoft-maia
document: hw-architecture
as_of: "2026-04-05"
primary_sources:
  - "HC2024 'Inside Maia 100' — Sherry Xu, Microsoft (August 2024)"
  - "Microsoft Tech Community — Inside Maia 100 blog"
  - "Microsoft Blog — Maia 200 announcement (January 2026)"
  - "Microsoft Tech Community — Deep dive into the Maia 200 architecture"

generations:
  maia_100:
    announced: "November 2023"
    presented_at: "Hot Chips 2024 (HC2024)"
    deployed: "Late 2024"
    primary_use: "Training and inference"
    process: "TSMC N5 (5nm)"
    package: "CoWoS-S interposer"
    die_size_mm2: 820
    transistors_B: 105
    tdp_w_nominal: 500
    tdp_w_max: 700
    compute:
      mx6_pops: 3.0
      mx9_pops: 1.5
      bf16_pops: 0.8
    tensor_unit:
      type: "16xRx16 high-speed tensor unit"
      formats: ["MX6", "MX9", "BF16"]
      isa: "not public"
    vector_processor:
      type: "loosely coupled superscalar"
      isa: "custom, not public"
      formats: ["FP32", "BF16"]
    dma_engine:
      features: ["tensor sharding schemes", "hardware semaphores", "async programming"]
    on_chip_sram_mb: 500
    sram_management: "software-managed scratchpad (no hardware cache)"
    hbm_type: "HBM2e"
    hbm_capacity_gb: 64
    hbm_bandwidth_tbs: 1.8
    hbm_stacks: 4
    host_interface:
      type: "PCIe Gen5 x8"
      bandwidth_gbs: 32
    scale_up_network:
      protocol: "custom RoCE-like transport"
      allgather_scatter_gbps: 4800
      alltoall_gbps: 1200
      ports: "12x 400GbE"
      backend_bandwidth_gbs: 600
      encryption: "AES-GCM"
    rack_system:
      name: "Ares"
      chips_per_rack: 32
      servers_per_rack: 8
      rack_power_kw: 40
      cooling: "mandatory liquid cooling"
      tors: "Arista + Cisco dual-sourced"

  maia_200:
    announced: "January 26, 2026"
    deployed: "January 27, 2026"
    primary_use: "Inference-optimized"
    process: "TSMC N3 (3nm)"
    transistors_B: 140
    tdp_w: 750
    compute:
      fp4_pflops: 10
      fp8_pflops: 5
    architecture:
      hierarchy: "Tile -> Cluster"
      tile_components: ["Tile Tensor Unit (TTU)", "Tile Vector Processor (TVP)", "Tile SRAM (TSRAM)", "tile DMA"]
      cluster_components: ["multiple tiles", "Cluster SRAM (CSRAM)", "cluster DMA (HBM<->CSRAM)"]
    tensor_unit:
      type: "Tile Tensor Unit (TTU)"
      formats: ["FP4", "FP8", "BF16"]
    vector_processor:
      type: "Tile Vector Processor (TVP)"
      description: "highly programmable SIMD engine"
    on_chip_sram_mb: 272
    sram_tiers:
      tsram: "per-tile; hot activation buffer; ~10-20x HBM bandwidth"
      csram: "per-cluster shared; second-tier locality; stages HBM traffic"
    hbm_type: "HBM3e"
    hbm_capacity_gb: 216
    hbm_bandwidth_tbs: 7.0
    hbm_supplier: "SK Hynix (reported)"
    scale_up_network:
      nic_location: "integrated on-die"
      bandwidth_tbs: 2.8
      topology: "2-tier scale-up network"
      max_cluster_size: 6144
      protocol: "advanced transport (enhanced reliability + congestion control)"

