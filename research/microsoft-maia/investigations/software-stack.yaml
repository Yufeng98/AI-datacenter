chip: microsoft-maia
document: software-stack
as_of: "2026-04-05"
primary_sources:
  - "Azure Blog — From silicon to software to systems"
  - "Microsoft Tech Community — Inside Maia 100"
  - "Microsoft Blog — Maia 200 announcement (January 2026)"
  - "HC2024 Inside Maia 100 PDF"

framework_integration:
  pytorch:
    status: confirmed
    modes: ["eager mode", "graph mode (torch.compile-style)"]
    notes: "first-class PyTorch backend; standard model code runs without modification"
  azure_openai_services:
    status: confirmed
    notes: "Maia serves Azure OpenAI production inference (Copilot, Azure AI Studio)"

sdk:
  name: "Maia SDK"
  availability: "preview (Azure customers only)"
  open_source: false
  programming_models:
    triton:
      name: "Triton programming model"
      language: "Python DSL (OpenAI Triton)"
      open_source_base: true
      maia_backend_open: false
      characteristics: ["agility", "portability", "GPU + Maia cross-target"]
    npl:
      name: "NPL — Nested Parallel Language"
      description: "Maia-specific custom programming model"
      open_source: false
      explicit_control:
        - "data movement (DMA scheduling)"
        - "SRAM placement (TSRAM/CSRAM tier selection)"
        - "parallel execution mapping"
      performance: "near-peak hardware utilization"
  tools:
    - name: "Triton compiler for Maia"
      type: compiler
      status: not_public
    - name: "NPL compiler"
      type: compiler
      status: not_public
    - name: "Maia simulator"
      type: emulator
      status: not_public
    - name: "Cost calculator"
      type: performance_tool
      status: not_public
    - name: "Debugger"
      type: developer_tool
      status: not_public
    - name: "Profiler"
      type: developer_tool
      status: not_public
    - name: "Visualizer"
      type: developer_tool
      status: not_public
    - name: "Model quantization tools"
      type: developer_tool
      status: not_public
    - name: "Validation suite"
      type: developer_tool
      status: not_public

kernel_library:
  status: not_public
  description: "Microsoft-built ML compute + communication kernels using SDK compilers"
  known_kernels:
    - "GEMM / batched GEMM"
    - "Attention (SRAM-tiling aware)"
    - "All-gather, scatter-reduce, all-to-all collectives"
    - "Activations, normalization"
  custom_kernel_authoring: "supported via Triton or NPL"

runtime:
  status: not_public
  availability: "SDK preview"
  functions:
    - "kernel dispatch and scheduling"
    - "SRAM allocation"
    - "HBM buffer management"
    - "DMA queue management"
    - "synchronization (hardware semaphores)"

driver_firmware:
  driver:
    status: not_public
    notes: "Azure-internal; not upstreamed to Linux kernel"
  firmware:
    status: not_public
    notes: "Maia 100 firmware-upgradeable; 'new capabilities via firmware update' confirmed"

communication:
  maia_100:
    protocol: "custom RoCE-like transport over Ethernet"
    allgather_scatter_gbps: 4800
    alltoall_gbps: 1200
    encryption: "AES-GCM (confidential compute)"
    topology: "unified scale-up + scale-out"
  maia_200:
    protocol: "advanced on-die transport"
    bandwidth_tbs: 2.8
    tiers: 2
    max_cluster_size: 6144

isa:
  vector_processor:
    status: not_public
    formats: ["FP32", "BF16"]
  tensor_unit:
    status: not_public
    formats_maia100: ["MX6", "MX9", "BF16"]
    formats_maia200: ["FP4", "FP8", "BF16"]
  mx_format:
    name: "MX (Microscaling)"
    standard: "OCP (Open Compute Project)"
    co_developers: ["Microsoft", "AMD", "Arm", "Intel", "Meta", "Qualcomm", "NVIDIA"]
    spec_public: true
    spec_url: "https://www.opencomputeproject.org/projects/mx"
    maia_isa_implementation: not_public

data_types:
  maia_100: ["MX6", "MX9", "BF16", "FP32"]
  maia_200: ["FP4", "FP8", "BF16", "FP32"]

