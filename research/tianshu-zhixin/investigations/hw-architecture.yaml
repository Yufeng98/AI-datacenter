    # ---- Added 2026-08-08 ----
    - name: "TianGai 300 (天垓300)"
      generation: "New-generation self-developed architecture (no public architecture name)"
      purpose: "General-purpose GPU flagship — AI training + inference"
      announced: "2026-07-19"
      announced_venue: "WAIC 2026 (World AI Conference), Shanghai, day 3 of July 17-20"
      status: announced
      status_verb_note: >-
        Company states only '天垓300已具备规模化应用条件' ('meets the conditions for large-scale
        deployment') plus adaptation/joint-solution discussions with domestic cloud providers,
        server OEMs and supernode system vendors. This is a company readiness assertion, NOT
        evidence of tape-out, sampling, mass production, or any named deployment.
        TianGai-100/150 remain the shipping products.
      vendor_product_node: "cpjs-yj-xlxl-tg300"
      vendor_spec_sheet_published: false
      confidence: confirmed_existence_only
      sources: ["iluvatar-site", "tencent-news-tg300-a", "tencent-news-tg300-b", "ithome-tg300", "semi-insights-tg300", "aastocks-09903hk"]

      architecture:
        execution_model: "SIMT retained (scalar + vector + tensor execution paths)"
        generation_change: true
        derivative_of_big_island: false
        confidence: confirmed
        sources: ["tencent-news-tg300-a", "ithome-tg300", "semi-insights-tg300"]

      data_types:
        fp8: true
        fp4: true
        note: "First Iluvatar part for which FP8/FP4 is claimed. Peak throughput at every dtype NOT disclosed."
        instruction_classes: ["MMA", "DPX", "FMA"]
        confidence: confirmed
        sources: ["tencent-news-tg300-a", "tencent-news-tg300-b"]

      isa_extensions:
        extensions:
          - name: ixSMEX
            function: "Raises data reuse to cut redundant memory traffic"
          - name: ixDPX
            function: "Compresses a six-instruction dynamic-programming sequence into one instruction"
            nearest_analogue: "NVIDIA Hopper DPX instructions"
          - name: ixTrans
            function: "Lossless matrix transpose; reduces bank conflicts and VRAM overhead"
        encodings_disclosed: false
        note: "The only concrete microarchitectural detail disclosed for TianGai 300."
        confidence: confirmed
        sources: ["tencent-news-tg300-a", "tencent-news-tg300-b"]

      workload_optimizations_named:
        optimizations:
          - "Attention/FFN (AF) separation"
          - "Prefill/decode (PD) separation"
        implementation_disclosed: false
        confidence: reported
        sources: ["semi-insights-tg300"]

      not_disclosed:
        # Positive findings: actively checked, no public figure exists. Never estimate these.
        fields:
        - process_node
        - foundry
        - die_size
        - transistor_count
        - packaging
        - memory_type            # incl. HBM generation — the raw scan's 'uses HBM' claim is NOT supported
        - memory_capacity
        - memory_bandwidth
        - on_chip_sram_l1_l2
        - peak_flops_fp32
        - peak_flops_tf32
        - peak_flops_bf16
        - peak_flops_fp16
        - peak_flops_fp8
        - peak_flops_fp4
        - peak_tops_int8
        - compute_unit_count
        - tensor_unit_dimensions
        - clock_frequency
        - scale_up_link_bandwidth_per_chip
        - host_interface_generation
        - tdp
        - form_factor
        - card_board_name
        - price
        confidence: confirmed_absence
        sources: ["iluvatar-site", "tencent-news-tg300-b"]

      vendor_performance_claims:
        # MARKETING. First-party, relative-only, unverified. Baseline is an unspecified
        # 'Hopper-architecture mainstream international solution' — NOT Blackwell.
        baseline: "NVIDIA Hopper (unspecified solution)"
        third_party_verified: false
        mlperf_submission: false
        absolute_figures_published: false
        claims:
          attention_efficiency: ">90% across precisions; ~10% above Hopper at 64k context"
          moe_compute_efficiency: ">70%; ~10% higher average MoE throughput on a DeepSeek-V4-class workload"
          time_to_first_token: "~20% lower across Qwen / GLM / Kimi / DeepSeek"
          decode_efficiency: "~10% higher"
          inter_card_comm_latency: "~13% lower average"
          energy_efficiency: "'above mainstream Hopper solutions' — no figure given"
        confidence: vendor_claim
        sources: ["tencent-news-tg300-a", "tencent-news-tg300-b", "ithome-tg300"]

