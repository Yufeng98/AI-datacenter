source_independence_caveat: >-
  The many Chinese outlets covering the 2026-07-19 launch appear to derive from a common
  company briefing. Source count is high; true independence is low. Nothing in the coverage
  is independently measured, and no vendor specification sheet exists to check it against.

confidence_vocabulary:
  confirmed: "Multiple sources agree and a primary artifact supports it"
  confirmed_existence_only: "Product/feature provably exists (vendor listing) but no specification is published"
  confirmed_absence: "Actively checked; no public figure exists. A positive finding — never fill by estimation"
  announced: "Vendor has stated it; no verifiable specification published"
  vendor_claim: "First-party marketing; unverified by any third party"
  company_stated: "Company-reported business/deployment figure; not independently audited"
  reported: "Appears in secondary coverage; not corroborated by a primary artifact"
  unverified: "Claim exists in coverage but no source connects it to a real product"
