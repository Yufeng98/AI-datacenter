  # ---- Added 2026-08-08 ----
  name: "天数超节点 (Tianshu supernode)"
  announced: "2026-07-19"
  claimed_domain_size_chips: 144
  claimed_property: "high-speed full interconnect"
  significance: "First scale-up domain size Iluvatar CoreX has ever stated publicly (prior public ceiling: 8 GPUs/server over CLIF)"
  status: "trial / partnership-discussion stage — explicitly pre-production"
  not_disclosed:
    fields:
    - topology                      # full mesh vs switched fabric unstated
    - per_link_bandwidth
    - per_chip_bandwidth
    - switch_asic                   # no switch chip named
    - single_coherent_domain_status
    - rack_power_and_cooling
    - relationship_to_clif          # extends CLIF or a new fabric: unstated
  comparability_note: >-
    With neither bandwidth nor topology published, the supernode cannot be compared
    quantitatively to NVL72, CloudMatrix384, or any other rack-scale domain.
    Only the domain size (144) is citable, and only as a company claim.
  confidence: vendor_claim
  sources: ["tencent-news-tg300-a", "tencent-cloud-waic2026"]

roadmap:
  # Big-Dipper (北斗七星) ARCHITECTURE codenames, from Jan 2026 press coverage of an
  # investor-facing roadmap. Kept as a SEPARATE namespace from the 天垓 PRODUCT line.
  codename_mapping_status: unresolved
  codename_mapping_note: >-
    No retrieved source ties TianGai 300 (or any shipped/announced product) to 天枢/天璇/天玑/天权.
    Two signals argue against assuming TianGai 300 = Tianxuan: (1) 天垓300 is named from the 天垓
    product line, which already contains 天垓100 and 天垓150, not from the Big-Dipper architecture
    namespace; (2) the Jan 2026 roadmap positioned the 2026 generation against B200/Blackwell,
    whereas TianGai 300's own marketing benchmarks are all against Hopper.
  codename_sources: ["trendforce-roadmap", "trendforce-roadmap-jan28", "tomshardware-roadmap"]
  entries:
    - name: "Tianshu (天枢)"
      year: 2025
      vs_nvidia: "Claims to exceed Hopper H100/H200"
      confidence: announced
    - name: "Tianxuan (天璇)"
      year: 2026
      vs_nvidia: "Targets Blackwell B200"
      confidence: unverified
      note: "Roadmap codename only; no product tied to this name as of 2026-08-08"
    - name: "Tianji (天玑)"
      year: 2026
      vs_nvidia: "Claims to surpass Blackwell"
      confidence: unverified
      note: "Roadmap codename only; no product tied to this name as of 2026-08-08"
    - name: "Tianquan (天权)"
      year: 2027
      vs_nvidia: "Targets Rubin R100"
      confidence: announced

