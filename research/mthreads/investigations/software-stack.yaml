chip: mthreads
resource: software-stack
as_of: "2026-08-08"
baseline_as_of: "2026-04-05"
status: completed
device_class: "GPU (China, 摩尔线程)"

sdk_name: MUSA (Meta-computing Unified System Architecture)
sdk_version_current: "5.1.0"   # was 4.0.1 at the 2026-04-05 baseline; see update_2026_08_08
sdk_version_baseline: "4.0.1"
github_org: "https://github.com/MooreThreads"

layers:
  framework_integration:
    - name: torch_musa
      type: PyTorch backend
      cuda_analog: torch.cuda / CUDA backend
      repo: "https://github.com/MooreThreads/torch_musa"
      open_source: true
      operators_supported: 470+
      features: [MUSAGraph, TorchInductor, triton_musa, FP8, LLM fusion modules]

    - name: vllm-musa
      type: LLM inference serving
      cuda_analog: vLLM
      repo: "https://github.com/MooreThreads/vllm-musa"
      open_source: true
      pypi: vllm-musa
      models: [LLaMA, Qwen, Baichuan]

    - name: llama.cpp MUSA backend
      type: GGML inference
      repo: "https://github.com/ggml-org/llama.cpp"
      pr: 8383
      merged: true

  compiler_ir:
    - name: MCC
      full_name: MUSA C Compiler
      cuda_analog: nvcc
      function: "Compiles MUSA C++ kernels (<<<>>> launch syntax) to MUSA ISA binary"
      included_in_sdk: true

    - name: Musify / CUDA ON MUSA
      type: source translator
      cuda_analog: none (unique)
      function: "Automated CUDA→MUSA source substitution; cuBLAS/cuDNN/NCCL shims"

    - name: tilelang_musa
      type: kernel DSL
      cuda_analog: Triton / CUTLASS templates
      repo: "https://github.com/MooreThreads/tilelang_musa"
      function: "Tile-level kernel authoring; compiles to MUSA C via MCC"

    - name: "TorchInductor + triton_musa"
      type: "torch.compile backend"
      cuda_analog: "TorchInductor + Triton"
      function: "Enables torch.compile() on MTT GPUs"

  op_library:
    - name: muDNN
      cuda_analog: cuDNN
      ops: [Conv2D, SDPA/Attention, Normalization, Pooling, Activation]
      precisions: [FP32, BF16, FP16, INT8]

    - name: muBLAS
      cuda_analog: cuBLAS
      ops: [GEMM, BLAS L1-L3, batch matmul]
      precisions: [FP32, BF16, FP16, INT8]

    - name: MATE
      full_name: MUSA AI Tensor Engine
      type: high-level LLM inference primitives
      python_bindings: mthreads-ml-py
      used_by: vllm-musa

  kernel_library:
    - name: muThrust
      cuda_analog: Thrust
      ops: [Reduce, Scan, Sort, parallel primitives]

    - name: muFFT
      cuda_analog: cuFFT
      ops: [FFT operations]

    - name: tilelang_musa
      cuda_analog: "CUTLASS / Triton"
      type: manual kernel authoring framework

  runtime:
    - name: "MUSA Runtime (musart / libmusa.so)"
      cuda_analog: "CUDA Runtime (cudart)"
      apis: [musaMalloc, musaFree, musaMemcpyAsync, musaStreamCreate, musaEventCreate]
      launch_syntax: "<<<grid, block, shmem, stream>>>"

    - name: MUSA Driver API
      cuda_analog: CUDA Driver API
      function: "Context management, module loading, fine-grained memory control"

    - name: torchada
      type: "CUDA→MUSA compatibility shim"
      used_by: vllm-musa

  driver_firmware:
    - name: MUSA Kernel Driver (.ko)
      function: "PCIe BAR, IOCTL, DMA, interrupts"
      os_support: ["Ubuntu (Intel x86)", "Kylin (Hygon x86)"]

    - name: Kubernetes Device Plugin
      function: "GPU resource advertising, health monitoring, multi-tenancy"

  communication:
    - name: MCCL
      full_name: MUSA Collective Communication Library
      cuda_analog: NCCL
      ops: [AllReduce, AllGather, ReduceScatter, Broadcast]
      intra_node: MTLink 1.0 hardware fabric
      inter_node: "Ethernet / RoCE"
      tested_scale: 10000 GPUs

  isa:
    - name: MUSA ISA
      type: proprietary SIMT
      public: false
      precisions_chunxiao: [FP32, TF32, BF16, FP16, INT8]
      precisions_flower_harbor: [FP64, FP32, BF16, FP16, FP8, FP4, MTFP6, MTFP4, INT8]
      note: "No public virtual ISA equivalent; not analogous to NVIDIA PTX"

cuda_compatibility:
  source_translation: Musify (automated)
  runtime_parity: "Full API parity (musaMalloc = cudaMalloc pattern)"
  library_shims: [muBLAS→cuBLAS, muDNN→cuDNN, MCCL→NCCL, muThrust→Thrust]
  extension_parity: "MUSAExtension = CUDAExtension"

ecosystem_status:
  llm_training: "3B-param LLM trained on MTT S4000 cluster (confirmed 2024)"
  llm_inference: "LLaMA/Qwen/Baichuan via vllm-musa"
  max_cluster_scale: 10000 GPUs
  maturity: "Growing; significantly less mature than CUDA"

