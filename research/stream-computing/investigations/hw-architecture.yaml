# ── Compute Engine ────────────────────────────────────────────────────────────
compute_engine:
  npc_core:
    name: "NeuralScale core (NPC — Neural-network Processing Core)"
    model: "RISC-V scalar core driving three decoupled execution engines (MIMD per core, not SIMT)"
    scalar_core: "AndesCore N25F licensed IP — 32-bit RV32G, 5-stage in-order, dynamic branch prediction"
    scalar_caches: "64 KB L1 I$ + 64 KB L1 D$ per core (hardware-cached; control path only)"
    pipeline: "4 stages (decode / issue / execute / write-back); 3 instruction buffers; in-order issue up to 3 instr/cycle (one per engine); blocks only on address overlap"
    engines:
      vme:
        name: "Vector MAC Engine"
        macs: "64 FP16 MACs"
        special_functions: "POLY module — exp, div, sqrt"
        operands: "base RVV (vector registers) + custom vector instructions (L1 / Intermediate Buffer byte addresses in GPRs)"
      mme:
        name: "Matrix MAC Engine"
        macs: "64 x 32 = 2048 MAC units"
        per_mac: "1x FP16 or 2x INT8 per cycle"
        dataflow: "reads Data Input Buffer + Weight Buffer; writes Intermediate Buffer"
      mte:
        name: "Memory Transfer Engine"
        function: "explicit data movement L1 <-> remote L1 / LLB / DDR over the NoC"
        modes: ["L1<->LLB point-to-point", "L1<->DRAM point-to-point", "LLB broadcast to all corresponding L1 Buffers"]
    rvv_config: "VLEN = 1024 bits, ELEN = 16 bits (RVV v0.8)"
    vector_register_count: "not disclosed"
    confidence: confirmed
    sources:
      - https://carrv.github.io/2021/papers/CARRV2021_paper_67_Zhan.pdf

  datatypes:
    supported: [FP16, INT8]
    absent: [BF16, FP8, FP4, INT4, "native FP32 compute path"]
    note: "All models in the vendor support table are FP16 or w8a8 / w8a16 quantised."
    confidence: confirmed
    sources:
      - https://docs.streamcomputing.com/AI加速卡/开发者资源/模型支持说明
      - https://docs.streamcomputing.com/AI加速卡/硬件产品手册/STCP920产品手册

  p920_soc:
    neuralscale_cores: 32
    clusters: 4
    cores_per_cluster: "not disclosed (32/4 = 8 is derived; no source states it)"
    management_cpu: "ARM Cortex-A53 — in-order, 8-stage, dual-issue; PPI + up to 64 SPI interrupts; SoC boot and management"
    peak_fp16_tflops: 128
    peak_int8_tops: 256
    clock_ghz: 1.0
    throughput_reconciliation: "2048 MME MACs x 2 flop x 32 cores x 1 GHz = 131.1 TFLOP/s FP16 (quoted 128); x2 for INT8 = 262 TOP/s (quoted 256). VME MACs (+4.1 TFLOPS) appear excluded. [derived]"
    process_node: "TSMC 12 nm FinFET"
    die_area_mm2: 400
    chip_tdp_w: 130
    transistor_count: "not disclosed"
    package: "not disclosed"
    peripherals: [UART, SPI, I2C, PWM, RTC]
    frequency_domains: "east / west SoC domains, independently settable (stc-smi -s --freq --east/--west; stcmlDeviceSetFrequency 0x1=west, 0x10=east, 0x11=both)"
    power_domains: "4 independent banks; host may gate 1-3 (power-save) or all 4 (standby, static power only) over PCIe"
    dvfs_mhz: [624, 800, 900, 1000, 1100, 1200, 1300, 1400]
    dvfs_note: "Card manual lists 624/800/900/1000/1200; stcml API lists all eight; stc-smi CLI exposes only 1000/900."
    voltages: "vsoc 800-950 mV; vmac 550-950 mV (stc-smi) vs 550-800 mV (stcmlVoltageInfo_t) — authoritative range not disclosed"
    confidence: confirmed
    sources:
      - https://carrv.github.io/2021/papers/CARRV2021_paper_67_Zhan.pdf
      - https://docs.streamcomputing.com/AI加速卡/硬件产品手册/STCP920产品手册
      - https://docs.streamcomputing.com/AI加速卡/开发者资源/C++_API

# ── ISA ───────────────────────────────────────────────────────────────────────
isa:
  shipping_product_isa:
    base: "RV32G scalar (AndesCore N25F) + RVV v0.8"
    custom_instructions: 53
    opcode: "custom-3 major opcode 1111011, designated OP-VE"
    encoding: "[31:26] funct6 | [25] dmc | [24:20] rs2 | [19:15] rs1 | [14] dm | [13:12] opm2 | [11:7] rd | [6:0] 1111011"
    operand_shape_classes: "opm2 — 00 matrix-matrix (mm), 01 matrix (m), 10 matrix-vector (mv), 11 matrix-scalar (mf)"
    direction_encoding: "{dmc,dm} — {0,X} full-element, {1,0} vertical on row vectors, {0,1} horizontal on column vectors"
    example_instructions: [veadd, vesub, veacc, veemul, veemacc, memul, meconv, velkrelu, mov]
    custom_csrs: 22
    csr_examples: ["0x400 shape_s1", "0x401 shape_s2", "0x408 conv_FM_in", "0x409 conv_Depth_in", "0x422 mte_shape"]
    standardisation: "vendor-custom extension, NOT the ratified RISC-V matrix/IME extension"
    live_confirmation: "SDK ships inst_decoder.py (MLTC tools/): 0x06ABE8FB -> veadd.mv.dimw (x17), (x23), (x10)"
    open_source: false
    confidence: confirmed
    sources:
      - https://carrv.github.io/2021/papers/CARRV2021_paper_67_Zhan.pdf
      - https://docs.streamcomputing.com/AI加速卡/推理软件使用手册/STCRP使用指南/MLTC使用指南

  open_matrix_extension_proposal:
    note: "SEPARATE from the shipping ISA — the P920 does NOT implement this. Company standards work only."
    repo: https://github.com/riscv-stc/riscv-matrix-spec
    license: CC-BY-4.0
    version: "v0.5 announced Nov 2024"
    last_activity: "Dec 2024"
    stars: 27
    register_model: "8 tile registers tr0-tr7 + 8 accumulation registers acc0-acc7"
    parameters: [ELEN, MLEN, RLEN, "AMUL in {1,2,4,8}"]
    tile_shape: "mtilem x mtilen x mtilek; mtype CSR via msettype / msettypei"
    sub_extensions: [Zmi4, Zmv, Zmi2c, Zmc2i, Zmsp]
    company_standing_vendor_claim: "RISC-V International Premier member, board + TSC member, chair of Software Applications & Tools committee, chair of AI/ML SIG, core member of Matrix TG"
    confidence: confirmed
    sources:
      - https://github.com/riscv-stc/riscv-matrix-spec
      - https://raw.githubusercontent.com/riscv-stc/riscv-matrix-spec/main/tilereg.adoc
      - https://raw.githubusercontent.com/riscv-stc/riscv-matrix-spec/main/param.adoc

# ── Memory ────────────────────────────────────────────────────────────────────
on_chip_memory:
  management_model: "Software-managed and non-coherent. NoC labelled 'Non-coherent interconnect'; custom VME/MME instructions take L1/IM byte addresses in GPRs; all inter-level movement is explicit MTE / sysDMA. Only the 64 KB scalar I$/D$ are hardware caches (control path)."
  confidence: confirmed
  sources:
    - https://carrv.github.io/2021/papers/CARRV2021_paper_67_Zhan.pdf

  l1_buffer:
    scope: per NPC
    capacity: "1.25 MiB (1 MiB Data IO Buffer + 0.25 MiB Weight Buffer)"
    bandwidth: "512 GB/s — single third-party-hosted vendor figure; no vendor manual states L1 bandwidth"
    managed_by: "software (MTE + explicit addressing)"
    confidence: confirmed   # capacity
    bandwidth_confidence: unconfirmed
    sources:
      - https://docs.streamcomputing.com/AI加速卡/硬件产品手册/STCP920产品手册
      - https://github.com/bytedance/xpu-perf/blob/main/projects/infer_perf/general_perf/backends/STC/README.md

  intermediate_buffer:
    scope: per NPC
    capacity_kb: 256
    bandwidth: "not disclosed"
    role: "MME output / VME staging, private per core"
    managed_by: software
    confidence: confirmed
    sources:
      - https://carrv.github.io/2021/papers/CARRV2021_paper_67_Zhan.pdf
      - https://docs.streamcomputing.com/AI加速卡/希姆计算术语表

  scalar_caches:
    scope: per NPC
    capacity: "64 KB I$ + 64 KB D$"
    managed_by: "hardware cache (control path only, not tensor data)"
    confidence: confirmed

  llb:
    name: "LLB — Last Level Buffer"
    scope: per NPC Cluster
    capacity_per_cluster_mib: 8
    capacity_total_mib: 32
    organisation: "8 x 4 MB banks, each independently attached to the NoC"
    bandwidth: "CONTESTED — CARRV'21 states 17 TB/s aggregate; the ByteDance-hosted vendor spec table states 8 MB @ 256 GB/s per cluster (~1 TB/s chip-wide). ~17x apart, unreconciled in any source."
    managed_by: "software (MTE, sysDMA)"
    confidence: confirmed   # capacity
    bandwidth_confidence: unconfirmed
    sources:
      - https://carrv.github.io/2021/papers/CARRV2021_paper_67_Zhan.pdf
      - https://docs.streamcomputing.com/AI加速卡/硬件产品手册/STCP920产品手册
      - https://github.com/bytedance/xpu-perf/blob/main/projects/infer_perf/general_perf/backends/STC/README.md

  total_sram_derived: "80 MiB = 32 x (1.25 MiB L1 + 0.25 MiB IM) + 32 MiB LLB, plus 4 MiB scalar caches. Derived, not vendor-stated."
  total_sram_confidence: likely

off_chip_memory:
  type: LPDDR4X
  capacity_gb: 16
  organisation: "4 GiB per cluster x 4 clusters; 4 independent DDR subsystems"
  interface: "256-bit, 1867 MHz clock (3733 MT/s); stc-smi -g --freq reports 'ddr frequency 3733'"
  bandwidth_stated_gbps: 108
  bandwidth_alternatives:
    - "119.4 GB/s — ByteDance-hosted vendor spec table (2023)"
    - "119.5 GB/s — derived from 256 b x 3733 MT/s / 8"
    - "136 GB/s theoretical — CARRV'21 design description (LPDDR4 @ 4266 MT/s)"
  bandwidth_note: "Confirmed 16 GB LPDDR4X at ~108-119 GB/s; the authoritative figure and the reason for the 108 GB/s derating are NOT DISCLOSED."
  dma: "2 DMA controllers per DDR subsystem (stc-smi 'DMA count: 2' per cluster); profiler sysdma_0 / sysdma_1, C0 = DDR->LLB, C1 = LLB->DDR"
  confidence: confirmed
  bandwidth_confidence: unconfirmed
  sources:
    - https://docs.streamcomputing.com/AI加速卡/硬件产品手册/STCP920产品手册
    - https://carrv.github.io/2021/papers/CARRV2021_paper_67_Zhan.pdf
    - https://github.com/bytedance/xpu-perf/blob/main/projects/infer_perf/general_perf/backends/STC/README.md

memory_bound_consequence:
  statement: "~108 GB/s against 128 TFLOPS FP16 implies >1000 FLOP/byte arithmetic intensity to saturate compute. Vendor's own LLM table: Qwen2-7B-Instruct 2 cards @ 10.39 tok/s; Qwen2-72B-Instruct 16 cards @ 4.98 tok/s; DeepSeek-R1-Distill-Llama-70B 16 cards @ 4.42 tok/s."
  interpretation: "CNN/NLP-era inference card retrofitted for LLMs, not an HBM-class part."
  confidence: confirmed
  sources:
    - https://docs.streamcomputing.com/AI加速卡/开发者资源/模型支持说明

# ── Execution model ───────────────────────────────────────────────────────────
execution_model:
  style: "Heterogeneous host+device, explicitly CUDA-shaped: kernel<<<NCORE>>>(args); built-ins CoreID / CoreNum"
  parallelism: "Per-core MIMD; no warp/wavefront; divergence is ordinary scalar branching"
  scheduling: "In-order, statically scheduled; up to 3 instructions/cycle (one per engine); stalls only on address overlap. Performance requires software-pipelining MTE against MME/VME."
  profiler_support: "PAL(MTE/MME), PAL(MTE/VME), PAL(VME/MME), PAL(ALL) overlap percentages per NPC"
  memory_space_qualifiers: "__local__ -> L1 Buffer; __shared__ -> LLB; plain device pointers -> DDR; IM_BUFFER_START -> Intermediate Buffer; sync() intra-group barrier"
  shape_state: "Matrix/vector shapes programmed into custom unprivileged CSRs before instruction issue (CONFIG_VE_CSR, CONFIG_VE_BC_CSR, DEFINE_SHAPE)"
  measured_bert_trace:
    npc_occupancy: "95% of total cycles"
    dma_overlap: "96% of the time"
    mme_occupancy_within_npc: "78% of cycles"
    mte_overlap: "92% of the time with MME and/or VME"
    vme_serialisation: "45% of VME time, due to data dependencies on MME"
  confidence: confirmed
  sources:
    - https://carrv.github.io/2021/papers/CARRV2021_paper_67_Zhan.pdf
    - https://docs.streamcomputing.com/AI加速卡/推理软件使用手册/STCRP使用指南/HPE使用指南

# ── Interconnect ──────────────────────────────────────────────────────────────
on_chip_interconnect:
  topology: "4x4 mesh; every component attaches to a router; all links bidirectional"
  planes: "control bus 32 bits per direction; data bus 512 bits per direction"
  link_bandwidth: "64 GB/s per direction per link, 128 GB/s combined @ 1.0 GHz"
  coherence: "non-coherent (labelled 'Non-coherent interconnect' in the P920 block diagram)"
  discrepancy_note: "A company-authored RISC-V International blog is sometimes summarised as '4x6 mesh, 1 TB/s'. The peer-reviewed CARRV'21 paper (same authors, same product) says 4x4 mesh / 64 GB/s per direction. Use CARRV."
  not_disclosed: ["NoC IP vendor", "router microarchitecture", "virtual channels / QoS", "exact ordering model"]
  confidence: confirmed
  sources:
    - https://carrv.github.io/2021/papers/CARRV2021_paper_67_Zhan.pdf

hardware_sync:
  name: HSYNC
  function: "Partitions the 32 NeuralScale cores into up to 16 groups; group size configurable by the application"
  sdk_exposure: "Only indirectly — SHC sync() intrinsic; profiler counters syn_cycle / syn_inst / syn_wait_cycle. The 16-group API and the HSYNC-to-cluster mapping are NOT documented in the public SDK, which presents a 4-cluster model."
  confidence: confirmed
  sources:
    - https://carrv.github.io/2021/papers/CARRV2021_paper_67_Zhan.pdf

host_interface:
  link: "PCIe 4.0 x16 (Lane Reversal supported)"
  bars: "BAR0 16 GB prefetchable; BAR2 32 MB non-prefetchable; BAR4 1 GB prefetchable"
  functions: "1 physical function (64-bit); no SR-IOV VFs"
  bios_requirement: "Above 4G Decoding"
  pci_ids: "Vendor ID 0x23e2 / Sub-Vendor ID 0x23e2"
  oob_management: "SMBus 7-bit addr 0x2A — board power 0xF1, board temp 0xF2, PCI IDs 0xF3/0xF4, MCU FW 0xF5, power brake 0xF6 (write 0x55), chip temp 0xF7, serial LE/BE 0xF8/0xF9, part number 0xFA, chip voltage 0x50, MAC voltage 0x51"
  virtualisation: "PCIe passthrough to KVM guests supported (firmware V1.3.3+); host + KVM simultaneously (V1.3.4+). No SR-IOV."
  confidence: confirmed
  sources:
    - https://docs.streamcomputing.com/AI加速卡/硬件产品手册/STCP920产品手册
    - https://docs.streamcomputing.com/AI加速卡/固件使用手册/Firmware_Release_Notes

scale_up:
  fabric: "None on any shipping card — PCIe peer-to-peer only. No NVLink/CCIX/Ethernet-mesh equivalent in any public product document."
  soc_capability: "P920 has two PCIe subsystems (PCIE0, PCIE1), each up to 16 lanes, each configurable as endpoint or root complex; CARRV'21 describes PCIE1 as 'usually configured as a root complex for scalability, connecting to other SoC chips'."
  shipping_status: "Whether the PCIE1 chip-to-chip path is wired or enabled on any shipping STCP card is NOT DISCLOSED — no card manual documents a chip-to-chip or card-to-card link."
  topology_tool: "stc-topo reports only PCIe path classes LOC / PIX / PXB / PHB / SYS plus CPU and NUMA affinity"
  measured_p2p:
    ddr_to_ddr_mbps: 888.6
    ddr_to_llb_mbps: 9005
    llb_to_ddr_mbps: 886.5
    llb_to_llb_mbps: 9014
    note: "Vendor p2p_perf tool, 2-card host. Peaks ~9 GB/s to on-chip LLB; <1 GB/s to remote LPDDR — far below the PCIe 4.0 x16 ~32 GB/s unidirectional ceiling."
  confidence: confirmed
  sources:
    - https://docs.streamcomputing.com/AI加速卡/硬件性能测试手册/p2p_perf使用指南
    - https://docs.streamcomputing.com/AI加速卡/推理软件使用手册/STCRP使用指南/HPE使用指南
    - https://carrv.github.io/2021/papers/CARRV2021_paper_67_Zhan.pdf

scale_out:
  fabric: "Standard datacenter Ethernet at the server level"
  rdma: "none"
  collective_hardware: "none"
  collective_library: "none — multi-card parallelism is expressed as MLTC compiler ops over PCIe P2P"
  confidence: confirmed
  sources:
    - https://docs.streamcomputing.com/AI加速卡/开发者资源/MLTC算子支持说明

