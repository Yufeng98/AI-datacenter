chip: sk-hynix-aim
investigation: hw-architecture
date: "2026-04-05"
confidence: high
sources:
  - url: "https://hc34.hotchips.org/assets/program/posters/hc34.SKhynix.YongkeeKwon.v03.pdf"
    type: conference_poster
    title: "System Architecture and Software Stack for GDDR6-AiM — HC34"
  - url: "https://ieeexplore.ieee.org/document/9499894"
    type: peer_reviewed_paper
    title: "Hardware Architecture and Software Stack for PIM — ISCA 2021"
  - url: "https://ieeexplore.ieee.org/document/9895629/"
    type: peer_reviewed_paper
    title: "System Architecture and Software Stack for GDDR6-AiM — IEEE"
  - url: "https://ieeexplore.ieee.org/document/10664793/"
    type: peer_reviewed_paper
    title: "SK Hynix AiMX-xPU — Hot Chips 2024 IEEE"

architecture:
  paradigm: "Processing-in-Memory (PIM)"
  product_name: "GDDR6-AiM / AiMX"
  memory_base: "GDDR6"
  key_principle: "MAC units embedded at DRAM bank boundary; all-bank parallel operation"

gddr6_aim_device:
  banks: 16
  pseudo_channels: 2
  banks_per_pseudo_channel: 8
  mac_units_per_pseudo_channel: 1
  mac_units_per_package: 2
  mac_unit:
    type: "FP16 SIMD"
    lanes: 16
    per_lane: "1x FP16 multiplier + 1x FP16 adder"
    execution: "SIMD (lock-step)"
    register_files: 3
  total_fp16_lanes_per_package: 32

bandwidth:
  external_io_GB_per_s: 64
  internal_dram_TB_per_s: 4.0
  speed_grade_gbps_per_pin: 16
  operating_voltage_V: 1.25

aimx_card:
  gen1:
    packages: 16
    capacity_GB: 16
    interface: PCIe
  gen2_2024:
    packages: 32
    capacity_GB: 32
    interface: PCIe
    roadmap_capacity_GB: 256

performance:
  speedup_vs_cpu_dram: "up to 16x"
  power_reduction_pct: 80
  llm_attention_speedup_vs_gpu: "10x"
  power_vs_gpu_pct: 20

deployment:
  mode: "Heterogeneous co-processor (pairs with CPU or GPU)"
  target_ops: ["GEMV", "embedding lookup", "KV-cache attention", "RNN inference"]
  standalone: false

compatibility:
  jedec_gddr6: true
  backward_compatible: true
  notes: "AiM commands via extended ISR; standard GDDR6 commands still work"

