        Trn3 architecture page since the 2025-12-02 re:Invent commit 6e694cbb and was
        unchanged through commit b741ad5b (2026-01-29). The survey's earlier
        "exact GA specs pending" was our own research gap. Per-device values are identical
        whether derived from Gen1 (/64) or Gen2 (/144) aggregates.
      key_specs:
        gen1:
          devices: 64
          servers: 4
          hbm3e_GiB: 9216
          hbm_bandwidth_TBps: 313.6
          mxfp8_mxfp4_TFLOPS: 161088
          fp16_bf16_tf32_TFLOPS: 42944
          fp32_TFLOPS: 11712
          efa_Gbps: 12800
          host_vcpus: 768
          host_memory_GiB: 8192
        gen2:
          devices: 144
          servers: 36
          hbm3e_GiB: 20736
          hbm_bandwidth_TBps: 705.6
          mxfp8_mxfp4_TFLOPS: 362448
          fp16_bf16_tf32_TFLOPS: 96624
          fp32_TFLOPS: 26352
          efa_Gbps: 28800
          host_vcpus: 2304
          host_memory_GiB: 27648
        per_device:
          hbm3e_GiB: 144
          hbm_bandwidth_TBps: 4.9
          mxfp8_mxfp4_TFLOPS: 2517
          neuronlink_v4_GiBps: 2048
          efa_Gbps: 200   # 12800/64 == 28800/144; AWS reports EFA at UltraServer granularity
        efa_per_instance: not disclosed
      sources:
        - title: "Trn3 architecture page (live)"
          url: "https://awsdocs-neuron.readthedocs-hosted.com/en/latest/about-neuron/arch/neuron-hardware/trn3-arch.html"
        - title: "trn3-arch.rst at 6e694cbb (2025-12-02) — spec table already present"
          url: "https://raw.githubusercontent.com/aws-neuron/aws-neuron-sdk/6e694cbb/about-neuron/arch/neuron-hardware/trn3-arch.rst"
        - title: "trn3-arch.rst commit history"
          url: "https://api.github.com/repos/aws-neuron/aws-neuron-sdk/commits?path=about-neuron/arch/neuron-hardware/trn3-arch.rst"

    - name: Trn3 scale-up fabric is PCIe Gen6 switched
      confidence: confirmed
      note: >
        NEW in the window. Section "Trn3 UltraServer Connectivity and Networking" was
        appended by commit 539a73c5 on 2026-04-09 (shipped with Neuron SDK 2.29.0) and is
        byte-identical to the current master version. AWS states the PCIe switch fabric
        replaces "the point-to-point NeuronLink topology used in previous generations
        (Trn1, Trn2)". Architecturally load-bearing: NeuronSwitch-v1 is a PCIe Gen6 switch
        fabric and NeuronLink-v4 is carried over PCIe Gen6 x8 lane groups, qualifying the
        survey's framing of NeuronLink as bespoke vendor interconnect IP.
      key_specs:
        intra_server: {links_per_chip: "4 x PCIe Gen6 x8", aggregate_bidir_GBps: 256, scope: "4-chip sled to intra-server switch"}
        inter_server: {links_per_chip: "5 x PCIe Gen6 x8", aggregate_bidir_GBps: 320, scope: "server-to-server within rack"}
        inter_rack:   {links_per_chip: "2 x PCIe Gen6 x8", aggregate_bidir_GBps: 128, scope: "direct rack-to-rack links"}
        routing: "address-based; (rack, server, chip) tuple encoded in upper bits of outbound PCIe address; switches use BAR address matching to select output port; transparent to workloads, configured by runtime and compiler"
        synchronization: "hardware semaphores; data and its completion semaphore guaranteed to traverse the same physical path, giving ordering without software fences"
      sources:
        - title: "trn3-arch.rst at master (136 lines; adds PCIe Gen6 connectivity section)"
          url: "https://raw.githubusercontent.com/aws-neuron/aws-neuron-sdk/master/about-neuron/arch/neuron-hardware/trn3-arch.rst"
        - title: "trn3-arch.rst at b741ad5b (2026-01-29, 83 lines; no PCIe section) — establishes the section is new"
          url: "https://raw.githubusercontent.com/aws-neuron/aws-neuron-sdk/b741ad5b/about-neuron/arch/neuron-hardware/trn3-arch.rst"

    - name: Trn3 per-device scale-up bandwidth — unreconciled figures
      confidence: contested
      note: >
        Three figures circulate and none reconciles with the others. AWS's own page is
        internally inconsistent. Cite 2,048 GiB/s/device as the vendor spec-table figure and
        record the other two; do not average, silently select, or present 2.5 TB/s as
        vendor-stated. The 2.5 TB/s figure was previously carried in this survey without
        attribution.
      key_specs:
        aws_spec_table_GiBps_per_device: 2048
        aws_connectivity_section_link_budget_GBps_per_chip: 704   # 256 + 320 + 128
        semianalysis_bidirectional_TBps: 2.5
        reconciliation: none available from any primary source
      sources:
        - title: "Trn3 architecture page (both the spec table and the connectivity section)"
          url: "https://raw.githubusercontent.com/aws-neuron/aws-neuron-sdk/master/about-neuron/arch/neuron-hardware/trn3-arch.rst"
        - title: "SemiAnalysis — AWS Trainium3 Deep Dive (source of the 2.5 TB/s figure)"
          url: "https://newsletter.semianalysis.com/p/aws-trainium3-deep-dive-a-potential"

