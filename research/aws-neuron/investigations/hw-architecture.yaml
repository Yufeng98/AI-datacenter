chip: aws-neuron
device_class: Systolic Array Accelerator
investigation: hw-architecture
date: 2026-04-05

layer_mappings:
  - layer: Compute
    components:
      - name: Tensor Engine (NeuronCore-v2)
        description: 128×128 BF16 systolic array; >90 TFLOPS FP16/BF16; supports FP16, BF16, TF32, INT8, FP32 mixed precision; Trainium1 / Inferentia2
      - name: Tensor Engine (NeuronCore-v3)
        description: 128×128 BF16 systolic array; 158 cFP8 TFLOPS / 79 BF16 TFLOPS / 20 FP32 TFLOPS; Trainium2
      - name: Tensor Engine (NeuronCore-v4)
        description: 512×128 MXFP8/MXFP4 systolic array (OCP compliant); 315 MXFP8 TFLOPS; supports MXFP8, MXFP4, FP16, BF16, TF32, FP32; Trainium3
      - name: Vector Engine
        description: Parallel vector compute for reductions and activation functions; ~2.3 TFLOPS FP32 on v2; scaled up on v3/v4
      - name: Scalar Engine
        description: Element-wise scalar operations; ~2.9 TFLOPS FP32 on v2; scales on subsequent generations
      - name: GPSIMD Engine
        description: 8× 512-bit wide fully programmable vector processors per NeuronCore; run general-purpose C code; direct SRAM access; present on v2/v3/v4
      - name: DGE (Dynamic Grouping Engine)
        description: Hardware block on NeuronCore-v3 and v4; dynamic data grouping and rearrangement for structured sparsity; feeds Tensor Engine for MoE token routing

  - layer: Data Path
    components:
      - name: DMA Engine
        description: Handles all HBM↔SBUF and HBM↔PSUM transfers; operates independently from compute engines; enables double-buffering (prefetch next tile while computing current)
      - name: SBUF→Tensor Engine pipeline
        description: Staged tile computation; SBUF partitions supply weight and activation tiles to Tensor Engine; PSUM accumulates partial sums across tiles
      - name: Compute Engine pipeline
        description: Tensor → PSUM → Vector → Scalar → SBUF producer-consumer chain; asynchronous execution across engines for throughput pipelining

  - layer: On-chip Memory
    components:
      - name: SBUF (State Buffer)
        description: Software-managed SRAM scratchpad; 24 MiB (v2), 28 MiB (v3), 32 MiB (v4); 128 partitions; no hardware cache; explicitly addressed by compiler and NKI kernels
      - name: PSUM (Partial Sum Buffer)
        description: 2 MiB SRAM; receives direct output from Tensor Engine systolic array; holds partial accumulations before Vector Engine post-processing; unchanged across v2/v3/v4

  - layer: Off-chip Memory
    components:
      - name: HBM (NeuronCore-v2)
        description: 32 GiB HBM2e per chip (Trainium1); 820 GB/s per chip; shared across all NeuronCore instances in chip
      - name: HBM (NeuronCore-v3)
        description: 96 GiB HBM2e per Trainium2 chip; 2.9 TB/s per chip; Trn2 instance aggregate 1.5 TiB / 46 TB/s
      - name: HBM (NeuronCore-v4)
        description: 144 GiB HBM3e per Trainium3 chip (4 stacks); 4.9 TB/s per chip; Trn3 UltraServer up to 20 TB HBM total

  - layer: Host Interface
    components:
      - name: PCIe
        description: NeuronDevices connect to host CPU via PCIe; aws-neuronx-dkms kernel driver handles BAR mapping, command queues, interrupts
      - name: Nitro Integration
        description: AWS Nitro hypervisor provides direct device passthrough; near-bare-metal PCIe throughput; device enumeration via Nitro device model

  - layer: Scale-up
    components:
      - name: NeuronLink-v2 (Trainium1)
        description: 768 GB/s bidirectional chip-to-chip; 2D Torus topology in trn1.32xlarge (16 chips)
      - name: NeuronLink-v3 (Trainium2)
        description: 1 TB/s bidirectional; 4×4 2D Torus per node (16 chips); 3D Torus in Trn2 UltraServer (64 chips via NL32×2; ~6,100 copper cables)
      - name: NeuronLink-v4 + NeuronSwitch-v1 (Trainium3)
        description: 2.5 TB/s bidirectional; NeuronSwitch-v1 all-to-all switched fabric replaces 2D/3D Torus; Trn3 NL32×2 (64 chips), NL72×2 (144 chips); optimized for MoE all-to-all and tensor parallelism

  - layer: Scale-out
    components:
      - name: EFAv2 (Trn1)
        description: Up to 1,600 Gbps per trn1 instance for inter-node collective communication
      - name: EFAv3 (Trn2/Trn3)
        description: 3.2 Tbps per trn2 instance; 12.8 Tbps per Trn2 UltraServer; higher bandwidth for Trn3 UltraServers
      - name: EC2 UltraClusters
        description: Multiple UltraServers interconnected with petabit-scale EFA networking; scales to 500,000+ chips (Project Rainier); enables cluster-level data and pipeline parallelism

key_abstractions:
  - name: Software-Managed SRAM (SBUF/PSUM)
    description: NeuronCore eliminates hardware cache entirely. SBUF (state buffer) and PSUM (partial sum buffer) are explicitly allocated and addressed by the compiler or NKI programmer. This enables deterministic memory access latency and compiler-predictable tile movement — at the cost of requiring explicit DMA management. SBUF grows each generation (24→28→32 MiB) to reduce HBM refetch pressure.
    source_refs:
      - https://awsdocs-neuron.readthedocs-hosted.com/en/latest/general/arch/neuron-hardware/neuron-core-v2.html
      - https://awsdocs-neuron.readthedocs-hosted.com/en/latest/nki/guides/architecture/trainium2_arch.html

  - name: Heterogeneous Engine Pipeline
    description: Each NeuronCore contains four independently-pipelined execution units (Tensor, Vector, Scalar, GPSIMD) that operate in a producer-consumer chain. The compiler schedules all four engines to maximize hardware utilization. GPSIMD provides a general-purpose escape hatch for non-standard ops.
    source_refs:
      - https://awsdocs-neuron.readthedocs-hosted.com/en/latest/general/arch/neuron-hardware/neuron-core-v2.html
      - https://awsdocs-neuron.readthedocs-hosted.com/en/latest/about-neuron/arch/neuron-hardware/neuron-core-v3.html

  - name: NeuronLink Scale-Up Interconnect
    description: Proprietary chip-to-chip interconnect evolving from 768 GB/s 2D Torus (v2) to 1 TB/s 3D Torus (v3) to 2.5 TB/s all-to-all switched fabric (v4 + NeuronSwitch-v1). Topology choice directly shapes which parallelism strategies are efficient — Torus favors ring-based AllReduce; switched fabric enables all-to-all for MoE expert parallelism.
    source_refs:
      - https://awsdocs-neuron.readthedocs-hosted.com/en/latest/general/arch/neuron-hardware/trn1-arch.html
      - https://awsdocs-neuron.readthedocs-hosted.com/en/latest/about-neuron/arch/neuron-hardware/trn3-arch.html

  - name: DGE (Dynamic Grouping Engine)
    description: A hardware block introduced in NeuronCore-v3 that performs dynamic data grouping and token rearrangement, enabling structured sparsity and efficient MoE token routing at hardware speed. Feeds prepared token groups directly into the Tensor Engine's systolic array without software-managed scatter/gather overhead.
    source_refs:
      - https://awsdocs-neuron.readthedocs-hosted.com/en/latest/about-neuron/arch/neuron-hardware/neuron-core-v3.html

  - name: NeuronSwitch-v1 All-to-All Fabric
    description: Introduced with Trainium3, NeuronSwitch-v1 replaces the fixed 2D/3D Torus topology with an all-to-all switched fabric. This enables O(1)-hop connectivity between any two chips in the UltraServer domain (up to 144 chips), halving worst-case all-to-all collective latency and removing the bandwidth asymmetry between near and far neighbors in a torus.
    source_refs:
      - https://awsdocs-neuron.readthedocs-hosted.com/en/latest/about-neuron/arch/neuron-hardware/trn3-arch.html
      - https://newsletter.semianalysis.com/p/aws-trainium3-deep-dive-a-potential

framework_integrations:
  - framework: NKI
    mechanism: Direct hardware access via nki.isa opcodes targeting specific engines; nl.ndarray maps to SBUF partitions; DMA via nl.load/nl.store
  - framework: neuronx-cc compiler
    mechanism: Automatic tiling, SBUF allocation, DMA scheduling, engine pipelining from XLA HLO / MLIR input
  - framework: NCCom (Neuron Collective Communication)
    mechanism: Routes AllReduce/AllGather/ReduceScatter over NeuronLink (intra-node) or EFA (inter-node) without CPU involvement

key_sources:
  - title: NeuronCore-v2 Architecture
    url: https://awsdocs-neuron.readthedocs-hosted.com/en/latest/general/arch/neuron-hardware/neuron-core-v2.html
  - title: NeuronCore-v3 Architecture
