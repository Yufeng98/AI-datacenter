    superseded_repo_figures:
      items:
        - field: "Galaxy peak compute"
          was: "~25 PFLOPS FP8 (summary.md) / ~24 PFLOPS (hw-architecture.md)"
          now: "23 PFLOPS Block FP8"
        - field: "Galaxy accelerator SRAM"
          was: "~6.7 GB"
          now: "6.2 GB @ 2.9 PB/s"
        - field: "Galaxy scale-out bandwidth"
          was: "~1 TBps aggregate (layer-table.md, hw-architecture.md, hw-architecture.dot)"
          now: "11.2 TB/s vendor / 5.6 TB/s unidirectional over 56 x 800 GbE QSFP-DD"
        - field: "Blackhole PCIe SKU compute"
          was: "140 Tensix cores / 745 TOPS FP8"
          now: "120 Tensix cores / 664 TFLOPS BLOCKFP8 (full-die 140/745 kept as reference)"
      confidence: confirmed
      sources:
        - url: https://tenstorrent.com/en/hardware/galaxy
        - url: https://tenstorrent.com/en/hardware/blackhole

    quasar:
      status: "next-generation bring-up target in the open-source stack; no product, no spec sheet"
      first_public_code: "tenstorrent/tt-llk PR #593 'feat: initial commit of Quasar LLK', 2025-08-15"
      merged_into_tt_metal: "2025-08-17"
      commit_counts:
        tt_metal_quasar_commits: 662
        tt_llk_quasar_commits: 85
      misdating_warning: >-
        Quasar support did NOT newly land in the Apr-Aug 2026 window. It predates the repo's
        2026-04-05 baseline by roughly eight months. The v0.75.0 and Aug-2026 dev-build entries
        are incremental bring-up, not a milestone.
      v0_75_0_and_dev_items:
        - "Enable trace capture and replay on Quasar"
        - "Enabling DFBs in Quasar fast-dispatch flow"
        - "Add Quasar fast dispatch stress tests"
        - "Fix Quasar unicast and iDMA VC assignments"
        - "make Quasar-unsupported APIs fail at compile time"
        - "Quasar unary and binary SFPU performance tests"
        - "Quasar LLK perf matmul coverage"
        - "Enable Quasar selection in LLK ttsim regression script"
      process_node: "Samsung Foundry SF4X (4 nm-class), Taylor, Texas"
      process_node_confidence: medium
      process_node_caveat: >-
        Announced October 2023 for the "Quasar" low-cost low-power ML chiplet. Tenstorrent has
        not restated the node for the 2025-26 tt-metal Quasar architecture target, so it is not
        confirmed that they are the same silicon. Do NOT record "no process node disclosed" —
        that was an error in the raw scan.
      core_count: not_disclosed
      sram_config: not_disclosed
      memory_config: not_disclosed
      peak_throughput: not_disclosed
      data_types: not_disclosed
      packaging: not_disclosed
      ship_date: not_disclosed
      isa_documentation: "absent — tt-isa-documentation top level contains only WormholeB0 and BlackholeA0"
      product_listing: "absent — docs.tenstorrent.com/aibs lists only Wormhole and Blackhole cards plus Wormhole/Blackhole QuietBox, LoudBox and Galaxy systems"
      confidence: "confirmed (existence, timeline, commit counts); medium (process node); not_disclosed (all specs)"
      sources:
        - url: https://api.github.com/search/commits?q=repo:tenstorrent/tt-llk+Quasar&sort=committer-date&order=asc
        - url: https://api.github.com/search/commits?q=repo:tenstorrent/tt-metal+Quasar&sort=committer-date&order=asc
        - url: https://api.github.com/repos/tenstorrent/tt-metal/releases/tags/v0.75.0
        - url: https://api.github.com/repos/tenstorrent/tt-isa-documentation/contents/
        - url: https://docs.tenstorrent.com/aibs/
        - url: https://www.theregister.com/on-prem/2023/10/04/samsung-to-fab-risc-v-chips-for-tenstorrent/
        - url: https://www.inkl.com/news/tenstorrent-to-use-samsung-s-sf4x-for-quasar-low-cost-ai-chiplet

