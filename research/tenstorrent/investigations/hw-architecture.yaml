          tdp_w: 300
          cooling: active
          external_ports: none
          price_usd: 999
        - sku: p150a
          tensix_cores: 120
          big_risc_v: 16
          on_chip_sram_mb: 180
          gddr6_gb: 32
          gddr6_bandwidth_gbs: 512
          peak_tflops_blockfp8: 664
          host_interface: "PCIe 5.0 x16"
          tdp_w: 300
          cooling: active
          external_ports: "4 x QSFP-DD 800G"
          price_usd: 1399
        - sku: p150b
          tensix_cores: 120
          big_risc_v: 16
          on_chip_sram_mb: 180
          gddr6_gb: 32
          gddr6_bandwidth_gbs: 512
          peak_tflops_blockfp8: 664
