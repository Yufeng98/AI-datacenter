chip: tenstorrent
investigation: software-stack
as_of: "2026-08-08"
baseline_as_of: "2026-04-05"
status: complete

layers:
  - layer: ISA / Intrinsics
    component: TT-LLK
    repo: https://github.com/tenstorrent/tt-llk
    description: "Header-only LLK library; Unpack→Math→Pack pipeline; arch-specific for Wormhole and Blackhole"
    open_source: true

  - layer: ISA / Intrinsics
    component: TT-ISA-Documentation
    repo: https://github.com/tenstorrent/tt-isa-documentation
    description: "Complete public ISA reference: Baby RISC-V, Matrix Unit, Vector Unit (SFPU), Scalar Unit"
    open_source: true

  - layer: Runtime
    component: TT-Metalium
    repo: https://github.com/tenstorrent/tt-metal
    description: "Low-level SDK: Device/Program/CircularBuffer/Kernel C++ API; JIT kernel compilation to RISC-V"
    open_source: true
    key_abstractions: [Device, Program, CircularBuffer, KernelHandle, Buffer, CommandQueue]

  - layer: Op Library
    component: TT-NN
    repo: https://github.com/tenstorrent/tt-metal (ttnn/ subdirectory)
    description: "PyTorch-like op library; tile layout; sharding; MeshDevice for multi-chip; CCL for collectives"
    open_source: true
    model_count: "800+ model variants in CI"

  - layer: Compiler / IR
    component: TT-MLIR
    repo: https://github.com/tenstorrent/tt-mlir
    dialects: [TTIR, TTNN, TTMetal, TTKernel]
    description: "MLIR-based compiler: TTIR→TTNN→TTMetal dialects; fusion, sharding, memory passes"
    open_source: true

  - layer: Framework Integration
    component: TT-Forge
    repo: https://github.com/tenstorrent/tt-forge
    description: "End-to-end MLIR compiler combining TT-XLA (JAX/PyTorch), TT-Torch, TT-Forge-FE (ONNX/TF)"
    open_source: true

  - layer: Framework Integration
    component: TT-XLA
    repo: https://github.com/tenstorrent/tt-xla
    description: "PJRT bridge for JAX and torch.compile; StableHLO → TT-MLIR; recommended new-project path"
    open_source: true

  - layer: Driver / Firmware
    component: TT-KMD
    repo: https://github.com/tenstorrent/tt-kmd
    description: "Linux kernel module: /dev/tenstorrent, PCIe BAR, command queues, IRQ"
    open_source: true

  - layer: Communication
    component: TT-NN CCL
    description: "Built-in collective comms in TT-NN: AllReduce, AllGather, ReduceScatter over Ethernet"
    open_source: true

tt_mlir_dialects:
  TTIR: "High-level tensor ops (hardware-independent); akin to StableHLO/TOSA"
  TTNN: "Models TT-NN API as MLIR; lowered from TTIR"
  TTMetal: "Host-side TT-Metalium ops: buffer alloc, program dispatch"
  TTKernel: "Kernel code representation for code generation"

compilation_pipeline:
  - "StableHLO / ONNX / torch.export"
  - "TTIR (import + optimization passes)"
  - "TTNN (layout + sharding + fusion)"
  - "TTMetal (code generation)"
  - "TT-NN C++ + TT-Metalium RISC-V kernel binaries"
  - "Device execution via Fast Dispatch"

open_source_summary:
  fully_open: true
  license: "Apache 2.0 / MIT"
  includes: [TT-Metal, TT-NN, TT-MLIR, TT-Forge, TT-LLK, TT-KMD, TT-SMI, TT-ISA-Docs]
  contrast: "NVIDIA has closed cuDNN, closed GSP firmware, closed TensorRT kernel weights"

key_insights:
  - "Fully open-source stack from ISA to framework integration"
  - "No hardware cache means programmer/compiler must orchestrate all data movement"
  - "TT-MLIR enables MLIR-standard compiler pass reuse and community contribution"
  - "TT-XLA PJRT bridge enables JAX/torch.compile without framework changes"
  - "800+ model variants in CI ensures broad model compatibility"

confidence: confirmed
sources:
  - url: https://docs.tenstorrent.com/getting-started/tt-software-stack.html
  - url: https://docs.tenstorrent.com/tt-mlir/
  - url: https://docs.tenstorrent.com/tt-mlir/dialects-overview.html
  - url: https://github.com/tenstorrent/tt-mlir
  - url: https://github.com/tenstorrent/tt-forge
  - url: https://github.com/tenstorrent/tt-llk

# ============================================================================
# Update appended 2026-08-08 — Metal 2.0 / Device 2.0, DataflowBuffer, TT-Lang,
# Quasar backend, model coverage and vendor performance claims. Facts above
# (as_of 2026-04-05) are retained.
# ============================================================================

updates:
  - update_as_of: "2026-08-08"
    change_class: major

    metal_2_0_device_2_0:
      description: >-
        API rearchitecture of TT-Metalium ("Metal 2.0", runtime-facing) and TT-NN
        ("Device 2.0", op-facing). Absent from prior repo coverage; a closed coverage gap
        rather than a new-window event.
      first_public_commit: "2025-11-16 — '[DM]: Porting DM tests to Device 2.0 APIs first pass' (#32121)"
      metal_2_0_commit_count: 168
      predates_repo_baseline: true
      misdating_warning: >-
        Do NOT frame Metal 2.0 / Device 2.0 as an April-August 2026 development. It predates
        the repo's 2026-04-05 baseline.
      v0_75_0_items:
        - "Kernel scratchpad support for Metal 2.0"
        - "NOC-distinctness legality check added to the Metal 2.0 API"
        - "Migrate normalization and reduction ops to the Device 2.0 API (CNN ops in progress)"
        - "Feature: multi-config layer support"
        - "emule: multichip fiber engine + fabric/CCL teleport (8-chip Blackhole LoudBox)"
      release: "tt-metal v0.75.0, published 2026-07-30"
      confidence: confirmed
      sources:
        - url: https://api.github.com/repos/tenstorrent/tt-metal/releases/tags/v0.75.0
        - url: https://api.github.com/search/commits?q=repo:tenstorrent/tt-metal+%22Metal+2.0%22&sort=committer-date&order=asc

    dataflow_buffer:
      component: "DataflowBuffer (DFB)"
      layer: Runtime
      description: >-
        Systematic replacement for CircularBuffer as the L1 producer-consumer primitive.
        Migration spans eltwise, conv/pool, data-movement and Moreh kernels in v0.75.0;
        DFBs are enabled in the Quasar fast-dispatch flow.
      survey_significance: >-
        The repo previously presented CircularBuffer as THE Metalium synchronization
        primitive (summary.md Programming Model Rationale item 2). That framing is now
        generation-scoped: accurate for existing Wormhole/Blackhole kernels, superseded in
        new code. Both coexist during the migration.
      dfb_as_next_gen_primitive: inference_not_vendor_stated
      confidence: confirmed
      sources:
        - url: https://api.github.com/repos/tenstorrent/tt-metal/releases/tags/v0.75.0

    tt_lang:
      component: TT-Lang
      status: "listed on docs.tenstorrent.com/aibs; absent from prior repo coverage"
      layer: not_disclosed
      scope: not_disclosed
      relationship_to_metalium_ttnn_ttmlir: not_disclosed
      confidence: listed-only
      sources:
        - url: https://docs.tenstorrent.com/aibs/

    quasar_software_support:
      first_public_code: "tenstorrent/tt-llk PR #593, 'feat: initial commit of Quasar LLK', 2025-08-15"
      merged_into_tt_metal: "2025-08-17"
      tt_metal_commit_count: 662
      tt_llk_commit_count: 85
      predates_repo_baseline: true
      v0_75_0_and_dev_items:
        - "Enable trace capture and replay on Quasar"
        - "Enabling DFBs in Quasar fast-dispatch flow"
        - "Add Quasar fast dispatch stress tests"
        - "Fix Quasar unicast and iDMA VC assignments"
        - "make Quasar-unsupported APIs fail at compile time"
        - "Quasar unary and binary SFPU performance tests"
        - "Quasar LLK perf matmul coverage"
        - "Enable Quasar selection in LLK ttsim regression script"
      isa_documentation: "absent — tt-isa-documentation contains only WormholeB0 and BlackholeA0"
      isa_openness_caveat: >-
        The survey's "ISA fully public" claim is now generation-scoped: it holds for shipped
        silicon (Wormhole B0, Blackhole A0) but not for the next-generation target.
      confidence: confirmed
      sources:
        - url: https://api.github.com/search/commits?q=repo:tenstorrent/tt-llk+Quasar&sort=committer-date&order=asc
        - url: https://api.github.com/search/commits?q=repo:tenstorrent/tt-metal+Quasar&sort=committer-date&order=asc
        - url: https://api.github.com/repos/tenstorrent/tt-isa-documentation/contents/

