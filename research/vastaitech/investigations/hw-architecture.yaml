# ── Memory hierarchy ──────────────────────────────────────────────────────────
memory_hierarchy:

  register_file:
    size: "not disclosed"
    organisation: "not disclosed"
    confidence: not_disclosed

  on_chip_sram:
    capacity: "not disclosed"
    bandwidth: "not disclosed"
    management: "software-managed scratchpad (inferred, not stated)"
    confidence: inferred
    reasoning: >-
      VAMC exposes per-model flags that explicitly place tensors: output_ddr ([-1,1] forces
      named graph outputs to off-chip DDR), mem_inplace, data_transport_mode (1|3),
      cluster_mode (0|1), output_layout, enable_graph_partition, and a
      graph.extra_ops: insert_odma pass that inserts explicit output-DMA nodes. A
      hardware-cached memory would not need a compiler flag naming DDR as a destination.
      The FLAGS are confirmed; the conclusion is inferred. No vendor statement confirms the
      absence of a hardware data cache in the compute path.
    sources:
      - https://github.com/Vastai/VastModelZOO/blob/main/tools/vamc/vamc_config.yaml

  vdsp_local_buffer:
    capacity: "not disclosed, but bounded"
    evidence: >-
      The shipped planar_argmax custom op documents "currently channel number is limited to
      less than or equal to 96" for an fp16 planar tensor — a per-op local-buffer constraint.
    confidence: confirmed
    sources:
      - https://github.com/Vastai/VastStreamX-Samples/blob/main/samples/vdsp_op/custom_op/argmax/argmax_op.hpp

  tiling_granularity:
    llm_sequence_length: "must be a multiple of 16 at compile time"
    confidence: confirmed
    sources:
      - https://github.com/Vastai/VastModelZOO/blob/main/llm/README.md

  off_chip_memory:
    capacity_per_die:
      va1_16g: "8 GB"
      va16: "32 GB"
      va10l: "32 GB"
    capacity_per_card:
      va1_launch: "32 GB"
      va1_16g: "16 GB"
      va1l_2023: "64 GB"
      va16: "128 GB"
      va10l: "128 GB"
    memory_technology: "not disclosed"
    memory_bandwidth: "not disclosed"
    confidence: confirmed        # capacities only
    not_disclosed_note: >-
      Memory TECHNOLOGY (HBM / GDDR / LPDDR / DDR) and memory BANDWIDTH in GB/s are not
      disclosed for ANY VastaiTech part ever shipped. Searched in Chinese and English:
      no datasheet, no teardown, no reviewer measurement, no bandwidth figure of any kind.
      This is the single most consequential gap in the entry, because VA16 is a
      capacity-first 128 GB card serving 671 B MoE models, where bandwidth determines decode
      performance. DO NOT estimate from capacity, die count, or any peer part.
    sources:
      - https://github.com/Vastai/VastStreamX-Samples/blob/main/samples/card_info/card_info.cpp
      - https://vllm-vacc.vastaitech.com/Qwen/Qwen3-32B

  runtime_memory_model:
    style: "Explicit host↔device copies; no unified/managed memory exposed to the user"
    apis:
      - "vsx.from_numpy(x, device_id) / vsx.as_numpy(t)"
      - "Context::CPU() vs Context::VACC(device_id)"
      - "Tensor::Clone(Context::VACC(id))"
      - "GetDataAddress() → raw device address packed into custom-op config structs"
    confidence: confirmed
    sources:
      - https://github.com/Vastai/VastStreamX-Samples/blob/main/common/model_base.hpp

