# ── Card = N dies (the key structural fact) ───────────────────────────────────
die_model:
  statement: >-
    Every VastaiTech card presents N independent devices ("dies") to software, each with its
    own memory pool and its own device_id. All runtime knobs (VACC_VISIBLE_DEVICES,
    --llm_devices, --tensor-parallel-size) operate at DIE granularity, not card granularity.
  api: "vsx::Card::GetAllDies()"
  evidence:
    - "card_info sample output: 'Card type: VA1-16G  Die ID: 0, 1' with 'Memory total: 8 GB' per device → VA1-16G = 2 dies × 8 GB"
    - "vLLM recipe site states hardware as 'VA16128G (4×32G)' and 'VA10L128G (4×32G)' → 4 dies × 32 GB"
    - "DeepSeek-V3 on 8× VA16 runs at TP=32 = 8 cards × 4 dies"
  cross_check: >-
    Per-die decode throughput (~51–62 ch @30 fps) × 2 dies ≈ 102–124 channels, versus VA1's
    claimed 120 ch — an independent confirmation that VA1 is a 2-die card.
  physical_nature_of_a_die: "not disclosed"
  physical_nature_note: >-
    Whether a "die" is a physically separate silicon die in a multi-chip package or a partition
    of one monolithic die is never stated by the vendor, and no teardown exists.
  confidence: confirmed
  sources:
    - https://github.com/Vastai/VastStreamX-Samples/blob/main/samples/card_info/card_info.cpp
    - https://vllm-vacc.vastaitech.com/Qwen/Qwen3-32B
    - https://vllm-vacc.vastaitech.com/Qwen/Qwen3-Embedding
    - https://github.com/Vastai/VastModelZOO/blob/main/llm/deepseek_v3/README.md

