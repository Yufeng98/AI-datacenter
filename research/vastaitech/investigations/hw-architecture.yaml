      overall: 95.391
      model_infer_cost: "15.5 min"
    - backend: "VACC-VA16 BF16 TP1"
      overall: 95.647
      model_infer_cost: "13 h 26 min"
    - backend: "VACC-VA16 BF16 TP2"
      overall: 95.611
      model_infer_cost: "9 h"
    - backend: "VACC-VA16 BF16 TP4"
