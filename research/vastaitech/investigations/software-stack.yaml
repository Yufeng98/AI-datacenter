# ── Comparative read ──────────────────────────────────────────────────────────
comparative_position:
  more_open_than: >-
    Cambricon (MagicMind closed) and Huawei (CANN kernel layer) in ONE narrow respect: the
    compile CONFIGURATION surface is fully public, so an outsider can read exactly which flags,
    quantisation modes and parallelism degrees the compiler supports across 344 real models.
  much_less_open_than: >-
    Sophgo, whose TPU-MLIR is a complete open compiler. VastaiTech publishes the configs but
    not the compiler that consumes them.
  kernel_programmability: >-
    Notably behind. Peers offer Triton ports, TileLang, or at minimum an intrinsics header.
    VastaiTech offers pre-built ELFs and no authoring path at all.
  llm_serving_maturity: >-
    Behind. Mandatory eager mode, no data parallelism, and max-concurrency 4 are all
    self-disclosed and all point the same way.
  confidence: inferred
