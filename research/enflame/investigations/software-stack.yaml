update_2026_08_08:
  as_of: 2026-08-08
  window: 2026-04-05 .. 2026-08-08
  sdk_line: TopsRider 3.7.x

  layers:
    framework_integration:
      - name: torch-gcu
        type: source_published        # deliberately NOT "open_source project" — see caveats
        url: https://github.com/EnflameTechnology/torch-gcu
        repo_created: 2026-06-23
        repo_last_push: 2026-06-23
        license: BSD-style, derived from PyTorch's; Copyright (c) 2026 Enflame 燧原科技
        version_matrix:
          torch_gcu: 2.10.0
          pytorch: 2.10.0
          python: ['3.9', '3.10', '3.12']
          topsrider: v3.7.1
        backend_mechanism: PyTorch official PrivateUse1 dispatch key (C++ tensors show as privateuseoneFloatType)
        features:
          - Extensive ATen operator coverage with automatic CPU fallback
          - torch.distributed backend "eccl" — full collectives plus send/recv/isend/irecv
          - torch.compile / Inductor backend integration
          - AMP via torch.gcu.amp.autocast and GradScaler
          - torch.gcu.GCUGraph (CUDA-Graph analog)
          - ProfilerActivity.GCU / Kineto profiler integration
          - PyTorch-compatible caching allocator
          - transfer_to_gcu one-line CUDA migration shim
          - libtorch_gcu C++ inference (single-device inference only; no multi-device, no training)
        source_tree_notes: [csrc/aotfusion/, csrc/efficient_ops/]
        hardware_support_table: [CloudBlazer S60]     # ONLY entry; no T20, no L600
        known_limitation: GCU lacks native 64-bit types; F64/I64 implicitly down-cast to 32-bit
        caveats:
          - No source states torch_gcu is a rename of or replacement for TopsTorch
          - Single-commit code drop (created_at == pushed_at); no follow-on commits; no press coverage
          - Support matrix covers one inference product only
        confidence: high (contents); low (that it is a live open-source project)
        sources: [enflame-torch-gcu-readme, enflame-torch-gcu-license, enflame-github-org-api]

      - name: vllm-gcu
        type: open_source
        url: https://github.com/EnflameTechnology/vllm-gcu
