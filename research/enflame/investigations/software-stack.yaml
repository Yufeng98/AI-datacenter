chip: enflame
as_of: 2026-08-08
baseline_as_of: 2026-04-05   # everything outside update_2026_08_08 is the baseline investigation
device_class: Data Transfer Unit (China)
investigation: software-stack
platform_name: TopsRider
sdk_line: TopsRider 3.7.x (as of 2026-08-08; baseline referenced 2.5.115 doc slug)

layers:
  framework_integration:
    - name: TopsTorch
      type: proprietary
      description: PyTorch plug-in; torch.device("gcu"); ATen dispatch to TopsBlasOps
      confidence: medium
      source: hami-enflame-docs

    - name: vllm-gcu
      type: open_source
      url: https://github.com/EnflameTechnology/vllm-gcu
      description: vLLM fork for GCU S60; LLM inference serving; OpenAI-compatible API
      confidence: high

    - name: candle-gcu
      type: open_source
      url: https://github.com/EnflameTechnology/candle-gcu
      description: HuggingFace Candle Rust ML framework on GCU
      confidence: high

    - name: PaddleNLP GCU backend
      type: integration
      url: https://paddlenlp.readthedocs.io/en/latest/llm/devices/gcu/llama/README.html
      description: PaddlePaddle custom device backend for GCU; LLaMA2-13B on S60
      confidence: high

    - name: Qwen2 GCU support
      type: integration
      url: https://github.com/QwenLM/Qwen2/pull/456
      description: GCU backend merged to Alibaba Qwen2
      confidence: high

  compiler_ir:
    - name: TopsCC
      type: proprietary
      description: Graph compiler; lowers to GCU-CARE static dataflow; handles memory tiling; sparsity annotation
      confidence: high
      source: hami-enflame-docs, hc33-ieee

    - name: GCU-CARE Scheduler
      type: proprietary
      description: Integrated into TopsCC; compile-time SIP graph mapping; no runtime thread dispatch
      confidence: high
      source: hc33-ieee

  op_library:
    - name: TopsBlasOps
      type: proprietary
      description: GEMM + BLAS + Conv + Attention + Norm primitives; dispatched by TopsTorch
      confidence: medium
      source: hami-dependency-manifest

    - name: TopsCodec / FFmpeg-GCU
      type: open_source
      url: https://github.com/EnflameTechnology/FFmpeg-GCU
      description: Hardware video encode/decode; FFmpeg plugin interface
      confidence: high

  kernel_library:
    - name: TopsPlatform Kernel Library
      type: proprietary
      description: GCU-CARE native binary kernels; bundled with TopsCC; not open-sourced
      confidence: medium
      source: inferred from vllm-gcu deps

  runtime:
    - name: TopsRuntime
      type: proprietary
      binary: libTopsRuntime.so
      description: Device memory mgmt; stream/event model; kernel launch
      confidence: high
      source: vllm-gcu-readme, hami-enflame-docs

    - name: GCU Monitor
      type: proprietary
      url: https://support.enflame-tech.com/onlinedoc_dev_2.5.115/6-k8s/k8s/GCU_monitor_examples/content/source/index.html
      description: Runtime observability; Prometheus-style metrics; profiling
      confidence: high

  driver_firmware:
    - name: TopsDrv
      type: proprietary
      description: Linux kernel module; PCIe BAR; IOCTL; DMA; interrupt handling
      confidence: high
      source: hami-enflame-docs

    - name: HAMi GCU plugin
      type: open_source
      url: https://github.com/Project-HAMi/HAMi
      description: Kubernetes device plugin for GCU resource sharing and health monitoring
      confidence: high

  communication:
    - name: ECCL
      type: proprietary
      package: eccl_3.5*.deb
      description: Enflame Collective Communication Library; AllReduce/AllGather; NCCL analog
      confidence: high
      source: EnflameTechnology-github, vllm-gcu

    - name: GCU-LARE Protocol
      type: proprietary_hw
      description: Chip-to-chip intra-node interconnect; 300 GB/s bidir (LARE 2.0)
      confidence: high
      source: hc33-lare-slides, enflame-support-bridge

  assembler_isa:
    - name: GCU-CARE ISA
      type: proprietary
      public_docs: false
      description: Static dataflow instruction set; TopsCC handles all lowering; not user-accessible
      confidence: inferred

    - name: GCU-DARE ISA
      type: proprietary
      public_docs: false
      description: On-chip data movement instruction set; intra-SIC tile routing
      confidence: inferred

ecosystem_gaps:
  - No public ISA documentation (unlike NVIDIA PTX or Cambricon MLISA)
  - No open-source kernel library (unlike Cambricon mlu-ops or NVIDIA CUTLASS)
  - TopsTorch not open-sourced (unlike torch_mlu for Cambricon)
  - No academic papers on TopsCC internals

github_org: https://github.com/EnflameTechnology

