chip: enflame
as_of: 2026-08-08
baseline_as_of: 2026-04-05   # everything outside update_2026_08_08 is the baseline investigation
device_class: Data Transfer Unit (China)
investigation: hw-architecture

compute_engine:
  unit: SIP (Scalable Intelligent Processor)
  cluster: SIC (Scalable Intelligent Cluster, 8 SIPs)
  units_per_die: 32 SIPs / 4 SICs (DTU 1.0 and 2.0; DTU 3.0/4.0 not disclosed)
  execution_model: static_dataflow_GCU-CARE
  sparsity: hardware_unstructured_zero_skip
  precisions:
    dtu_1_2: [FP32, TF32, FP16, BF16, INT32, INT16, INT8]
    dtu_4: [FP32, TF32, FP16, BF16, INT32, INT16, INT8, FP8]

products:
  - name: CloudBlazer T10 / DTU 1.0
    code: 邃思1.0
    process: GF 12LP FinFET
    transistors: 14B
    hbm: HBM2
    memory_gb: 32
    memory_bw_tbps: 0.512
    pcie: Gen4 x16
    package: 2.5D MCM (compute die + HBM2 stacks)
    peak_fp32_tflops: ~8 (est.)
    peak_int8_tops: ~32 (est.)

  - name: CloudBlazer i20 / DTU 2.0 (inference)
    code: 邃思2.0
    process: 12nm
    hbm: HBM2e
    memory_gb: 16
    memory_bw_tbps: 0.819
    pcie: Gen4 x16
    peak_fp32_tflops: 32
    peak_tf32_tflops: 128
    peak_int8_tops: 256
    tdp_w: 150

  - name: CloudBlazer T20 / DTU 2.0 (training)
    code: 邃思2.0
    process: 12nm
    hbm: HBM2e x4
    memory_gb: 64
    memory_bw_tbps: 1.8
    pcie: Gen4 x16
    package: 9-die MCM (57.5mm x 57.5mm)
    peak_fp32_tflops: 40
    peak_tf32_tflops: 160
    peak_int8_tops: 320

  - name: CloudBlazer S60 / DTU 3.0
    code: 邃思3.0 (SCORPIO-AO)
    process: TSMC N6NTO-HPC
    hbm: HBM2e
    memory_gb: TBD
    memory_bw_tbps: TBD
    pcie: Gen4 x16
    units_shipped: 70000 (by 2024)
    peak_fp16_tflops: ~128 (est.)
    peak_int8_tops: ~512 (est.)
    export_scrutiny: TSMC N6; NBCNews/TechInsights 2025

  - name: CloudBlazer L600 / DTU 4.0
    code: 邃思4.0
    process: TSMC 5nm (rumored)
    hbm: HBM3
    memory_gb: 144
    memory_bw_tbps: 3.6
    pcie: Gen5 (likely)
    fp8_support: true
    announced: WAIC July 2025
    positioning: H100-class replacement for China domestic market

scale_up:
  name: GCU-LARE (Local Area Reconfigurable Engine)
  lare_2_bw_bidir_gbps: 300
  bridge_card: true
  bridge_card_ports: 3
  bridge_card_topology: 4-card full-mesh intra-server
  scalability: SmartCluster (1000s of cards)

scale_out:
  library: ECCL (Enflame Collective Communication Library)
  protocol: Ethernet / RoCE
  proprietary_nic: false

packaging:
  type: 2.5D MCM
  interposer: silicon (CoWoS-style)

sources:
  - url: https://gf.com/gf-press-release/enflame-technology-announces-cloudblazer-dtu-chip-globalfoundries-12lp-finfet/
    label: GF press release DTU 1.0
    confidence: high
