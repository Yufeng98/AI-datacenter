    not_confirmed_do_not_publish:
      - "Tianchi 512 '~2x total inter-card bandwidth vs Tianchi 256' — found in no retrieved source"
      - "Any M100 process node, HBM capacity, memory bandwidth, TFLOPS/TOPS or TDP"
      - "'Tianchi 256 completed testing April 2026' — the statement was 点亮 (lit up / powered on)"
      - "'Tianchi 256 reached market June 2026' as observed fact — it was a forward-looking statement made 2026-05-13"
      - "'32/64-card supernode is a 2026 development' — it launched April 2025"
      - "'10x training gain' for the 32/64-card supernode as a point value — sources say 5-10x"
      - "USD 50B valuation as a filed or confirmed figure — it is a press leak (Reuters citing The Information)"
      - "vLLM-Kunlun dev branch 'v0.25.1-dev' — unreliable; docs site says v0.15.1-dev; cite no dev version"

    searched_and_absent:
