        confidence: high
      press_reported_only:
        target_valuation_usd: "~50 billion (Reuters 2026-06-28, citing The Information)"
        expected_listing: "around Q3 2026"
        revenue_2025: "~RMB 3.5bn / ~USD 500M, at breakeven"
        baidu_retained_stake: "~58%"
        volatility_note: "at least one report notes the target rose from ~USD 14.7bn cited roughly two weeks earlier"
        listed_as_of_2026_08_08: false
