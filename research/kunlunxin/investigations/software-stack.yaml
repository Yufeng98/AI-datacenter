software_stack:
  layers:
    framework:
      primary: PaddlePaddle
      secondary:
        - PyTorch (via torch_xpu plugin)
        - vLLM (via vLLM-Kunlun fork)
      hugging_face: partial (via PaddlePaddle bridge)

    graph_compiler:
      name: XTCL
      full_name: XPU Tensor Compilation Library
      based_on: TVM (Apache TVM)
      modes:
        - AOT (offline compilation)
        - JIT (first-run lazy compilation)
      input_formats:
        - ONNX
        - PaddlePaddle IR
        - TVM Relay IR
      optimizations:
        - operator_fusion
        - constant_folding
        - layout_transformation
        - XPU-aware tiling and memory placement

    op_library:
      name: XDNN
      full_name: XPU DNN Operator Library
      categories:
        - BLAS (GEMM, GEMV, Batched GEMM)
        - Convolution (forward + backward)
        - Attention (fused multi-head)
        - Normalization (LayerNorm, BatchNorm, RMSNorm)
        - Activations (GELU, SiLU, ReLU, Swish)
        - Elementwise
        - Reduction
        - Pooling
        - Embedding
      api_style: C API with tensor descriptors

    kernel_sdk:
      name: XTDK
      full_name: XPU Tool Development Kit
      programming_model: data_parallel_simd
      language: C/C++ with XPU prefix keywords
      features:
        - Cluster-local SRAM addressing
        - Vector intrinsics (SIMD)
        - Inline assembly for direct hardware control
        - Pointer arithmetic
      compiler_backend: LLVM/Clang extended for XPU ISA
      output: XPU object files (.xpu.o)
      open_source: false

    runtime:
      name: XRE
      full_name: XPU Runtime Environment
      version: "5.0.21.21"
      capabilities:
        - Device enumeration and initialization
        - Memory allocation (xpu_malloc / xpu_free)
        - Host↔device data transfer
        - Stream (async queue) management
        - Event timing and profiling
        - Multi-card management (up to 8 XPU per host)
      os_support:
        - Ubuntu 18/20/22
        - CentOS 7/8
      distribution: prebuilt deb/rpm + Docker images
      open_source: false

  paddlepaddle_integration:
    device_api: "paddle.device.set_device('xpu')"
    training_features:
      mixed_precision: true
      static_graph: true
      dynamic_graph: true
      data_parallel: true
      distributed_data_parallel: true
      model_parallelism: partial
      pipeline_parallelism: partial
      amp: true
    verified_models:
      vision: [PPYOLOv3, PPYOLOE, ResNet, MobileNetV3, EfficientNet]
      nlp: [ERNIE3.0, BERT, GPT-2, Llama, ChatGLM, Qwen]
      speech: [DeepSpeech, Conformer]
      recommendation: [DLRM, Wide_and_Deep]
      llm: [DeepSeek_V3, DeepSeek_R1_671B]
      total_verified: 51+

  vllm_kunlun:
    repo: https://github.com/baidu/vLLM-Kunlun
    description: vLLM community fork for XPU with XDNN/XTDK kernel replacements   # WRONG — see updates[2026-08-08].vllm_kunlun_is_a_plugin
    superseded_by: "updates.2026-08-08.vllm_kunlun_is_a_plugin"
    features:
      - PagedAttention
      - Continuous batching
    supported_models: [Llama, Qwen, ChatGLM, DeepSeek]
    supported_chips: [R200, R300, P800]   # SUPERSEDED — prerequisites list Kunlun3 P800 only

key_differentiators:
  - PaddlePaddle is the deepest and most complete framework integration
  - XTCL graph compiler is TVM-based, enabling ONNX ecosystem import
  - XRE provides a CUDA-Runtime-equivalent abstraction (streams, events, multi-device)
  - vLLM-Kunlun (an out-of-tree vLLM PLUGIN, not a fork) enables production LLM serving without CUDA
  - Custom op authoring via XTDK + PaddlePaddle Plugin mechanism
  - Full DeepSeek V3/R1 training+inference stack validated on P800

