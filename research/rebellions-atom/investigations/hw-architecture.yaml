chip: rebellions-atom
as_of: "2026-08-08"
baseline_as_of: "2026-04-05"  # generations/rack_systems/corporate below were established at this date
confidence: medium  # based on public disclosures; die-level microarchitecture not fully published

generations:
  atom:
    process: Samsung 5nm
    architecture: CGRA (Coarse-Grained Reconfigurable Array)
    neural_engines: 8
    peak_fp16_tflops: 32
    peak_int8_tops: 128
    on_chip_sram_mb: 64
    sram_management: software-managed (compiler)
    off_chip_memory:
      type: GDDR6
      capacity_gb: 16
      bandwidth_gbs: 256
    host_interface:
      type: PCIe Gen5 x16
      card: RBLN-CA12
      form_factor: FHFL single-slot
      tdp_w_min: 60
      tdp_w_max: 130
    multi_instance: 16 hardware-isolated instances
    deployments:
      - KT Cloud (Korea, 2023)
      - SK Telecom AI services
      - Japan, Saudi Arabia, US

  atom_max:
    process: Samsung 5nm
    architecture: CGRA + Neural Engines (boosted clocks)
    note: Higher TDP variant of ATOM for large-scale inference

  rebel_single:
    process: Samsung 4nm
    architecture: Neural Cores (evolved CGRA)
    neural_cores: 16
    cores_per_cluster: 8
    cluster_interconnect: mesh (through SRAM blocks)
    on_chip_sram_mb: 128  # 64 MB L1 distributed + 64 MB L2 shared
    l1_sram_mb: 64  # per-core distributed
    l2_sram_mb: 64  # shared
    isa: custom RISC ISA for Neural Engines
    target: frontier-scale MoE, peta-scale inference

  rebel_quad:
    aka: Rebel100
    announced: Hot Chips 2025 (August 2025)
    presented_at: ISSCC 2026
    process: Samsung 4nm (per ASIC die)
    chiplet_config:
      compute_dies: 4
      compute_die_area_mm2: 320
      hbm3e_stacks: 4
      isc_capacitors: 4
    die_to_die_interconnect:
      standard: UCIe-Advanced
      speed_gbps: 16
      aggregate_bw_tbs: 4.0
      note: World's first AI accelerator with UCIe-Advanced
    memory:
      type: HBM3e (12Hi)
      per_stack_gb: 36
      total_gb: 144
      aggregate_bw_tbs: 4.8
    compute:
      peak_fp8_tflops: 2048
    package_tdp_w: 600
    form_factor: PCIe card (not OAM/SXM)
    reference_design: 8 cards per air-cooled node
    performance_vs_gpu:
      throughput_multiplier: 1.6x  # vs top-tier GPU, Llama 3.3 70B FP8
      power_reduction_pct: 50
      tps_per_watt_multiplier: 3.2x
    ocp_listing: https://www.opencompute.org/chiplets/76/rebel-quad-ai-accelerator-ai-soc

rack_systems:
  rebelrack:
    nodes: 4
    accelerators_per_node: 8
    total_accelerators: 32
    networking: quad-400 Gbps per node
    peak_fp8_pflops: 64
    total_hbm3e_tb: 4.6
    aggregate_memory_bw_tbs: 153.6
    # Re-graded 2026-08-08: no primary-source corroboration.
    confidence: low-secondary
    sourcing_note: >-
      Rebellions' own 2026-03-30 launch release for RebelRack/RebelPOD published no
      technical specifications. All figures above derive from secondary coverage and
      remain uncorroborated by any Rebellions primary source as of 2026-08-08.
    sources:
      - https://www.theregister.com/2026/03/30/rebellions_ai_rackscale/
      - https://rebellions.ai/newsroom/rebellions-closes-400-million-pre-ipo-and-launches-rebelrack-and-rebelpod-to-accelerate-global-expansion/  # primary; no specs

  rebelpod:
    nodes_range: "8–128"
    accelerators_per_node: 8
    networking: 800 Gbps Ethernet
    confidence: low-secondary
    sources:
      - https://www.theregister.com/2026/03/30/rebellions_ai_rackscale/

corporate:
  founded: 2020
  ceo: Park Sung-hyun
  country: South Korea
  merger:
    partner: SAPEON Korea (SK Telecom spinoff)
    completed: "2024-12-02"
    equity_ratio: "2.4:1 (Rebellions:SAPEON)"
    combined_value_usd_m: 927.9
  fab_partner: Samsung Electronics
  investors:
    - Samsung Electronics
    - KT (Korea Telecom)
    - SK Telecom (via Sapeon merger)
    - Arm
    - Samsung Ventures
    - SoftBank Ventures
  funding_rounds:
    - round: Series C
      date: "2024-01"
      amount_usd_m: 124
    - round: Series D
      date: "2025"
      amount_usd_m: 250
      lead_investors: [Arm, Samsung Ventures]
    - round: Pre-IPO
      date: "2026-03"
      amount_usd_m: 400
      valuation_usd_b: 2.3

