# ── Scale-up ──────────────────────────────────────────────────────────────────
scale_up:
  mn_core_2:
    fabric: none
    device_side_collectives: none
    mechanism: "host-mediated: OpenMPI + torch.distributed on the gloo backend, host-memory dist.send/dist.recv"
    evidence: "PFN's own pipeline-parallel Llama example: sdk/examples/run_pp_llama.py, run_llm_infer_pp.sh"
    confidence: confirmed
    sources:
      - https://github.com/pfnet/mncore
      - https://dev.mn-core.com/sdk/0.7/MLSDK/docs/en/technical_notes.html
  mn_core_gen1:
    fabric: "MN-Core DirectConnect (proprietary) + MN-Core DirectConnect Switches"
    topology: "32 MN-Core Servers + 2 switches = one 'Zone'"
    bandwidth: "not disclosed"
    confidence: confirmed
    sources:
      - https://projects.preferred.jp/supercomputers/
  gen2_fabric_status:
    value: "not disclosed"
    note: >-
      PFN has never explicitly stated whether DirectConnect was dropped for MN-Core 2 or
      merely not used in MN-Server 2. Record the absence of documentation, not a removal.
    confidence: unconfirmed

