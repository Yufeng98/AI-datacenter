  type_caveat: >-
    PFN's own Hot Chips 36 slides are inconsistent: slide 10 says "external DRAM (GDDR6)",
    slide 13 says "16 GB GDDR6X". The driver knob is `--gddr6 15000`. Record as GDDR6-class
    with the inconsistency noted; do not silently pick one.
  type_confidence: likely
  capacity_gib: 16
  capacity_per_group_gib: 4
  bandwidth_gb_s: 512
  bandwidth_per_group_gb_s: 128
  bus_width: "not disclosed"
  device_count: "not disclosed"
  per_pin_data_rate: "not disclosed"
  ecc: "not disclosed"
  confidence: confirmed
  sources:
    - https://hc2024.hotchips.org/assets/program/conference/day2/15_HC2024.Preferred.Makino.final.pdf
    - https://projects.preferred.jp/mn-core/assets/mncore2_dev_manual_en.pdf
    - https://projects.preferred.jp/mn-core/assets/MN-Core2-Devkit-MN-Server-2-installation-operation-manual.pdf
