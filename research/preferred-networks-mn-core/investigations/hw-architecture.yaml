chip: preferred-networks-mn-core
as_of: "2026-08-08"
device_class: "Compiler-Scheduled SIMD Accelerator (Japan)"
investigation: hw-architecture

# ── Vendor / provenance ───────────────────────────────────────────────────────
vendor:
  name: "Preferred Networks, Inc. (PFN)"
  country: Japan
  hq: Tokyo
  co_developer: "Kobe University (Prof. Junichiro Makino, also PFN CTO of Computer Architecture)"
  development_started: 2016
  internal_codenames:
    gen1_die_marking: "GPFN-2G01"
    gen2: "GPFN3 (SDK tools gpfn3-smi / gpfn3_package_main / assemble3; MLSDK docs say 'MN-Core 2 (also known as GPFN3)')"
  confidence: confirmed
  sources:
    - https://www.preferred.jp/en/business/chips/
    - https://www.preferred.jp/en/news/pr20231016
    - https://dev.mn-core.com/sdk/0.7/MLSDK/docs/en/technical_notes.html

# ── Design philosophy: what the hardware omits ────────────────────────────────
design_philosophy:
  hardware_cache: none          # at any tier, any generation
  per_pe_program_counter: false
  per_pe_instruction_decoder: false
  hardware_instruction_scheduler: false
  hazard_interlocks: false      # "It is the programmer's responsibility"
  branches: false               # mask-register predication only
  instruction_supply: "single stream generated by the host CPU, delivered over PCIe"
  vendor_quote_whitepaper: >-
    Processing Element (PE) on the accelerator does not have its own program counter or
    instruction decoder. All PEs operate in perfect synchronization, receiving instruction
    sequences generated by the host CPU directly from the host.
  vendor_quote_sdm: >-
    There are no hardware-managed caches in MNCore 2, and all the intra-board data transfers
    are explicitly managed by using machine code instructions. Instructions are sent to the
    board in a single stream and there are no mechanisms to manage the control flow of the
    execution.
  arithmetic_transistor_fraction_pct: 7.4   # PFN's own measurement; comparators anonymized
  arithmetic_transistor_fraction_note: >-
    Vendor claim, PFN's own research. Comparators given as 1.7% ("GPU N"), 2.4%
    ("Accelerator P"), 1.3% / 0.8% (two CPUs) — all anonymized by PFN.
  architectural_lineage: "TMC CM-2 / MasPar MP-2 class large-scale SIMD; register-memory, not load-store (Makino, HC36)"
  confidence: confirmed
  sources:
    - https://projects.preferred.jp/mn-core/assets/MN-Core_2_whitepaper_en.pdf
    - https://projects.preferred.jp/mn-core/assets/mncore2_dev_manual_en.pdf
    - https://hc2024.hotchips.org/assets/program/conference/day2/15_HC2024.Preferred.Makino.final.pdf
    - https://www.preferred.jp/en/news/pr20260601

# ── Compute Engine — MN-Core 2 (current shipping part) ────────────────────────
compute_engine:
  mn_core_2:
    process_node: "TSMC N7"
    die_area_mm2: 550
    dies_per_package: 1
    transistors_b: 22
    clock_mhz: 750
    pes: 4096
    maus: 1024                  # derived: 4096 PEs / 4 PEs per MAB
    maus_derivation_note: "Derived from 4 PEs + 1 MAU per MAB; PFN publishes PE count, not MAU count."
    mabs: 1024
    l1bs: 64
    l2bs: 8
    groups: 4
    peak_fp64_tflops: 12
    peak_fp32_tflops: 49
    peak_pseudo_single_tflops: 98    # PFN labels this "TF32"; it is PFN block-FP, NOT NVIDIA TF32
    peak_half_tflops: 393            # PFN labels this "TF16"; block-FP half, NOT IEEE binary16
    power_w: 330
    power_qualifier: "design value (not a measured TDP)"
    efficiency_gflops_per_w:
      fp64: 37.24
      fp32: 148.9
      pseudo_single: 297.9
      half: 1192
    efficiency_caveat: >-
      The widely quoted 1192 GFLOPS/W is the HALF-precision (block-FP) figure only.
      FP64 efficiency is 37.24 GFLOPS/W. Never quote 1192 without the precision qualifier.
    confidence: confirmed
    sources:
      - https://projects.preferred.jp/mn-core/assets/MN-Core_2_whitepaper_en.pdf
      - https://projects.preferred.jp/mn-core/en/

  mab_structure:
    definition: "MAB (Matrix Arithmetic Block) = 4 PEs + 1 MAU (Matrix Arithmetic Unit)"
    mau_matrix_register: "double-buffered (two sides: multiply against side 2 while writing side 1)"
    mau_matvec_shapes_per_cycle:
      double: "m=2, n=4 (A,b block-FP double; c,y normal double)"
      single: "m=8, n=4 (A,b block-FP single; c,y normal single)"
      pseudo_single: "m=8, n=8 (block-FP only; shorter effective mantissa than single; c,y normal single)"
      half: "m=16, n=16 (A,b block-FP half; c,y normal SINGLE)"
    mau_vector_fma_per_cycle:
      double: "m=4, but only elements 0/1 or 2/3 enabled per issue -> a full 4-element FMA takes two issues"
      single: "m=8"
      half: "m=16 (a,b half; c,y single)"
    peak_reconciliation:
      fp64: "2*4*2*1024*750MHz = 12.29 TF"
      fp32: "8*4*2*1024*750MHz = 49.2 TF"
      pseudo_single: "8*8*2*1024*750MHz = 98.3 TF"
      half: "16*16*2*1024*750MHz = 393.2 TF"
      note: "derived arithmetic; reconciles exactly with PFN's published peaks"
    pe_alu: "integer + general ops incl. special ops such as ReLU; mask registers for predication"
    reduction_units: "present in PE->L1BM->L2BM uplink paths; PFN explicitly EXCLUDES them from peak FLOPS"
    confidence: confirmed
    sources:
      - https://projects.preferred.jp/mn-core/assets/mncore2_dev_manual_en.pdf
      - https://projects.preferred.jp/mn-core/assets/MN-Core_2_whitepaper_en.pdf

  integer_matrix_datapath:
    value: "not disclosed"
    note: >-
      The SDM documents only FP/BFP matrix modes for the MAU. The compiler exposes integer
      dtypes (Int8/Byte/Short/Int/Long) but only for ALU-class work. Absence of an INT8/INT4
      MAU mode is not explicitly confirmed by PFN.
    confidence: unconfirmed

# ── Number formats ────────────────────────────────────────────────────────────
number_formats:
  ieee754_compatible: false
  half_hw_16bit: {sign: 1, exponent: 6, mantissa: 9, note: "NOT IEEE binary16 (1-5-10)"}
  single_sw_32bit: {sign: 1, exponent: 8, mantissa: 23, note: "IEEE-like field widths"}
  double_lw_64bit: {sign: 1, exponent: 11, mantissa: 52, note: "IEEE-like field widths"}
  denormals: false
  nans: false
  special_encodings: "exponent all-zero => +/-0 regardless of mantissa; exponent all-ones => +/-inf regardless of mantissa"
  half_max_positive: 4.29e+09
  half_min_positive_normal: 9.31e-10
  block_floating_point:
    used_for: "ALL precisions on MN-Core 2 (gen 1 used BFP for half precision only)"
    field_widths: "same as the corresponding format but with NO hidden bit"
    requirement: "matrix-vector product operands must be BFP-converted first"
  assembly_typing: "untyped — an MAU float result can be fed to the integer ALU with no check"
  compiler_integer_dtypes: [Int8, Byte, Short, UShort, Int, UInt, Long, ULong, Half, Single, LongBool]
  endianness: big-endian
  confidence: confirmed
  sources:
    - https://projects.preferred.jp/mn-core/assets/mncore2_dev_manual_en.pdf
    - https://dev.mn-core.com/sdk/0.7/MLSDK/docs/en/hardware_specification.html

# ── On-chip memory ────────────────────────────────────────────────────────────
on_chip_memory:
  hardware_cache: false
  management: "100% software-managed scratchpad at every tier"
  tree: "Top Level -> 4 Groups -> 8 L2Bs -> 64 L1Bs -> 1024 MABs -> 4096 PEs"
  unit_note: "LW = long word = 64 bits = 8 bytes; SW = 32-bit word; HW = 16-bit"
  levels:
    - {level: PE, name: "GRF0 / GRF1", per_unit: "256 LW = 2 KiB each", chip_total_mib: 16, ports: "1R1W, 2 LW/cycle each"}
    - {level: PE, name: "LM0 / LM1", per_unit: "2 Ki LW = 16 KiB each", chip_total_mib: 128, ports: "1RW, 2 LW/cycle each"}
    - {level: PE, name: "T-register", per_unit: "8 LW = 64 B", chip_total_mib: 0.25, ports: "1R1W, 2 LW/cycle"}
    - {level: L1B, name: "L1BM", per_unit: "8 Ki LW = 64 KiB", chip_total_mib: 4, ports: "not disclosed"}
    - {level: L2B, name: "L2BM", per_unit: "32 Ki LW = 256 KiB", chip_total_mib: 2, ports: "not disclosed"}
    - {level: Group, name: "PDM (PIU Data Memory)", per_unit: "4 MiB (512 Ki LW)", chip_total_mib: 16, ports: "not disclosed"}
  aggregate_sram_mib: 166
  aggregate_sram_confidence: likely
  aggregate_sram_note: >-
    DERIVED by summing the documented per-level capacities. PFN does not publish an
    aggregate on-chip SRAM figure. Do not attribute 166 MiB to PFN.
  structural_facts:
    - "Only Group 0's PDM is physically connected to the host over PCIe; ALL host<->device I/O funnels through that one 4 MiB PDM."
    - "The compiler's Location abstraction can only place tensors in DRAM or LM0/LM1. GRF0/GRF1 and L1BM/L2BM are never Locations."
    - "Address namespaces: DRAM $d, PDM $p, L2BM $lc, L1BM $lb are LW-addressed; LM0 $m, LM1 $n, GRF0 $r, GRF1 $s are SW-addressed."
    - "Results shorter than 2 LW are MSB-aligned (big-endian storage)."
  derived_lm_bandwidth:
    per_bank_tb_s: 49
    lm0_plus_lm1_tb_s: 98
    confidence: likely
    note: >-
      DERIVED: 4096 PEs x 2 LW/cycle x 8 B x 750 MHz. An arithmetic implication of the
      documented port widths, not a PFN-published figure.
  l1bm_l2bm_bandwidth: "not disclosed"
  ecc: "not disclosed"
  confidence: confirmed
  sources:
    - https://dev.mn-core.com/sdk/0.7/MLSDK/docs/en/hardware_specification.html
    - https://projects.preferred.jp/mn-core/assets/mncore2_dev_manual_en.pdf
    - https://dev.mn-core.com/sdk/0.7/MLSDK/docs/en/technical_notes.html

# ── On-chip interconnect ──────────────────────────────────────────────────────
on_chip_interconnect:
  topology: "broadcast/reduction tree — no NoC, no mesh, no crossbar"
  l1b: "16 MABs + one L1BM; modes: broadcast, individual transfer, reduction, distribute/collect; controlled by PE instructions"
  l2b: "8 L1Bs + one L2BM; same repertoire between L2BM and L1Bs"
  top_level: "per-Group data engines move data among PDM, DRAM and L2BM, within and across groups"
  symmetry_property: "every downward mode (e.g. distribute) has a matching upward mode (collect) that reassembles the identical layout"
  documented_throughputs:
    dram_to_l2bm_parallel: "16 LW/cycle per group (= 96 GB/s/group at 750 MHz, derived)"
    inter_group_broadcast_reduce: "8 LW/cycle (half of intra-group)"
    l2bm_collect_distribute: "up to 32 LW/cycle"
    pdm_l2bm_individual: "8 LW/cycle PDM side, 1 LW/cycle L2BM side"
    pdm_dram: "8 LW/cycle PDM side, 2 LW/cycle DRAM side"
  vendor_rationale: >-
    Broadcast and reduction "are the two most important communication patterns for PEs used
    for tensor operations in deep learning. Compared to shared cache, energy consumption
    becomes much smaller." (Makino, HC36)
  confidence: confirmed
  sources:
    - https://projects.preferred.jp/mn-core/assets/mncore2_dev_manual_en.pdf
    - https://projects.preferred.jp/mn-core/assets/MN-Core_2_whitepaper_en.pdf
    - https://hc2024.hotchips.org/assets/program/conference/day2/15_HC2024.Preferred.Makino.final.pdf

# ── Execution model / data path ───────────────────────────────────────────────
execution_model:
  instruction_classes:
    mv_instruction: "data movement among upper memories (PDM, DRAM, L2BM, across groups); executes asynchronously"
    pe_instruction: "VLIW; controls everything at L2B and below (despite the name)"
  step_granularity_cycles: 4
  step_rationale_quote: >-
    This is because 1 cycle per instruction would saturate the PCIe bandwidth between the
    host and the board.
  step_rationale_significance: "The instruction issue rate is set by the host PCIe link, not by the silicon."
  packing_modes:
    auto_stride: "3 PE instructions + 1 MV instruction per stream unit; addresses auto-increment each cycle within a step"
    flat: "2 PE + 1 MV; GRF0/GRF1/LM0/LM1 addresses specified per cycle; strict superset of auto-stride"
    note: "Real hardware requires packed streams; the emulator does not."
  hazards: "no interlocks; programmer/compiler must leave cycles before reading a just-written value (SDM 3.6.3)"
  control_flow: "none; mask-register predication written by ALU result flags"
  synchronization: "explicit `wait` field carried in every (fixed-width) PE instruction, with a 'don't wait' encoding"
  architecturally_visible_forwarding: [mauf, aluf, lbf, mreadf, nowrite]
  gen2_addition: "direct feedback paths from MAU/IALU relative to gen 1"
  determinism_claim:
    text: "Without cache interference or speculative behavior, execution is fully deterministic — the performance you measure in simulation is the performance you get on hardware."
    label: vendor claim
    source: https://dev.mn-core.com/architecture
  instruction_stream_bandwidth_gb_s: "not disclosed"
  onboard_instruction_buffer: "not disclosed"
  confidence: confirmed
  sources:
    - https://projects.preferred.jp/mn-core/assets/mncore2_dev_manual_en.pdf
    - https://dev.mn-core.com/architecture

# ── Off-chip memory ───────────────────────────────────────────────────────────
off_chip_memory:
