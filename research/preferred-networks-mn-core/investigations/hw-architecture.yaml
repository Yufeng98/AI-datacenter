# ── Vendor-reported performance ───────────────────────────────────────────────
performance:
  hot_chips_36_vs_a100:
    label: vendor claim
    date: "2024-08-27"
    measurements:
      - {workload: "GCN (PFN internal)", mn_core_2: "5.41 TF (FP32)", a100: "3.17 TF"}
      - {workload: "ResNet-50 training", mn_core_2: "77 TF (FP16)", a100: "33.2 TF (BF16)"}
      - {workload: "ResNet-50 inference", mn_core_2: "154 TF (FP16)", a100: "33.7 TF (BF16)"}
      - {workload: "HIMENO", mn_core_2: "9.03 TF (FP64)", a100: "0.634 TF"}
      - {workload: "OpenFDTD", mn_core_2: "0.655 TF (FP32)", a100: "0.488 TF"}
    himeno_note: >-
      9.03 TF FP64 is ~75% of the 12 TF peak on a memory-bound stencil; PFN attributes the
      14x-A100 result to the large on-chip memory plus temporal blocking.
    confidence: confirmed
