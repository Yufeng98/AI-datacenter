# ── Assessment ────────────────────────────────────────────────────────────────
assessment:
  strengths:
    - "The compiler performs cache replacement (Location Planner + Scheduler spill/refill/Forget), physical-topology data layout (Layout Planner), capacity management (Time-Slice), rematerialization (auto_recompute_sa) and instruction packing (VLIW + L1Merge) — all decisions a GPU hands to hardware."
    - "The three-property MNValue model (Dtype / Location / Layout) is a genuinely reusable abstraction."
    - "Free emulator + public ~130-page ISA manual + educational graph compiler make this the most REPRODUCIBLE proprietary stack in the registry."
  weaknesses:
    - "No source for anything load-bearing."
    - "No user extensibility — you cannot add an operator because codegen/layers is not shipped."
    - "One framework, one custom torch build, static shapes only."
    - "No dynamic-shape or paged-attention story; LLM inference labelled experimental."
    - "HPCSDK in alpha with no docs; OpenACC promised in 2023, still undocumented in 2026."
    - "No collectives and no device fabric on MN-Core 2 — multi-board goes through host gloo/MPI."
    - "Compile times long enough that caching is a first-class API."
    - "CODEGEN_AUTO_RECOMPUTE_HACK_FOR_QWEN shows the 'compiler handles it' promise still needs per-model rescue."
  comparison_anchor: >-
    Groq's TSP is the obvious neighbour, but MN-Core goes further: Groq's compiler schedules a
    chip that still fetches its own instructions; MN-Core's PEs have no program counter and no
    decoder at all, and the instruction rate is bounded by the PCIe link to the host. MTIA and
    Sophgo each have a hardware-managed or partially-hardware-managed memory path somewhere;
    MN-Core has none, at any tier, in any generation.

# ── Explicitly not disclosed ──────────────────────────────────────────────────
