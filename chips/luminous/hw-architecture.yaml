ip_disposition: >
  Two channels into AMD. (1) Silicon photonics design IP LICENSED (not sold) to Enosemi
  2023-10 with Luminous retaining title; AMD acquired Enosemi 2025-05-28/29.
  (2) Luminous Computing, Inc. assigned its own patent portfolio OUTRIGHT to Advanced
  Micro Devices, Inc., USPTO recordation date 2026-02-28 (US11500410B1, US12379543B2,
  US12613811B2). No press coverage; USPTO records are the sole evidence.
sdk_disposition: "None. No compiler/runtime/SDK/driver was ever released, open-sourced, or transferred."
web_presence: "luminous.com no longer company-controlled; third-party domain-sale listing (Top Notch Domains / Embrace.com) as of 2026-08-08"
