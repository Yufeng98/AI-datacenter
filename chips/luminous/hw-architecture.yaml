wind_down_reasons:
  - "Silicon photonics manufacturing immaturity and yield challenges in 2022-2023"
  - "System integration complexity (precision fiber coupling at scale)"
  - "Insufficient capital ($123M vs ~$500M–$1B needed to reach production)"
  - "Competitive pressure from NVIDIA NVLink/NVSwitch reducing urgency"
  - "Analog noise and thermal drift challenges in photonic compute"
