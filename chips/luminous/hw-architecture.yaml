architecture:
  paradigm: "Photonic interconnect at every scale; electronic compute"
  compute_medium: "CMOS ASIC (electronic)"
  data_movement_medium: "Silicon photonics + WDM optical fiber"
  photonic_role: interconnect
  electronic_role: all_compute

  hierarchy_bandwidth_claim: "10–100× improvement vs electrical at every scale"
  scales_addressed:
    - scale: die_to_memory
      link_type: optical
    - scale: chip_to_chip
      link_type: photonic_wdm
    - scale: board_to_board
      link_type: optical
    - scale: rack_to_rack
      link_type: fiber_wdm

compute_die:
  type: CMOS_ASIC
  process_node: not_public
  tdp_w: not_public
  performance_claim: "3,000× TPU v3 board (unverified, pre-pivot claim)"

