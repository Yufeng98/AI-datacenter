products:
  m1108:
    type: Analog Matrix Processor (AMP)
    amp_tiles: 108
    control_tiles: 4
    peak_tops: 35
    typical_power_w: 4
    weight_params_capacity: ~100M
    process: 40nm embedded NOR flash
    package: 19x19 mm² BGA
    host_interface: PCIe 2.0
    launch: "2020-11"
    target: Edge AI inference
  m1076:
    type: Analog Matrix Processor (AMP)
    amp_tiles: 76
    control_tiles: 4
    peak_tops: 25
    typical_power_w: 3
    weight_params_capacity: ~80M
    process: 40nm embedded NOR flash
    host_interface: PCIe 2.0
    launch: "2021-06"
    form_factors: [standalone, PCIe M.2 A+E-key, PCIe M.2 M-key]
    target: Edge AI inference (scalable, power-efficient)
  m1076_pcie_card:
    type: Multi-chip PCIe card
    chips_per_card: 16
    peak_tops: ~400
    typical_power_w: 75
    process: 40nm embedded NOR flash
    target: Higher-TOPS edge / entry server

architecture:
  paradigm: Analog compute-in-memory (flash-based)
  compute_medium: Analog current summation in NOR flash cells
  weight_storage: Embedded NOR flash (non-volatile, in-cell)
  weight_access_bw_during_inference: 0  # weights read as analog current, no DRAM
  nonlinear_ops: Digital (SIMD engine per tile)

  amp_tile:
    components:
      - Mythic Analog Compute Engine (ACE™) — NOR flash MMA
      - Input DAC (activation voltage encoding)
      - Bitline ADC (current-sum to digital)
      - 32-bit RISC-V nano-processor (Codasip licensed)
      - SIMD vector engine
      - 64 KB SRAM (activation buffer + scratchpad)
      - NoC router (2D mesh)
    gops_per_tile: 250
    energy_per_mac_pj: 0.25
    topology: 2D mesh across all tiles

  memory_hierarchy:
    - level: Flash weight store (ACE)
      technology: Embedded NOR multi-level flash
      capacity: ~80-100M params per chip (in flash cells)
      bandwidth: "Not applicable — analog in-cell"
      notes: Non-volatile; programmed once at model load; no DRAM BW consumed
    - level: Tile SRAM
      technology: SRAM
      capacity_per_tile: 64 KB
      bandwidth: High on-tile
      notes: SW-managed scratchpad for activations
    - level: Host DRAM
      technology: External DRAM (host-side)
      role: Model weight programming, host activations
      notes: Used only once per model load to program flash

  interconnect:
    tile_to_tile:
      type: 2D mesh NoC (on-chip)
      purpose: Activation routing between tiles
    chip_to_host:
      type: PCIe 2.0
      bw_approx: ~4 GB/s
      purpose: Host control, activation I/O
    multi_chip:
      type: PCIe card (up to 16 chips)
      purpose: Scale-up on single board

process:
  node: 40nm embedded NOR flash
  rationale: Mature node for reliable flash; cost over density; no HBM needed
  package_m1108: 19x19 mm² BGA
  form_factors: [standalone_chip, PCIe_M2_AE_key, PCIe_M2_M_key, PCIe_card_16x]

supported_data_types: [INT4, INT8, INT16]
precision_notes: Analog noise limits to INT8 effectively; INT4 for aggressive quantization

key_distinctions_vs_digital_cim:
  d_matrix_corsair: Digital MAC in SRAM (volatile; 6nm); vs Mythic flash-based analog (40nm; non-volatile)
  sk_hynix_aim: PIM in GDDR6/HBM (DRAM process); vs Mythic standalone eFlash logic chip
  samsung_aquabolt: PIM in HBM2 (DRAM process); vs Mythic standalone eFlash logic chip

analog_limitations:
  - Weight precision limited to INT8 by analog noise floor
  - NOR flash endurance (~100K–1M write cycles) constrains model swap frequency
  - Temperature drift of flash charge requires calibration
  - Nonlinear ops (ReLU, GELU, Softmax, LayerNorm) remain digital (SIMD)
  - 40nm process density disadvantage vs. advanced-node digital accelerators

applications:
  historical_edge: [surveillance cameras, drones, robotics, machine vision, autonomous systems]
  new_target_2026: [1T+ parameter LLMs, datacenter inference, defense, automotive]
  new_target_2026_status: stated_intent_no_silicon_disclosed

